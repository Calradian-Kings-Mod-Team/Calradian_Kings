l_english:
 rule_ck_backstory_event: "$ck_pre$ Mount & Blade Backstory for [adventurers|E]"
 setting_ck_backstory_enabled: "Backstory Enabled"
 setting_ck_backstory_enabled_desc: "Design your own backstory using Mount & Blade-inspired backstory creation. Requires @roadstopower_icon! $DLC014_EP3$."
 setting_ck_backstory_disabled: "#V Backstory Disabled#!"
 setting_ck_backstory_disabled_desc: "#N The Mount & Blade-inspired backstory creation is disabled.#!"
 rule_ck_landed_backstory_event: "$ck_pre$ Backstory Creation for Landed Rulers"
 setting_ck_landed_backstory_enabled: "Backstory Enabled"
 setting_ck_landed_backstory_enabled_desc: "The Mount & Blade-inspired backstory creation will be available to custom landed characters."
 setting_ck_landed_backstory_disabled: "#V Backstory Disabled#!"
 setting_ck_landed_backstory_disabled_desc: "#The Mount & Blade-inspired backstory creation for landed characters is disabled."
 rule_ck_admin_government: "$ck_pre$ $bl_pre$ Imperial [government|E]"
 setting_ck_admin_government_disabled: "Default"
 setting_ck_admin_government_disabled_desc: "Calradian Empires start with [feudal|E] government. Provides most balanced gameplay."
 setting_ck_admin_government_nimp: "#V Northern Empire#!"
 setting_ck_admin_government_nimp_desc: "Northern Empire starts with [administrative|E] government. Setting somewhat accurate lore-wise. May result in an unbalanced gameplay."
 setting_ck_admin_government_nimp_and_wimp: "#V Northern and Western Empire#!"
 setting_ck_admin_government_nimp_and_wimp_desc: "Both Northern and Western Empires start with administrative government. May result in an unbalanced gameplay."
 setting_ck_admin_government_every_empire: "#V Every Empire#!"
 setting_ck_admin_government_every_empire_desc: "Every Calradian Empire starts with Administrative government. May result in an unbalanced gameplay."
 rule_ck_shattered_calrad: "$ck_pre$ Shattered Calradia"
 setting_ck_full_shatter_calradia: "#V Starting Factions#!"
 setting_ck_full_shatter_calradia_desc: "Shatter all starting factions' top titles, Vlandia, Battania, Sturgia, Khuzaits, Aserai, and all 3 Empires.#N  This setting MUST be enabled before clicking 'Play as any ruler' if you want to play with a shattered world!#!"
 setting_ck_shatter_calradian_empires: "#V Shatter Calradians#!"
 setting_ck_shatter_calradian_empires_desc: "Shatter just the 3 Calradian Empires' top titles, the North, South, and West.#N  This setting MUST be enabled before clicking 'Play as any ruler' if you want to play with a shattered world!#!"
 setting_ck_shatter_all_but_calradians: "#V Shatter Non-Calradians#!"
 setting_ck_shatter_all_but_calradians_desc: "Shatters all non-Calradian starting factions' top titles, Vlandia, Battania, Sturgia, Khuzaits, and Aserai.#N  This setting MUST be enabled before clicking 'Play as any ruler' if you want to play with a shattered world!#!"
 setting_ck_no_shatter: "No Shattering"
 setting_ck_no_shatter_desc: "Do not shatter any starting factions."
 rule_ck_aserai_title_names: "$ck_pre$ Aserai Title Names"
 setting_aserai_house_names_rule: "House Name"
 setting_aserai_house_names_rule_desc: "Primary titles of independent Aserai dukes and kings will be named after their house name, or their house and first name."
 setting_aserai_house_names_rule_disabled: "#V Unchanged#!"
 setting_aserai_house_names_rule_disabled_desc: "Primary title names of independent Aserai dukes and kings will be unchanged."
 rule_ck_geroian_coalition: "$ck_pre$ Geroian Coalitions"
 setting_ck_geroian_coalition_enabled: "Enabled"
 setting_ck_geroian_coalition_enabled_desc: "Geroian rulers will summon their neighbors to help defend against foreign invasions."
 setting_ck_geroian_coalition_disabled: "#V Disabled#!"
 setting_ck_geroian_coalition_disabled_desc: "Geroian rulers will not use their neighbors to help defend against foreign invasions."
 game_rule_category_calradia_kings: "@ck_small_icon! #color_porple Calradian Kings#!"
 game_rule_category_bannerlord: "#ck_bl_yellow Bannerlord#!"
 game_rule_category_warband: "@warband_icon!#ck_wb_green Warband#!"
#  rule_the_damar_river_situation: "$ck_pre$ [damar_situation|E]"
#  setting_the_damar_river_situation_toggle_on: "#V Enabled#!"
#  setting_the_damar_river_situation_toggle_on_desc: "All rulers with a capital along the Damar River will be involved in a [situation|E] with its own [region_seasons|E].\n#calradian_gold Nomadic Region: Nahasa gamerule is recommended!#!"
#  setting_the_damar_river_situation_toggle_off: "Disabled"
#  setting_the_damar_river_situation_toggle_off_desc: "[damar_situation|E] [situation|E] will not be enabled and any gameplay along the Damar River will play like any other part of the map."
 rule_great_steppe_khuzaits: "$ck_pre$ $bl_pre$ Great Steppe: Khuzaits"
 setting_ck_non_canon_nomads: "$non_canon$ [nomads|E]"
 setting_ck_non_canon_nomads_desc: "Non-canonical tribal holdings in the [the_great_steppe|E] will be converted to nomadic."
 setting_ck_duchy_nomads: "#V Ducal Nomads#!"
 setting_ck_duchy_nomads_desc: "All duchy titles with capitals in the [the_great_steppe|E] will be converted to nomadic."
 setting_ck_whole_khuzait: "#V Nomadic Khanate#!"
 setting_ck_whole_khuzait_desc: "The whole Khuzait Khanate will become nomadic on game start, with the entire region becoming a part of the [the_great_steppe|E]!\n#warning Possibly unbalanced!#!"
 setting_ck_shatter_khanate: "#V Shattered Khanate#!"
 setting_ck_shatter_khanate_desc: "The Khuzait Khanate will become shattered.\nIn its ashes, every former vassal, and below, will become nomads fighting over the corpse of the Khanate."
 setting_ck_shatter_khanate_duchies: "#V Shattered Khuzait Duchies#!"
 setting_ck_shatter_khanate_duchies_desc: "#warning Feeling brave then?#!\nShatters the Khuzait ducal titles into nomadic counties."
 setting_ck_no_nomads: "#V No Khuzic Nomads#!"
 setting_ck_no_nomads_desc: "No nomads in the Khuzait Khanate"
 rule_nahasa_nomad_region_on: "$ck_pre$ Extra Nomadic Region: Nahasa"
 setting_nahasa_nomad_region_on_off: "Default"
 setting_nahasa_nomad_region_on_off_desc: "The Nahasan region is unchanged."
 setting_nahasa_nomad_region_on_on: "#high Nomadic#!"
 setting_nahasa_nomad_region_on_on_desc: "The Nahasa region uses [nomadic|E] mechanics, designed for Steppe Nomads. This setting will not have any effect unless you own the @khansofthesteppe_icon!#V $DLC020_CE2$#! Expansion."
 rule_ck_titles_coa: "$ck_pre$ Titles Coat of Arms"
 setting_ck_titles_coa_house_coa: "House Coat of Arms"
 setting_ck_titles_coa_house_coa_desc: "Titles will use their rulers' house coat of arms. This setting does not apply to empires and important canon titles."
 setting_ck_titles_coa_default: "#V Default Coat of Arms#!"
 setting_ck_titles_coa_default_desc: "Titles will use their default coat of arms."

 rule_ck_culture_conversion_speed: "$ck_pre$ Culture Conversion Speed"
 setting_default_ck_culture_conversion_speed:0 "Default"
 setting_default_ck_culture_conversion_speed_desc:0 "Conversion speed is unchanged."
 setting_faster_ck_culture_conversion_speed:1 "#high Faster#!"
 setting_faster_ck_culture_conversion_speed_desc:0 "The speed is increased, making conversion take roughly half of the time."
 setting_significantly_faster_ck_culture_conversion_speed:0 "#high Significantly Faster#!"
 setting_significantly_faster_ck_culture_conversion_speed_desc:0 "The speed is significantly increased, making conversion take roughly a quarter of the time."
 setting_significantly_slower_ck_culture_conversion_speed:1 "#high Significantly Slower#!"
 setting_significantly_slower_ck_culture_conversion_speed_desc:0 "The speed is significantly reduced, making conversion take roughly four times longer."
 setting_slower_ck_culture_conversion_speed:1 "#high Slower#!"
 setting_slower_ck_culture_conversion_speed_desc:0 "The speed is reduced, making conversion take roughly twice the time.

 ck_pre: "$game_rule_category_calradia_kings$:"
 bl_pre: "#ck_bl_yellow [Glossary('$game_rule_category_bannerlord|q$', 'ck_bl_gloss')]#!"
 ck_bl_gloss: "Effective in the 1084 bookmarks for Mount&Blade II: $bm_1084_t$."
 wip_suf: "#calradian_gold (WIP)#!"
 wb_pre: "#ck_wb_glow;size:14 [Glossary('$game_rule_category_warband|q$', 'ck_wb_gloss')]#!"
 ck_wb_gloss: "Effective in the 1257 bookmarks for Mount&Blade: $bm_1257_t$."
 canon: "#P Canonical#!"
 non_canon: "#N Non-Canon#!"
 ## Warband-related
 # Canonical Families (Give rulers non-canonical families or not?)
 rule_ck_canonical_families: "$ck_pre$ $wb_pre$ Ruler Families"
 setting_ck_non_canon_generate: "$non_canon$, #V Generated#! Families"
 setting_ck_non_canon_generate_desc: "This setting will enable generating [family_members|E] for faction rulers, respecting the #UND $rule_generate_families$#! rules, which are currently [AccessGameRules.AccessNamedGameRule( 'generate_families' ).GetSetting.GetName]."
 setting_ck_non_canon_preset: "$non_canon$, #V Preset#! Families"
 setting_ck_non_canon_preset_desc: "This setting gives starting rulers a predefined [family|El], consisting of a spouse and 1 child of each gender."
 setting_ck_canon_single: "$canon$ Families"
 setting_ck_canon_single_desc: "In Warband, rulers start with no family, potentially opening the realm to an early [game_over|E] or [claimant_factions|E]. With this setting, rulers of all 6 main [kingdoms|E] will #weak not#! have any [spouse|El] or [children|El]."
 # Claimant Camps - Enabled/Disabled
 rule_ck_claimants_camps: "$ck_pre$ $wb_pre$ Pretender [claimants|E]"
 setting_ck_claimants_no_camps: "#V No Landless#! Claimants"
 setting_ck_claimants_no_camps_desc: "Claimants will not start the game with [camps|E], with the exception of any you choose to play as."
 setting_ck_claimants_camps_on: "#V Landless#! Claimants"
 setting_ck_claimants_camps_on_desc: "Claimants to each of the 6 main [kingdoms|E] will start the game with their own landless [camps|E]."
 setting_ck_claimants_off: "@failed_examination!#N No#! Claimants"
 setting_ck_claimants_off_desc: "The stability of the realm is paramount - therefore all of these pretenders are better off dead."
 setting_ck_claimants_invert: "@passed_examination!#P Successful#! Claimants"
 setting_ck_claimants_invert_desc: "By a twist of fate all rightful claimants sit upon the throne once more. However, who can truly end this cycle of [usurpation|El]?"
 # Naming of the Southern Empire in 1257
 rule_ck_southern_empire_naming_1257: "$ck_pre$ $wb_pre$ Southern Empire Naming"
 setting_default_name_of_southern_empire_1257: "#V $cn_kholradyan_empire$#!"
 setting_default_name_of_southern_empire_1257_desc: "$canon$: The Southern Imperial remnant will be known as the Kholradyan Empire."
 setting_southern_empire_name_of_southern_empire_1257: "#V $e_southern_empire$#!"
 setting_southern_empire_name_of_southern_empire_1257_desc: "$non_canon$: The Southern Empire will remain named as the Southern Empire"
 setting_calradian_empire_name_of_southern_empire_1247: "#V $e_calradian_empire$#!"
 setting_calradian_empire_name_of_southern_empire_1247_desc: "#V What?!#! Why would you give these pretenders the name of [Glossary( '$MythicalFounder_calradios|q$', 'CK_CALRADIOS_GLOSS')]? I guess they'll be known as the Calradian Empire then."
 