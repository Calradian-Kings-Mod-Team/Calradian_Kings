wb_claimant_event.0002.t: "$grand_ambitions_header$: The Mark of the Fallen"
wb_claimant_event.0002.desc: "Having fallen from grace, [recipient.GetTitledFirstNamePossessive] body must bear the reminder of their failure as a ruler of [revoked.GetName].\nYetn my great kindness, I shall only take a part of what is owed to me from [recipient.GetRelationToString( ROOT.Char )]."
wb_claimant_event.0002.recruit: "Yet does it not seem right for them to serve as a living reminder thereafter, [recipient.GetFaith.FateGodName] be damned?"
wb_claimant_event.0002.banish: "May they live long yet wither, as I shall cas them away from the realm like the vile beggar they are!"
# disfigured (original default)
 wb_claimant_event.0002.disfigured: "How dare they breath the same air as us..."
 wb_claimant_event.0002.disfigured.flavor: "How will they smell? Terrible!"
 # infirm to incapable (add other trait if already old)
#  wb_claimant_event.0002.infirm: "The future is now, old [recipient.GetWomanMan]."
 # blinded (one eye at a time)
 wb_claimant_event.0002.blind: "Get out of my sight!"
 wb_claimant_event.0002.one_eyed: "An eye for an eye!"
 # maimed
 wb_claimant_event.0002.clubfooted: "Get used to staying on your knees..."
 wb_claimant_event.0002.hunchbacked: "Grovel before me!"
 wb_claimant_event.0002.one_legged: "You think walking free is an option?"
 wb_claimant_event.0002.one_handed: "They shall never bear arms again."
 # castrated
 wb_claimant_event.0002.eunuch: "No more seeds of discontent..."
