l_english:
 # Visit Lake Rat Hideout #
 ## WB COMPANIONS ##
 # ep3_laamp_decision_events.txt
 ep3_laamp_decision_event.1030.desc_ck_companion_recruited: "[laamp_warband_companion_recruitable.GetNameNoTooltip] has gathered [laamp_warband_companion_recruitable.GetHerHis] belongings and left the tavern for camp."
 ep3_laamp_decision_event.1030.desc_ck_companion_nonrecruited: "[laamp_warband_companion_recruitable.GetNameNoTooltip] continues to sit in the corner, drinking [laamp_warband_companion_recruitable.GetHerHis] ale."
 ep3_laamp_decision_event.1030.ck.companion_second: "I'll pay [laamp_warband_companion_recruitable.GetNameNoTooltip] another visit."
 ep3_laamp_decision_event.1030.ck.companion_tt_second: "Approach [laamp_warband_companion_recruitable.GetNameNoTooltip] again"
 ep3_laamp_decision_event.1030.ck.companion: "Let me meet this intriguing figure."
 ep3_laamp_decision_event.1030.ck.companion_tt: "Approach the secluded figure"
 # ck_laamp_visit_events.txt - Meet the Companion
 ck_laamp_visit_events.1000.t: "The Companion"
 # Description
 # First Part
 ck_laamp_visit_events.1000.desc: "I approach the figure, drinking and seemingly having a splendid time, but something from [laamp_warband_companion_recruitable.GetHerHis] demenor tells me otherwise. I cannot know for certain if [laamp_warband_companion_recruitable.GetSheHe] drinks for the fun of it, or if [laamp_warband_companion_recruitable.GetSheHe] drinks because of something in [laamp_warband_companion_recruitable.GetHerHis] past. You approach the figure"
 ck_laamp_visit_events.1000.desc_second: "I approach [laamp_warband_companion_recruitable.GetNameNoTooltip] yet again. [laamp_warband_companion_recruitable.GetSheHe] looks up at me expectedly, "Have you reconsidered taking me on?""
 ck_laamp_visit_events.1000.desc_second_2: "I approach the figure yet again. [laamp_warband_companion_recruitable.GetSheHe|U] looks up at me with boredom in [laamp_warband_companion_recruitable.GetHerHis] eyes. "Have you returned to yet again dismiss me?""
 # Second Part
 ck_laamp_visit_events.1000.desc_alayen: " and he looks up at you, asking, "You there, good [ROOT.Char.GetWomanMan, be so kind as to fetch me another drink, eh?""
 ck_laamp_visit_events.1000.desc_artimenner: " who looks up at you as you approach and asks, "Oh! Say, friend, are you by chance heading out of town anytime soon?""
 ck_laamp_visit_events.1000.desc_baheshtur: " and they notice you and raise their cup, "Greetings, traveller. Would you join me for a drink?""
 ck_laamp_visit_events.1000.desc_borcha: " and he looks up at with an eagerness, "Ho there, traveller. You wouldn't by chance be in the market for a tracker, would you?""
 ck_laamp_visit_events.1000.desc_bunduk: " who takes a moment to notice your presence. Once he notices you, he hiccups and cheers you, "Greetings there, [ROOT.Char.Custom('GetSisterBrother_ck')|L]! Here's to the doom and downfall of all high-born lords and ladies! Hic!""
 ck_laamp_visit_events.1000.desc_deshavi: " and she looks up at with suspicion, eyes locked intently on yours. "Yes? Keep your distance, by the way.""
 ck_laamp_visit_events.1000.desc_firentis: " and he looks up at you approaching, eyes red and the sight of dried tears on his cheeks. He starts sobbing into his drink, constantly exclaiming, "I am lost... Lost...""
 ck_laamp_visit_events.1000.desc_jeremus: " whom just finished a conversation with a disgruntled mercenary captain hobbling off. He notices you approach and perks up, "Greetings, fellow traveller. Perhaps you can help me.""
 ck_laamp_visit_events.1000.desc_katrin: "and notice as you approach the signs of aging on this woman, perhaps no older than sixty, as she drinks everyone around her under the table. Cheeks reddened from drinking, she notices you approach and raises her cup, "Hello there, laddie. Have a drink on me.""
 ck_laamp_visit_events.1000.desc_klethi: ", hiding away in the darker parts of the tavern. You think you see the silver glint of a blade in her hand and consider turning back. However, she has taken notice of you and has been observing you from the moment you entered the tavern. Sizing you up, the nimble young woman finally speaks, "Hello there. From the look of you, I'd say you're expecting to get into some fights in the near future. Are you by any chance looking for some help?""
 ck_laamp_visit_events.1000.desc_lezalit: ", his brow furrowed so hard it almost appears as though it could at any moment become permanent. He has an air of arrogance to him and he stares daggers into the drunken soldiers in the tavern. Noticing you approach, he wastes no time in addressing you, "Yes? What is it you wish?""
 ck_laamp_visit_events.1000.desc_marnid: ", fingers dancing a lone denar in circles on the table. You have barely approached when you hear an audible sigh coming from the man. He looks up at you, your silhouette masking the light within the taverns and darkening his gaze. He gives a faint smile, lifts his empty flagon to you, "Hello. Would you be so kind as to have a cup with me? I'm down to my last five denars and I'd rather not drink alone.""
 ck_laamp_visit_events.1000.desc_matheld: ", the strong, sharp features of her face are framed by blonde hair pulled back into a ponytail. With an upright posture of self-importance, she gives a constant glance around the tavern in between drinks before noticing you approach. If gazes could kill, hers would. She speaks to you with a sternness in her voice, "What do you want?""
 ck_laamp_visit_events.1000.desc_nizar: ", flanked by gentlemen and women on both sides as he finishes one of his latest tales. Noticing you, he takes note of your seeming importance and brushes the people off his shoulders. Alone with you now, he introduces himself, "Greetings, traveler. I am Nizar. No doubt you will have heard of me.""
 ck_laamp_visit_events.1000.desc_rolf: ", whom just recently finished a conversation with another mercenary captain. The captain, seemingly in a worse mood could be heard whispering under his breath, "House of Rolf, my ass." as he brushes past you. You look over at the individual you assume to be from the House of Rolf, and he wastes no time introducing himself, "Greetings. I am Rolf, son of Rolf, of the most ancient and puissant House of Rolf.""
 ck_laamp_visit_events.1000.desc_ymira: " who has fallen back into her seat having been rejected by another mercenary captain. Before you sits a girl, who looks no older than thirty, seemingly trying to strike conversations with captains from around tavern. Finally, she comes to you and too eagerly exclaims, "Good day to you!""
 #If the player immediately dismisses the companion before hearing their story
 ck_laamp_visit_events.1000.desc_reencounter: " who looks up at you, "So, I hope we can off on the right foot this time?""
 #If the story was already told
 ck_laamp_visit_events.1000.desc_reencounter_story: " who looks up at you, "I hope you have reconsidered my offer?""
 # tt
 ck_laamp_visit_events.1000.a.tt: "You listen to the person's story"
 # Fallbacks
 ck_laamp_visit_events.1000.a: "Good day to you!"
 ck_laamp_visit_events.1000.b: "I'm not interested. Good day."
 ck_laamp_visit_events.1000.a_reencounter: "Yes, I apologize."
 ck_laamp_visit_events.1000.a_reencounter_story: "Yes, I'm interested."
 ck_laamp_visit_events.1000.b_reencounter_story_n: "Sorry, but I am not interested."
 ck_laamp_visit_events.1000.a_reencounter_story_2: "I apologize. I will listen."
 # Companion-specific
 ck_laamp_visit_events.1000.a.alayen: "You must have me confused with the tavernkeep, sir."
 ck_laamp_visit_events.1000.b.alayen: "Fetch it yourself!"

 ck_laamp_visit_events.1000.a.artimenner: "I am. What concern is it of yours, may I ask?"
 ck_laamp_visit_events.1000.b.artimenner: "I'd be obliged if you minded your own business, sir."

 ck_laamp_visit_events.1000.a.baheshtur: "Certainly. With whom do I have the pleasure of drinking?"
 ck_laamp_visit_events.1000.b.baheshtur: "I have no time for that."

 ck_laamp_visit_events.1000.a.borcha: "Perhaps. What's the urgency?"
 ck_laamp_visit_events.1000.b.borcha: "Step back, sir, and keep your hand away from my purse."

 ck_laamp_visit_events.1000.a.bunduk: "Why do you say that, sir?"
 ck_laamp_visit_events.1000.b.bunduk: "That's rebel talk, and I'll hear none of it. Good day to you."

 ck_laamp_visit_events.1000.a.deshavi: "My apologies, I was merely going to say that you look a bit down on your luck."
 ck_laamp_visit_events.1000.b.deshavi: "Right. I'll not bother you, then."

 ck_laamp_visit_events.1000.a.firentis: "Why so gloomy, friend?"
 ck_laamp_visit_events.1000.b.firentis: "No doubt. Well, good luck getting found."

 ck_laamp_visit_events.1000.a.jeremus: "How is that?"
 ck_laamp_visit_events.1000.b.jeremus: "Sorry, I am afraid that I am otherwise engaged right now."

 ck_laamp_visit_events.1000.a.katrin: "What's the occasion?"
 ck_laamp_visit_events.1000.b.katrin: "I think not, madame."

 ck_laamp_visit_events.1000.a.klethi: "I could be. What's your story?"
 ck_laamp_visit_events.1000.b.klethi: "Mind your own business, lass."

 ck_laamp_visit_events.1000.a.lezalit: "To pass the time of day with a fellow traveller, if you permit."
 ck_laamp_visit_events.1000.b.lezalit: "Nothing at all. My apologies."

 ck_laamp_visit_events.1000.a.marnid: "Your last five denars? What happened to you?"
 ck_laamp_visit_events.1000.b.marnid: "I have better things to do."

 ck_laamp_visit_events.1000.a.matheld: "Merely to pass the time of day, ma'am, if you're not otherwise engaged."
 ck_laamp_visit_events.1000.b.matheld: "Nothing at all, from one so clearly disinclined to pleasantries. Good day to you."

 ck_laamp_visit_events.1000.a.nizar: "Um... I don't think so."
 ck_laamp_visit_events.1000.b.nizar: "No, and I can't say that I much want to make your acquaintance."

 ck_laamp_visit_events.1000.a.rolf: "Hmm... I have never heard of the House of Rolf"
 ck_laamp_visit_events.1000.b.rolf: "Eh? No thanks, we don't want any."

 ck_laamp_visit_events.1000.a.ymira: "Hello. What's a clearly well-brought up young lady like you doing in a place like this?"
 ck_laamp_visit_events.1000.b.ymira: "Run along now girl. I have work to do."

 # ck_laamp_visit_events.1001 - conversing with companion
 # Title is companion's name
 ck_laamp_visit_events.1001.t: "[laamp_warband_companion_recruitable.GetNameNoTooltip]"
 # Different Backstories of each character, with a proposal to join player's company
 # Return
 ck_laamp_visit_events.1001.desc_revisit: "[laamp_warband_companion_recruitable.GetNameNoTooltip] addresses me, "Since you have already heard my past story, and what I both am and am not capable of. Would you be willing to hire me now? Have your circumstances changed?""
 # First Time
 ck_laamp_visit_events.1001.desc_alayen: "My most humble apologies. It is sometimes hard to recognize folk amid the smoke and gloom here. I still cannot believe that I must make my home in such a place.\n\nI was my father's first son, and his heir. But my mother died, and my father remarried. His new wife thought that her son should inherit. She could not move against me openly, but the other day I fed a pot of suet that had been left out for me to one of my hounds, and it keeled over. I accused my stepmother, but my father, befuddled by her witchcraft, refused to believe me and ordered me to leave his sight.\n\nI hope to offer my sword to some worthy captain, as it is the only honourable profession for a man of my birth apart from owning land, but in the meantime I am condemned to make my bed among thieves, vagabonds, merchants, and the other riff-raff of the road."
 ck_laamp_visit_events.1001.desc_artimenner: "I'm an engineer, specialized in the art of fortification. If you need a wall knocked down, I can do that, given enough time. If you need a wall built back up, I can do that too, although it will take longer and cost you more. And you can't cut costs, either, unless you want your new edifice coming down underneath you, as someone around here has just found out.\n\nThe castellan here wanted a new tower added to the wall. Trouble is, he ran out of cash halfway through the process, before I could complete the supports. I told him that it would collapse, and it did. Unfortunately he was standing on it, at the time. The new castellan didn't feel like honoring his predecessor's debts and implied that I might find myself charged with murder if I push the point.\n\nMore fool me for having taken the contract without an advance, I suppose, but the end of it all is that I'm in a difficult spot, with the roads full of bandits and no money to pay for an escort. So I'd be much obliged if a well-armed party heading out in the next few days could take me along."
 ck_laamp_visit_events.1001.desc_baheshtur: "I am Baheshtur, son of Azabei, grandson of Badzan. Were you not a barbarian, you would likely know from my lineage that I am a Roan Horse Khergit of the highlands, of the tribe of Shamir, of the clan of Dulam, of the family of Ubayn, from the Pantash valley, and you might be able to guess why I am so far from home.\n\nFor as long as any one can remember, our people have feuded with the tribe of Humyan, many of whom have settled in the next valley over. Many men have died in this feud, on both sides, including two of my brothers. The Khan himself has ordered us to cease, to save men for the wars in Calradia. But I know my rights, and my brothers' blood cries out for vengeance. I waylaid and killed a Humyan on a track over the mountains, and I rode out of our village the same night, without even having had the chance to bid farewell to my father. I will bide my time in Calradia, for a year or two, then return home when the Khan's men have forgotten. The Humyan will not forget, of course, but such is the price of honour.\n\nIn the meantime, any opportunities to earn a living with my sword would be most welcome."
 ck_laamp_visit_events.1001.desc_borcha: "Well, [ROOT.Char.Custom('GetMadameSir_ck')|L], it's a long story...\n\nI had a bit of a misunderstanding here about a horse that I found tied up outside the inn. It was the spitting image of a beast that threw me a few days back and ran off. Naturally I untied it for a closer look. As it turns out, the horse belonged to a merchant, a pinch-faced old goat who wouldn't accept that it all was a simple misunderstanding, and went off to get the guard.\n\nBut if I was with a larger group who could vouch for me, they might let it pass. I'd be very grateful to you."
 ck_laamp_visit_events.1001.desc_bunduk: "It's a long story, but if you get yourself a drink, I'll be glad to tell it.\n\nA sergeant I was, in the garrison here at. Twenty years I stood guard for the city, taking many a hard knock in many a tough fight, until they appointed a snot-nosed, downy-lipped princeling, barely out of his mother's cradle, as commander of the garrison. He came upon me standing watch atop the tower, with my crossbow unstrung -- on account of the rain, you see... Can't have the cord loosen... But Little Prince Snot-Nose tells me that an unstrung bow is dereliction of duty. Says he'll have me horsewhipped. And something in me snapped. So I walked off my post.\n\nNow I'm here getting drunk, and the Devil take tomorrow."
 ck_laamp_visit_events.1001.desc_deshavi: "My luck? You could say that.\n\nIt was my bad luck to be born to a weak father who married me off to a drunken layabout who beat me. It was my bad luck, when I ran away from my husband, to be taken by a group of bandits. It was my bad luck that the only one among them who was kind to me, who taught me to hunt and to fight, inspired the jealousy of the others, who knifed him and forced me to run away again.\n\nBut I do not count myself unlucky, stranger, no more than any other woman of Calradia, this fetid backwater, this dungheap among the nations, populated by apes and jackals. If you are looking for those in need of work, I could certainly use the money."
 ck_laamp_visit_events.1001.desc_firentis: "I have commited [sic] the greatest of sins, [ROOT.Char.Custom('GetMadameSir_ck')|L], and it is to my shame that I must appoint you my confessor, if you should like to hear it.\n\nI was a captain of horse in the service of the lord here in, and my brother served with me. But we were both in love with the same woman, a courtesan -- a temptress, who played upon our jealousies! My brother and I quarreled. I had drunk too much. He slapped me with his glove, and I spit him upon my sword... My own brother! My sword-arm was stained with the blood of my kin!\n\nDo you believe there is hope for a man like me? Can I find the path of righteousness, or am I doomed to follow the demons that dwell inside of me?"
 ck_laamp_visit_events.1001.desc_jeremus: "I shall tell you -- but know that it is a tale of gross iniquity. I warn you in advance, lest you are of a choleric temperament, and so become incensed at the injustice done unto me that you do yourself a mischief.\n\nI am by training a natural philosopher, but condemned by the jealousy of the thick-headed doctors of my university to make my living as an itinerant surgeon. I was hired by a merchant of this city to cure his son, who fell into a coma after a fall from his balcony. I successfully trepanned the patient's skull to reduce the cranial swelling, but the family ignored my advice to treat the ensuing fevers with a tincture of willow bark, and the boy died. The father, rather than reward me for my efforts, charged me with sorcery -- me, a philosopher of nature! Such is the ignorance and ingratitude of mankind.\n\nThe lord of this castle is reluctant to place me under arrest, but I am anxious to move on elsewhere."
 ck_laamp_visit_events.1001.desc_katrin: "Why, I managed to sell my wagon and pots, [ROOT.Char.Custom('GetLassLad_ck')|L]. For once I've got money to spend and I intend to make the best of it.\n\nFor thirty years I followed the armies of this land, selling them victuals and drink, watching their games of dice and finding them girls, and nary a denar was left in my purse at the end.\n\nIt's no kind of life, victualling the armies. You earn a bit here and a bit there as the soldiers spend their money, and then along comes one defeat and you have to start over, endebting [sic] yourself to buy a new wagon and new oxen. So I've decided to get out of the business, but army life is all I know."
 ck_laamp_visit_events.1001.desc_klethi: "Well, [ROOT.Char.Custom('GetMadameSir_ck')|L], as long as I can remember I've had a weakness for pretty things, and it's gotten me into trouble, you see.\n\nI grew up in Malayurg castle as a bonded servant, working alongside my mother in the kitchens. I would amuse myself by hunting mice through the pantries and sculleries. I was so good at it that I put the castle cats out of a job, and eventually the lord realized that I might also be employed to track down bigger game, on certain errands of a type perhaps better left unsaid. Needless to say, I found a number of opportunities to avail myself of trinkets that had formerly belonged to my lord's enemies. So I was able to buy myself out of bondage, and find hire as a free agent. My last job was here.\n\nUnfortunately, my last employer's wife had a lovely amulet, of a kind I simply could not resist. She doesn't know it's missing, yet, but she might soon. So tell me, are you looking for helpers?"
 ck_laamp_visit_events.1001.desc_lezalit: "Very well. I do not mind. My name is Lezalit.\n\nI am the second son of the count of Geroia, of whom you have no doubt heard. Having no inheritance of my own, I came here to seek my fortune in Calradia, training men in the art of battle. Unfortunately, the lord here has no taste for the disciplinary methods needed to turn rabble into soldiers. I told him it was wiser to flog them now, then bury them later. But he would not listen, and I was told to take my services elsewhere.\n\nSo, if you know of any commander who believes that his purpose is to win battles, rather than pamper his soldiers, I would be pleased if you directed me to him."
 ck_laamp_visit_events.1001.desc_marnid: "It's a tragic tale, [ROOT.Char.Custom('GetMadameSir_ck')|L].\n\nA while back, I left Geroia with a caravan of goods. I was hoping to sell it all in Sargoth and make a hefty sum. But, what do you know... we were ambushed by a party of Khergit raiders who rode away with most of the horses and goods. And two days later, my own caravan guards ran away with the rest of what I had.\n\nSo here I am, no money and no way home."
 ck_laamp_visit_events.1001.desc_matheld: "Ah. Well, if you must know, I shall tell you.\n\nI am from an old family in the northern lands, the daughter of a thane and also wife to one. I fought by my husband's side, his partner both in war and in peace. But my husband died of the plague, when I was still childless. My husband had decreed that I should inherit his lands, in the absence of an heir. My brother-in-law, cursed be his name, said that it was not our custom that women could inherit a thanedom. That was nonsense, but his gold bought the loyalties of enough of my husband's faithless servants for him to install himself in my hall. So I fled, something I was raised never to do, and something I hope never to do again.\n\nWhen I have enough gold to raise an army I shall go back and take what it is mine."
 ck_laamp_visit_events.1001.desc_nizar: "You have not? Then perhaps you will have heard of my steed, who cuts across the Calradian plains like a beam of moonlight? Or of my sword, a connoisseur of the blood of the highest-born princes of the land?\n\nI am a warrior by profession. But perhaps you may also have heard of my prowess as a poet, who can move the iciest of maidens to swoon. Or of my prowess in the art of the bedchamber, in which I must confess a modest degree of skill. I confess a modest affection for Calradia, and for the past several years have visited its towns, castles, and villages, making the most of my talents.\n\nWhich reminds me -- somewhere out there in the city is a rather irate husband. I don't suppose you might consider helping me leave town?"
 ck_laamp_visit_events.1001.desc_rolf: "Really? Well, perhaps your ignorance can be forgiven. Our ancestral lands are far away, over the mountains.\n\nLike all the men of my family, I have come to a foreign land to make a name for myself in the profession of arms before returning home to take over custodianship of my estates.\n\nUnfortunately, the authorities in these lands have little understanding of the warrior code, and have chosen to call me a bandit and brigand, and put a price on my head -- a most unfair libel to throw at a gentleman adventurer, you will surely agree.\n\nBut I am anxious to avoid any further trouble, so if you knew of any company of fighting men where I might enlist, I would be most grateful."
 ck_laamp_visit_events.1001.desc_ymira: "A good question, and I shall tell you!\n\nMy father, a well-known merchant here, decided that I should be married to one of his business partners, a man well past the age of thirty. I have been an obedient daughter all of my life, but it was a ridiculous and horrid proposition. So I ran away!\n\nI shall marry whom I want, when I want. Moreover, regardless of what my father might think, I am perfectly capable of taking care of myself. I was thinking that I should perhaps join a band of gypsies, or perhaps a troop of mercenaries!"
 ck_laamp_visit_events.1001.desc: "I was born to a farmer's life until the war came and burned our village to the ground. The soldiers took the grain, the fire took the rest, and I took to the road with nothing but a hoe turned spear.\n\nSince then I've fought for whoever would feed me, seen lords rise and fall, and learned that loyalty rarely fills a stomach. I'm looking for a place where my blade can earn a night's peace, at least until the next war finds me."
 # Custom Options
 ck_laamp_visit_events.1001.a.alayen: "Well, it shouldn't be. You may join us."
 ck_laamp_visit_events.1001.b.alayen: "Some of my best friends are riff-raff. Good day to you, sir."

 ck_laamp_visit_events.1001.a.artimenner: "Wherever you need to go, I would be pleased to hire you."
 ck_laamp_visit_events.1001.b.artimenner: "Actually, I need a different kind of expertise. My apologies."

 ck_laamp_visit_events.1001.a.baheshtur: "That's the spirit! I might be able to offer you something."
 ck_laamp_visit_events.1001.b.baheshtur: "Actually, on second thought, I prefer to keep more civilized company."

 ck_laamp_visit_events.1001.a.borcha: "Good. You can be useful to us."
 ck_laamp_visit_events.1001.b.borcha: "I'd prefer not to take the risk. Good day, sir."

 ck_laamp_visit_events.1001.a.bunduk: "You're a good man. I could use experienced fighters."
 ck_laamp_visit_events.1001.b.bunduk: "We value discipline pretty highly in our company. Good day to you."

 ck_laamp_visit_events.1001.a.deshavi: "I will hire you. Try not to shoot anyone on your first day."
 ck_laamp_visit_events.1001.b.deshavi: "You sound like you might be trouble. Good day to you."

 ck_laamp_visit_events.1001.a.firentis: "You could join us. Right wrongs, fight oppressors and redeem yourself."
 ck_laamp_visit_events.1001.b.firentis: "Away with you, accursed fraticide!"

 ck_laamp_visit_events.1001.a.jeremus: "We would gladly welcome your company, doctor."
 ck_laamp_visit_events.1001.b.jeremus: "Sorry. I can't take on any new hands right now."

 ck_laamp_visit_events.1001.a.katrin: "It sounds like you'll be useful. You're hired."
 ck_laamp_visit_events.1001.b.katrin: "Very interesting, madame, but I have work to do."

 ck_laamp_visit_events.1001.a.klethi: "You sound capable enough. You should come with us."
 ck_laamp_visit_events.1001.b.klethi: "To be honest, I'd prefer someone who was a little less tempted to larceny."

 ck_laamp_visit_events.1001.a.lezalit: "Good, I'll be happy to hire someone like you."
 ck_laamp_visit_events.1001.b.lezalit: "Actually I have no wish to provoke a mutiny in my ranks. Good day, sir."

 ck_laamp_visit_events.1001.a.marnid: "Well, perhaps I could offer you work."
 ck_laamp_visit_events.1001.b.marnid: "Hard luck, friend. Good day to you."

 ck_laamp_visit_events.1001.a.matheld: "I can offer you the opportunity to make money through honest fighting!"
 ck_laamp_visit_events.1001.b.matheld: "You'd best seek your fortune elsewhere."

 ck_laamp_visit_events.1001.a.nizar: "I could use an extra sword in my company."
 ck_laamp_visit_events.1001.b.nizar: "No, sorry. Nothing I can do for you."

 ck_laamp_visit_events.1001.a.rolf: "I might be able to hire an extra hand."
 ck_laamp_visit_events.1001.b.rolf: "We are not in the habit of hiring bandits with invented pedigrees."

 ck_laamp_visit_events.1001.a.ymira: "If you're willing to learn, I could use another hand."
 ck_laamp_visit_events.1001.b.ymira: "Go back to your family, lass."
 ck_laamp_visit_events.1001.c: "I'm afraid I cannot afford this at the moment."
 ck_laamp_visit_events.1001.c.reason: "This option is available because you cannot afford to recruit [laamp_warband_companion_recruitable.GetNameNoTooltip]"