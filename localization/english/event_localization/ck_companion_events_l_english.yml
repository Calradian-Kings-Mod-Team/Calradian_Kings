l_english:
 ## wb_companion_event.0001 - Address Objections
 # Title
 wb_companion_event.0001.t: "Objection: "
 wb_companion_event.0001.t_food: "Low Supplies"
 wb_companion_event.0001.t_quest: "Failed Contracts"
 wb_companion_event.0001.t_casualty: "High Casualties"
 ## Desc
 # Food
 wb_companion_event.0001.desc_food: "With a growling stomach, I've decided enough is enough, and I walk across the camp to meet [wb_companion_0001.GetNameNoTooltip] and speak with [wb_companion_0001.GetHerHim] about the past lack of rations.\n\n"
 # Quest
 wb_companion_event.0001.desc_quest: "With a scarred pride and weakened coin purse, I've decided maybe it is time to address the recent contract failures our party has faced. Given [wb_companion_0001.GetNamePossessiveNoTooltip] voiced concerns have been the loudest, I decide to confront [wb_companion_0001.GetNameNoTooltip] personally to address the grievances.\n\n"
 # Casualties
 wb_companion_event.0001.desc_casualty_doctor: "Wandering through camp among the broken bodies of soldiers, those who followed me to their doom, I find our camp doctor, [ck_physician.GetNameNoTooltip] tend to those in dire need of medical aid. [ck_physician.GetSheHe] looks up at me as I pass, "Captain, we cannot take any more losses like this. I hear [wb_companion_0001.GetNameNoTooltip] wishes to speak with you. If you're truly concerned about the lives of these soldiers, then please hear [wb_companion_0001.GetHerHim] out." [ck_physician.GetSheHe] goes back to tending the wounded while I wander the camp looking for [wb_companion_0001.GetNameNoTooltip].\n\n"
 wb_companion_event.0001.desc_casualty: "Taking in the gruesome sights before me, the soldiers hired by our company to fight on our behalf are either dead, gone, or took broken to move anywhere. I can hear the murmurs under peoples' breath, condemning me for what they consider to be my fault, and it might just be. I sent them to their doom and now the more notable voices in my camp are requesting to speak with me about it. Taking one more look at the broken warriors, I wander off to find [wb_companion_0001.GetNameNoTooltip].\n\n"
 ## Food
 wb_companion_event.0001.desc_food_artimenner: "I find [wb_companion_0001.GetNameNoTooltip] grabbing half of an eaten apple, take a look at it, and shrug before biting into it. As [wb_companion_0001.GetSheHe] bites down into the apple, [wb_companion_0001.GetSheHe] looks up and notices my gaze and takes the apple out, "[ROOT.Char.Custom('GetMadameSir_ck')], just so you know my opinion, any commander with sense will not let his company run out of food. I hope you don't mind me speaking so bluntly.""
 wb_companion_event.0001.desc_food_baheshtur: "Looking around camp for half an hour, I finally find [wb_companion_0001.GetNameNoTooltip]. [wb_companion_0001.GetSheHe]'s carrying what appears to be a tiny animal killed in a hunt. [wb_companion_0001.GetSheHe] looks at at me before carrying the process of skinning the animal, "Pardon me, captain. It is not good to run out of food," blood splatters from the incision, "Your first duty is to the men who have taken your salt." He waves the skinning knife around as he speaks, "The least they can expect is food, pay, the opportunity to loot, and that you not waste their lives needlessly.""
 wb_companion_event.0001.desc_food_borcha: "I find [wb_companion_0001.GetHerHim] near the campfire, gnawing at a small piece of bread. [wb_companion_0001.GetSheHe] looks up at me, "Oy, boss! Please don't take this the wrong way, but it's a hard life and it's a bit much that we not be able to pay the men. Take a little more care in the future, captain, if you don't mind my saying.""
 wb_companion_event.0001.desc_food_deshavi: "[wb_companion_0001.GetNameNoTooltip] could be found scrounging for food scraps and throws them in a fit. As soon as [wb_companion_0001.GetSheHe] sees you, [wb_companion_0001.GetSheHe] wastes no time in laying into you, "Captain, I do not like to see us run out of food. Such are the actions of a common bandit chief, with no regard for his followers.""
 wb_companion_event.0001.desc_food_katrin: "I find [wb_companion_0001.GetNameNoTooltip] giving bread to someone else in camp when [wb_companion_0001.GetSheHe] sees me. [wb_companion_0001.GetSheHe] gestures the person on, approaches me, and addresses me directly, "Excuse me, captain. It's not good that we run out of food. I've followed armies and warbands for thirty years, and the least the soldiers expect of a leader is to feed them, pay them, and do his best to keep their sorry skins intact as best he can.""


 ## Quests
 wb_companion_event.0001.desc_quest_alayen: "I find [wb_companion_0001.GetNameNoTooltip] digging [wb_companion_0001.GetHerHis] grubby hands into the last of the sweetrolls. [wb_companion_0001.GetSheHe|U] notices my gazing, "Captain! I have been meaning to speak to you!". [wb_companion_0001.GetSheHe|U] finishes the roll before continuing with a much more serious tone, "Captain, I am dismayed that you fail a contract which we undertook on word of honour. A [ROOT.Char.Custom('GetLadyGentleman_ck')] such as yourself should exhibit the highest standards of honour at all times.""
 wb_companion_event.0001.desc_quest_artimenner: "Approaching our camp wagon, I find [wb_companion_0001.GetNameNoTooltip] looking around for some of [wb_companion_0001.GetHerHis] belongings, seemingly missing now. [wb_companion_0001.GetSheHe] notices my presence and turns around, "You know, friend, it's none too reassuring to see how you just fail a contract which we undertook on word of honour. If you can break your word to them, you can break your word to me, is how I figure it.""
 wb_companion_event.0001.desc_quest_firentis: "It doesn't take long to find [wb_companion_0001.GetNameNoTooltip]. [wb_companion_0001.GetSheHe|U]'s counting [wb_companion_0001.GetHerHis] coins, but unknown to you [wb_companion_0001.GetSheHe] is planning a small fortune to send back to [wb_companion_0001.GetHerHis] family as hope for little bit of redemption, but your recent contract failures have stopped [wb_companion_0001.GetHerHim] from accomplishing this. [wb_companion_0001.GetNameNoTooltip] sees you approach and sighs, "[ROOT.Char.Custom('GetSisterBrother_ck')], I can't say I like to see us turn every battle into a bloodbath for our side. You should treat your men well, and they'll repay with interest. ""
 wb_companion_event.0001.desc_quest_marnid: "[wb_companion_0001.GetNameNoTooltip] finds me before I can find [wb_companion_0001.GetHerHim], and asks for a moment of my time to say to something. I nod and [wb_companion_0001.GetSheHe] raises [wb_companion_0001.GetHerHis] chin and states, "[ROOT.Char.Custom('GetMadameSir_ck')], I'm not altogether happy that we fail a quest which we undertook on word of honour. I'm a merchant, and in our business one is bonded by one's word. I don't want a reputation for dishonesty. That would spell my end as a trader, sir.""


 ## Casualties
 wb_companion_event.0001.desc_casualty_artimenner: "I find [wb_companion_0001.GetNameNoTooltip] tending to some wounds from our recent catastrophic battle. Wincing in pain, [wb_companion_0001.GetSheHe] looks up and notices me approaching. Tending to [wb_companion_0001.GetHerHis] wound, [wb_companion_0001.GetNameNoTooltip] addresses me while dressing [wb_companion_0001.GetHerHis] wound, "[ROOT.Char.Custom('GetMadameSir_ck')], just so you know my opinion, any commander with sense will not let his company turn every battle into a bloodbath for our side. I hope you don't mind me speaking so bluntly.""
 wb_companion_event.0001.desc_casualty_baheshtur: "Looking around camp for half an hour, I finally find [wb_companion_0001.GetNameNoTooltip] dressing the wounds on some soldiers. [wb_companion_0001.GetSheHe] looks at at me before finishing the soldier's wound and gets up to address me, "Pardon me, captain. It is not good to lead our soldiers to their bloody deaths like this. Your first duty is to the men who have taken your salt." He waves around to the wounded soldiers as he speaks, "The least they can expect is food, pay, the opportunity to loot, and that you not waste their lives needlessly.""
 wb_companion_event.0001.desc_casualty_borcha: "I find [wb_companion_0001.GetHerHim] near the campfire, gnawing at a small piece of bread. [wb_companion_0001.GetSheHe] looks up at me, "Oy, boss! Please don't take this the wrong way, but it's a hard life and it's a bit much that we lose so many soldiers in these battles we should not be taking. Take a little more care in the future, captain, if you don't mind my saying.""
 wb_companion_event.0001.desc_casualty_bunduk: "I see [wb_companion_0001.GetNameNoTooltip] tending to some of the soldiers wounded in our recent engagements. [wb_companion_0001.GetSheHe] notices me approaching and wraps up the dressings on a soldier before rising to meet me. [wb_companion_0001.GetNameNoTooltip] addresses me while motioning to the injured soldiers behind [wb_companion_0001.GetHerHim], "[ROOT.Char.Custom('GetSisterBrother_ck')], I can't say I like to see us turn every battle into a bloodbath for our side. You should treat your men well, and they'll repay with interest.""
 wb_companion_event.0001.desc_casualty_deshavi: "I find [wb_companion_0001.GetNameNoTooltip] dressing some of her own wounds. As soon as [wb_companion_0001.GetSheHe] sees you, [wb_companion_0001.GetSheHe] wastes no time in laying into you, "Captain, I do not like to see us taking on so many casualties in such needless battles! Such are the actions of a common bandit chief, with no regard for his followers.""
 wb_companion_event.0001.desc_casualty_katrin: "I find [wb_companion_0001.GetNameNoTooltip] tended to wounded soldiers in camp when [wb_companion_0001.GetSheHe] sees me. [wb_companion_0001.GetSheHe] finishes dressing wounds on the soldier, approaches me, and addresses me directly, "Excuse me, captain. It's not good that we turn every battle into a bloodbath for our side. I've followed armies and warbands for thirty years, and the least the soldiers expect of a leader is to feed them, pay them, and do his best to keep their sorry skins intact as best he can.""


 ## Outro
 wb_companion_event.0001.desc_one: "\n\n[wb_companion_0001.GetNameNoTooltip], alone, stands with arms crossed awaiting my response"
 wb_companion_event.0001.desc_several: "\n\n[wb_companion_0001.GetNameNoTooltip] and others like [wb_companion_0002.GetNameNoTooltip] await my response to see what I'll promise them."
 ## Options
 wb_companion_event.0001.a: "I promise to do better."
 wb_companion_event.0001.a.tt: "You will promise to avoid this mistakes in the future"
 wb_companion_event.0001.a.tt.2: "@warning_icon! #X If you make another mistake in three years, your companions will become greatly upset!#!"
 wb_companion_event.0001.b: "Stay in your lane, [wb_companion_0001.GetNameNoTooltip]."
 wb_companion_event.0001.b.tt: "You disregard [wb_companion_0001.GetNameNoTooltip]'s concerns, upsetting them"
 ## Failure-related Loc
 wb_companion_broke_promise: "You broke your promise to [ck_companion_casualty_scope.GetNameNoTooltip]"