l_english:
 # Warning Phase -WARNING-
 ck_volcano_event.0002.t: "The Warning Signs"
 ck_volcano_event.0002.desc: "I am walking towards my bedchambers when suddenly I feel the walls turn on their side. I am thrown to the ground, but looking down I find it to be the wall. The room shakes with such violence that I feel my last meal begging to be released from my guts.\n\nSoon, the tremors seize and my orientation returns. I take a moment to look outside at the destruction and see numerous people running around to put out fires and help their loved ones from rubble. Looking up from the rubble, I gaze upon the great volcanic tyrant, al-Ifrit, with its maw burning with a great fiery light."
 ck_volcano_event.0002.a: "Ominous..."
 ck_volcano_event.0002.a.flavor: "The great volcano burns brighter than it has in years.\n\nWhy could that be?"
 ck_volcano_event.0003.t: "The Great Tyrant"
 ck_volcano_event.0003.desc: "Ten days since the land was shaken by great tremors, people are still recovering from the devastation, searching through the rubble and the countryside for those who remain missing. Meanwhile, the villagers living higher up the mountain have spoken of a great danger stirring beneath the earth, waiting to be unleashed upon the world.\n\nAccording to their ancient beliefs, the tremors are the work of Guayota, who seeks to disrupt the cycle of reincarnation by awakening the mountain and covering the land in fire.\n\nOthers have begun fleeing the island entirely, convinced that a great eruption is near. They claim that those who remain are condemning themselves to certain death. I must now decide what path to take."
 ck_volcano_event.0003.a: "We must leave at once!"
 ck_volcano_event.0003.a.flavor: "#V You [travel|E] to a nearby island until the eruption has finished.#!"
 ck_volcano_event.0003.b: "No one must be left behind!"
 ck_volcano_event.0003.b.flavor: "#V You spend valuable time to ensure people evacuate. Effects on [development_i][development|E] by the eruption are mitigated.#!"
 ck_volcano_event.0003.c: "We will hunker down."
 ck_volcano_event.0003.c.flavor: "#X You will attempt to ride out the coming events. Your chances of surviving are grim should it be a greater eruption.#!"
 ck_volcano_event.0003.d: "Through the fires, I will be reborn as the [Glossary( 'Mahdi', 'CK_GLOSS_MAHDI' )]!"
 ck_volcano_event.0003.d.flavor: "@warning_icon! #X What? You're insane!#!"