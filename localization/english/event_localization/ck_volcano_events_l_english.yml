l_english:
 ## Warning Phase -WARNING-
 ck_volcano_event.0002.t: "The Warning Signs"
 ck_volcano_event.0002.desc: "I am walking towards my bedchambers when, without warning, I feel the walls turn on their side. I am hurled to the ground, only to realize that what I once thought was the floor is, in fact, the wall. The room shakes with such violence that I feel my last meal clawing its way back up my throat.\n\nAt last, the tremors cease, and my sense of orientation slowly returns. I take a moment to look outside at the devastation. Fires burn in the distance as people scramble about, searching for their loved ones and pulling survivors from the rubble.\n\nThen, looking up from the devastation, I see it. The great volcanic tyrant, al-Ifrit, looms in the distance, its maw burning with a terrible, fiery light."
 ck_volcano_event.0002.desc.not_immediate: "I am out for a walk when, without warning, the ground begins to sway beneath my feet. I stumble as the earth bucks and rolls, struggling to keep my balance as the tremors ripple through everything around me. For a moment, I can do nothing but brace myself and wait for the shaking to stop.\n\nAt last, the tremors cease, leaving an uneasy silence in their wake. I look around and see others emerging from their homes, looking about in confusion as they search for their loved ones and inspect the damage. Fallen masonry and broken timber litter the ground, but the destruction appears far less severe than it might have been.\n\nYet something about the air feels wrong. The earth has never moved like this before. Whatever has caused these tremors, I fear that what we have felt here is only a distant echo of something far greater."
 ck_volcano_event.0002.a: "Ominous..."
 ck_volcano_event.0002.a.flavor: "The great volcano burns brighter than it has in years.\n\nWhy could that be?"
 ck_volcano_event.0003.t: "The Great Tyrant"
 ck_volcano_event.0003.desc: "Ten days have passed since the land was shaken by great tremors, yet people are still recovering from the devastation, searching through the rubble and countryside for those still missing. Meanwhile, the villagers living higher up the mountain have spoken of a great danger stirring beneath the earth, waiting to be unleashed upon the world.\n\nAccording to their ancient beliefs, the tremors are the work of Guayota, who seeks to disrupt the cycle of reincarnation by awakening the mountain and covering the land in fire.\n\nOthers have begun fleeing the island entirely, convinced that a great eruption is near. They claim that those who remain are condemning themselves to certain death. I must now decide what path to take."
 ck_volcano_event.0003.desc.not_immediate: "Ten days have passed since the land was shaken by great tremors, yet people are still recovering from the damage, repairing their homes and searching the countryside for those still missing. Whispers have begun to spread of strange happenings elsewhere, of a great danger stirring beneath the earth and something terrible waiting to be unleashed.\n\nAccording to rumors brought by travelers and those who have crossed the sea, some believe the tremors are the work of Guayota, who seeks to disrupt the cycle of reincarnation by awakening the mountain and covering the land in fire. Others dismiss such claims as superstition, insisting that there is no reason to fear an eruption.\n\nFor now, there is little to do but wait and wonder what truth lies behind the whispers."
 ck_volcano_event.0003.a: "We must leave at once!"
 ck_volcano_event.0003.a.flavor: "#V You [travel|E] to [ck_volcano_0003_destination.GetName] until the eruption has finished.#!"
 ck_volcano_0003_a_tt: "All [courtiers|E] and [guests|E] join your evacuation"
 ck_volcano_event.0003.b: "No one must be left behind!"
 ck_volcano_event.0003.b.flavor: "#V You spend valuable time to ensure people evacuate. Effects on [development_i][development|E] by the eruption are mitigated.#!"
 ck_volcano_event.0003.c: "We will hunker down."
 ck_volcano_event.0003.c.flavor: "#X You will attempt to ride out the coming events. Your chances of surviving are grim should it be a greater eruption.#!"
 ck_volcano_event.0003.d: "Through the fires, I will be reborn as the [Glossary( 'Mahdi', 'CK_GLOSS_MAHDI' )]!"
 ck_volcano_event.0003.d.flavor: "@warning_icon! #X What? You're insane!#!"
 ## Phase Changes - ck_volcano_event.0004 (excluding warning phase and minor/major eruptions)
 ck_volcano_event.0004.t: "Volcanic Phase: "
 # Titles
 ck_volcano_events.0004.t.flows: "$phase_active_flows$"
 ck_volcano_events.0004.t.heavy_ash: "$phase_major_ash_clouds$"
 ck_volcano_events.0004.t.light_ash: "$phase_minor_ash_clouds$"
 ck_volcano_events.0004.t.inactive: "$phase_inactive$"
 ck_volcano_events.0004.t.flows: "$phase_extinct$"
 # Descs
 ck_volcano_events.0004.desc.flows: "The volcano is awakened; new and ancient paths alike carrying streams of molten lava down the mountain's slopes.\n\nThe inhabitants, who have long lived beneath the volcano's shadow, know the safest paths and how to avoid the shifting currents of lava. Travelers and pilgrims, however, must remain vigilant, for the mountain is ever changing, and paths that were safe yesterday may be claimed by the fires today."
 ck_volcano_events.0004.desc.heavy_ash: "As if spawned from the depths of [ROOT.Char.GetFaith.NegativeAfterLife] itself, plumes of black ash rise to meet the sky and blanket it with a smothering embrace.\n\nAs the ash continues its trek east, those left in its wake suffer from crop failure, dying livestock, breathing problems, and the persistent pestilence spawned from the sick.\n\n[ROOT.Char.GetFaith.CreatorName] watches as [ROOT.Char.GetFaith.CreatorHerHis] creations suffer."
 ck_volcano_events.0004.desc.light_ash: "The once blue skies turn to gray as light ash sweeps across the sky.\n\nAlthough the sun still peeks through the occasional break in ash coverage, the people still suffer from imbalances in humors and pestilence begins to rot the land. In other parts of the land, animals flee into sanctuary as enclosed livestock begin to slow get sick themselves."
 ck_volcano_events.0004.desc.inactive: "Any trace of activity from the once mighty volcano is all gone. Only that remains is the towering titan that has helped to define this region of the world. Whether it shows activity or not, no one can say for certain."
 ck_volcano_events.0004.desc.flows: "$phase_extinct$"
 # Options
 ck_volcano_events.0004.a.flows: "And so the great tyrant awakens."
 ck_volcano_events.0004.a.ash: "The sky darkens."
 ck_volcano_events.0004.a.inactive: "And so the great tyrant sleeps."
 ck_volcano_events.0004.a.extinct: "And so the great tyrant dies."
 ck_volcano_events.0004.a: "And so the great tyrant changes."
 ## Phase Changes for Minor and Major Eruptions
 ck_volcano_events.0005.t.minor_eruption: "$phase_minor_eruption$"
 ck_volcano_events.0005.t.major_eruption: "$phase_major_eruption$"
 ck_volcano_event.0005.a: "[ROOT.Char.GetFaith.HighGodName] preserve us!"
 ck_volcano_event.0005.a_sound: "Concerning."
 ck_volcano_events.0005.desc.minor_eruption: "I am minding my own affairs when suddenly the ground beneath me begins to quake and rumble with a ferocity unlike anything I have ever felt. Yet when I look towards the evening sky, I see a strange glow on the horizon, faint at first, but growing brighter with each passing moment.\n\nFor several minutes, I stand mesmerized by the sight as the glow pulses against the darkening sky, growing brighter and brighter until a tremendous crack thunders across the horizon and leaves me momentarily deafened. Only then do I understand the awful truth. The volcano across the sea has erupted."
 ck_volcano_events.0005.desc.minor_eruption_sound: "I feel a slight quake beneath my feet as I go for an evening walk. For a moment, I am concerned, but the unease soon passes.\n\nHalf an hour later, however, I hear a sound so immense that it seems to shake the very air around me, leaving my ears ringing long after it has passed. I have never heard anything like it, nor can I find words to describe what I have heard. It was not thunder, nor the roar of any beast, but something so vast and violent that my mind struggles to comprehend it.\n\nI am deeply worried of what could have produced such a terrifying sound. Is it some great beast or something much worse?"
 ck_volcano_events.0005.desc.major_eruption: "The earth beneath me suddenly begins to tremble with a violence unlike anything I have ever felt. At first I take it for an ordinary quake, but the shaking only grows stronger, rattling doors and sending stones tumbling from their resting places. Then, upon the distant horizon, I notice a faint red glow against the darkening sky.\n\nIt grows brighter with every passing moment, spreading across the horizon until the distant sky seems to burn. Then a tremendous roar reaches me from across the sea, deep enough to shake the earth beneath my feet.\n\nOnly then do I understand the awful truth. The volcano across the sea has erupted, and whatever has been unleashed is unlike anything I have ever witnessed."
 ck_volcano_events.0005.desc.major_eruption_sound: "I am minding my own affairs when I begin to notice a faint trembling beneath my feet. It is subtle enough to dismiss at first, but then a deep rumbling begins somewhere beyond the horizon. I can see nothing to explain it, and there are no clouds overhead. Still, the strange sound continues, rolling across the land like distant thunder.\n\nThen, without warning, an enormous boom tears through the air. It is so deafening that I instinctively cover my ears, while doors and windows rattle around me. For a moment, the rumbling continues, but it soon begins to fade until all is quiet once more. I am left wondering what could have caused such a terrible sound, for I have never heard anything like it before."
 ## Ash passes over your realm (for Affected Rulers and Travellers not on the islands)
 ck_volcano_event.0008.t: "Ashfall"
 ck_volcano_event.0008.light_ash.capital: "I witness with my own eyes as the skies above me begin to darken. Soon enough, ash begins to fall all around me, filling the air and settling upon the ground. I catch a flake in my fingers and rub it between them, realizing that this strange rain may spell trouble before long."
 ck_volcano_event.0008.light_ash.realm: "I am receiving reports that people in other parts of my realm are experiencing darkened skies. According to them, it is as though the sun itself has been engulfed by [ROOT.Char.GetFaith.EvilGodNames]. Panic is spreading through the streets as word travels. The more erudite among my courtiers believe it to be the result of some great fire, with ash from the conflagration now falling across my realm.\n\nWhatever the cause, they warn that such a thing is beyond our control. The consequences may be immense, bringing crop shortages and livestock deaths to my lands, not to mention the harm it may do to the health of my people."
 ck_volcano_event.0008.light_ash.traveller: "Going through my camp's stash of supplies, I notice a looming darkness engulfing the ground beneath me. Where there was once light, there is now a shadow creeping across the land. Looking up, I see gray clouds that seem to grow larger by the moment, blotting out the sun.\n\nFaint rays of sunlight still break through, but barely. Then I feel something strange land upon my neck. Looking around, I notice what at first appears to be snow, but upon closer inspection turns out to be... ash? Is there some great fire elsewhere in the world that is causing this?"
 ck_volcano_event.0008.heavy_ash.capital: "I hear of a dark cloud approaching before I ever see it. People fleeing from failed crops, dying livestock, and disease have warned me of clouds that have seemingly blotted out the sun wherever they have passed.\n\nHours later, their warnings prove true as a black cloud slowly spreads across the sky above. As the sun is blotted out entirely, I shiver not only at the sudden chill but at the thought that something could darken the skies on such a scale. Before I can close a curtain, I notice what appears to be snow beginning to fall, but upon a closer inspection, I find it to be black ash! Soon enough, the ground is covered in a thick layer of it."
 ck_volcano_event.0008.heavy_ash.realm: "Elsewhere in my realm, I hear reports of a black cloud growing and spreading across the land, dumping black ash and bringing death and disease in its wake. People claiming to have fled from its source say that a great mountain erupted in fire, consuming everything in its path. They continue moving onward, too desperate or frightened to even stop and rest.\n\nAs I look upon the growing darkness in the distance, I cannot help but wonder what will become of my realm. Will these black clouds bring instability to my lands, or can I somehow turn this disaster to my own advantage?"
 ck_volcano_event.0008.heavy_ash.traveller: "Going through my camp's stash of supplies, I notice the light fading around me. Looking up, I see a dark cloud spreading across the sky, slowly swallowing the sun and bringing an unexpected chill.\n\nI have heard travelers speak of a great mountain that erupted in fire, forcing people from their homes and leaving crops and livestock dead in its wake. I had dismissed their stories as exaggerations, but now something lands upon my neck. What I first take for snow proves to be black ash, already beginning to settle across my camp."
 ck_volcano_event.0008.a.realm: "Worrisome..."
 ck_volcano_event.0008.a.capital: "This isn't good."


 ## You are on the island as it erupts ##
 ck_volcano_event.0010.t: "Danger: Eruption!"
 ck_volcano_event.0010.desc.rescue: "I feel a pit in my stomach before I see it, but not even a minute later the top of the volcano explodes with fire raining from within its belly. Looking around at those still climbing aboard boats, I still see people in the distance clammering with personal belongings as a dark cloud hurdles down from the mountainside towards us.\n\nI must make a decision now whether to ensure these people make it at the potential cost of my own life, or to take who we can and leave now!"
 ck_volcano_event.0010.desc.rescue.2: "The eruption tears the ground from beneath me, sending me crashing onto my back against the rocky shore, where I can only watch in horror as the volcano seems to tear itself apart. Its entire mountainside erupts in a deafening roar, hurling great stones of fire high into the sky that hang there for a moment like stars before falling back to the earth.\n\nOne of them crashes into one of the boats. There is no time for those aboard to escape as the vessel vanishes beneath the water, taking everyone with it.\n\nI struggle to my feet and see something far worse approaching, a vast black cloud racing down the mountain towards us, its depths alive with flashes of lightning. Petrified, I realize that there is no time left to hesitate; I can order our boats to flee with those already aboard, or risk my own life and remain behind to save as many as I can."
 ck_volcano_event.0010.desc.stayed_behind: "Ignoring the warning signs nearly three weeks ago, I walk along the shores of the island taking in its natural beauty. Suddenly, I feel a tremor beneath my legs, one greater the ones from those weeks ago. Suddenly, the evening sky turns into day as the volcano roars and spits columns of fires into the sky.\n\nI chose to ignore the warnings, and now I am paying the price. With the cloud bearing down upon me, I must find refuge or flee before it is too late."
 ck_volcano_event.0010.desc.stayed_behind.2: "Ignoring the warning signs nearly three weeks ago, I walk along the shores of the island, taking in its natural beauty. Suddenly, the ground gives way beneath me as a fissure tears open, belching lava into the evening air. As if this were not terrible enough, the sky shifts from its fading evening hues to a blinding red light, accompanied by a deafening roar that shakes the very earth beneath my feet.\n\nI look up at the mountain, and my heart drops. The entire summit of the volcano has exploded, sending columns of fire into the heavens as burning rocks, some the size of homes, come crashing down across the island and into the sea around me. Then I see it: a vast, dark cloud racing towards me, accompanied by a terrible howl and the constant crackle of thunder from within.\n\nI chose to ignore the warnings, and now I am paying the price. With the cloud bearing down upon me, I must find refuge or flee before it is too late."
 ck_volcano_event.0010.desc.lunatic: "Sifting through my sacred writings on the Mahdi, I am torn from my reading by a blinding light and a deafening boom from the summit of the volcano. I look up and there it is. Great pillars of fire and smoke erupt into the heavens, and I know at once what this means. The mountain has answered the call, and the path to my next incarnation has been opened before me. Perhaps this is the moment I have awaited all my life, the moment when I shall be reborn as the prophesied [Glossary( 'Mahdi', 'CK_GLOSS_MAHDI' )]!\n\nI step outside and gaze upon the mountain in awe as a vast plume of dark ash comes hurtling towards me. I do not flee. How could I? Within that ash lie the lives of those who came before, returned once more to the world. Perhaps among them is the life I was meant to inherit."
 ck_volcano_event.0010.desc.lunatic.1: "Sifting through my sacred writings on the Mahdi, I am torn from my reading by a flash so bright that it turns night into day, followed by a thunderous roar that shakes the very foundations of the earth. I rush outside and look towards the summit, only to see the mountain itself tearing open beneath a pillar of fire that reaches into the heavens. The sky darkens as an immense cloud of ash and smoke rises above the island, swallowing the stars and blotting out the sun.\n\nThe earth convulses beneath my feet as burning stones rain from the heavens, while rivers of fire pour down the mountain and spread across the land. Yet I cannot bring myself to fear it. At last, the mountain has awakened fully. At last, the dead are being returned to the world, and the path to the Mahdi has been opened.\n\nI stand beneath the falling ash with my arms outstretched, waiting to receive what the mountain has carried within it for generations. Let the earth burn. Let the heavens darken. From this destruction, the chosen one shall be reborn, and perhaps that blessed soul will be me!"
 ck_volcano_event.0010.a: "We need to leave now!"
 ck_volcano_0010_a_kill_tt: "Around [SCOPE.ScriptValue('dead_courtiers_and_guests_from_eruption')|0N] people will not make it and die!"
 ck_volcano_0010_a_kill_tt_2: "You will only have saved a total of [SCOPE.ScriptValue('development_change_volcano')|0+=]#! @development_icon![development|E]"
 ck_volcano_event.0010.a.2: "Everyone else! Get aboard now!"
 ck_volcano_event.0010.a.2.flavor: "Your heroics will save everyone on the island"
 ck_volcano_event.0010.a.2.tt: "You will have saved #P all#! @development_icon![development|E]"
 ck_volcano_event.0010.a.2.tt_survive: "You miraculously find shelter and survive"
 ck_volcano_event.0010.a.2.tt_die: "However, others are not so fortunate"
 ck_volcano_event.0010.a.2.tt_evacuate: "You manage to evacuate but lose some people in the frenzy"
 ck_volcano_0010_a_tt: "All your [courtiers|E] and [guests|E] join [players_heir.GetNamePossessiveNoTooltip] evacuation"
 ck_volcano.0010.a.2.tt_failure: "Fail to evacuate anyone"
 ck_volcano.0010.b.tt_survive: "Miraculously survive"
 every_person_on_the_island: "Every person on the island"
 ck_volcano_event.0010.b: "$ck_volcano_event.0010.a$"
 ck_volcano_event.0010.b_tt: "No evacuation preparations, therefore:\n$EFFECT_LIST_BULLET$Lose #X [SCOPE.ScriptValue('lost_development_from_eruption')|0N]#! @development_icon![development|E]\n$EFFECT_LIST_BULLET$Around #X [SCOPE.ScriptValue('dead_courtiers_and_guests_from_eruption')|0N]#! people will not make it and die!"
 ck_volcano_event.0010.b.2: "We need to find shelter!"
 ck_volcano_event.0010.c: "Paradise awaits!"
 ck_volcano_event.0010.c.2: "Wait! I've changed my mind!"
 ck_volcano_event.0010.c.tt_survive: "Somehow, against all odds, you survive"
 ck_volcano_0010_c_kill_tt: "Some people who stayed behind with you will die"
 #### ARRIVAL IN REFUGE ####
 ck_volcano_event.0100.t: "Arrival in [ck_volcano_0003_destination.GetNameNoTooltip]"
 ck_volcano_event.0100.desc: "As we arrive at night on the warm shores of [ck_volcano_0003_destination.GetName], I look back to see a faint red glow on the horizon, coming from the direction of the volcano. It seems all suspicions of an imminent eruption were not misplaced.\n\nLooking upon the faces of my entourage, those who fled alongside me, I am reminded that I now bear an even greater responsibility for their safety, both here and when we return.\n\nFor now, we make camp outside [ck_volcano_0003_destination.GetNameNoTooltip] and wait for the eruptions to subside."
 ck_volcano_event.0100.a: "Now we wait."