 great_holy_war.0003.darusan.desc: "A $special_doctrine_darusian_name$ envoy has reached my [ROOT.Char.Custom('GetCourtConcept')], bringing news from [GetTitleByKey('k_darusan').GetDefinitiveName]. [ghw_sponsor.GetTitledFirstName] issued a call to arms to all righteous children under the Darusian cross. As a [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] [ROOT.Char.GetTitleAsNameNoTooltip], I am expected to prepare my [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] in support of this most holy cause, sponsored by the will of Heaven.\n\nTo all those who will take the fight against the vile [target_character.Custom('GetUnbelieverNamePlural')] desecrating the holy grounds of [target_kingdom.GetBaseNameNoTier], the Holy Embers promises full absolution from all sins under Heaven's Mandate."

