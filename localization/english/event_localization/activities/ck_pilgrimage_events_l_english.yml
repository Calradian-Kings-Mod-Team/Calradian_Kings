 ck_pilgrimage_lost_increase_crit: "Chance of Getting Lost: #N;bold Greatly Increases#!"
 # Entangled in Vines
 ck_pilgrimage.0050.t: "Entangled"
 ck_pilgrimage.0050.desc: "As I move through the thick brush and around trees as thick as huts, I come upon a web of entangled vines and branches stretching across me. I sigh and look for any way around but given the thickness of it all, it's hard to discern any route around.\n\nI either have to find something cut through these vines, or spend time wandering to find another way around. If I wander though, I risk losing myself to the forest altogether."
 ck_pilgrimage.0050.a: "I have something to cut with!"
 ck_pilgrimage.0050.a.flavor: "#P;bold Guaranteed Success#!"
 ck_pilgrimage.0050.a.tt: "You manage to cut through the thick vines"
 ck_pilgrimage.0050.b: "I'll find something to cut with!"
 ck_pilgrimage.0050.b.rl_1: "You find something"
 ck_pilgrimage.0050.b.rl_2: "You have to find another way around"
 ck_pilgrimage.0050.b.succeed: "You succeed in cutting through the vines"
 ck_pilgrimage.0050.b.fail: "You fail to cut through the vines"
 # Raging Rapids
 ck_pilgrimage.0051.t: "A Leap of Faiths"
 ck_pilgrimage.0051.desc: "I see light through the branches ahead, and as I am about to step above a root I nearly fall first into a crevice. Looking down, I can see a water raging along the jagged crevices of the crevice.\n\nI look beyond the crevice and see a clearing. I might be able to make that jump but I would have to time it right."
 ck_pilgrimage.0051.a: "Here we go!"
 ck_pilgrimage.0051.a_success: "Success"
 ck_pilgrimage.0051.a_success_desc: "You succeed in leaping across the crevice"
 ck_pilgrimage.0051.a_failure: "Fall into the Water"
 ck_pilgrimage.0051.a_failure_desc: "You fall and become washed up downstream"
 ck_pilgrimage.0051.b: "There must be some way around it."
 ck_pilgrimage.0051.b_success: "You get back on track"
 ck_pilgrimage.0051.b_failure: "You become lost"
 ck_pilgrimage.0051.c: "Surely this stream comes from the grove?"
 ck_pilgrimage.0051.c_success: "Your intuition sets you on the right path"
 # The Lost Pilgrim
 ck_pilgrimage.0052.t: "The Lost Pilgrim"
 ck_pilgrimage.0052.desc: "In the clearing ahead, I see a [lost_pilgrim.GetWomanMan] with [lost_pilgrim.GetHerHis] hands in [lost_pilgrim.GetHerHis] face. From first glance, it seems [lost_pilgrim.GetSheHe] became lost and has decided to give up.\n\nMy suspicions are confirmed when the [lost_pilgrim.GetWomanMan] sees me up and jumps up. "Oh my! It's so amazing to see others. I have been wandering these forests forever in search of the legendary grove. Oh! Would you mind helping me? I'll help you too!"\n\nI look at [lost_pilgrim.GetHerHim] and then back to my own entourage. We only have so many supplies, and before I can say anything, I hear [lost_pilgrim.GetHerHim] assure me, "Please! I have plenty of supplies. Look! I even have a map I scrawled on some bark!" [lost_pilgrim.GetSheHe|U] gives off a sudden maniacal chuckle."
 ck_pilgrimage.0052.a: "Fine. You can join us."
 ck_pilgrimage.0052.a.add_pilgrim: "[lost_pilgrim.GetNameNoTooltip] joins your [entourage|E]"
 ck_pilgrimage.0052.b: "Away with you, vile beggar!"
 ck_pilgrimage.0052.a_tt: "[lost_pilgrim.GetNameNoTooltip] becomes lost in the dense forest"
 ck_pilgrimage.0052.b_failure: "Without the pilgrim, you become more lost"
 # Foreign Bandits
 ck_pilgrimage.0053.t: "The Heathens"
 ck_pilgrimage.0053.desc: "Being careful not to disturb a huge spiderweb with a just as huge spider on it, I make my way into a clearing in the forest. Before I can even begin sauntering to the other end of it, I hear foreign words being shouted at me from my side. Turning, I see several armored warriors moving towards me. Each one looks around at the rest of my entourage, attempting to size up my party.\n\n"
 ck_pilgrimage.0053.desc.mid: "One of them speaks up in a tongue that sounds like a broken version of my own language, "What are you doing here? Do you not know these lands belong to [ksiref_holder.GetName]? Leave now or we will remove you by force!""
 ck_pilgrimage.0053.desc.mid_2: "One of them speaks up in a tongue that sounds like a broken version of my own language, "What are you doing here? Do you not know these lands belong to the [foreign_culture.GetCollectiveNoun]? Begone and perhaps we will spare you!""
 ck_pilgrimage.0053.a: "Eat my steel, you bastards!"
 ck_pilgrimage.0053.a.success: "You succeed in fending off the foreigners"
 ck_pilgrimage.0053.a.failure: "You fail and are pushed back into the forest"
 ck_pilgrimage.0053.a_alt: "Kill them all!"
 ck_pilgrimage.0053.a_alt_tt: "With your superior numbers, you easily beat them"
 ck_pilgrimage.0053.a_alt_tt_2: "You find a map on the bodies"
 ck_pilgrimage.0053.b: "Perhaps a parlay?"
 ck_pilgrimage.0053.b_success: "You convince them of your intentions"
 ck_pilgrimage.0053.b_failure: "You fail and are chased back into the forest"
 ck_pilgrimage.0053.c: "How much to let us pass?"
 ck_pilgrimage.0053.c.flavor: "Perhaps they the language of gold?"
 ck_pilgrimage.0053.c_success: "You successfully pay for passage"
 # The Quiet Meadow
 ck_pilgrimage.0054.t: "The Quiet Meadow"
 ck_pilgrimage.0054.desc: "I believe it to be the fabled grove at first, but it turns out to be a small, peaceful meadown. Stepping out into the clearing, I'm astounded by the beauty of it all. The birds sing their beautiful melodious songs while a small stream flows peacefully through the glade.\n\nI should take a moment to sit and recuperate, maybe reflect on my journey and think of the path ahead from here."
 ck_pilgrimage.0054.a: "I will take this moment to meditate."
 ck_pilgrimage.0054.b: "I simply must wash myself."
 ck_pilgrimage.0054.c: "I need to plan my next steps"
 ck_pilgrimage.0054.c_success: "You put yourself back on track"
 ck_pilgrimage.0054.d: "No rest! Need to proceed!"
 # Did you find the Grove?
 ck_pilgrimage.0054.t.success: "The Grove"
 ck_pilgrimage.0054.t.failure: "Failure"
 ck_pilgrimage.0054.desc.success: "#size:12 I cannot believe my eyes as I step through the clearing. The very fabled spring lies before me in its resplendent glory. To imagine the Mahdi taking this journey to confer to Urzor and Aatxe, and be granted stewardship of this grove until his death.\nIt's almost too much. I spot a handful of pilgrims entering the grove at different ends, each of us taking a different journey to get here.\n\n"
 ck_pilgrimage.0054.desc.success_but_lost: "I take all the time I have to visit each landmark of the grove, finding momentos left behind by previous pilgrims. I decide to leave something of my own to mark my success in making this journey. However, I look around and suddenly everything begins to look unfamiliar.\n\nMy heart racing out of panic, I run into the forest hoping to find a way out but I end up in circles. I have lost sight of the grove and I am stuck in this dense forest with no way out!"
 ck_pilgrimage.0054.desc.success_not_lost: "I take all the time I have to visit each landmark of the grove, finding momentos left behind by previous pilgrims. I decide to leave something of my own to mark my success in making this journey.\n\nAfterwards, I depart with other pilgrims to return back to the coastline.\nBefore leaving, I turn and take one look back at the grove. It's hard to imagine something this wonderful is hidden away from the world, but that alone makes the experience much more fulfilling.\n\nI turn and leave..."
 ck_pilgrimage.0054.desc.failure: "I think the next clearing to finally be my destination, but as soon as I pass a tree all I see is more foliage. I have been on this pilgrimage for days with no sight the grove! I only have enough supplies right now for a return trip, so I will need to turn around now or risk starvation.\n\n#!"
 ck_pilgrimage.0054.desc.failure_not_lost: "Turning around, I begin using the sun as my guide to find my way back to the coast. After several hours, I finally hearing the sounds of waves beating against rocks. Soon enough, I emerge from the forest onto the coastline. If my intuition is correct, if I continue heading south down the coastline, I should enter a village.\n\nI turn back to the forest one more time and lament at the fact I could not complete this pilgrimage.#!"
 ck_pilgrimage.0054.desc.failure_lost: "I walk on for hours, unsure of how far I really am from the coastline. Eventually, I reach a large stone but that was the same large stone from several hours ago! I put my hands on my head and begin to panic. I have already wasted my supplies trying to get back, and I now I am lost.\n\nClearing my head, I decided to pick a direction and walk...#!"
 ck_pilgrimage.0055.a: "Onwards!"
 ck_pilgrimage.0055.b: "No, no, NO!"

 ### Mahdi Trials
 ck_pilgrimage.0060.t: "The Marabout"
 ck_pilgrimage.0060.desc: "I walk into the marabout's temple and immediately the smell of incense hits me. My eyes begin to water as I attempt to take in my surroundings. Wiping my eyes, still stinging from the waft of incense, I see the local marabout kneeling in prayer on the floor in front of a relief of the god, Urzor.\n\nBefore I can even approach, and without lifting [trial_marabout.GetHerHis] head, the marabout's voice booms, "What troubles you child? Have you come here to also seek prayer as I do with our lord Urzor, or do you come seeking to complete a trial. Hmm? To see if you are worthy of the mantle of the Mahdi?""
 ck_pilgrimage.0060.a: "Yes! I have come for your trial."
 ck_pilgrimage.0060.a.flavor: "You will begin your trial."
 ck_pilgrimage.0060.b: "I'm sorry for interrupting you. I will be leaving"
 # Reasons
 CK_MAHDI_TRIAL_OPTION_MARTIAL: "This trial will challenge your [martial|E] [skill|E]"
 CK_MAHDI_TRIAL_OPTION_STEWARDSHIP: "This trial will challenge your [stewardship|E] [skill|E]"
 CK_MAHDI_TRIAL_OPTION_INTRIGUE: "This trial will challenge your [intrigue|E] [skill|E] and [health|E]"
 CK_MAHDI_TRIAL_OPTION_LEARNING: "This trial will challenge your [learning|E] [skill|E]"
 CK_MAHDI_TRIAL_OPTION_DIPLOMACY: "This trial will challenge your [diplomacy|E] [skill|E]"

 ck_pilgrimage.0161.a.try_again: "You can undergo this trial again in [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'mahdi_pilgrimage_cooldown' ))]"
 ck_pilgrimage.0161.a.try_again_success: "You can undergo this trial again in [GetGameTimeDifferenceForDiffDays( THIS.VarRemaining( 'ck_mahdi_path_cooldown' ))]"
 ck_mahdi_visited_hs_tt: "You already completed this Mahdi Trial"
 ### ck_pilgrimage.0100
 ck_pilgrimage.0100.t: "The Trial"
 ck_pilgrimage.0100.desc.black: "The marabout turns to face me, and looks me up and down, "I do hope you realize what this trial will entail? Your mind will be tested as you recite the knowledge of our forebearers, and your body will be tested too with a tasting of the holy ljjn poison derived from the oualili flower."\n\n"Are you ready to proceed, child?""
 ck_pilgrimage.0100.desc.white: "The old and wise marabout stands up and approaches me. [trial_marabout.GetSheHe|U] gets close to me and looks me up and down. "You must be weary from the travel. Please sit and enjoy a lben with me, child."\n\nI sit down on a cushion set before me and accept the lben, drinking it and enjoying the sweat taste. [trial_marabout.GetSheHe|U] speaks again, "Welcome to Amullzghal, a holy place for us all. I am its marabout and custodian, and I assume you are here for the trial? If so, my trial will challenge your theological mind with questions and another trial. Are you prepared?""
 ck_pilgrimage.0100.desc.red: "The elderly marabout lumbers over to one side of the room, near some axes and swords. [trial_marabout.GetSheHe|U] looks over to me, "My trial will challenge your knowledge of strategy, and if you have it in you to emulate the mighty Mahdi in endeavors of warfare. He was a great warrior but also a renowned poet."\n\nHe passes me a sword, "Sharpen this while I question you. Sit!""
 ck_pilgrimage.0100.desc.blue: "The ancient marabout sits up, the obscene sounds of [trial_marabout.GetHerHis] back popping echo throughout the room. "Apologies, young one. I am no longer in the prime of my age."\n\n[trial_marabout.GetSheHe|U] chuckles to [trial_marabout.GetHerselfHimself] before patting me on the shoulder, lumbering past to grab some tea. "While walls crumble and tyrants overtax their people, here we are preparing to see if you have it in you be a just and fair ruler. Will you be?""
 ck_pilgrimage.0100.desc.green: "Unseen marabouts and travelers begin to leave the central chamber of this part of Indurar N'Hatif. The marabout in charge pours [trial_marabout.GetHerselfHimself] a single cup of tea and begins sipping on it.\n\n"So you wish to complete the Trial of Azizawzghal? I certainly hope you are well-studied in matters of administration, for the Mahdi knew well the importance of such things. Are you prepared?""
 ck_pilgrimage.0100.a.impatient: "Let's get this over with."
 ck_pilgrimage.0100.a: "Ready as I can be."
 ck_pilgrimage.0100.a.red_hill: "On it!"
 ck_pilgrimage.0100.a.blue_hill: "Yes, I will."
 ck_pilgrimage.0100.a.flavor: "Begin the trial."
 ck_pilgrimage.0100.b: "Better yet, I'll rethink this."
 ck_pilgrimage.0101.desc.question: "[ROOT.Char.Custom('ck_mahdi_0101_questions')]"
 ck_pilgrimage.0101.desc.wrong: "The marabout shakes [trial_marabout.GetHerHis] head shamefully and sighs, "Onto the next question..."\n\n"
 ck_pilgrimage.0101.desc.correct: "The marabout slowly nods [trial_marabout.GetHerHis] head and smiles, "Onto the next question..."\n\n"
 ck_pilgrimage.0101.desc.failed_questions: "The marabout sighs disapprovingly, "Forgive me child but you are unprepared for the trials that await. I would recommend you commit to the reading and teachings of our faith more before you decide to undertake this pilgimage again."\n\n[trial_marabout.GetSheHe|U] ushers me outside and closes the door behind them, leaving me outside to reflect on my failure."
 # Questions
 black_hill_question_1: "The marabout lowers their voice, "#weak 'A truth told carefully can accomplish far more.'#! If the Mahdi knew a dangerous truth but revealing all of it would ruin his purpose, how would he handle it?""
 black_hill_question_1.a: "Reveal only what was necessary to achieve his aim."
 black_hill_question_1.b: "Refuse to speak at all."
 black_hill_question_1.c: "Invent a lie and repeat it until accepted."
 black_hill_question_2: "The marabout gives me a knowing look.\n\n"In the camp of a hostile chieftain, the Mahdi learned much simply by listening to men who #weak 'boasted, complained, drank, and quarreled.'#! If no one would answer him directly, what would he rely upon?""
 black_hill_question_2.a: "A search of [trial_marabout.GetHerHis] belongings."
 black_hill_question_2.b: "Their unguarded words and behavior."
 black_hill_question_2.c: "A bribe offered to one of the chieftain's servants."
 black_hill_question_3: "The marabout narrows [trial_marabout.GetHerHis] eyes.\n\n"#weak 'A man who knows what insults you knows how to provoke you.'#! If an enemy deliberately tried to anger the Mahdi, how would he answer the provocation?""
 black_hill_question_3.a: "Hide his anger and deny the enemy knowledge of his weakness."
 black_hill_question_3.b: "Respond harshly so the enemy understood not to press."
 black_hill_question_3.c: "Admit openly what had offended him."
 black_hill_question_4: "The marabout begins to circle me.\n\n"One accused servant quietly denied theft. Another immediately blamed #weak 'the cook, the stable boy, and three guests besides.'#! If the Mahdi were judging them, whose behavior would draw his closer attention?""
 black_hill_question_4.a: "The quiet servant."
 black_hill_question_4.b: "The one eagerly throwing suspicion onto everyone else."
 black_hill_question_4.c: "Neither, because no confession had been made."
 black_hill_question_5: "A faint smile crosses the marabout's face.\n\n"The warning is simple: #weak 'never mistake secrecy for wisdom.'#! If the Mahdi devised a hidden scheme and later realized the plan itself was foolish, what would he do?""
 black_hill_question_5.a: "Abandon or rethink the plan rather than trust secrecy to redeem it."
 black_hill_question_5.b: "Continue because concealment makes a plan effective."
 black_hill_question_5.c: "Reveal it publicly so no one could call it deceptive."
 black_hill_question_6: "The marabout leans closer.\n\n"When betrayal threatened him, the Mahdi once #weak 'changed only the destination of his journey.'#! If he suspected a companion of carrying his plans to an enemy, how would he expose the truth?""
 black_hill_question_6.a: "Alter the plan and see whether the betrayal revealed itself."
 black_hill_question_6.b: "Accuse the companion publicly at once."
 black_hill_question_6.c: "Imprison the companion before gathering proof."
 ## Red Hill — Martial
 red_hill_question_1: "The marabout looks me over before speaking.\n\n"The Mahdi once taught that #weak 'an army marches not upon courage alone.'#! If eager warriors were ready to march but their stores were thin, what would he have seen to first?"
 red_hill_question_1.a: "That the army could be properly fed."
 red_hill_question_1.b: "That enough prisoners could be taken."
 red_hill_question_1.c: "That the enemy possessed no cavalry."
 red_hill_question_2: "The marabout takes a few slow steps.\n\n"Outnumbered and pressed by an eager enemy, the Mahdi once #weak 'withdrew into the hills and waited.'#! If faced with the same ground again, what course would he favor?""
 red_hill_question_2.a: "Wait for reinforcements from another tribe."
 red_hill_question_2.b: "Draw the enemy into difficult ground until their numbers mattered less."
 red_hill_question_2.c: "Abandon the struggle before his followers lost courage."
 red_hill_question_3: "The marabout's expression hardens.\n\n"#weak 'Land may be retaken, walls may be rebuilt, and pride may be restored.'#! If victory could only be purchased with the destruction of what remained of his army, what would the Mahdi choose?""
 red_hill_question_3.a: "Preserve his remaining forces and accept the lesser defeat."
 red_hill_question_3.b: "Refuse retreat because withdrawal destroys authority."
 red_hill_question_3.c: "Attack immediately regardless of the cost."
 red_hill_question_4: "The marabout raises a hand.\n\n"Nasir the Lion inspired fear, while his brother ate beside his men and listened to them. If the Mahdi had to choose between obedience through terror and devotion freely given, which would he seek?""
 red_hill_question_4.a: "Fear, so no command would ever be questioned."
 red_hill_question_4.b: "Loyalty built through trust and shared hardship."
 red_hill_question_4.c: "Distance, so the soldiers never forgot his rank."
 red_hill_question_5: "The marabout motions toward the earth.\n\n"The teaching says that hills, forests, heat, mud, and stone #weak 'take no side in war until a clever mind gives them one.'#! How would the Mahdi look upon difficult terrain before battle?""
 red_hill_question_5.a: "As an obstacle best avoided."
 red_hill_question_5.b: "As something that could be turned against the enemy."
 red_hill_question_5.c: "As a sign of which army Urzor favored."
 red_hill_question_6: "The marabout watches me in silence for a moment.\n\n"Before battle, the Mahdi promised neither safety nor certain victory. He told his followers only #weak 'why they fought and what would be lost should they fail.'#! Faced with frightened warriors, how would he strengthen them?""
 red_hill_question_6.a: "Promise that Urzor would preserve every faithful fighter."
 red_hill_question_6.b: "Tell them the truth of the danger and give them a reason worth facing it."
 red_hill_question_6.c: "Convince them that defeat was impossible."
 ## White Hill — Learning
 white_hill_question_1: "The marabout studies me with an almost challenging expression.\n\n"Urzor #weak 'did not grant mankind reason so that reason might remain unused.'#! If the Mahdi encountered a mystery that scripture did not clearly answer, what would he do?""
 white_hill_question_1.a: "Question, investigate, and make use of reason."
 white_hill_question_1.b: "Accept the first explanation offered by an authority."
 white_hill_question_1.c: "Refuse to examine the matter further."
 white_hill_question_2: "The marabout lifts several fingers before lowering them again.\n\n"A physician celebrated because twelve men recovered, yet when asked #weak 'what became of the other eight?'#! he had no answer. How would the Mahdi judge the physician's conclusion?""
 white_hill_question_2.a: "As flawed because he ignored the evidence that contradicted him."
 white_hill_question_2.b: "As sound because most of the patients survived."
 white_hill_question_2.c: "As flawed only because the herb had not been blessed."
 white_hill_question_3: "The marabout recites the opening from memory.\n\n"#weak 'Knowledge begins in memory...'#! If the Mahdi heard a student repeat every sacred passage perfectly but understand none of them, what would he say was still missing?""
 white_hill_question_3.a: "The ability to recite them more quickly."
 white_hill_question_3.b: "Understanding why the words were worth remembering."
 white_hill_question_3.c: "The approval of another scholar."
 white_hill_question_4: "The marabout stares at me intently.\n\n"One scholar trusted a chronicle, another village memory, and another the stones themselves. All were #weak 'partly wrong and partly correct.'#! If the Mahdi wished to know the truth, how would he proceed?""
 white_hill_question_4.a: "Weigh the different sources against one another."
 white_hill_question_4.b: "Trust only the written chronicle."
 white_hill_question_4.c: "Trust whichever scholar spoke with the greatest confidence."
 white_hill_question_5: "The marabout pauses before continuing.\n\n"When asked where the soul resides before returning to the world, the Mahdi answered only #weak 'Bi-lal kaifa.'#! If pressed to answer something he truly did not know, what would he do?""
 white_hill_question_5.a: "Admit the limit of his knowledge rather than invent certainty."
 white_hill_question_5.b: "Offer an answer so his followers would not doubt him."
 white_hill_question_5.c: "Refuse because sacred matters should never be questioned."
 white_hill_question_6: "The marabout opens an imaginary manuscript in [trial_marabout.GetHerHis] hands.\n\n"One mistaken word survived for eighty years simply because each scribe copied the last. When some defended it because #weak 'their fathers had known it,'#! how would the Mahdi respond?""
 white_hill_question_6.a: "Correct the error despite its age and familiarity."
 white_hill_question_6.b: "Preserve it because tradition made it sacred."
 white_hill_question_6.c: "Keep both versions and declare them equally true."
 ## Blue Hill — Diplomacy
 blue_hill_question_1: "The marabout clasps their hands together.\n\n"The writings tell of people who overcame foreign domination by forming alliances, and remind us that even the Mahdi #weak 'utilized such tools in his unification of the land.'#! If faced with a powerful enemy that could not be opposed alone, what would the Mahdi do?""
 blue_hill_question_1.a: "Seek allies whose interests aligned with his own."
 blue_hill_question_1.b: "Seek an understanding with the enemy first."
 blue_hill_question_1.c: "Unite his own people under a single command before involving outsiders."
 blue_hill_question_2: "The marabout regards me thoughtfully.\n\n"#weak 'Interpersonal bonds are stronger than the bindings that hold the land together.'#! If the Mahdi saw two rulers neglecting an old friendship because of a dispute over land, what would he consider more important?"
 blue_hill_question_2.a: "Preserving the bond, knowing such connections endure beyond worldly possessions."
 blue_hill_question_2.b: "Securing the land first, since territory outlasts relationships."
 blue_hill_question_2.c: "Ending the friendship so neither ruler's judgment could be clouded by affection."
 blue_hill_question_3: "The marabout folds their hands behind their back.\n\n"#weak 'Take heed of friends and foes. Understand the matters that lead brothers to conflict.'#! If two clans came before the Mahdi demanding judgment in a bitter dispute, how would he approach them?"
 blue_hill_question_3.a: "Seek to understand the cause of their conflict and mediate fairly."
 blue_hill_question_3.b: "Support whichever clan held greater strength so the dispute ended quickly."
 blue_hill_question_3.c: "Refuse to interfere, lest either clan resent his involvement."
 blue_hill_question_4: "The marabout's expression grows stern.\n\n"#weak 'Sometimes, disrespect to ones authority must be met with a heavy hand.'#! If the Mahdi found that repeated leniency only encouraged greater defiance, how would he respond?""
 blue_hill_question_4.a: "Assert his authority firmly when restraint had ceased to command respect."
 blue_hill_question_4.b: "Continue forgiving every offense so no one could accuse him of cruelty."
 blue_hill_question_4.c: "Surrender his authority to an elder whose judgment would be less controversial."
 blue_hill_question_5: "The marabout gives me a faint, knowing smile.\n\n"Haliz ul-Gharab possessed #weak 'honeyed words and great gifts'#!, yet these failed him when he was asked to prove himself through labor. If the Mahdi wished to earn another person's genuine respect, what would he rely upon?""
 blue_hill_question_5.a: "Humility and a willingness to prove himself through honest effort."
 blue_hill_question_5.b: "Wealthy gifts sufficient to demonstrate his importance."
 blue_hill_question_5.c: "Eloquence alone, provided his words were flattering enough."
 blue_hill_question_6: "The marabout watches me closely.\n\n"When the mountain erupted, the Mahdi #weak 'ran to evacuate the village'#! and placed himself between danger and his people. If others were threatened while his own safety remained uncertain, what would he do?""
 blue_hill_question_6.a: "Put the welfare of those in danger before his own safety."
 blue_hill_question_6.b: "Preserve himself first so he could lead the survivors afterward."
 blue_hill_question_6.c: "Wait for a sign from Urzor before risking himself for strangers."
 ## Green Hill — Stewardship
 green_hill_question_1: "The marabout holds one hand higher than the other, as if weighing two choices.\n\n"One ruler empties every granary in abundance. Another fills them and #weak 'never opens them.'#! If the Mahdi governed through a year of plenty, what balance would he seek?""
 green_hill_question_1.a: "Preserve enough for future need while still using what was needed in the present."
 green_hill_question_1.b: "Store every measure indefinitely."
 green_hill_question_1.c: "Spend everything while abundance lasted."
 green_hill_question_2: "The marabout's voice turns stern.\n\n"The Mahdi once asked whether a lord meant to #weak 'collect grain from graves once every farmer was dead.'#! If a failed harvest left villagers starving beneath an unchanged levy, what would he do?""
 green_hill_question_2.a: "Reduce the burden so the people could survive and continue producing."
 green_hill_question_2.b: "Demand the same levy in coin instead."
 green_hill_question_2.c: "Increase the levy to recover what the harvest had lost."
 green_hill_question_3: "The marabout gestures toward an imaginary wall.\n\n"#weak 'If a wall collapses each winter, do not praise the mason who rebuilds it each spring.'#! Faced with that same wall, what would the Mahdi demand?""
 green_hill_question_3.a: "A cheaper mason."
 green_hill_question_3.b: "An answer for why the wall kept failing, followed by a lasting remedy."
 green_hill_question_3.c: "That the wall be abandoned altogether."
 green_hill_question_4: "The marabout rubs two fingers together as though counting coin.\n\n"A merchant grows rich carrying salt one way and wool the other, yet #weak 'both villages ate better that winter.'#! How would the Mahdi judge whether the trade was worthy?""
 green_hill_question_4.a: "By whether both sides gained something they valued."
 green_hill_question_4.b: "By whether the merchant earned no profit."
 green_hill_question_4.c: "By whether both goods had exactly equal prices."
 green_hill_question_5: "The marabout glances into the distance.\n\n"#weak 'Coin leaves the hand, but what it builds may remain.'#! If the Mahdi were asked to fund a well he might never personally use, what would guide his decision?""
 green_hill_question_5.a: "Whether its benefit would endure long after the cost was paid."
 green_hill_question_5.b: "Whether it produced immediate profit."
 green_hill_question_5.c: "Whether every traveler paid him directly."
 green_hill_question_6: "The marabout speaks more quietly.\n\n"#weak 'Count not only your dinars but the hands that earned them.'#! If the treasury were full while fields emptied and workshops fell silent, where would the Mahdi look for the true problem?""
 green_hill_question_6.a: "To the failing prosperity of the people whose labor sustained the realm."
 green_hill_question_6.b: "To the amount of coin still locked inside the treasury."
 green_hill_question_6.c: "To the need for higher taxes."
 ck_pilgrimage.0101.a: "[ROOT.Char.Custom('ck_mahdi_0101_answers_A')]"
 ck_pilgrimage.0101.b: "[ROOT.Char.Custom('ck_mahdi_0101_answers_B')]"
 ck_pilgrimage.0101.c: "[ROOT.Char.Custom('ck_mahdi_0101_answers_C')]"
 ck_pilgrimage.0101.desc.success: "The marabout nods slowly and smiles, "You are well read, child. That or you are fortunately lucky. Luck cannot always save you, and you must rely on your faith and wits. You are ready for the next stage of your trial."\n\n"
 ck_pilgrimage.0101.d.poison: "Whew... I'm ready."
 ck_pilgrimage.0101.d: "Yes."
 ck_pilgrimage.0101.d.white_hill: "I will find him. Have no worries."
 ck_pilgrimage.0101.e: "Damn it."
 ck_pilgrimage.0101.f: "Ehh, I'm good."
 ck_pilgrimage.0101.desc.success_black: ""You will be given the ljjn poison now. Your body will feel as though it is burning from the inside out. You will quite literally be on death's doorstep, but should you succeed in this task, and avoid the headache of me having to clean up your corpse, you will have shown yourself to be as vigorous as the Mahdi himself.""
 ck_pilgrimage.0101.desc.success_red: ""You come at an opportune time. Local bandits have taken off with a holy relic and I require it back. You will travel and find these bandits. Show them the light of Urzor or take their heads. The choice is up to you, child.""
 ck_pilgrimage.0101.desc.success_blue: ""Nearby, there are two herder families that have started a blood feud. The children of these clans have opted for sticks and stones over words. I want you to seek them out and have them end their feud.""
 ck_pilgrimage.0101.desc.success_green: ""Merchants from $k_gagan$, a land to the east, have settled near here and begun to drive out our local merchants. Using your own wealth and cunning, I want you to drive these parasites out.""
 ck_pilgrimage.0101.desc.success_white: "The face of the marabout grows worries and [trial_marabout.GetHerHis] voice almosts seems to quiver, "My great friend, another of us marabouts, has lost his way since the death of his family to the plague. I worry for him and what he may do. Please go to him and turn him towards the light of Urzor no matter what.""
 ck_pilgrimage.0102.desc.black_hill: "The marabout brings over the cup with the poison in it. Handing it over to me, I cannot help but feel like I've done something I cannot turn back from. I slowly bring the cup to my lips to drink when the taste hits me like a horse.\n\nI begin coughing and vomiting on the floor, but the poison has already set it and in just a few hours I'm laying in a bed recoiling in pain. Eventually, my mind gives way and I pass out. My dreams are a swirl of dark ominous clouds as the poison continues to seep into my being."
 ck_pilgrimage.0102.desc.white_hill: "I found the man the marabout spoke of standing over an enbankment looking down at the raging river below.\n\nHe turns his head and notices me approach and shouts, "This does not concern you stranger! I do not know your reasons for being here, but let me go in peace. Urzor has condemned my family and so why should I have faith in that god anymore?""
 ck_pilgrimage.0102.desc.red_hill: "I slowly make my way through the forest until I catch a whiff of smoke coming from the west. Sneaking my way up, I see several men huddled around a camp and past them I catch the glint of the relic. Knowing I am clearly outnumbered, I wait until dusk when most men are asleep before attempting to snatch the relic.\n\nI successfully nab the relic, and am not even thirty feet from the camp when one of the men apprehends me, "Stop! You took something that belongs to us. Return it willingly and I may let you keep your hands!" I don't see any other commotion from the camp, so right now it's just the two of us."
 ck_pilgrimage.0102.desc.blue_hill: "I reach the top of a nearby hill, where the two families are said to be feuding. I hear a shout and turn my head just as a stone is thrown past my face. I look in the direction of who threw it and I find a [right_portrait.GetWomanMan] storming in my direction, but when I turn around I see a different [center_portrait.GetWomanMan] storming towards me as well.\n"Curses upon your family, [center_portrait.GetFirstNameNicknamedNoTooltip]! I see you brought a dog from the village to try and mediate things? Ha! How pathetic of your family of [center_portrait.GetFaith.EvilGodNames] worshippers!"\n\nThe second [center_portrait.GetWomanMan] speaks up, "I have no idea who this is! What do you want stranger?""
 ck_pilgrimage.0102.desc.green_hill: "I find the $k_gagan_adj$ merchants' stall near the base of the mountain. Travellers and merchants swarm the stalls while the local stalls suffer from a lack of attention.\n\nThe two men, clearly brothers, see me approach, "Ah yes! Come to see our beautiful Selidonian silver wares? Perhaps dates grown from the very shores of the Damar River?"\n\nI reply, "No. You have bled the markets here dry with your wares for too long. So, let's come to an understanding, yes?""
 ck_pilgrimage.0102.a: "When will it end!?"
 ck_pilgrimage.0102.a2: ""The light of Urzor has not forsaken you, brother.""
 ck_pilgrimage.0102.a2.flavor: "Convince him Urzor has not fully abandon him."
 ck_pilgrimage.0102.a3: ""I need to understand what started this feud.""
 ck_pilgrimage.0102.a3.success: "Successfully resolve this feud"
 ck_pilgrimage.0102.a3.failure: "The feud resumes"
 ck_pilgrimage.0102.b2: ""Please, look at me. You are not alone in this moment.""
 ck_pilgrimage.0102.b2.success: "Successfully save him"
 ck_pilgrimage.0102.b2.flavor: "Hope he listens to reason."
 mahdi_trial_success_tt: "#size:16;P;bold Succeeded this Mahdi trial!#!"
 mahdi_trial_failure_tt: "#size:16;N;bold Failed this Mahdi trial!#!"
 ck_pilgrimage.0102.b2.failure: "Fail to save him"
 ck_pilgrimage.0102.b3: ""Perhaps for some coin you can forget I was here?""
 ck_pilgrimage.0102.b3.success: "Pay off the bandit"
 ck_pilgrimage.0102.b3.failure: "Fail to convince the bandit"
 ck_pilgrimage.0102.b4: ""Enough! Surely we can settle this peacefully.""
 ck_pilgrimage.0102.b5: ""Perhaps you can find a better market elsewhere.""
 ck_pilgrimage.0102.c2: ""Get over here now!""
 ck_pilgrimage.0102.c2.flavor: "Try to pull him back from the enbankment by force."
 ck_pilgrimage.0102.c2.success: "Succeed in pulling him back"
 ck_pilgrimage.0102.c2.failure: "Accidentally push him to his death"
 ck_pilgrimage.0102.c3: ""Have at thee brigand!""
 ck_pilgrimage.0102.c3.tt: "Begin a [single_combat_duel|E] to the death with the brigand"
 ck_pilgrimage.0102.d1: ""Join me and forget about life on the run!""
 ck_pilgrimage.0102.d1.tt: "The bandit joins your [court|E] and [entourage|E]"
 ck_pilgrimage.0102.d1.unv: "You already recently hired a bandit"
 ck_pilgrimage.0102.e1: ""Perhaps an exchange can settle this dispute.""
 ck_pilgrimage.0102.e1.success_crit: "They agree to the terms"
 ck_pilgrimage.0102.e1.success: "They agree, but only for something in return"
 ck_pilgrimage.0102.e1.failure: "Fail to convince them"
 ck_pilgrimage.0102.e2: "I hear there are favorable markets in [GetTitleByKey('c_djarah').GetNameNoTier]"
 ck_pilgrimage.0102.e2.success: "Convince them to move"
 ck_pilgrimage.0102.e2.failure: "They remain unconvinced"
