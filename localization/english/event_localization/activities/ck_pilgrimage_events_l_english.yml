l_english:
 pilgrimage.2511.desc.vengeful.darusan: "\n\nIt is times like this I am reminded Darusos commanded us to turn the other cheek..."
 # Charas
 pilgrimage.5001.t.ck:0 "All Roads Lead to Charasea"
 pilgrimage.5001.desc.ck:0 "Pilgrims flock to [GetTitleByKey('c_charas').GetNameNoTier] from all over the known world. Some follow the cobbled roads leading from [GetTitleByKey('c_galend').GetNameNoTier] to [GetTitleByKey('c_vostrum').GetNameNoTier]; others take less well known paths. In the end, we all converge here, at Calradios' Basilica, where the great man himself was put to rest.\n\nStanding here with the other pilgrims, I sense a feeling of solemn unity and fellowship shared amongst the gathered, all having overcoming various trials and tribulations along their journey."
 # Razih
 pilgrimage.5011.t.aserai:0 "The Majesty of Razih"
 pilgrimage.5011.desc.beginning.aserai:0 "Not many other cities in the known world have a history quite like Razih. In addition to the many other wonderful sites there, the city contains"
 pilgrimage.5011.desc.calradian:0 "the Great Library of Razih! It's knowledge spans back to the golden years of the Kannic people, a time when they once held domain over the Perassic!"
 pilgrimage.5011.desc.aserai:0 "the Great Kannic Port of Razih, the location where Asera sailed out into the infinite beyond at the end of his life."
 pilgrimage.5011.desc.end.razih:0 "\n\nStanding outside of the Great Library, with my eyes fixed to its majesty, I find myself reflecting on everything that happened on my journey to this city of legend."
 # Lycaron
 pilgrimage.5021.t.ck:0 "The City of Emperors!"
 pilgrimage.5021.desc.ck:0 "I finally stand on the hills outside Lycaron, a glimmering jewel of civilization that echoes with the glory of the Calradian Empire. It is truly a site to behold!\n\nNear the center I can see the Imperial Academy, the great center of learning, which is often the considered the epitome of Calradian architecture.\n\nIt is far from the only wonder here though, and as I gaze out over the city I marvel at the glories of [ROOT.Char.GetFaith.CreatorNamePossessive] creation."
 # Sahel
 pilgrimage.5201.desc.ck:0 "Asera was not always beloved, and in the earliest days of his youth, many within his clan rejected his ideas of liberation from the hands of foreigners.\n\nAfter being exiled from the Banu Sahelid, the son of the Nahasa travelled across the Nahasa, from the volcanic hills of al-Ifrit to the gilded walls of Husn Fulq. This journey was known as the Hegira. Returning home, Asera found his former clan had suffer from tyranny and was able to rally the disparate tribes around him to throw of the yoke of the Hubyari and Calradian tyrants with the guiding light of [ROOT.Char.GetFaith.CreatorName].\n\nNow here I am, ready to honor his journey myself."
 #Paderborn
 pilgrimage.5901.t.ck: "Varcheg!"
 pilgrimage.5901.desc.ck: "Deep in the forests of Varch once lay Irminsul, the Great Pillar. Erected to honor Wodan, the monument was destroyed by a Calradian legatus during the Northern Wars, but our people continue to flock to the site where it once stood in honor of its memory. Now I can say that I, too, have made pilgrimage to the sacred place."

 # Debating Theology Event: pilgrimage.6760 #
 pilgrimage.6760.desc.calradian:0 ""Only a fool would believe that Darusos was a saint. The boy was an ineffective Emperor at that, completely unqualified for sainthood!"\n\n"The rule of Darusos was intended as one of peace and prosperity. It was through the actions of his most trusted general that our paradise was denied! But his return will burn brighter than the sun and the stars combined, lighting a new path to paradise!"
 pilgrimage.6760.calradian.b:1 "And you know how his estate sold all of his possessions and disinherited him because of his lunacy?"
 pilgrimage.6760.calradian.b.success:0 "[bishop_pilgrim.GetShortUIName] seems convinced"
 # Naked preacher! #
 pilgrimage.3002.calradian.desc:0 "As my party prepares to break camp, I notice a massive commotion nearby — A naked [naked_preacher.GetWomanMan] has climbed on top of a large rock and is preaching to the assembled crowd.\n\n"The original sin still stains our souls my friends, but that need not be so! If we shed our garbs, can we recover the lost innocence of Aden and Iya... then, and #EMP only#! then, will Heaven see fit to touch us and show us its true love!""
 pilgrimage.3003.calradia.t:1 "$pilgrimage_header$ Aden's Guilt"
 ## End is Night ##
 pilgrimage.3004.calradia.a:0 "But of that day and hour no one knows!"
 #Sea: Go fish
 pilgrimage.2040.b.ck: "#EMP Kannacites!#! I should spend my time praying instead."

 ### Path of the Madhi Events
 activity_pilgrimage.is_location_valid.al_ifrit_mahdi: "The location is unavailable for this type of pilgrimage"
 ## Activity Intent: Mahdi
 pilgrimage_type_mahdi: "Path of the Mahdi"
 pilgrimage_type_mahdi_desc: "$EFFECT_LIST_BULLET$ Some event options will allow you to more closely follow the Mahdi's Path\n$EFFECT_LIST_BULLET$ Taking these awards high [piety|E]\n$EFFECT_LIST_BULLET$ Completing the Mahdi's Path could result in a unification of the faith under you\n\n#weak To mirror the Mahdi's path is to hope for a beautiful, unified world — one free from famish, pestilence, and conflict. Walk the steps of the Mahdi and usher in paradise and deliver us to ljnt!#!"
 pilgrimage_type_mahdi_option_tt: "[travel_option|E]: Your [faith|E] dictates you take this path alone"
 pilgrimage_type_mahdi_activity_loc: "Enlightenment Achieved"
 pilgrimage_type_mahdi_activity_loc_success_desc: "\n\nHow Enlightened your [pilgrimage|E] has turned out to be so far.\n\nThe more trials you succeed in, the better [activity|E] rewards you may receive."
 pilgrimage_mahdi_type_tt_positive: "Your [GetActivityType('activity_pilgrimage').GetName] becomes #P more Enlightened#!"
 pilgrimage_mahdi_type_tt_very_positive: "Your [GetActivityType('activity_pilgrimage').GetName] becomes #P very Enlightened#!"

 ## Journey Events
 ## Destination Events
 # Arrival in al-Ifrit
 ck_pilgrimage.0002.t: "The Fiery Tyrant"
 ck_pilgrimage.0002.desc.active: "To see the Great Tyrant in all its glory like this, with its towering peak pluming with smoke, carrying the ashes of our forebearers across the world to be reborn. I am humbled to be in the presence of the very creation of Urzor who gifted mankind this gift of reincarnation so that we may learn to be better."
 ck_pilgrimage.0002.desc.active_cynical: "As I look up upon the supposed Great Tyrant's shape as it engulfs my field of view, I do feel a sense of wonderment at what nature has produced with this great volcano."
 ck_pilgrimage.0002.desc.warning: "I behold al-Ifrit's great towering shape for what feels like days when suddenly I am shaken by a violent quake beneath my feet. The island is known to experience tremors but this is nothing from what I have heard. In the distance, I observe people fleeing to ships while others close their doors in the hopes that this quake will subside"
 ck_pilgrimage.0002.desc.eruption: "Fire and great burning boulders erupt from the top the volcano, and plumes of black ash are sent careening down towards a nearby village. Not even a second later, the village disappears completely. If I wish to complete this step on my path to mantle the Mahdi, I must take care to respect the forces of nature wrought upon this island."
 ck_pilgrimage.0002.desc.ash_clouds: "The sky turns into a dark haze, backlit by the red fires spewing from the great volcano. Already, I feel my lungs burning as the smoke sinks from the skies to only assault my lungs. I pull a cloth up over my face while I continue my trek."
 ck_pilgrimage.0002.desc.inactive: "I thought seeing al-Ifrit would bring me joy, but all I see is a mountain devoid of life. Quakes can still be felt every once in a while, telling me that at any moment the volcano will awaken. Looking to the sky, I see a flock of seagulls calmly flying across the island. It is nature's indication that it is currently safe to continue my journey."
 ck_pilgrimage.0002.desc.extinct: "I nearly did not believe my ears when I heard the news that the great volcano has died. I kneel down and put an ear to the ground in the hopes of hearing at least one tremor, but I hear absolutely nothing. Looking up at the mountainside, all I see are birds making nest at the peak of a mountain that once spewed holy fires and ash from its crown.\n\nNow, it sits alone and dead, no longer able to fulfill its purpose, the purpose Urzor gave it. Our cycle of reincarnation is ended."
 ck_pilgrimage.0002.a: "Beautiful!"
 ck_pilgrimage.0002.a_dead: "We have seen the Great Tyrant."
 ck_pilgrimage.0002.a_dangerous: "I must be careful in these uncertain times."
 ck_pilgrimage.0002.a_cynical: "Unremarkable, but I must carry on."
 # Arrival in the Mahdi's Grove - Ashtari
 ck_pilgrimage.0003.t: "The Green Canopies of Summer"
 ck_pilgrimage.0003.desc: "I have arrived in Ksiref to seek out the Mahdi's Grove and complete my pilgrimage. Somewhere, deep in these thick forests, lies a legendary grove said to have been cultivated by the Mahdi as dedication to the gods. Many pilgrims fail to find the grove and either end up missing or changed by their failure.\n\nI go into this knowing there may be a chance I find nothing. At worst, I become lost and forgotten. I cannot fail."
 ck_pilgrimage.0003.desc.non_religion: "Having arrived in Ksiref to seek out the Mahdi's Grove, I catch [ksiref_faith.GetAdherentNameNoTooltip] lumberers staring at me as I approach the thick forests ahead. They cut the holy trees of our faith with little regard for how sacred they are to most!\n\nPerhaps one day, someone will liberate this island from the clutches of these heathens. Regardless, I must begin my pilgrimage before any more trouble starts.\n\nI take a step into the thick forest, hoping to seek that which is hidden deep beyond human eyes, and my only hope now is that I do not become lost."
 ck_pilgrimage.0003.a: "Onwards!"
 ck_pilgrimage.0003.b: "Better yet, I should turn back."
 ck_pilgrimage.0003.a.list_desc: "In taking this journey"
 ck_pilgrimage.0003.a.find_grove: "#P Success#!"
 ck_pilgrimage.0003.a.find_grove_tt: "You find the grove"
 ck_pilgrimage.0003.a.failure_to_find_grove: "#X Failure#!"
 ck_pilgrimage.0003.a.failure_to_find_grove_tt: "You fail to find the grove"
 ck_pilgrimage.0003.a.missing_in_grove: "Death @death_icon!"
 ck_pilgrimage.0003.a.missing_in_grove_tt: "You get lost in the forest"
 ck_pilgrimage_leave_grove: "Leave the Grove"
 ck_pilgrimage_leave_grove_tt: "You safely leave the forest"
 event_window_widget_grove: "#L Current Chances:#!\nFinding the Grove: [GetPlayer.Custom('ck_madhi_grove_success')] \nBecoming Lost: [GetPlayer.Custom('ck_madhi_grove_lost')]"
 ck_madhi_grove_success_crit: "#P;bold Guaranteed#!"
 ck_madhi_grove_success: "#P;bold Near Guaranteed#!"
 ck_madhi_grove_success_slight: "#P;bold Possible Success#!"
 ck_madhi_grove_success_failure: "#N;bold Possible Failure#!"
 ck_madhi_grove_success_failure_crit: "#N;bold Failure#!"
 ck_madhi_grove_lost_crit: "#N;bold Near Certain!#!"
 ck_madhi_grove_lost_failure: "#N;bold Dangerous#!"
 ck_madhi_grove_lost_neutral: "#bold Uncertain#!"
 ck_madhi_grove_lost_safe: "#P;bold Possibly Safe#!"
 ck_madhi_grove_lost_safe_crit: "#P;bold Safe!#!"
 ck_pilgrimage_mahdi_entourage: "Those in your [entourage|E] will attempt to follow you"
 ck_mahdi_grove_success_icon_tt: "Throughout your [pilgrimage|E] to the fabled Grove of the [Glossary( 'Mahdi', 'CK_GLOSS_MAHDI' )], you will be met with dangers and challenges, natural or manmade.\n\nEach choice can either increase or decrease your chances to find the Grove.\n\nHowever, other decisions can also increase the chances of you becoming lost @death_icon! forever, but you always have a chance to turn back before that happens."
 ck_end_pilgrimage_mahdi: "@warning_icon!#X This will end your [pilgrimage|E]#!"
 # Arrival at the Green Hill - ck_pilgrimage.0004
 ck_pilgrimage.0004.t: "[GetBuilding('indurar').GetName], The Holy City"
 ck_pilgrimage.0004.desc.mahdi: "As I walk up to the great walls of [GetBuilding('indurar').GetName], built and sculpted into the side of the great sandstone cliffs of Indurar, I stop and stand in awe of the great work that must have went into its construction. For a mile each way, I can observe the movement of people along its great facets like little ants in a colony. In other parts though, I see the effects of wear as seasons of torrential rain tear away at the stone.\n\nFinished admiring the architecture, I begin making my way inside to face my final trial."
 ck_pilgrimage.0004.desc: "As I walk up to the great walls of [GetBuilding('indurar').GetName], built and sculpted into the side of the great sandstone cliffs of Indurar, I stop and stand in awe of the great work that must have went into its construction. For a mile each way, I can observe the movement of people along its great facets like little ants in a colony. In other parts though, I see the effects of wear as seasons of torrential rain tear away at the stone.\n\nFinished admiring the architecture, I begin making my way inside to admire the architecture and meet other pilgrims."
 ck_pilgrimage.0004.a: "Incredible!"
 ck_pilgrimage.mahdi_leave_desc: "I am not ready for this."
 # Arrival at the Black Hill
 ck_pilgrimage.0005.t: "$b_abarchazghal$"
 ck_pilgrimage.0005.desc.mahdi: "Hiking up $b_abarchazghal$ for several hours, I finally reach the summit. Across the valley before me, I see countless pilgrims who have made the same journey trading goods, and leaving their own offerings to Urzor.\n\nThe hill gets its name from the near black rocks that line the valley. Legends say that the valley was formed by a star falling from the sky and landing here. I begin carefully making my way down, taking note of the marabout temple at the center of the valley where I will be performing one of my trials."
 ck_pilgrimage.0005.desc: "Hiking up $b_abarchazghal$ for several hours, I finally reach the summit. Across the valley before me, I see countless pilgrims who have made the same journey trading goods, and leaving their own offerings to Urzor.\n\nThe hill gets its name from the near black rocks that line the valley. Legends say that the valley was formed by a star falling from the sky and landing here. I begin carefully making my way down, taking note of the marabout temple at the center of the valley where I see others attempting trials. I am here for the journey though."
 ck_pilgrimage.0005.a: "Exciting!"
 ck_pilgrimage.0005.b: "Let's get this over with."
 # Arrival at the White Hill
 ck_pilgrimage.0006.t: "$cn_amellazghal$"
 ck_pilgrimage.0006.desc: "Having to cover my eyes and mouth while white limestone from the hills blows into my face, I finally reach a point on the hill where I can safely uncover my face.\n\nHelped up the final step of this journey by a fellow pilgrim, I take in the surroundings. In the center of the village is the marabout's hut where trials are conducted, on the north side is the market bustling with activity and trade, and on the south side is the local lord's keep."
 ck_pilgrimage.0006.desc.mahdi: "\n\nI look back down the hill, its side covered in a bright limestone surface with pilgrims making their own ways up. Turning back around, I take a deep breath and get ready for my trial."
 # Arrival at the Red Hill
 ck_pilgrimage.0007.t: "$b_amezghal$"
 ck_pilgrimage.0007.desc: "The iron rich soil gives the hills here their distinctive red color. Along the stone cliffs of Amezghal, I find sculptures carved into the rock, each depicting a different god of our faith. I stop to admire them before continuing on my way.\n\nBefore long, I arrive at the local marabout's hut. I look around for other pilgrims, but find only a handful. Amezghal is relatively isolated from the wider Zamazigh world, and its trial is said to be among the most difficult."
 ck_pilgrimage.0007.desc.mahdi: "\n\nI approach the door, knowing that the trial awaits me within. A faint scent of incense drifts from the hut, telling me that the marabout is home."
 # Arrival at the Blue Hill
 ck_pilgrimage.0008.t: "$b_amezghal$"
 ck_pilgrimage.0008.desc: "The name Amezghal, the Blue Hill, is something of a misnomer, as it actually refers to the wide blue lake at the center of the village, with a small island sitting in its middle. Should one wish to conduct their trial here, they must first find a rowboat to cross the water.\n\nI walk through the village, taking in the smell of spices and the occasional waft of fish. At a local shrine, I see a pilgrim leaving offerings to Urzor, perhaps hoping to receive some blessing from the god."
 ck_pilgrimage.0008.desc.mahdi: "\n\nEventually, I make my way down to the fishing docks in search of a boat for my own trial. I find a fisherman willing to take me out to the island, though he expects something in return."

 ## Destination Events: Events that fire while on event. Some are flavor, others are event chains
 # Mahdi's Grove - Random Events
 ck_pilgrimage_mahdi_grove_giveup: "This is too much. I am turning around."
 CK_GLOSS_MAHDIS_GROVE: "The Mahdi's Grove is part fable, part reality according to the many testaments of pilgrims who have journeyed to the island of Ksiref to seek out the grove.\n\nAccording to legend, it is said that in an effort to temper his wrath during war, the Mahdi sought out the god Aatxe who showed the prophet an island free from exploitation and human inhabitation. Eventually, the Mahdi would work to tend the gardens of the grove and it is said that instead of dying of unknown causes, he came back here at the end of his life time to tend the gardens.\n\nSince then, the walls of the garden have grown into great forests that are said to ward off invaders and only allow in those with a worthy heart."
 ## Success/Lost Increases/Decreases
 # Success
 ck_pilgrimage_success_increase: "Chance of Finding the Grove: #P;bold Increases#!"
 ck_pilgrimage_success_increase_crit: "Chance of Finding the Grove: #P;bold Greatly Increases#!"
