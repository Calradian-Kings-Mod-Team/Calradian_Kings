 ck_pilgrimage_lost_decrease: "Chance of Getting Lost: #P;bold Decreases#!"
 ck_pilgrimage_lost_decrease_crit: "Chance of Getting Lost: #P;bold Greatly Decreases#!"
 # Failure
 ck_pilgrimage_failure_increase: "Chance of Finding the Grove: #N;bold Decreases#!"
 ck_pilgrimage_failure_increase_crit: "Chance of Finding the Grove: #N;bold Greatly Decreases#!"
