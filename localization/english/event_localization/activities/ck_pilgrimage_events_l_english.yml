 ck_pilgriamage.0103.t: "Success"
 ck_pilgrimage.0103.desc: "I awaken with a start, sweat running into my eyes. As I wipe them, I see the marabout speaking with another pilgrim. Upon noticing me awake, [trial_marabout.GetSheHe] sends them away and comes to my side.\n\n"Not many survive the ljjn as you have. You possess a hardy constitution, child. Some survivors describe the pain as drifting through a thoughtless dream of black clouds, though I cannot say why. Still, you have passed the Trial of $cn_abarchazghal$. Now begone, I have other pilgrims to attend to!""
 ck_pilgrimage.0103.desc.white: "I return to the marabout's temple and enter. I find the two marabouts speaking to each other, with the one I saved taking one look at me before leaving. The other marabout sees me enter and has a brightness to [trial_marabout.GetHerHis] face, "Thank you so much for that. Our village would not survive without that man. He has done so much for this community but has received so little thanks for what he lost. With your help, I hope to guide him back on the right path. Again, thank you."\n\n[trial_marabout.GetSheHe|U] gently ushers me outside so that I may return home for my next journey."
 ck_pilgrimage.0103.desc.red: "Entering the temple triumphantly, I place the relic before the marabout who gives me an unspoken look of approval. Taking the relic, [trial_marabout.GetSheHe] places it on the shrine and turns around to me, "You have done very well, child. I hope you taught those brigands a lesson they will never forget!"\n\nTaking the brooch from [trial_marabout.GetHerHis] cloak, [trial_marabout.GetSheHe] hands it to me, "Please, accept my gratitude for you have done so much to restore this shrine. Now please go, I have other matters to attend to.""
 ck_pilgrimage.0103.desc.blue: "I make my way across the lake once again and finally reach the marabout's temple. Walking inside, I explain what had happened and they give me an approving nod.\n\n"You have done tremendously well! Word had already reached me that the two families have come to an understanding and ceased their feuding. Perhaps there is potential in you yet, child.""
 ck_pilgrimage.0103.desc.green: "Returning to the marabout, I catch [trial_marabout.GetHerHim] in the middle of conversing with some local merchants, who thank me for what I did. As they leave, the marabout turns to me, "Those were local merchants who have told me you managed to remove those $k_gagan_adj$ peddlers from our midst. They're someone else's trouble now."\n\nSitting down, [trial_marabout.GetSheHe] remarks to me, "You certainly have the makings of the Mahdi in you. Perhaps one day you may unite us as our new Mahdi?""
 ck_pilgrimage.0103.a: "Where can I get some water?"
 ck_pilgrimage.0103.a.2: "Time to move on."
 ck_pilgrimage.0103.a.3: "It has been a pleasure."
 ck_pilgrimage.0104.t: "Failure"
 ck_pilgrimage.0104.desc: "I meekly make my way inside of the marabout's temple and see them in the corner. Turning around, I can see the shift in expression from one of sadness to anger. "You had one task. One! Begone from my sight and do not return! You will find no success in your trial here. You can try again in the future but do not expect me to be your sponsor."\n\nI stand there for a few seconds too long, they shout, "LEAVE!""
 ck_pilgrimage.0104.a: "Damn..."
 ck_pilgrimage.1001.t: "Pilgrimage: Victory!"
 ck_pilgrimage.1001.desc: "Heaving heavily, I walk over to the brigand's broken body and jab my blade into the their throat. Wiping my brow, I put the relic into my pack just as the rest of the brigand's camp begins to stir and shouts could be heard, "Where is [sc_loser.GetFirstNameNicknamedNoTooltip]? Where is the relic!?"\n\nI leave before they can find me."
 ck_pilgrimage.0104.desc.blue: "I make my way across the lake once again and finally reach the marabout's temple. Walking inside, I explain what had happened and they give me an disapproving look.\n\n"I hear the families continue their feuding, and not only that but they have resorted to straight butchery instead of rocks. I am immensely disappointed in your performance. Maybe in time you'll learn the wisdom of diplomacy, but today is not that day.""
 ck_pilgrimage.1001.a: "Best to get back to the marabout."