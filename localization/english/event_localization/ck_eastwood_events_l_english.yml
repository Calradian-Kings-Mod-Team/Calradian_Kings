l_english:
 # Wandering Educator
 eastwood_flavor.0001.t: "The Wandering Educator"
 eastwood_flavor.0001.desc: "Villagers say that a wanderer has recently arrived and offered to teach their children to read. [wandering_educator_ck.GetSheHe|U] is not only well-educated, but [wandering_educator_ck.GetSheHe] has a gift for holding the attention of restless 10-year-olds.\n\nHowever, [wandering_educator_ck.GetSheHe] seems to have spent time with one of the rebel bands that were common around here ten years back, and occasionally speaks of a coming reign of justice brought by Heaven, in a way that doesn't seem like one of [wandering_educator_ck.GetHerHis] ironic jokes."
 eastwood_flavor.0001.desc.random_child: "\n\n[fascinated_child_ck.GetNameNoTier] has taken to the [wandering_educator_ck.GetWomanMan] and seems to follow [wandering_educator_ck.GetHerHim] wherever [wandering_educator_ck.GetSheHe] goes, learning new things."
 eastwood_flavor.0001.desc.my_child: "\n\nMy [ROOT.Char.Custom2('RelationToMe', fascinated_child_ck)] [fascinated_child_ck.GetNameNoTooltip] has taken to the [wandering_educator_ck.GetWomanMan] and seems to follow [wandering_educator_ck.GetHerHim] wherever [wandering_educator_ck.GetSheHe] goes, learning new things. It's becoming a little bit disconcerting."
 eastwood_flavor.0001.a: "[wandering_educator_ck.GetSheHe|U] may stay in my court."
 eastwood_flavor.0001.a.tt: "There is a chance of [fascinated_child_ck.GetName] becoming [GetTrait('zealous').GetName( GetNullCharacter )]"
 eastwood_flavor.0001.b.arrogant: "The people only need to know how to plow fields!"
 eastwood_flavor.0001.b.zealous: "I will not abide a heresiarch in my court!"
 eastwood_flavor.0001.b.normal: "I do not have room in my court of this vagabond."
 eastwood_flavor.0001.b.tt: "#TUT The wanderer will leave your lands forever#!"
 eastwood_flavor.0001.c: "If [wandering_educator_ck.GetSheHe] ceases [wandering_educator_ck.GetHerHis] ramblings, [wandering_educator_ck.GetSheHe] can stay."
 eastwood_flavor.0001.c.tt: "#TUT You hire the wanderer in exchange for them ceasing their ramblings about politics and religion#!"

 # Nomads Seeking to Settle
 eastwood_flavor.0002.t: "Settling Nomads"
 eastwood_flavor.0002.desc: "A desperate band of nomads have arrived in [root_capital_county.GetNameNoTier], seeking a place to settle down. Their herds were ravaged by an epidemic, they say, and they are ready to take up farming or work as laborers.\n\nOtherwise, they must starve or give themselves to another tribe as servants. The villagers are skeptical. Nomads are too lazy to be farmers, they say, preferring horse theft and feuds."
 eastwood_flavor_0002.a: "Welcome them with open arms."
 eastwood_flavor_0002.a.recruit_nomads: "You can now recruit nomadic [men_at_arms|E] for the next 2 years"
 eastwood_flavor_0002.b: "They are welcome but must adapt to our ways."
 eastwood_flavor_0002.b.tt: "#V [ck_0002_nomad_1.GetName]#!, #V [ck_0002_nomad_2.GetName]#!, and #V [ck_0002_nomad_3.GetName]#! convert to #V [root_faith_ck.GetName]#! and join your [court|E]"
 eastwood_flavor_0002.c: "These nomads are more trouble than they're worth."
 eastwood_flavor_0002.c.success: "The nomads move on"
 eastwood_flavor_0002.c.failure: "The nomads leave and rampage across the neighboring countryside"

 # Nightmares
 eastwood_flavor.0003.t: "Haunted Dreams"
 eastwood_flavor.0003.desc: "You lie down for a well-deserved nap, but you slip into an uneasy dream.\n\nYou are sailing on a wind-tossed sea. A wave crashes on your bow, sending spray across the decks. You look closely, and see that it is not water but blood sloshing around across your feet. You stare out into the sea, and the breakers take on the forms of men you have slain in battle."
 eastwood_flavor.0003.a: "Have I killed without good reason? [ROOT.Char.GetFaith.HighGodName] wishes me to repent!"
 eastwood_flavor.0003.a.tt_discount: "You get a discount when creating a faith with the [GetFaithDoctrine('tenet_pacifism').GetName( GetPlayer.GetFaith )] [core_tenet|E]"
 eastwood_flavor.0003.b: "To where do we sail on this sea of blood? To glory, that is where!"
 eastwood_flavor.0003.c: "Dreams are but a temporary madness. [ROOT.Char.GetFaith.HighGodName] does not speak to us in this way."

# Fertility Festival
 eastwood_flavor.0004.t: "Palaic Festival"
 eastwood_flavor.0004.desc: "The village has seen an unexpected rise in pregnancies. Some of your villagers ask your permission to hold a festival in honor of Agalea, protectress of motherhood. Agalea has never been recognized as a saint by the imperial Senate, and many consider her veneration to be a primitive Palaic holder.\n\nHer festivals tend to be rather raucous, befitting the theme of fertility, and also rather expensive. It would certainly set tongues wagging in the district.\n\nDo you grant permission?"
 eastwood_flavor_0004.a: "Bring out the wine and let us dance to lady Agalea!"
 eastwood_flavor_0004.b: "The villagers will learn proper worship under Heaven's light."
 eastwood_flavor_0004.c: "I'll let them celebrate but keep it discrete."

## The Pavillion (Two Parts)
 eastwood_flavor.0005.t: "The Pavillion"
 eastwood_flavor.0005.desc: "As you leave town you come across an encampment of traveling entertainers.\n\nYou see tattered but colorful tents, you hear wailing but enticing music, and smell the scent of cheap incense and meat that is probably slightly spoiled but spiced so that you would never notice. A group of women in some noble's thrown-away silks, their faces made up skillfully with charcoal and sheep's blood, beckon to your men."
 eastwood_flavor.0005.desc.fawning: "\n\nMy [ROOT.Char.Custom2('RelationToMe', ck_fawning_courtier)] [ck_fawning_courtier.GetNameNoTooltip] is practically fawning over the woman and would be either upset or cheerful based on what decision I take."
 eastwood_flavor.0005.desc.fawning_no_relation: "\n\n[ck_fawning_courtier.GetNameNoTooltip] is practically fawning over the woman and would be either upset or cheerful based on what decision I take"
 ck_flavor.0005.a: "Steer clear of such dubious enticements!"
 ck_flavor.0005.b: "Let the men have fun but within reason."
 ck_flavor.0005.c: "The fun is on me! Let the men have their fun!"
 ck_flavor.0005.d: "Rob the entertainers. No doubt their wealth is ill-gotten."
 eastwood_flavor.entourage.tt: "Every adult entourage member"
