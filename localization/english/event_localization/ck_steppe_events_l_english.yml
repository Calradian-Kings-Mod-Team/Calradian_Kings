l_english:
 ck_steppe_events.0001.t: "Tenger's Path beckons"
 ck_steppe_events.0001.desc: "\nWhile mighty Tenger gallops across the sky, turning day into night, I am here on earth as a mere [ROOT.Char.GetWomanMan]. It is time both my tribe and [family|E] follow one of Tenger's path across the sky, maintaining balance here on the mortal plane. As such, I have few options laid out before me.\n\nShould I go with the older [GetFaithByKey('arkits_faith').GetAdjective] faith, the supposed oldest tribe and oldest child of the She-Wolf? Will I perhaps follow new blood and embrace the [GetFaithByKey('khuzait_faith').GetAdjective] faith most [GetCulturePillar('heritage_khuzic').GetName] tribes follow?"
 ck_steppe_events.0001.a: "New is fun and exciting!"
 ck_steppe_events.0001.b: "Follow the ancient tenets and learn from your elders."
  # other version
 ck_steppe_events.0002.t: "The Heart of Man wavers"
 ck_steppe_events.0002.desc: "\nHaving returned to our homeland[ConcatIfNeitherEmpty(', with its ', GetPlayer.GetCapitalLocation.Custom('TerrainInspirationLoc'))], we must focus on what it truly means to be [GetPlayer.GetCulture.GetName]. It is high time that we decide on the way forward, not just for my herd and followers, but also those yet to come under our influence. \n\nShall we follow the [GetFaithByKey('xorheguzz').GetAdjective] creed, prioritizing our own [GetPlayer.GetDomicile.GetCulture.GetPrefix] people, or those of the ancestral [GetFaithByKey('yolguzz_faith').GetAdherentNamePlural], that has thus far failed to make us whole?"
