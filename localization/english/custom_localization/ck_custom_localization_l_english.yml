 ### Calradic "Bible" Quotes
 ## Long form
 # Equality
 ck_scripture_quote_1: "[Glossary('Let them who proclaims themselves above all be cast down as not less than, but equal to those whom were scorned.','SCRIPTURE_QUOTE_1')]"
 # Vows of Poverty
 ck_scripture_quote_3: "[Glossary('Give not one child an assurance of doubt, lest they stray from the Mandated path of Heaven to deny themselves salvation.','SCRIPTURE_QUOTE_3')]"
 # Philanthropia
 ck_scripture_quote_4: "[Glossary('When Echerion said to Cypegos, ‘Why do you castigate those who give you coin and warm bread,’ and the tyrant sneered with derision, ‘What have the voluptuaries done to deserve such indulgences? I bid war upon our foes and quash tribes. They deserve only my peace!’','SCRIPTURE_QUOTE_4')]"
 ck_scripture_quote_5: "[Glossary('Waste not the hands to emancipate those whom would litter with barbarians! Leave them in these arids lands.','SCRIPTURE_QUOTE_5')]"
 # Khrachkar
 ck_scripture_quote_6: "[Glossary('Raise a stele of triumphs to Heaven so that all of man may see the glory of your kingdom.','SCRIPTURE_QUOTE_6')]"
 # Ora et Labora
 ck_scripture_quote_8: "[Glossary('A kingdom built in a day will fall in a day, a kingdom built in centuries will endure eternally.','SCRIPTURE_QUOTE_8')]"
 ck_scripture_quote_2: "[Glossary('Build yourself a kingdom under the guiding light of Heaven, and from it shepherd your flock across its lands.','SCRIPTURE_QUOTE_2')]"
 # Confession
 ck_scripture_quote_9: "[Glossary('Let he who confessed his sins first be welcomed beyond Heaven’s gates. Let he who stays off confession be condemned with.','SCRIPTURE_QUOTE_9')]"
 ck_scripture_quote_12: "[Glossary('Hate not your brother and sister, for we have but one life on Heaven’s earth.','SCRIPTURE_QUOTE_12')]"
 # Armed Pilgrimages
 ck_scripture_quote_10: "[Glossary('With faith as your armor and conviction as your sword, defend the flock from wolves that skulk in lands absent of Heaven’s light.','SCRIPTURE_QUOTE_10')]"
 ck_scripture_quote_14: "[Glossary('Deny the faithful a pasture, and they will be consumed by hungry lions in the lands that belong to Heaven and Heaven alone.','SCRIPTURE_QUOTE_14')]"
 ck_scripture_quote_15: "[Glossary('Defend the homes of the faithful with spirit and blade, and drive back the unfaithful with great vengeance.','SCRIPTURE_QUOTE_15')]"
 # Scholasticism
 ck_scripture_quote_11: "[Glossary('In knowledge there is wisdom, and where there is wisdom in the subtle guiding hand of Heaven.','SCRIPTURE_QUOTE_11')]"
 # Astrology
 ck_scripture_quote_13: "[Glossary('Raise your gaze to Heavens and receive its cosmic will.','SCRIPTURE_QUOTE_13')]"
 # Communion
 ck_scripture_quote_7: "[Glossary('When Rhovanis prostrated himself before Heaven upon the shores of Calradia, he beheld an empire of gold endowed with the everlasting light of Heaven.','SCRIPTURE_QUOTE_7')]"
 # Anachoresis Tenet
 ck_scripture_quote_16: "[Glossary('Oh Calradios, divine son of Heaven, send your sons to shepherd the faithful across this new land to preach your divine nature.','SCRIPTURE_QUOTE_16')]"
 # Mendicant Preachers
 ck_scripture_quote_17: "[Glossary('Take only bread and clothing with you on this journey, child.','SCRIPTURE_QUOTE_17')]"
 # Peace of God
 ck_scripture_quote_18: "[Glossary('Shed not the blood of Heaven’s children, lest we reap the fields for Hell’s own children.','SCRIPTURE_QUOTE_18')]"
 # Pacifism
 ck_scripture_quote_20: "[Glossary('The children of Heaven will be called upon one day to lay down their arms and accept eternal peace.','SCRIPTURE_QUOTE_20')]"
 # Love thy Neighbor
 ck_scripture_quote_19: "[Glossary('In the time before war, mankind knew blissful peace. Oh, how the visions received from Heaven fulfill me so.','SCRIPTURE_QUOTE_19')]"
 # Dulia
 ck_scripture_quote_21: "[Glossary('And behold the consecrated blood of Surmarys, martyred by the vile pagans.','SCRIPTURE_QUOTE_21')]"
 # Darusan Transubstantiation
 ck_scripture_quote_22: "[Glossary('In the body and blood of the holy son, Darusos, do we remember your sacrifice, your worthiness before Heaven','SCRIPTURE_QUOTE_22')]"
 # Darusain Hyperdulia
 ck_scripture_quote_24: "[Glossary( 'Heaven will deliver you a sign, lord, and in the bosom of a woman will there be the Son of Heaven, and she shall name him Ouranogenēs.', 'SCRIPTURE_QUOTE_24')]"
 # Simony
 ck_scripture_quote_25: "[Glossary( 'Precious treasure remains in the house of the wise, but the fool devours it.', 'SCRIPTURE_QUOTE_25')]"
 # Monophysitism
 ck_scripture_quote_26: "[Glossary( 'When Heaven bore down Calradios to the world, It delivered a warrior of faith with one nature: divine.', 'SCRIPTURE_QUOTE_25')]"
 # Monophysitism - Darusan Version
 ck_scripture_quote_27: "[Glossary( 'In the second coming of the promised Son of Heaven, Darusos bore the divinity of Heaven and Calradios as one, a nature of full divinity.', 'SCRIPTURE_QUOTE_27')]"
 # Miaphysitism
 ck_scripture_quote_36: "[Glossary( 'When Heaven bore down Calradios to the world, It delivered a warrior of faith both human and divine.', 'SCRIPTURE_QUOTE_36')]"
 # Miaphysitism - Darusan Version
 ck_scripture_quote_37: "[Glossary( 'In the second coming of the promised Son of Heaven, Darusos bore the divinity of Heaven, Calradios and his nature as man as one.', 'SCRIPTURE_QUOTE_37')]"
 # Acts of the Apostles
 ck_scripture_quote_28: "[Glossary( 'Come with us to the edge of the world, and let those who will listen become inundated with the glory of Heaven.', 'SCRIPTURE_QUOTE_28')]"
 # Purgatory
 ck_scripture_quote_29: "[Glossary( 'Let not yourself pass beyond this veil without purifying thy soul first, those who pass beyond impure will only wander the emptiness of Purgatory.', 'SCRIPTURE_QUOTE_29')]"
 # Fruitful and Multiply
 ck_scripture_quote_30: "[Glossary( 'It is Heaven’s plan for Its children to populate this land, to spread the teachings of its Mandates.', 'SCRIPTURE_QUOTE_30')]"
 # Apostolic Succession
 ck_scripture_quote_31: "[Glossary( 'You are Rhovarion, herald of Heaven, and your descendants will sit upon this throne, delivering Heaven’s Mandates to Calradia’s kings.', 'SCRIPTURE_QUOTE_31')]"
 # Original Sin
 ck_scripture_quote_32: "[Glossary( 'Therefore, just as sin came into the world through one kingdom, and death through that kingdom, and so too shall death spread to all because all have sinned.', 'SCRIPTURE_QUOTE_32')]"
 # Celestial Hierarchy
 ck_scripture_quote_33: "[Glossary( 'And so too shall Heaven send its angels to safeguard the kingdom of Calradios in all ways.', 'SCRIPTURE_QUOTE_33')]"
 # Alexandrian Catechism
 ck_scripture_quote_34: "[Glossary( 'It is in Heaven’s mandates that we are made wise, righteous, sanctified, and redeemed. We are given these mandates not through our efforts but through what Heaven manifests for us.', 'SCRIPTURE_QUOTE_34')]"
 # Adoptionist
 ck_scripture_quote_35: "[Glossary( 'You are the Son, the progeny of my first mandate; with you I am pleased.', 'SCRIPTURE_QUOTE_35')]"
 # Liturgy
 ck_scripture_quote_38: "[Glossary( 'And so Heaven said, ‘Enter my kingdom and behold a nature beyond your understanding, for my nature is holy and divine.’', 'SCRIPTURE_QUOTE_38')]"
 # Aniconism
 ck_scripture_quote_39: "[Glossary( 'Build no monuments to my glory, for my glory needs only your faith.', 'SCRIPTURE_QUOTE_39')]"
 # Communal Identity
 ck_scripture_quote_40: "[Glossary( 'As children of Heaven, we are the sole inheritors to the kingdom of the First Son.', 'SCRIPTURE_QUOTE_39')]"
 # Consolamentum - Uniquely Miraclist at game start
 ck_scripture_quote_41: "[Glossary( 'Free your body from the corruptions of this world, and you shall receive purification of the soul.', 'SCRIPTURE_QUOTE_41')]"
 # Divine Marriage
 ck_scripture_quote_42: "[Glossary( 'Now, not with lust, but with fidelity I take this kinswoman as my wife. Send down your mercy on me and on her, and grant that we may grow old together. Bless us with children.', 'SCRIPTURE_QUOTE_42')]"
 # Gnosticism
 ck_scripture_quote_43: "[Glossary( 'We speak of a nature of Heaven which remains truly hidden, a Vague God whose mandates are in opposition to evil.', 'SCRIPTURE_QUOTE_43')]"
 # Pentarchy
 ck_scripture_quote_44: "[Glossary( 'Let you, as the closest friend to the Son of Heaven, lead your congregation across this land and send forth the light of Heaven in fives.', 'SCRIPTURE_QUOTE_44')]"
 # Unrelenting Faith
 ck_scripture_quote_45: "[Glossary( 'Leave no member of the herd alone to face the wolves. Only together, do we face the dangers of this new land; as one faithful.', 'SCRIPTURE_QUOTE_45')]"
 # Hesychasm
 ck_scripture_quote_46: "[Glossary( 'Oh Heaven, master of the world, have mercy upon me as. May I find sanctuary under your light as a messenger of your mandate.', 'SCRIPTURE_QUOTE_46')]"
 # Mortification
 ck_scripture_quote_47: "[Glossary( 'Let loose the impurties of the body and tame it! Begone with the deeds of the body so you may better server Heaven.', 'SCRIPTURE_QUOTE_47')]"
 # Sanctity of Nature
 ck_scripture_quote_48: "[Glossary('All of Heaven’s creations, from one corner of the world to the other, belong to Heaven and must be treated with reverence.','SCRIPTURE_QUOTE_48')]"
 # Communal Possessions
 ck_scripture_quote_49: "[Glossary('All creations under Heaven’s domain belong to one and all of Its children, let no one man or woman stand above all and declare themselves god.','SCRIPTURE_QUOTE_49')]"
 # Ritual Celebrations
 ck_scripture_quote_50: "[Glossary('Bring forth guests to my hearth and let them take in the succor of Heaven’s grace.','SCRIPTURE_QUOTE_50')]"
 # Warmongering
 ck_scripture_quote_51: "[Glossary('Deny the enemies of Heaven respite as you strike out with righteous vengeance.','SCRIPTURE_QUOTE_51')]"
 # Auspicious/Sacred Birthright
 ck_scripture_quote_52: "[Glossary('You are my child; a child of Heaven, and you will bear great providence across these lands.','SCRIPTURE_QUOTE_52')]"
 # Pursuit of Power
 ck_scripture_quote_53: "[Glossary('Ask my child, and you shall receive a kingdom across these lands for your family and their sons.','SCRIPTURE_QUOTE_53')]"
 # Fallbacks
 ck_scripture_quote_23: "[Glossary( 'Eàn pèsē hē basileía hēmōn, ho politismòs hēmōn eis choūn straphēsetai', 'SCRIPTURE_QUOTE_23')]"

