 great_project_type_geroian_citadel: "Rebuild the $building_type_geroian_citadel_ruined$"
 great_project_type_geroian_citadel_desc: "We must raise up a citadel from our earthly origins in order to receive the wondrous Mandate of Heaven, far away from the conflicts that ravage the continent.\n\nAfter years of arduous cultivation, a great beacon true to [GetFaithByKey('aekekartel').GetAdjective] teachings will shine out to worshipers near these shores, and far across the sea through our [Glossary('$calradian_devotee_male_plural|q$', 'GEROIAN_MONK_GLOSS')]." 
 great_project_type_geroian_citadel_possessive: "The Citadel's"
 citadel_or_upgraded_special_building_tt: "A [GetBuilding('geroian_citadel_good').GetName|V] [great_project|E] [building|E] is constructed in the selected [barony|E]"
 citadel_under_construction_building_tt: "A [GetBuilding('geroian_citadel_ruined').GetName|V] [great_project|E] [building|E] is constructed in the selected [barony|E]"


