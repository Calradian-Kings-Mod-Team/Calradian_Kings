l_english:
 great_project_type_pamphian_palaces: "Restoration of $pamphian_palaces$"
 great_project_type_pamphian_palaces_desc: "The Palace is not merely the seat of my government. It is the jewel of the sea, and should be a majestic symbol of my reign instead of a damaged wreck. By refurbishing the entire court, improving streets, throwing a few weddings, raising statues and other monuments, this beautiful land will become a reflection of my dynasty."
 great_project_type_pamphian_palaces_possessive: "The Palace's"
 great_project_type_pamphian_palaces_contribution_materials: "$great_project_type_strengthen_capital_contribution_materials$"
 great_project_type_pamphian_palaces_contribution_workforce: "$great_project_type_strengthen_capital_contribution_workforce$"
 great_project_type_pamphian_palaces_contribution_architects: "$great_project_type_strengthen_capital_contribution_architects$"
 great_project_type_pamphian_palaces_contribution_engineers: "$great_project_type_strengthen_capital_contribution_engineers$"
 great_project_type_pamphian_palaces_contribution_sculptors: "$great_project_type_strengthen_capital_contribution_sculptors$"
#  great_project_type_pamphian_palaces_contribution_forbidden_city: "The Forbidden City"


 pamphian_palaces: "The Pamphian Palaces"
 ck_pamphian_palaces_character_modifier: "Architect of the Realm"
 ck_pamphian_palaces_character_modifier_desc: "$pamphian_palaces$ have undergone recent refurbishment, greatly improving the [capital_possessive|El] majesty. The island is now the undisputed center of the realm."
 ck_pamphian_palaces_modifier: "Heavenly Capital"
 ck_pamphian_palaces_modifier_desc: "$building_pamphian_palaces_restored_desc$"
 ck_pamphian_palaces_architects_modifier: "Impeccable Architecture"
 ck_pamphian_palaces_architects_modifier_desc: "$pamphian_palaces$ have been refurbished under the supervision of skilled architects, greatly improving the isle's capacity for population growth and commerce."
 ck_pamphian_palaces_engineers_modifier: "Ingenious Engineering"
 ck_pamphian_palaces_engineers_modifier_desc: "$pamphian_palaces$ have been refurbished under the supervision of talented engineers, greatly improving the capital's infrastructure and connections to nearby settlements."
 ck_pamphian_palaces_sculptors_character_modifier: "Glorious Sculptures"
 ck_pamphian_palaces_sculptors_character_modifier_desc: "During the restoration of $pamphian_palaces$, the best sculptors the realm could offer were hired to carefully beautify every aspect of the new architecture. This greatly pleases the monarch and any visitors to the [royal_court|E]."
#  ck_pamphian_palaces_modifier_education_bonus: "\nIncreases success for the [GetActivityType('activity_adult_education').GetTextIcon][GetActivityType('activity_adult_education').GetName] [activity|E] in this [location|E]"
