l_english:
 # Enable Requirements
 NOT_holy_site_orukani_or_holy_site_trigger: "The holder must follow an [GetReligionByKey('oroki_religion').GetName] [faith|E] or consider this a [holy_site|E]"
 # Buildings
 building_type_rock_of_garantor_01:0 "Rock of Garontor"
 building_type_rock_of_garantor_01_desc:0 "The monolithic Rock of Garontor overlooks a narrow strait that is the gateway to the Perassic Sea. Looking at it now, you cannot help but wonder what lies in the blue beyond."
 building_rock_of_garantor_01:0 "$building_type_rock_of_garantor_01$"
 building_rock_of_garantor_01_desc:0 "$building_type_rock_of_garantor_01_desc$"
 building_type_wineyards_01:0 "Vineyards"
 building_type_wineyards_01_desc:1 "The unique climate and soil conditions result in exceptional grape quality, ideal for producing fine wines."
 building_wineyards_01:1 "Small Vineyards"
 building_wineyards_01_desc:2 "Though compact, these vineyards yield grapes of remarkable quality, perfect for crafting exquisite, limited-batch wines."
 building_wineyards_02:1 "Specialised Vineyards"
 building_wineyards_02_desc:1 "Focused on cultivating specific grape varieties, these vineyards produce grapes with enhanced flavor profiles tailored for distinct wine styles."
 building_wineyards_03:1 "Expansive Vineyards"
 building_wineyards_03_desc:1 "A vast expanse of grapevines stretches in orderly rows, designed to produce a large and consistent harvest for wine production."
 building_wineyards_04:1 "Manorial Vineyards"
 building_wineyards_04_desc:2 "Attached to a noble estate, these vineyards are meticulously tended by serfs, with the grapes processed in nearby manorial presses to produce wine for the lord's table and the local market."
 building_wineyards_05:1 "Heritage Vineyards"
 building_wineyards_05_desc:1 "Ancient vines with deep roots thrive here, producing grapes with a distinct terroir, offering wines with rich, complex flavors passed down through generations."
 building_wineyards_06:1 "Grand Vineyards"
 building_wineyards_06_desc:1 "A breathtaking expanse of grapevines as far as the eye can see, carefully maintained for a bountiful harvest."
 building_wineyards_07:1 "Grafted Vines"
 building_wineyards_07_desc:1 "By grafting different grape varieties, the vineyard produces unique blends, enhancing the range and complexity of wines available."
 building_wineyards_08:1 "Royal Vineyards"
 building_wineyards_08_desc:1 "These prestigious vineyards are owned or protected by the crown, producing the finest wines reserved for royal banquets and diplomatic gifts, with each vine tended to with utmost care."
 wineyard_effect_desc:0 "#I Higher chance to acquire better quality wines.#!"
 ck_wedding_bonus_effect_desc:0 "#weak This will lead to an increased [dynasty_prestige_i] [dynasty_prestige|E] gain and [stress_loss_i] [stress|E] loss.#!"
 ## Lake Rat Hideout ##
 lakerat_holder: "Holder is the leader of the Lake Rats"
 building_type_lake_rat_hideout:0 "Hudenyan Cove"
 building_type_lake_rat_hideout_desc:0 "This natural mountainous cove was formed by the collapse of this side of the volcanic island forever ago. Now, it exists as a hub of pirate activity in Lake Laconis and as the home of the Lake Rats.\n\n$EFFECT_LIST_BULLET$" # #P Lake Rats have special interactions here!#! - Add this back in when interactions are added
 building_lake_rat_hideout:0 "$building_type_lake_rat_hideout$"
 building_lake_rat_hideout_desc:0 "$building_type_lake_rat_hideout_desc$"
 ## Pamphian Palaces ##
 building_type_pamphian_palaces:0 "Palaces of Pamphia"
 building_type_pamphian_palaces_desc:0 "The Palaces of Pamphia were built in 486, as a place to entertain foreign dignitaries from further South, and as a summer palace for reigning Emperors and Governors. They feature a large amount of murals, monuments, and other various artworks. It is said that the jewels in the palaces might stretch all the way back to Lycarion if they were set in a line."
 building_pamphian_palaces:0 "$building_type_pamphian_palaces$"
 building_pamphian_palaces_desc:0 "$building_type_pamphian_palaces_desc$"
 building_pamphian_palaces_ruined:0 "Ruined Palaces of Pamphia"
 building_pamphian_palaces_ruined_desc:0 "The Palaces of Pamphia were sacked in 1070 by Nords, in the early stages of Imperial decline. Its ruins now serve as little more than a quarry for stone and metals. The fine jewels and tapestries, murals and icons of the palaces have all been taken back on longships or burned."
 building_pamphian_palaces_restored:0 "Restored Palaces of Pamphia"
 building_pamphian_palaces_restored_desc:0 "The Palaces of Pamphia, now fully restored, are a shining example of cultural and diplomatic hegemony. New murals and artworks dot the many palaces, who now once more can serve their role as sites of relaxation for any who would come to the island."
 ##Robber Keeps
 building_type_robber_keeps_1:0 "Raejning Keeps"
 building_type_robber_keeps_1_desc:0 "The twin Raejning Keeps, erected by Knudarr Reamaldsson in 1255, are placed at opposite ends of the Lipathos Pass, ensuring that all who pass through must pay a toll to the keeps' ruler. This does little to ingratiate the local populace, who chafe at the lack of free movement across the land. Of course, it does much to enrich the local ruler's treasury."
 building_robber_keeps_1:0 "$building_type_robber_keeps_1$"
 building_robber_keeps_1_desc:0 "$building_type_robber_keeps_1_desc$"
 building_robber_keeps_2:0 "Expanded Raejning Keeps"
 building_robber_keeps_2_desc:0 "The Raejning Keeps have been expanded, with great walls and lookout towers allowing for a tighter control of the pass. The local populace has come to somewhat accept the towers. Many still chaff at the toll and even go as far as to risk a journey along the northern coast. However, tales of sea raiders, Nordic bandits seizing the goods and skulls of those traveling north, often frighten travelers who would rather pay the toll than risk their life."
 # Geroian Mountain Citadel #
 building_type_geroian_citadel_ruined: "$building_geroian_citadel_good$"
 building_type_geroian_citadel_ruined_desc: ""This old structure was built to defend the mountain pass from Thonian raiders in ages past, long before the arrival of the Calradians. It has since been destroyed and rebuilt over the centuries. This great citadel also serves as a training ground for the Warrior Bishops of Geroia. With its walls intact and garrisoned to the gills with warriors, no army can stand to pass through this mountain pass without significant losses."
 building_geroian_citadel_ruined: "Great Citadel of Geroia: Ruined"
 building_geroian_citadel_ruined_desc: "This old structure was built to defend the mountain pass from Thonian raiders in ages past, long before the arrival of the Calradians. It has since been destroyed and rebuilt over the centuries, and currently it stands in ruins. This great citadel also serves as a training ground for the Warrior Monks of Geroia, but with it in ruins, how will they train?"
 building_geroian_citadel_good: "Great Citadel of Geroia"
 building_geroian_citadel_good_desc: "The Great Citadel of Geroia stands again! Foes may crumble its walls but the Geroians will rebuild them every time! With its walls repaired and garrisoned to the gills with warriors, no army can stand to pass through this mountain pass without significant losses."
 # Prýtanikka/Prytanikka #
 building_type_prytanikka: "Prýtanikka"
 building_type_prytanikka_desc: "In the old empire, Prýtanikkas served as seats of the magistrates, subordinate to the local governors of the province, they represented the ability to collect tax on the administrations behalf. After the fall of the empire, the offices, many swelled to the size of palaces, remain as prestigious and influential seats of power for local bourgeoisie."
 building_prytanikka: "Prýtanikka"
 building_prytanikka_desc: "$building_type_prytanikka_desc$"
 # Paravendic Arena #
 building_type_paravendic_arena: "Paravendic Arena"
 building_type_paravendic_arena_desc: "There are many arenas throughout Calradia, but none are as opulent as the Paravendic Arena. Built in the High Imperial period, it served as a constant source of bread and circuses to the people of the Empire. Even centuries later, it still remains as the greatest arena in Calradia."
 building_paravendic_arena: "Paravendic Arena"
 building_paravendic_arena_desc: "$building_type_paravendic_arena_desc$"
 # Gundar's Landing #
 building_type_gundars_landing: "Gundar's Landing"
 building_type_gundars_landing_desc: "When Gundar sailed south and broke the sea raiders, earning the loyalty of the locals, he sailed on many great ships. These ships were later broken down into timber, a sign of his willingness to tie his fate with that of Sturgia.\n\nThis timber was used to construct the foundations of what would come to be known as Gundar's Landing, a vast port network, well suited to both trade and the defense of Balgard."
 building_gundars_landing: "Gundar's Landing"
 building_gundars_landing_desc: "$building_type_gundars_landing_desc$"
 # Vaktulisija #
 building_type_vaktulisija: "Vaktulisija"
 building_type_vaktulisija_desc: "The Vaktulisija is a grove of trees said to be descendants of the World Tree. It is incredibly ancient, having been maintained since time immemorial, with grove tenders often living in complete isolation from the rest of society, dedicating their entire lives to pruning and caring for the great trees. When the tree is threatened, these same peaceful grove tenders take up arms to fight with a ferocity unmatched amongst the realms of Calradia."
 building_vaktulisija: "Vaktulisija"
 building_vaktulisija_desc: "$building_type_vaktulisija_desc$"
 # Tomchul #
 building_type_tomchul: "Tomchul"
 building_type_tomchul_desc: "Long ago, the Gods fought as men do. It is not known who the victor was, but the Tomchul remains as a sign of their heavenly battle on earth. A great meteor, it is said to have been struck off of Kuar by Tenger when Kuar took to the skies.\n\nNowdays, prospectors will occasionally come here to search for priceless gems."
 building_tomchul: "Tomchul"
 building_tomchul_desc: "$building_type_tomchul_desc$"
 # Mouth of the Nahasa #
 building_type_mouth_of_nahasa: "Mouth of the Nahasa"
 building_type_mouth_of_nahasa_desc: "A settlement at the mouth of the Nahasa is well positioned to take advantage of trade going further south, as well as trade coming north."
 building_mouth_of_nahasa: "Mouth of the Nahasa"
 building_mouth_of_nahasa_desc: "$building_type_mouth_of_nahasa_desc$"
 # Abarchazghal
 building_type_abarchazghal: "$b_abarchazghal$"
 building_type_abarchazghal_desc: "This great crater on the Amanzuri Peninsula serves as a rich source of priceless gems, but it is also a holy site for [GetReligionByKey('west_nahasan_religion').GetAdherentName] pilgrims.\n\nAccording to legend, the crater was formed by a falling star which was said to have been $acham_evil_god_name$ when he was cast down by the god, Urzor."
 building_abarchazghal: "$building_type_abarchazghal$"
 building_abarchazghal_desc: "$building_type_abarchazghal_desc$"
 # Kaalranid's Citadel
 building_type_kaalranid: "Kaalranid's Citadel"
 building_type_kaalranid_desc: "The purported site of Kaalranid's first landing before leaving the Tekreans behind to continue his voyage northwards.\n\nToday, this area has grown into a significant fortress, the envy of the region. From its high walls, many Tekrean Reges have looked down upon the legacy of their forebearers, only for history to sweep them away in war time and time again"
 building_kaalranid: "$building_type_kaalranid$"
 building_kaalranid_desc: "$building_type_kaalranid_desc$"
 # Teerimaa, the Mysterious Statue
 building_type_teerimaa: "Teerimaa"
 building_type_teerimaa_desc: "Nestled high up in the hills of the Kwadre Valley is a man of stone standing alone at a height of a hundred feet.\n\nNot even the locals know the story of how the monolithic statue got into the mountains, or who put it there, but some locals have taken to calling it Teerimaa, meaning friend, and occasionally leave offerings in hopes of prosperity and good harvest.\n\nIn the centuries since, locals have added stone companions to the once lone man of stone."
 building_teerimaa: "$building_type_teerimaa$"
 building_teerimaa_desc: "$building_type_teerimaa_desc$"
 # Katakiel Gem Mines
 building_type_katakiel: "Katakiel Gem Mines"
 building_type_katakiel_desc: "Deep in the Pakala Mountains of the West Nahasa lies a series of labyrinthine mines full of rare and unique gems found only in this part of the world. Such a rarity has been the cause of many conflicts as rulers attempt to assume control of these mines for the wealth they are believed to inherently contain.\n\nWho knows if the current lord of these mines can actually hold onto them or not."
 building_katakiel: "$building_type_katakiel$"
 building_katakiel_desc: "$building_type_katakiel_desc$"
 building_katakiel_02: "$building_type_katakiel$"
 building_katakiel_02_desc: "$building_type_katakiel_desc$"
 ## GENERIC SALT MINES
 building_type_salt_mines: "Salt Mines"
 building_type_salt_mines_desc: "This region offers an abundance of salt, ripe for harvesting, whether from salt flats or mines. Such a commodity is bound to improve the prosperity of the local province."
 building_salt_mines_01: "$building_type_salt_mines$"
 building_salt_mines_01_desc: "$building_type_salt_mines_desc$"
 building_salt_mines_02: "$building_type_salt_mines$"
 building_salt_mines_02_desc: "$building_type_salt_mines_desc$"
 building_salt_mines_03: "$building_type_salt_mines$"
 building_salt_mines_03_desc: "$building_type_salt_mines_desc$"
 building_salt_mines_04: "$building_type_salt_mines$"
 building_salt_mines_04_desc: "$building_type_salt_mines_desc$"
 # Iron Mines of Lope
 building_type_lope_mines: "Iron Mines of Lópè"
 building_type_lope_mines_desc: "Lópè is home to one of the largest iron mines in the entire Nahasa and has been the greatest boon to civilization in the Esuyan Valley.\n\nThe local Orukani and Arikoyi have stripped the iron from these mines for generations, and used the utility of the iron to forge great weapons and armor, making them a near-unrivaled power in the Western Nahasa, if not for their incessant infighting"
 building_lope_mines: "$building_type_lope_mines$"
 building_lope_mines_desc: "$building_type_lope_mines_desc$"
 building_lope_mines_02: "$building_type_lope_mines$"
 building_lope_mines_02_desc: "$building_type_lope_mines_desc$"
 building_lope_mines_03: "$building_type_lope_mines$"
 building_lope_mines_03_desc: "$building_type_lope_mines_desc$"
 # Waters of Olokun
 building_type_olokun: "Waters of Olokun"
 building_type_olokun_desc: "Olokun, being the òrìṣà who rules the water and seas, is said to have first departed for the deep blue from this river delta. Families from all over come here to give birth to their children, where it is said the sacred waters provide comfort and healing to the mothers who have had to endure months of laborious pregnancy."
 building_olokun: "$building_type_olokun$"
 building_olokun_desc: "$building_type_olokun_desc$"
 # Port of Okun Iba
 building_type_okun_iba: "Port of Òkun Ìbà"
 building_type_okun_iba_desc: "The great harbor sitting in Ìbíhìn ferries ships from across the entirety of the West Nahasa and acts as a central trading hub to the unknowable southlands. In addition to the iron mines to the north, this harbor also provides an extraordinary boost to the power and wealth of whoever controls it."
 building_okun_iba: "$building_type_okun_iba$"
 building_okun_iba_desc: "$building_type_okun_iba_desc$"
 # Indurar N'Hatif
 building_type_indurar: "Indurar N'Hatif"
 building_type_indurar_desc: "Idurar n'Hatif, "the Mountain of Voices," serves as a bedrock holy site for the Zunzari faithful. Inside its great edifice, etched out of the mountainside, lies great chambers dedicated to worship with an inner sanctum dedicated to the prior incarnations of the Mahdi. Those who have little respect of the local faith whisper of great treasures lying inside these cavernous walls."
 building_indurar: "$building_type_indurar$"
 building_indurar_desc: "$building_type_indurar_desc$"
 # al-Ifrit
 building_type_al_ifrit: "Al-Ifrit"
 building_type_al_ifrit_desc: "Al-Ifrit looms above the West Nahasa like a mythological titan. From its peak, smoke bellows out and spreads across the east, helping to fertilize soil far and wide.\n\nThe volcano has erupted only once in recorded history, and the destruction from that eruption was felt as far as the city of Ortysia, itself a new Calradian city at the time. Locals worship the volcano as a bringer of life, for in their eyes, the soul is sent through the earth and returned to the world through the volcanic ash."
 building_al_ifrit: "$building_type_al_ifrit$"
 building_al_ifrit_desc: "$building_type_al_ifrit_desc$"
 # Mount Agadir
 building_type_mt_agadir: "Mount Agadir"
 building_type_mt_agadir_desc: "Once a mighty and active volcano dwarfing al-Ifrit, this monstrous volcano has lain extinct long since before recorded history.\n\nNow, its slopes are mined for sharp obsidian and other sorts of metals. With no threat of eruption or lava flows, many children attempt to summit the mountain and lay down small flags to mark how far they get."
 building_mt_agadir: "$building_type_mt_agadir$"
 building_mt_agadir_desc: "$building_type_mt_agadir_desc$"
