 building_type_lake_rat_hideout_desc:0 "This natural mountainous cove was formed by the collapse of this side of the volcanic island forever ago. Now, it exists as a hub of pirate activity in Lake Laconis and as the home of the Lake Rats.\n\n$EFFECT_LIST_BULLET$" # #P Lake Rats have special interactions here!#! - Add this back in when interactions are added
