 ## Pamphian Palaces ##
 building_type_pamphian_palaces:0 "Palaces of Pamphia"
 building_type_pamphian_palaces_desc:0 "The Palaces of Pamphia were built in 486, as a place to entertain foreign dignitaries from further South, and as a summer palace for reigning Emperors and Governors. They feature a large amount of murals, monuments, and other various artworks. It is said that the jewels in the palaces might stretch all the way back to Lycarion if they were set in a line."
 building_pamphian_palaces:0 "$building_type_pamphian_palaces$"
 building_pamphian_palaces_desc:0 "$building_type_pamphian_palaces_desc$"
 building_pamphian_palaces_ruined:0 "Ruined Palaces of Pamphia"
 building_pamphian_palaces_ruined_desc:0 "The Palaces of Pamphia were sacked in 1070 by Nords, in the early stages of Imperial decline. Its ruins now serve as little more than a quarry for stone and metals. The fine jewels and tapestries, murals and icons of the palaces have all been taken back on longships or burned."
 building_pamphian_palaces_restored:0 "Restored Palaces of Pamphia"
 building_pamphian_palaces_restored_desc:0 "The Palaces of Pamphia, now fully restored, are a shining example of cultural and diplomatic hegemony. New murals and artworks dot the many palaces, who now once more can serve their role as sites of relaxation for any who would come to the island."
 ##Robber Keeps
 building_type_robber_keeps_1:0 "Raejning Keeps"
 building_type_robber_keeps_1_desc:0 "The twin Raejning Keeps, erected by Knudarr Reamaldsson in 1255, are placed at opposite ends of the Lipathos Pass, ensuring that all who pass through must pay a toll to the keeps' ruler. This does little to ingratiate the local populace, who chafe at the lack of free movement across the land. Of course, it does much to enrich the local ruler's treasury."
 building_robber_keeps_1:0 "$building_type_robber_keeps_1$"
 building_robber_keeps_1_desc:0 "$building_type_robber_keeps_1_desc$"
 building_robber_keeps_2:0 "Expanded Raejning Keeps"
 building_robber_keeps_2_desc:0 "The Raejning Keeps have been expanded, with great walls and lookout towers allowing for a tighter control of the pass. The local populace has come to somewhat accept the towers. Many still chaff at the toll and even go as far as to risk a journey along the northern coast. However, tales of sea raiders, Nordic bandits seizing the goods and skulls of those traveling north, often frighten travelers who would rather pay the toll than risk their life."
 # Geroian Mountain Citadel #
 building_type_geroian_citadel_ruined: "$building_geroian_citadel_good$"
 building_type_geroian_citadel_ruined_desc: ""This old structure was built to defend the mountain pass from Thonian raiders in ages past, long before the arrival of the Calradians. It has since been destroyed and rebuilt over the centuries. This great citadel also serves as a training ground for the Warrior Bishops of Geroia. With its walls intact and garrisoned to the gills with warriors, no army can stand to pass through this mountain pass without significant losses."
 building_geroian_citadel_ruined: "Great Citadel of Geroia: Ruined"
 building_geroian_citadel_ruined_desc: "This old structure was built to defend the mountain pass from Thonian raiders in ages past, long before the arrival of the Calradians. It has since been destroyed and rebuilt over the centuries, and currently it stands in ruins. This great citadel also serves as a training ground for the Warrior Monks of Geroia, but with it in ruins, how will they train?"
 building_geroian_citadel_good: "Great Citadel of Geroia"
 building_geroian_citadel_good_desc: "The Great Citadel of Geroia stands again! Foes may crumble its walls but the Geroians will rebuild them every time! With its walls repaired and garrisoned to the gills with warriors, no army can stand to pass through this mountain pass without significant losses."
 # Prýtanikka/Prytanikka #
 building_type_prytanikka: "Prýtanikka"
 building_type_prytanikka_desc: "In the old empire, Prýtanikkas served as seats of the magistrates, subordinate to the local governors of the province, they represented the ability to collect tax on the administrations behalf. After the fall of the empire, the offices, many swelled to the size of palaces, remain as prestigious and influential seats of power for local bourgeoisie."
 building_prytanikka: "Prýtanikka"
 building_prytanikka_desc: "In the old empire, Prýtanikkas served as seats of the magistrates, subordinate to the local governors of the province, they represented the ability to collect tax on the administrations behalf. After the fall of the empire, the offices, many swelled to the size of palaces, remain as prestigious and influential seats of power for local bourgeoisie."
 # Paravendic Arena #
 building_type_paravendic_arena: "Paravendic Arena"
 building_type_paravendic_arena_desc: "There are many arenas throughout Calradia, but none are as opulent as the Paravendic Arena. Built in the High Imperial period, it served as a constant source of bread and circuses to the people of the Empire. Even centuries later, it still remains as the greatest arena in Calradia."
 building_paravendic_arena: "Paravendic Arena"
 building_paravendic_arena_desc: "There are many arenas throughout Calradia, but none are as opulent as the Paravendic Arena. Built in the High Imperial period, it served as a constant source of bread and circuses to the people of the Empire. Even centuries later, it still remains as the greatest arena in Calradia."
 # Gundar's Landing #
 building_type_gundars_landing: "Gundar's Landing"
 building_type_gundars_landing_desc: "When Gundar sailed south and broke the sea raiders, earning the loyalty of the locals, he sailed on many great ships. These ships were later broken down into timber, a sing of his willingness to tie his fate with that of Sturgia. This timber was used to construct the foundations of what would come to be known as Gundar's Landing, a vast port network, well suited to both trade and the defense of Balgard."
 building_gundars_landing: "Gundar's Landing"
 building_gundars_landing_desc: "When Gundar sailed south and broke the sea raiders, earning the loyalty of the locals, he sailed on many great ships. These ships were later broken down into timber, a sing of his willingness to tie his fate with that of Sturgia. This timber was used to construct the foundations of what would come to be known as Gundar's Landing, a vast port network, well suited to both trade and the defense of Balgard."
 # Vaktulisija #
 building_type_vaktulisija: "Vaktulisija"
 building_type_vaktulisija_desc: "The Vaktulisija is a grove of trees said to be descendants of the World Tree. It is incredibly ancient, having been maintained since time immemorial, with grove tenders often living in complete isolation from the rest of society, dedicating their entire lives to pruning and caring for the great trees. When the tree is threatened, these same peaceful grove tenders take up arms to fight with a ferocity unmatched amongst the realms of Calradia."
