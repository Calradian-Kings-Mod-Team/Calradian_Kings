 # Tomchul #
 building_type_tomchul: "Tomchul"
 building_type_tomchul_desc: "Long ago, the Gods fought as men do. It is not known who the victor was, but the Tomchul remains as a sign of their heavenly battle on earth. A great meteor, it is said to have been struck off of Kuar by Tenger when Kuar took to the skies."
