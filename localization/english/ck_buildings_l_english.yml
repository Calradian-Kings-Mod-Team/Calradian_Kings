 # Mouth of the Nahasa #
 building_type_mouth_of_nahasa: "Mouth of the Nahasa"
 building_type_mouth_of_nahasa_desc: "A settlement at the mouth of the Nahasa is well positioned to take advantage of trade going further south, as well as trade coming north."
