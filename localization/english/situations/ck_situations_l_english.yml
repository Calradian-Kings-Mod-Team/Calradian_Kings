 ## Volcano Situation
 situation_ck_volcano_situation: "The Tyrant of Fire"
 ck_volcano_situation_participant_group_affected_rulers_realm: "Affected Rulers (Realm)"
 ck_volcano_situation_participant_group_affected_rulers_realm_desc: "All [rulers|E] with part of their realm affected by the spread of ash and the subsequent consequences of that."
 ck_volcano_situation_participant_group_affected_rulers_capital: "Affected Rulers (Capital)"
 ck_volcano_situation_participant_group_affected_rulers_capital_desc: "All [rulers|E] with part of their realm affected by the spread of ash and the subsequent consequences of that."
 ck_volcano_situation_participant_group_iderfani_islanders: "Iderfani Islanders"
 ck_volcano_situation_participant_group_iderfani_islanders_desc: "All [rulers|E] with [realms|E] and [capitals|E] on the [GetGeographicalRegion('region_volcano_iderfani').GetName], with Ghilizi being the home of the great volcano itself."
 ck_volcano_situation_participant_group_traveller: "Traveller"
 ck_volcano_situation_participant_group_traveller_desc: "An [adventurer|E] travelling through parts of the world directly affected by the great volcano, [al_ifrit|E]."

 ck_volcano_situation_all_rulers: "#weak (Affected Rulers)#!"
 ck_volcano_situation_affected_rulers: "#weak (All Realms)#!"
 ck_volcano_situation_phase_active_flows: "Active Flows"
 ck_volcano_situation_phase_active_flows_desc: "Al-Ifrit is alive and well. Magma rises from the earth and spills out from crevices along the sides of the great mountain. Although locals know how to avoid such dangerous flows, unwary travelers must be mindful of their steps."
 ## Phases
 # Flows
 phase_active_flows: "$ck_volcano_situation_phase_active_flows$"
 phase_active_flows_desc: "$ck_volcano_situation_phase_active_flows_desc$"
 game_concept_ck_volcano_situation_phase_active_flows: "$phase_active_flows$"
 game_concept_ck_volcano_situation_phase_active_flows_desc: "$ck_volcano_situation_phase_active_flows_desc$"
 # Warning
 ck_volcano_situation_phase_volcano_warning: "$phase_volcano_warning$"
 ck_volcano_situation_phase_volcano_warning_desc: "$phase_volcano_warning_desc$"
 phase_volcano_warning: "@warning_icon! #X Warning!#!"
 phase_volcano_warning_desc: "Something is stirring beneath the mountainous surface of the great volcano. Great tremors act as harbingers to something terrible to come soon. For those residing on the island who do not flee or seek shelter, only death may await."
 game_concept_ck_volcano_situation_phase_volcano_warning: "$phase_volcano_warning$"
 game_concept_ck_volcano_situation_phase_volcano_warning_desc: "$phase_volcano_warning_desc$"
 # Minor Eruption
 ck_volcano_situation_phase_minor_eruption: "$phase_minor_eruption$"
 ck_volcano_situation_phase_minor_eruption_desc: "$phase_minor_eruption_desc$"
 phase_minor_eruption: "Minor Eruption"
 phase_minor_eruption_desc: "Ash and fire spew in great quantities from the bowels of the earth beneath. Settlements on the island that were prepared for this eruption have managed to only barely weather this catastrophic punishment from Heaven."
 game_concept_ck_volcano_situation_phase_volcano_warning: "$phase_minor_eruption$"
 game_concept_ck_volcano_situation_phase_volcano_warning_desc: "$phase_minor_eruption_desc$"
 # Major Eruption
 ck_volcano_situation_phase_major_eruption: "$phase_major_eruption$"
 ck_volcano_situation_phase_major_eruption_desc: "$phase_major_eruption_desc$"
 phase_major_eruption: "#X Major Eruption#!"
 phase_major_eruption_desc: "The sky darkens as once white clouds have become replaced with ash violently spewing from the bowels of the earth. Where there were once settlements on the island now lie ash. The bodies of those unfortunate to have been caught in the pyroclastic cloud are nothing now but a haunting spectre of gray reaching towards salvation. Waves reachings dozens of feet tall slam into nearby coastlines, causing widespread flooding and disaster. Soon, the rest of the world will experience a true dark age as the ash clouds choke out the very light from Heaven."
 game_concept_ck_volcano_situation_phase_major_eruption: "$phase_minor_eruption$"
 game_concept_ck_volcano_situation_phase_major_eruption_desc: "$phase_minor_eruption_desc$"
 # Heavy Clouds
 ck_volcano_situation_phase_major_ash_clouds: "$phase_major_ash_clouds$"
 ck_volcano_situation_phase_major_ash_clouds_desc: "$phase_major_ash_clouds_desc$"
 phase_major_ash_clouds: "#bold Heavy Ash Clouds#!"
 phase_major_ash_clouds_desc: "The sky darkens as once white clouds have become replaced with ash violently spewing from the bowels of the earth. Across all affected regions, the darkening skies cause temperatures to plummet, crops to fail, and disease to run rampant. Until these clouds subside, there will be no respite for anyone caught under the obsidian skies."
 game_concept_ck_volcano_situation_major_ash_clouds: "$phase_major_ash_clouds$"
 game_concept_ck_volcano_situation_major_ash_clouds_desc: "$phase_major_ash_clouds_desc$"
 # Light Clouds
 ck_volcano_situation_phase_minor_ash_clouds: "$phase_minor_ash_clouds$"
 ck_volcano_situation_phase_minor_ash_clouds_desc: "$phase_minor_ash_clouds_desc$"
 phase_minor_ash_clouds: "Light Ash Clouds"
 phase_minor_ash_clouds_desc: "The skies turn from blue to gray as ash from a recent volcanic eruption spreads eastwards. Those caught under its tyrannical shadow suffer from lower temperatures and food shortages, but it could not get any worse... right?"
 game_concept_ck_volcano_situation_minor_ash_clouds: "$phase_minor_ash_clouds$"
 game_concept_ck_volcano_situation_minor_ash_clouds_desc: "$phase_minor_ash_clouds_desc$"
 # Inactive
 ck_volcano_situation_phase_inactive: "$phase_inactive$"
 ck_volcano_situation_phase_inactive_desc: "$phase_inactive_desc$"
 phase_inactive: "Inactive"
 phase_inactive_desc: "The volcano sits, unmoving and unbothered, with no signs of activity. Even the lava that once ran down its mountain sides has seemed to have ceased and disappeared. All is calm."
 game_concept_ck_volcano_situation_phase_inactive: "$phase_inactive$"
 game_concept_ck_volcano_situation_phase_inactive_desc: "$phase_inactive_desc$"
 # Extinct
 ck_volcano_situation_phase_extinct: "$phase_extinct$"
 ck_volcano_situation_phase_extinct_desc: "$phase_extinct_desc$"
 phase_extinct: "Extinct"
 phase_extinct_desc: "The volcano, nothing more than a scenic mountain now, sits unbothered and dead. While the Zamazigh people may lament the death of their holy volcano, it can no longer harm the world of the living."
 game_concept_ck_volcano_situation_phase_extinct: "$phase_extinct$"
 game_concept_ck_volcano_situation_phase_extinct_desc: "$phase_extinct_desc$"

