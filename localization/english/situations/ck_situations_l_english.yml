 ## Cycle Histories
 cycle_history_key_rise_of_shen: "The lands of the former Nine Warring States are united by the warlord, Shén Dàzhàn, who brought the various states under a strong imperial dynasty lasting for six centuries"
 cycle_history_key_fall_of_shen: "After centuries of rule, the Shén dynasty falls apart after repeated rebellions and internal strife from successive inept emperors with the last Shén Emperor burning himself and his entire court alive in a great fire"
 cycle_history_key_rise_of_the_min: "The states were reunified by a triumphant Mín dynasty whose Emperor came from humble beginnings as a rice farmer"
 cycle_history_key_conquest_of_min: "The revanchistic Asibhrut dynasty from Makhana in the south went on a spree of conquest northwards into Mín lands and supplanted the Emperor who then fled north"
 cycle_history_key_return_of_the_min: "After successive defeats from local rebellions, the Ashibruts are driven by south by the Mín emperor at the head of a great army"
 cycle_history_key_yellow_turban_rebellion_ck: "Discontent masses, inspired by revolutionary Daoist prophecy, rise up against the Mín dynasty, leading to decades of internal strife"
 cycle_history_key_five_kingdoms_period: "With the forced abdication of the last Mín emperor, the land is partitioned between the five kingdoms of Xuan, Lie, Hou, Qing, and Rui"
 cycle_history_key_rise_of_the_lie: "The Five Kingdoms period is brought to an end when the Xuan warlord is killed in battle and the emperor is forced to abdicate, resulting in the establishment of the Lie dynasty"
 cycle_history_key_war_of_the_princes: "The uncles of the young ineffectual Lie emperor vie over control of the emperor, resulting in wars that rattle the imperial house"
 cycle_history_key_fall_of_lie: "The establishment of a breakaway kingdom, in Yushu in the west, disrupted vital trade during turbulent natural disasters, laying the groundwork for the disintegration of the east into numerous states"
 cycle_history_key_east_west: "The chaos of the period gradually gives way to the more consolidated Western and Eastern Dynasties, though reunification remains a dream"
 cycle_history_key_east_unstable: "In the aftermath of the death of great Emperor Anshi of Eastern Xiong, his mother-in-law, Fei Kun seizes court power and establishes the Tian dynasty"
 cycle_history_key_decline_of_tian: "Costly infrastructure projects and untimely natural disasters bring the Tian dynasty to its knees; the Empress is murdered and the imperial regent ascends as the first emperor of the Zhan dynasty"
 cycle_history_key_zhuge_rebellion: "General Zhuge Huai leads an unsuccessful rebellion against the Zhan, with catastrophic consequences for millions"
 cycle_history_key_collapse_of_zhan: "The murder of the final Zhan emperor marks the end of the dynasty, with more than a dozen warlords competing for recognition as its successor"
 cycle_history_key_rise_of_the_dian: "A brilliant general unites the warring kingdoms and ushers in a new era of peace and prosperity as the founder of the Dian dynasty"
 cycle_history_key_sack_of_beizhou: "The Dian dynasty suffers a major defeat when the imperial capital is raided by the $goryeo_ck$ Ryu dynasty, the emperor himself taken prisoner"