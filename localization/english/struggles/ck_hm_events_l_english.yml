 # Event to Choose Title #
 ck_heaven_struggle.1000.t: "Restoration of the Ecumenical Patriarchate"
 ck_heaven_struggle.1000.desc: "Though the land my Patriarch may reside on is not that of holy soil, I can only hope his presence amongst us will help to consecrate the earth with Heaven's divine grace. With that being said, I have the opportunity to reform the Ecumenical Patriarchate and settle it in one of my own ducal lands."
 ck_heaven_struggle.1000.a: "Give [ck_hm_1000_option_A.GetNameNoTier] to the Ecumenical Patriarchate"
 ck_heaven_struggle.1000.b: "Give [ck_hm_1000_option_B.GetNameNoTier] to the Ecumenical Patriarchate"
 ck_heaven_struggle.1000.c: "Give [ck_hm_1000_option_C.GetNameNoTier] to the Ecumenical Patriarchate"
 ck_heaven_struggle.1000.d: "I will rethink on this."
 ck_heaven_struggle.1000.d.tt: "#help You can return to this decision later#!"
 ck_heaven_struggle.1000.d.tt.2: "#help You have no spare duchies. Consider creating one#!"
 ck_heaven_struggle.1002.t: "The Ecumenical Patriarchate Restored"
 ck_heaven_struggle.1002.desc.restorer: "Since Lycaron fell to the barbaric armies of Jagutai, the Ecumenical Patriarchate of Calradia has stood without a sacred seat, and Heaven without a voice upon this earth. Without that unifying authority, our venerable religion fractured into rival sects and faiths, each lifting its own claim to Heaven’s Mandate.\n\nToday, that silence ends! I have restored the Patriarchate in [ck_chosen_patriarchate.GetNameNoTier], and from this sacred seat, Heaven shall speak again. With its voice restored, Calradia draws nearer to the restoration of the greatest empire this world has ever seen!"
 ck_heaven_struggle.1002.desc.mandatist: "Since Lycaron fell to the barbaric armies of Jagutai, the Ecumenical Patriarchate of Calradia has stood without a sacred seat, and Heaven without a voice to guide the faithful. In those long years, our venerable religion was left fractured among rival sects and faiths, each claiming its own vision of Heaven's Mandate.\n\nToday, that silence is broken! [ck_patriarch_ruler.GetFullName] has restored the Patriarchate in [ck_chosen_patriarchate.GetNameNoTier], and Heaven’s voice rings out once more. The faithful rejoice, Calradia stands renewed, and the dream of empire lives again!"
 ck_heaven_struggle.1002.desc.kholraydan: "When Lycaron yielded to the armies of great Giankoutai, he burned the profane idols of the Patriarchate and drove its Patriarch from the city in his bedclothes. Yet now another Patriarch comes crawling back, clothed in silk and crowned by the same old lies.\n\nBy restoring that accursed seat, [ck_patriarch_ruler.GetFullName] spits upon us faithful [ROOT.Char.GetFaith.GetAdherentNamePlural]!"
 ck_heaven_struggle.1002.desc.other_calradic: "When Jagutai drove the old Ecumenical Patriarchate of Calradia from the halls of Lycaron, the unity once maintained by that venerable church began to fracture. Since then, our religion has splintered into rival sects and faiths, each holding to its own interpretation of Heaven's Mandate.\n\nNow, with [ck_patriarch_ruler.GetFullNamePossessive] restoration of the Patriarchate in [ck_chosen_patriarchate.GetNameNoTier], the Calradic Church may yet have a chance to bind those divided traditions beneath one sacred authority. Whether it can do so remains to be seen."
 ck_heaven_struggle.1002.desc.everyone_else: "The fall of Lycaron did more than humble the old Calradian Church. It broke the voice that once bound emperors, priests, and soldiers beneath the promise of Heaven’s Mandate. In the years since, the Calradian faiths have quarreled among themselves, and their divisions have often kept their ambitions turned inward.\n\nNow [ck_patriarch_ruler.GetFullName] has restored the Patriarchate in [ck_chosen_patriarchate.GetNameNoTier], giving the Calradians a symbol around which many may gather once again. Whether this brings peace to their lands or renewed war beyond their borders, neighboring peoples much like myself would be wise to take notice."
 ck_heaven_struggle.1002.a.1: "#bold Ave!#!"
 ck_heaven_struggle.1002.a.2: "#bold Damn them!#!"
 ck_heaven_struggle.1002.a.3: "#bold Interesting times ahead.#!"
 ck_heaven_struggle.1002.a.4: "#bold Concerning...#!"
 ck_additional_requirement_ce: "You finished one requirement to take the [GetDecisionWithKey('wb_restore_calradian_empire_decision').GetName] [decision|E]"
 # Restore the Calradian Empire
 restore_calradian_empire_wb_decision_effect_tooltip: "The Calradian Empire will be restored and acquire the [de_jure|E] of all currently held Empires."
 ck_heaven_struggle.1003.a.tt: "You gain access to the [pax_calradica_invasion_casus_belli|E]"
 game_concept_pax_calradica_invasion_casus_belli: "Pax Calradica Casus Belli"
 game_concept_pax_calradica_invasion_casus_belli_desc: "A powerful [casus_belli|E] available only to the [ruler|E] of the Calradian Empire for the purpose of inaugurating a new era of [Glossary( 'Pax Calradica', 'PAX_CALRADICA_GLOSS' )] or restoring lost Imperial lands.\n\nIt can target an entire [kingdom|E] [title|E] at once, and allows for rapid expansion across large swathes of land."
 PAX_CALRADICA_GLOSS: "The #bold Pax Calradica#! — an old Calradic phrase meaning "The Calradian Peace" — has been historically used to describe the period of "peace" inaugurated by Catomenys' victory at the [Glossary( 'Battle of Ortysia', 'BATTLE_OF_ORTYSIA_GLOSS' )]. This phrase does not refer to an absence of war, but rather means that all Calradia's foes were subdued."
 BATTLE_OF_ORTYSIA_GLOSS: "The Battle of Ortysia was a decisive naval battle fought in the Bay of Ortysia. Catomenys' fleet, commanded by Spurius Neretzes, defeated the combined forces of the rebellious Calradian general Iantys Renatos, securing Catomenys' uncontested rule as Emperor of the new Calradian Empire. The victory also marked the rise of the Neretzes family, which would later become one of the most influential families in Calradian politics."
 ck_heaven_struggle.1003.t: "Calradia Reborn"
 ck_heaven_struggle.1003.desc: "It is an auspicious day, for today Calradia witnesses the return of its glorious empire.\n\nFrom every corner of the continent can shouts of jubilation and pride be heard: #EMP Hail the Emperor! Hail the Princeps!#!\n\nBut I must now steer the sails of this vast enterprise. What will we make of my empire? Among my many predecessors and the myriad incarnations of Calradian power, the choice narrows.\n\nShall we continue on, true to our recent culture? Or shall we fully embrace the administrative goals of our forebearers?"
 ck_heaven_struggle.1004.t: "The Second Coming of Calradia"
 ck_heaven_struggle.1004.desc: "One of the last remaining claimants to the legacy of Calradios, the Calradian Empire, has somehow managed to reclaim enough lost territory to declare the Calradian Empire restored!"
 ck_heaven_struggle.1004.patriarch: "Having restored the Ecumenical Patriarch of Calradia, the crowning was a solemn affirmation of divine right, blessed by [scoped_emperor.GetFaith.GetReligiousHead.GetTitledFirstName] [scoped_emperor.GetFaith.GetReligiousHead.GetHerselfHimself]. The spiritual roots of the empire run deep, intertwining faith closely with imperial ambition.\n\n"
 ck_heaven_struggle.1003.a: "I am content with our current government."
 ck_heaven_struggle.1003.b: "For our ambitions, administrative is best."
 ck_heaven_struggle.1003.b.flavor: "Restore the Calradian Empire with [administrative|E] as its [government|E]"
 ck_heaven_struggle.1004.intro: "A great declaration has been made from the imperial seat of [scoped_emperor.GetCapitalLocation.GetBaronyNameExplicitly] by the hand of [scoped_emperor.GetName]. Far-flung lands once belonging to the old Calradian Empire are unified anew by the [scoped_emperor.GetCulture.GetCollectiveNoun], with ambitions as grand as the Emperors of old.\n\n"
 
 #### STRUGGLE ENDINGS:
 ### SUPREMACY
 ck_heaven_struggle.1005.t: "$end_the_struggle_supremacy$"
 ck_heaven_struggle.1005.opening.calradian: "The Calradian Empire is restored by its rightful stewards, the Calradians! We stood at the edge of extinction, yet fought like hell to reclaim our heavenly empire.\n\nLet history remember that, no matter the cost, we Calradians are the true rulers of this continent!\n\n"
 ck_heaven_struggle.1005.opening.borteq: "The age of the old Calradian emperors is finished! With their once-glorious empire restored beneath my rule, our riders will storm the west and ensure this empire endures for all eternity!\n\n"
 ck_heaven_struggle.1005.opening.esvulgeste: "Though the less learned may call us Calradian, the truth is that we are only their descendants, and hold little reverence for that inheritance.\n\nYet though we have become a people of our own, our legacy and claim to the old Calradian Empire have not been forgotten. With renewed vigor and courage, we shall take up the mantle that so many Calradians before us once bore!\n\n"
 ck_heaven_struggle.1005.opening: "The Calradians had their time, a thousand years to rule, and still they squandered their empire on petty bickering and foolish traditions.\n\nUnder my rule, this empire shall endure for two thousand years! Nay, for ten thousand!\n\n"
 ck_heaven_struggle.1005.desc: "There is now no other realm that can truly contest our dominance of Calradia, or the priests and settlers who bring the word of [ROOT.Char.GetFaith.HighGodName] and civilization to its cities.\n\nAll that remains is to declare this victory, having decided how to proceed with our rule."
 ck_heaven_struggle.1005.faith_speed_tt: "$task_conversion$ [councillor_task|E] speed in [GetGeographicalRegion('ck_wb_imperial_boundaries').GetName] [region|E]: #P +50%#!"
 ck_heaven_struggle.1005.culture_speed_tt: "$task_promote_culture$ [councillor_task|E] speed in [GetGeographicalRegion('ck_wb_imperial_boundaries').GetName] [region|E]: #P +50%#!"
 ck_heaven_struggle.1005.a:0 "This shall be a land of [ROOT.Char.GetFaith.HighGodName]!"
 ck_heaven_struggle.1005.b:0 "The establishment of a Calradian identity will be our focus."
 ck_heaven_struggle.1005.c:1 "[ROOT.Char.GetFaith.HighGodName] has given Calradia to the [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]!"
 ck_struggle_supremacy_acceptance_tt: "Cultural Clashes"
 ck_heaven_struggle.1006.t: "$end_the_struggle_supremacy$"
 ck_heaven_struggle.1006.opening: "With the Calradian Empire and its hegemony restored, the future of the continent is beginning to look uncertain as the days go on..."
 ck_heaven_struggle.1006.desc: "\n\n[struggle_ender.GetName] holds the imperial throne now, proclaiming that all of Calradia will be reunited under the rule of its eagles, and that the age of strife plaguing eastern Calradia is over.\n\n"
 ck_heaven_struggle.1006.closing.faith: "[struggle_ender.GetSheHe|U] has proclaimed that this reason for celebration is thanks to [struggle_ender.GetFaith.HighGodName], and that all heretics and nonbelievers repent their falsehoods before the Empire."
 ck_heaven_struggle.1006.closing.culture: "[struggle_ender.GetSheHe|U] has proclaimed that Calradia belongs to the [struggle_ender.GetCulture.GetHeritage.GetNameNoTooltip] and only them, and that all foreigners in the lands of the Calradians should accept this reality."
 ck_heaven_struggle.1006.closing.combined: "[struggle_ender.GetSheHe|U] has proclaimed that Calradia and the [struggle_ender.GetCulture.GetHeritage.GetNameNoTooltip] to be one in the same, as stewards of [struggle_ender.GetFaith.HighGoHighGodNamePossessivedName] will on this world"
 ck_heaven_struggle.1006.a: "This is far from over."
 ck_heaven_struggle.1006.b: "Concerning"
 ### COMPROMISE
 ck_heaven_struggle.1007.t: "$struggle_iberia_ending_conciliation_decision$"
 ck_heaven_struggle.1007.opening.calradian: "For so long, Calradia has suffered war after war without its rightful stewards. Today, the decision for the continent's destiny is back in our hands."
 ck_heaven_struggle.1007.opening.esvulgeste: "Though the less learned may call us Calradian, the truth is that we are only their descendants, and hold little reverence for that inheritance.\n\nYet though we have become a people of our own, our legacy and claim to the old Calradian Empire have not been forgotten.\n\nWith renewed vigor and courage, we begin a new chapter in Calradia's history."
 ck_heaven_struggle.1007.opening.borteq: "Centuries ago, our ancestors would have never dreamed of where they children would be today. From the eastern steppes of Tanaesia to the blue waters of the Calradic Sea, our people have firmly established ourselves as stewards of this land."
 ck_heaven_struggle.1007.opening: "\n\nA sworn guarantee of protection, which only I am now in a position to enforce, will ensure the diverse peoples of the region may live and worship freely.\n\n[ROOT.Char.GetFaith.HighGodName] willing, the wars of the past will remain there, and the other rulers will see the benefits of co-existence."
 TRUCE_CK_HM_COMPROMISE:0 "Compromise in Calradia"
 ck_heaven_struggle.1008.opening: "Word of recent developments in Eastern Calradia has reached our court, promising an end to the conflicts that have plagued the region."
 ck_heaven_struggle.1008.desc:0 "\n\n[struggle_ender.GetPrimaryTitle.GetAdjectiveNoTooltip] heralds have proclaimed guarantees of free passage and worship for all, enforced by [struggle_ender.GetTitledFirstName], to the wide acclamation of the common people.\n\nMany have longed for an end to the bloodshed in Eastern Calradia; perhaps #EMP this#! peace will be a lasting one."
 ### CHAOS
 ck_heaven_struggle.1009.t: "The End of a Dream"
 ck_heaven_struggle.1009.opening.calradian: "It is time we accept the inevitable. For even we, as once proud stewards of this land, must go forth into the future knowing there will be no future for a unified Calradia."
 ck_heaven_struggle.1009.opening.esvulgeste: "Today a dream comes to an abrupt end. While the idea of a united Calradia is a part of our own legacy, it is time for us to begin writing a new chapter. "
 ck_heaven_struggle.1009.opening.borteq: "When Urkhun stormed west, he could never have imagined his heirs having destroyed the Calradian Empire fully and utterly."
 ck_heaven_struggle.1009.opening: "\n\nCalradia firmly lies broken and shattered. Among the vestiges of the once great empire, new kingdoms arise from humble beginnings as a new period of conflict begins. While the struggle that defined our lands for decades has ended, these same lands are about to see conflict unlike anything they have before. Without any hope of a new hegemonic empire to unite the continent, and without common cause to unify the various realms, chaos will reign.\n\nThe dreams of dead ambitious men will haunt the living no longer."
 ck_heaven_struggle.1010.desc: "\n\n[struggle_ender.GetName] is said to have stood upon an old Calradian plinth and proclaimed that the dream of restoring the Calradian Empire has come to an end. With Eastern Calradia still trapped in the cycle of violence that has long consumed it, [struggle_ender.GetName] declares that any ruler who dares claim the mantle of Emperor would be illegitimate. The disparate realms now seem too entrenched, too divided, and too bloodied to be united beneath a single throne.
 ck_heaven_struggle.1010.a: "We will not forget the dream of Calradia..."
 ck_hm_struggle_chaos_cb_tt: "$CONQUEST_DUCHY_CB_NAME$ [casus_bellis|E] against other [struggle_involved|E] [rulers|E]: #positive_value -50%#!"
 ck_heaven_struggle.1010.faith_speed_tt: "$task_conversion$ and/or $task_promote_culture$ [councillor_tasks|E] speed in [GetGeographicalRegion('ck_wb_imperial_boundaries').GetName] [region|E]: #N -50%#!"
 ck_hm_struggle_chaos_culture_conversion_task_desc: "$hm_struggle_chaos_involved_house_reward_modifier$"