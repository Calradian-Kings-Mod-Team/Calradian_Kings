 form_imperial_province_ck_title: "Form Imperial Province"
 form_imperial_province_ck_desc: "As my restored Calradian Empire expands, it needs governors and proconsuls to form the bureaucratic backbone of the Empire. Without them, the masses of low patricians and plebians alike look directly to me whenever something goes awry in their lives.\n\nThough these new [ce_provinces|E] may not be the exact model of the late empire centuries ago, they are at least a step forward in the right direction."
 form_imperial_province_ck_tooltip: "When you sufficiently hold enough land within a [ce_province|E], you can form it and then grant the new [title|E] as an appointment."
