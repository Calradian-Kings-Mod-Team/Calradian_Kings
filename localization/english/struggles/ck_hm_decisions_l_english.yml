 hm_struggle_conciliation_join_war_tt: "Permanently allows [struggle_involved|E] [culture|E] and [faith|E] [rulers|E] to join each other's defensive [wars|E] against outside invaders of the [GetGeographicalRegion('ck_wb_imperial_boundaries').GetName] borders"
