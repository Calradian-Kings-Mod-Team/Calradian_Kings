 end_the_struggle_chaos: "End the Dream of Calradia"
 end_the_struggle_chaos_desc: "For too long, realms once greater than mine have reached for the mantle of an empire long gone. Again and again they cast their people into war, dreaming that Calradia might rise beneath their banners. Now those powers lie in ash and ruin and so too do their ambitions. With no great realm left standing but mine, it falls to me to end that dream here and now.\n\nNo more Emperors. No more tyrants!"
 end_the_struggle_chaos_confirm: "The Dream ends today!"
 end_the_struggle_chaos_tooltip: "Effectively end all aspirations to reform the Calradian Empire"
