 ## Rekindle Fire - Darshi decision
 kindle_royal_fire_decision_desc_darshi: "It was custom among the Darshi kings of old to assume a new name at their coronation, and kindle a royal fire which would burn as long as their reigns would last. I, too, could have such a fire, to have its holy light bless me and my rule."

 ## Embrace Tenger faith ##
 embrace_tenger_decision: "Embrace $khuzait_faith$"
 embrace_tenger_decision_desc: "The blue sky beckons me — the great steppe lies beneath its endless expanse, and [GetFaithByKey('khuzait_faith').HighGodName] [GetFaithByKey('khuzait_faith').HighGodHerselfHimself] calls my name on the wind. Once more, my people and I must embrace the ways of our ancestors."
 embrace_tenger_decision_tooltip: "Convert yourself and your [yurt|E] to either the [GetFaithByKey('khuzait_faith').GetAdjective] [faith|E] or [GetFaithByKey('arkits_faith').GetAdjective] [faith|E]"
 embrace_tenger_decision_confirm: "As [GetFaithByKey('khuzait_faith').CreatorName] made it, so it shall be."
 not_of_a_steppe_faith_tt_ck: "You are already following a [GetFaithByKey('khuzait_faith').GetReligion.GetAdjective] [faith|E]"

 # Found Vaegir Guard #
 found_vaegir_guard_decision: "Found the Vaegir Guard"
 found_vaegir_guard_decision_desc: "For years, warriors from the remotest lands in the North have collected in the Calradian Empire, attracted by our riches. They offer their services as mercenaries, an art at which they excel, and have no loyalties except those to coin and their own pride. If we could organize their presence around the Emperor, we would get an invincible military force at our personal service!"
 found_vaegir_guard_decision_tooltip: "$found_vaegir_guard_decision$"
 found_vaegir_guard_decision_confirm: "Start recruiting"
