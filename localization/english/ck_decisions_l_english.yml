 ### Geroian Decisions ###
 # Unify the Thonians
 form_thonian_kingdom_decision:0 "Unify the Thonians"
 form_thonian_kingdom_decision_tooltip:0 "Form the Kingdom of Thlos"
 form_thonian_kingdom_decision_desc:0 "Since our expulsion from the mainland to Geroia by the Calradians centuries ago, we've maintained steady relations with our neighbors to the south. It has been made clear that if we intend to survive any further encroachments by the Imperials, we must be united. Let the Geroians bicker amongst themselves; this is not their war to fight. Under my holy rule, I shall unite all Thonians under one kingdom to reclaim our lost heritage and throw the Calradians from the land they once stole from us!"
 form_thonian_kingdom_decision_confirm:0 "The King of Thonians!"
 thlos_holds_at_least_two_duchies_tt:0 "Holds at least two [Concept('duchy','Duchy Titles')|E]"
 owns_half_thonian_lands_tt:0 "Owns 50% of the Thonian lands"
 you_will_unify_thonians.tt:0 "You will unify the Thonians under your rule"
 thlos_de_jure_changes_tt:0 "#V [GetTitleByKey('k_thlos').GetName]#! becomes [Concept('de_jure','De Jure')|E] liege of [GetTitleByKey('d_kefalida').GetName], [GetTitleByKey('d_modeia').GetName], [GetTitleByKey('d_imiaugia').GetName] and [GetTitleByKey('d_koszanos').GetName]"
 # Creation of Geroia
 geroia_creation_text: "Geroians and Thonians can only create Geroia by a decision"
 form_geroia_decision:0 "Form Kingdom of Geroia"
 form_geroia_decision_tooltip:0 "Form the Kingdom of Geroia"
 form_geroia_decision_desc:0 "For centuries, the counts and dukes of Geroia have bickered and fought over the measliest of scraps. While they continue to peddle in their feuds, I, however, understand the need for our people to be united now more than ever. With the world around us growing small, it is only by sheer necessity that Geroia be the biggest fish in the proverbial Perassic. With Geroia united under my rule, none would dare stand against her and her numerous galleys!"
 form_geroia_decision_confirm:0 "Long Live Geroia!"
 owns_half_geroia_proper_lands_tt:0 "Owns 60% of [geroia_proper|E]"
 no_foreigners_geroia_proper_tt:0 "No county in [geroia_proper|E] is occupied by foreigners"
 you_will_create_geroia.tt:0 "You will become the ruler of Geroia"

