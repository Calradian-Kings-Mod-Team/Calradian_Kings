 # Declare Rhodok War #
 rhodok_declare_war: "Declare a War of Independence"
 rhodok_declare_war_desc: "The Swadian yolk has ran down our necks for far too long! It is time that we fight back against the encroachment of the nobility and take back our destiny! With our council meetings concluded, we can finally go about the war we have dreamt about for so long."
