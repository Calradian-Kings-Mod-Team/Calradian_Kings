l_english:
 game_concept_calradiancivilwar:0 "Calradian Civil War"
 game_concept_civil_war_ck:0 "Civil War"
 game_concept_calradiancivilwar_desc:0 "The Calradian Civil War occurred a few months following the death of the late emperor, Arenicos. Although Arenicos was able to stabilize the Calradian Empire following the Battle of Pendraic, the underlying societal issues still existed. Many of these issues were exacerbated by many of Arenicos' choices, whether intentional or not.\n\nOne of these issues pertained to the rise of a people's cult who began to worship Arenicos as a divine savior. This may have had the consequence of enraging the aristocrats and senators. Another issue was the establishment of a royal bodyguard which used an imperial militia to fill its ranks.\n\nWhatever grievances or reasons led to this war, the assassination of Arenicos was the nail in the coffin for the Calradian Empire."
 game_concept_majorevents:0 "Major Events"
 game_concept_majorevents_desc:0 "A compendium of major events in Calradian history."
 ## Troop Game Concepts ##
 game_concept_shock_troops:0 "Shock Troops"
 game_concept_shock_infantry:0 "$shock_infantry$"
 game_concept_shock_troops_desc:0 "Shock troops are [men_at_arms|E] who can vary between lightly armed to heavily armed, and they are immensely skilled at charging enemy lines to inflict enormous loss.\n\nWhile shock troops can inflict these losses, they are still susceptible to fire by [archers|E] and [skirmish_cavalry|E]."
 game_concept_skirmish_cavalry:0 "Skirmish Cavalry"
 game_concept_mounted_skirmishers:0 "$mounted_skirmisher$"
 game_concept_skirmish_cavalry_desc:0 "Skirmish cavalry are [men_at_arms|E] who are uniquely suited to harrassment followed by immediate withdrawl, in order to maximize exhaustion for an enemy force.\n\nWhile each kind of skirmish cavalry may be unique, they are still generally countered by more heavily armed [heavy_cavalry|E], [archers|E], and [light_cavalry|E]."

game_concept_knight_druzhinnik: "$knight_druzhinnik_no_tooltip$"
game_concept_knight_druzhinnik_desc: "$innovation_druzhina_ck_desc$. [GetMaA('sturgian_heavy_cavalry').GetName] will often scorn to dismount indoors."

game_concept_knight_oathsworn: "$knight_oathsworn_no_tooltip$"
game_concept_knight_oathsworn_desc: "$battanian_heavy_infantry_flavor$. [GetMaA('battanian_heavy_infantry').GetName] that fail to hold a line are considered Oath-breakers."

game_concept_knight_hero: "$knight_hero_no_tooltip$"
game_concept_knight_hero_desc: "$tenet_mystical_birthright_balion_desc$. Together with their retinue, [GetMaA('gottic_heavy_cavalry').GetName] swear to vanquish all evils."

game_concept_knight_banner: "$knight_banner_no_tooltip$"
game_concept_knight_banner_desc: "$tradition_vlandian_banneret_desc$. If promoted, they can be found on the battlefield as [GetMaA('vlandian_heavy_cavalry_2').GetName]"

game_concept_knight_kheshig: "$knight_kheshig_no_tooltip$"
game_concept_knight_kheshig_desc: "$CK_KHESHIG_GLOSS$. They are split into the Day and Night guards, alternating between [GetMaA('khuzait_horse_archers_2').GetName] and [GetMaA('khergit_horse_archers_2').GetName]."

game_concept_knight_byalic: "$knight_byalic_no_tooltip$"
game_concept_knight_byalic_desc: "Those chosen by the $northern_gods_old$ due to their feats of strength are usually the first off a boat and the last to die."

 ## Vanilla Conversions ##
 # Varangian References
 game_concept_varangian_adventure_ck:0 "Vaegir Adventure"
 game_concept_varangian_adventures_ck:0 "Vaegir Adventures"
 game_concept_varangian_adventuring_ck:0 "Adventuring"
 game_concept_varangian_adventure_adventure_ck:0 "Adventure"
 game_concept_varangian_adventure_ck_desc:0 "This is a special type of [war|E], where the attacker intends to move their [realm|E] to the [war_target|E] wholesale.\n\nIf they win, they will immediately annex the appropriate [counties|E] and move their [capital|E] there. Their old vassals will go independent, and their old $game_concept_counties$ will be given to upstart local warlords. $game_concept_varangian_adventures_ck$ are #EMP ONLY#! available to [duke|E] and $game_concept_count$-[title_tier|E] [rulers|E], becoming progressively more expensive with each successful $game_concept_varangian_adventure_adventure_ck$.\n\nThis [casus_belli|E] is #EMP NEVER#! available after the $culture_era_tribal$ [era|E], and cannot be used against other [cultures|E] that can $game_concept_varangian_adventure_adventure_ck$ or against neighboring $game_concept_rulers$.\n\nNords, or Sturgians, launching their first $game_concept_varangian_adventure_ck$ receive up to [EmptyScope.ScriptValue('varangian_adventurers_standard_levy_cap_value')|0] bonus [special_troops|E], the amount going up with every same-[faith|E] same-[culture|E] county they completely control within [GetGeographicalRegion('region_longships').GetName]."
