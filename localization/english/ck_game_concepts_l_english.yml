 ## LAAMP-related Concepts ##
 game_concept_lake_rat_good: "Lake Rat Loot"
 game_concept_lake_rat_good_desc: "Lake Rat [adventurers|E] can accept [task_contracts|El] from the 'Rat King' in [GetTitleByKey('c_hudeyna').GetNameNoTier]. These contracts require Lake Rats to haunt the coast and lure in ships to plunder.\n\nThe loot plundered from these ships can then be sold at the Lake Rat hideout in [GetTitleByKey('c_hudeyna').GetNameNoTier], if it is under the control of the 'Rat King'."
 game_concept_goods: "Goods"

 ## Damar River Situation ##
 game_concept_damar_situation: "The Damar River"
 game_concept_damar_situation_desc: "$game_concept_damar_situation$ represents the powerful nature of the Damar River and the occasional, destructive flooding that can occur along its banks, and it is divided into three regions: North, Central, and South\n\nThe different [region_seasons|E] can adversely or postively affect life along the Damar River. These seasons provide opportunities and special actions only available during that time, and modifying the [county_modifiers|E] and [character_modifiers|E] of each person in the region.\n\nAll [governments|E] and [rulers|E] take part in this [situation|E] so long as they reside in this region."
 game_concept_region_season: "Season"
 game_concept_region_season_desc: "A $game_concept_region_season$ represents the current climate of a given [situation|E], and the effects it has on [county_fertility|E] as well as [county_modifiers|E] and [character_modifiers|E] of rulers, whether nomadic, landed, or landless.\n\nOn occasion, the same season may occur in more than one [situation_sub_region|E] at a time."
 game_concept_region_seasons: "Seasons"
 game_concept_region_seasons_desc: "$game_concept_region_season_desc$"

 game_concept_al_ifrit: "Al-Ifrit"
 game_concept_al_ifrit_desc: "$game_concept_al_ifrit$ represents the powerful natural force of the Al-Ifrit volcano off the coast of the West Nahasa. A relatively active volcano, it will go through several [ifrit_plural|E] whether it be the volcano going inactive, active with flows, or erupting. All effects stemming from the volcano's Phase will spread outwards from the volcano itself to neighboring realms, and possibly even the far east depending on the severity of the eruption."
 game_concept_region_ifrit: "Phase"
 game_concept_region_ifrit_desc: "A $game_concept_region_ifrit$ represents the current situation the volcano, Al-Ifrit, is in, whether it is dormant, active, or erupting. Each phase has a different effect on [county_fertility|E], [travel_safety|E], [travel_speed|E], and [development|E].\n\nAll Phases start from the volcano and spread outwards depending on the phase itself."
 game_concept_region_ifrit_plural: "Phases"
 game_concept_region_ifrit_plural: "$game_concept_region_ifrit_desc$"

 game_concept_ck_laws: "Realm Laws"
 game_concept_ck_law: "Law"
 game_concept_ck_laws_desc: "#L Realm Laws#! are [laws|E] that a ruler can pass that will have an overarching effect on their [realm|El]. [vassals|E] cannot pass most realm laws that would overwrite their own liege's laws.\n\nHowever, vassals can pass their own unique laws separate from their liege's as #L Subrealm Laws#!.\n\nExamples of Realm Laws:\n$BULLET_WITH_TAB$#L [Glossary('$game_concept_ck_slavery|q$', 'game_concept_ck_slavery_desc')]#!\n$BULLET_WITH_TAB$#L [Glossary('$game_concept_ck_religious_tolerance|q$','game_concept_ck_religious_tolerance_desc')]#!\n\nExamples of Subrealm Laws:"
 game_concept_ck_slavery: "Slavery"
 game_concept_ck_slavery_desc: "An ancient institution, slavery exists in different forms across varied [cultures|E].\n\nThe most notable example of contemporary slavery are the [GetCultureByKey('geroian').GetName] slaves. Recruited from ransom brokers across Calradia, they are forced to row galley ships for their new masters for a measly stipend."
 game_concept_ck_religious_tolerance: "Religious Tolerance"
 game_concept_ck_religious_tolerance_desc: "Many faiths and their denominations exist all across Calradia, from the sun-kissed lands of the far southwest savannas to the snow-choked forests of Anburia in the north of the steppes. In every place in the known world, people practice their faiths.\n\nWhether in private or public is up to the rulers who govern over these practitioners. Religious tolerance could help a realm become more stable than one with less tolerance. But, those who have the means, power, and zealousness will always try to snuff out the "heathens" in their lands."
 
 ## Regions ##
 game_concept_geroia_proper:0 "Geroia Proper"
 game_concept_geroia_proper_desc:1 "[GetGeographicalRegion('region_geroia').GetName] Proper encompasses the south-eastern portion of the island from [SelectLocalization(GetPlayer.IsValid, GetTitleByKey('c_portusi').GetNameNoTier, '$b_portusi|q$')] to [SelectLocalization(GetPlayer.IsValid, GetTitleByKey('c_ventod').GetNameNoTier, '$b_ventod|q$')]."
  
 ### Struggles ###
 ## Heaven's Mandate
 game_concept_heavens_mandate_struggle: "Struggle for Heaven's Mandate"
 game_concept_heavens_mandate_struggle_desc: "The $game_concept_heavens_mandate_struggle$ depicts a moment in Calradian history where the last vestiges of the Calradian Empire fight for hegemony of former imperial lands. The $perasoi_collective_noun$ and $kholradyan_collective_noun$ in particular have ambitions to restore the long dead Calradian Empire.\n\nThe [struggle|E] shifts between [struggle_phase_phases|E] depending on the whims of the most powerful [struggle_involved|E] [characters|E]. However, even the smallest realm within a [struggle_region|E] can still rise to the top and form their own empire, should they choose to do so."
 game_concept_heavens_mandate_struggle_border_raid: "$game_concept_border_raid$"
 game_concept_heavens_mandate_struggle_border_raids: "$game_concept_border_raids$"
 game_concept_heavens_mandate_struggle_border_raid_desc: "This is a special type of [war|E] available between [struggle_involved|E] [rulers|E] of the [struggle|E] for Heaven's Mandate where the attacker aims to [siege|E] a specific enemy [county|E] bordering their [realm|E].\n\nThe [war_leader|E] gains [gold|E] for capturing the [war_target|E], which will lose [development|E] and [control|E]. [buildings|E] may also be destroyed, yielding more [gold|E], the chance increasing with [development|E] and [siege|E] [army|E] size.\n\n[war_score|E] will be gained rapidly by the attacker upon [occupying|E] the [war_target|E]."
 game_concept_ck_struggle_chaos: "Chaos Phase"
 game_concept_ck_struggle_chaos_desc: "Tensions flare and war is let loose upon the land.\n\nRepeated acts of sabotage, breaking of treaties, assassinations, collapsing realms, or outright warfare has devolved this [situation|E] into a state of constant hostilities where even those thought of allies once are now considered enemies.\n\nSuch bloodshed couldn't possibly last forever, and this [struggle_phase|E] can only be brought to an end by those with the courage and tenacity to do so."
 game_concept_ck_struggle_tension: "Tension Phase"
 game_concept_ck_struggle_tension_desc: "While war may not be a worry of most commoners during this [struggle_phase|El], those in positions of power, however, are susceptible to the plotting and machinations of others.\n\nAlthough not as openly violent as the [ck_struggle_chaos|E], this phase in particular is no less important. Without war, those with ambitions of power work to grab it from within the shadows where plots and assassinations are commonplace."
 game_concept_ck_struggle_armistice: "Armistice Phase"
 game_concept_ck_struggle_armistice_desc: "A period of declared peace and cessation of hostilities following the [ck_struggle_chaos|E], all [struggle_involved|E] [characters|E] make it a point to ensure peace is upheld while the realms rebuild from the destruction.\n\nAlthough there is peace throughout the [struggle|E], the peace is precarious at best and those with nefarious ambitions can undercut the fragile peace for their own benefit. However, should a more diplomatic ruler decide a lasting peace is best, there is a possibility of all sides putting aside their hostilties for a common good."
 game_concept_ck_struggle_compromise: "Compromise Phase"
 game_concept_ck_struggle_compromise_desc: "When level-headed rulers come together during times of tension or peace, there is a growing possibility of a long-lasting peace among the [struggle_involved|E] [characters|E].\n\nWhile not everyone may abide by the peace, the largest realms in the [struggle|E] work hard to create bridges between each other, whether through ties between faith or culture. There is a chance though that this peace will not last, and if the dominoes start falling then this [struggle_phase|El] can come to an abrupt and violent end."
 game_concept_ck_struggle_supremacy: "Supremacy Phase"
 game_concept_ck_struggle_supremacy_desc: "When an [struggle_involved|E] [character|E] reforms the Calradian Empire and stands above all others with few to no peers, they hold supremacy over the [struggle|E]\n\nHowever, the Empire's authority is tenuous and the work that went into reforming this empire could come undone easily. Should someone desire to claim Heaven's Mandate, they must be prepared for the inevitable revolts and wars to come.\n\nIf this [struggle_phase|E] ends before the [struggle_ending_decision|E], [GetDecisionWithKey('end_the_struggle_supremacy').GetName], is taken, the Calradian Empire will collapse."
 game_concept_calradian_reclamation: "Calradian Reclamation"
 game_concept_calradian_reclamating: "Calradian Reclaiming"
 game_concept_calradian_reclamations: "Calradian Reclamations"
 game_concept_calradian_reclamation_desc: "This is a special type of [war|E] available to [struggle_involved|E] [rulers|E] of the [heavens_mandate_struggle|E].\n\nThe attacker aims to conquer a [duchy|E] which contains any [struggle_involved|E] [counties|E] held by an [struggle_interloper|E] or [struggle_uninvolved|E] [ruler|E], or [vassalize|E] them if they hold no land outside that Duchy."
 game_concept_ce_province: "Imperial Province"
 game_concept_ce_provinces: "Imperial Provinces"
 game_concept_ce_province_desc: "Provinces are a unique [empire|E] [title_tier|E] [title|E] under an [administrative|E] Calradian Empire, itself a [hegemony|E] tier [title|E]. They provide the Emperor the means to delegate rule across their vast empire which in turn ensures local [revolts|E] are the problems of their respective [governors|E].\n\nHowever, [governors|E] enjoy a significant amount of influence not only in the court of the Emperor but also in the [council|E] and Senate. These [governors|E] cannot be appointed from the family of the Emperor themself.\n\nFormed with the [GetDecisionWithKey('form_imperial_province_ck').GetName] [decision|E]."