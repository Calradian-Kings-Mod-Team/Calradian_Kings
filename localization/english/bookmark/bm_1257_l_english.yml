l_english:

 bm_group_1257:0 "1257"
 bm_1257:0 "Warband"
 bm_1257_desc:0 "The Calradic Empire is long gone. In its death arose a myriad of new kingdoms all laying a claim to a dead empire.\n\nIn a new world free of imperial hegemony, there exists a newfound sense of freedom for many. However, war always looms in the distance."


 ### Warband
 ## 1257 Main Factions
 # Swadia
 main_swadians: "King Harlaus"
 main_swadians_desc: "Pejoratively known as the "Butter Lord", King Harlaus of the Swadians enjoys frequent feasting, festivities, and tournaments. The stubborn and arrogant king thinks of his knights as an invincible force that can hold back the Nordic horde to his north, the heretical Vaegirs to his east, and the rebellious Rhodoks to his south.\n\nHowever, such arrogance has led to the fall of numerous realms in the past and Swadia will not be any different. The lords of the realm, seeing this behavior, either still back the decadent king or whisper secrets of treachery that perhaps Isolla, daughter of the late King Esterich, would be a better choice. \n\n#bold As King Harlaus, will you ride forth under the lion banner of Swadia to hold back, and perhaps even push back your enemies, or will your extravagance prove to be the ultimate cause of your downfall?#!"
 main_swadians_subheading: "King of the Swadians"
 # Rhodoks
 main_rhodoks: "King Graveth"
 main_rhodoks_desc: "If Grunwalder would see what the Rhodoks turned out to be after the rebellion, he would be ashamed of many of the things he fought for. When the Count of Culmarr used his strategic positioning to levy taxes on caravans, he used that wealth to then press himself into the kingship and henceforth all Rhodok rulers were known as kings. While the elective process remains as it did at the conclusion of the rebellion, the rivarly between King Graveth and Lord Kastor is another case for the historians to work out.\n\nRight now, Graveth must work out the constant border raids from his southern border with the Sarranids and the lands lost to the Swadians recently.\n\n#bold As Graveth, can you secure land lost, punish the Sarranids, and press forward into a new dawn for Calradia, with a succession system much like the late Empire?#!"
 main_rhodoks_subheading: "King of the Rhodoks"
 # Sarranids
 main_sarranids: "Sultan Hakim"
 main_sarranids_desc: "The Sarranid Sultanate is the last vestige of real Aserai hegemony in the south. Whilst the Mukhtarid and Damarid Sultanates in the far south bicker, and more petty Emirs lie between them and the Sarranids, Sultan Hakim holds onto ambitions to his north.\n\nFor Hakim, the dream of a reunited Calradia under his rule as Khalīfah is primarily what drove him to oust Arwa "the Pearled One", the adopted daughter of the last Sultan. That and a deep seated misogyny perhaps developed by his neglectful mother as a child.\n\nSultan Hakim has consolidated his forces, strategically placed Emirs into positions of power, and stands ready to press the advantage.\n\n#bold However, as Hakim, will you reach too far too soon or will Calradia come to know a new age with you as its Khalīfah?#!"
 main_sarranids_subheading: "Sultan of the Sarranids"
 # Khergits
 main_khergits: "Sanjar Khan"
 main_khergits_desc: "When Janakir Khan told his two sons that the lands of the Khergits, upon his death, would be split between the two, Sanjar and Dustum, Sanjar took it upon himself to take it all. Many in the Khergits saw this as a betrayal of tradition, but many others saw it as a prudent move in a time of real uncertainty in the future.\n\n With a Khanate and its Noyans united behind him, the settled nomads of the Khergits look to the westward horizon for new raids and conquest.\n\n#bold As Sanjar Khan, will your reign prove to be a long and decisive one full of victories, or will your treachery come back at you in the form of your half-brother, Dustum?#!"
 main_khergits_subheading: "Khan of the Khergits"
 # Vaegirs
 main_vaegirs: "King Yaroglek"
 main_vaegirs_desc: "Yaroglek rules over the stubborn boyars of the Vaegirs from his palace in Reyvadin, once known as Epicrotea in the Calradic tongue.\n\nYears ago when his uncle, King Kurzak, died, Yaroglek's father declared the son of Kurzak a bastard and his widowed wife an adulterer. For three decades, that bastardized son, Valdym, has wandered Calradia among the safety of those loyal to his late father. Soon after that usurpation, King Burelek died as perhaps holy retribution in the eyes of many and Yaroglek became king.\n\nA stubborn man, Yaroglek sympathizes with Valdym's plight but is unwilling to let go the kingship for fear of the instability it would bring to the Vaegir kingdom.\n\n#bold As Yaroglek, you will be facing challenges not only from the Nords and Khergits, but you must also contend with the possibility of your cousin, Valdym, gaining the support of some wayward adventurer.\nWill you succeed in this endeavors, or will the Vaegirs practically disappear just as the Sturgians before them have?#!"
 main_vaegirs_subheading: "King of the Vaegirs"
 # Nords
 main_nords: "King Ragnar"
 main_nords_desc: "Once Thane, now King, Ragnar of the Nords holds in his heart the ancient traditions and beliefs of the warrior spirit of Nords. When the Nords invaded from Nordland in the north, not to be confused with the pretender realm to the east, they swept over Northern Calradia like a great fire. Old cities burned while new ones were erected. Among one of those cities is Sargoth, and from its decorated walls, the King of the Nords sits within planning his next conquest.\n\nWhen the late King Hakrim died years ago, his son became shipwrecked while attempted to return and Ragnar used the uncertainty to take the throne for himself. When the son, Lethwin, finally made it back to Calradia, he found his thane now king upon the throne his father once sat. Ragnar contends that while Lethwin could have made a decent lord in a different realm, the Nords only respect strength and Lethwin as king would have been disaster for the Nordic kingdom.\n\n#bold As Ragnar, will your huscarls set south and raze the ancient cities of Reyvadin and Praven, or will Lethwin press his claim with the backing of some upstart adventurer?#!"
 main_nords_subheading: "King of the Nords"
 
 ## Swadia Bookmark
 bm_1257_swadia: "Kingdom of Swadia"
 bm_1257_swadia_desc: "Before they made landfall centuries ago, the Vlandians were known in their homeland by another name: Swadian. After the landing of Wilund “the Bold,” his followers adopted his Calradian name, Valandion, and came to be known as Vlandians for several centuries, until the end of the 11th century.\n\nTwenty years into the 12th century, upstarts calling themselves the Rhodoks rebelled against Swadian rule. Since then, the Swadians have ruled north of the Trand River, with a recent conquest across the river in Vyincourd a decade ago. While the Swadians may express disgust at Rhodok behavior and rule, their own kingdom suffers from infighting and warmongering nobles eager to seek trouble abroad."
 harlaus_bm: "$main_swadians$"
 harlaus_bm_desc: "main_swadians_desc"
 harlaus_bm_subheading: "$main_swadians_subheading$"

 klargus_bm: "Klargus"
 klargus_bm_desc: "The favored son of Count Beranz dey Suno before his passing, and the younger brother of Haringoth, Klargus styles himself as a holy man—a warrior destined to carry forth Heaven’s and Darusos’ will.\n\nFriends since childhood, Klargus and his fellow vassal Delinard not only spar together but also support each other in warfare. At times, this friendship goes beyond the king’s orders, and Delinard’s aid to Klargus in battles against the crown’s commands causes frustration.\n\n#bold As Klargus, will your friendship with Duke Delinard bring out the best in both of you, or will it become a source of a rift between you and the crown?#!
 klargus_bm_subheading: "Duke of $cn_suno$" #and d_etir

 haringoth_bm: "Haringoth"
 haringoth_bm_desc: "Ruling from the eponymously named Haringoth Castle in Western Swadia, Haringoth fancies himself an architect with desires to create a fortress that would be the envy of the world. Whilst he rules from his castle in the west, his son, Regas, rules over Reindi in the east as part of an award for service from King Harlaus. Meanwhile, his younger brother, Klargus, rules from the city of Suno.\n\n#bold As the bold and arrogant, Haringoth, will your abrasive personality make you few friends in Swadia, or will you instead build walls so high that such criticisms never reach you?#!"
 haringoth_bm_subheading: "Duke of $d_drapand$"

 clais_bm: "Clais"
 clais_bm_desc: "Fancying himself a warrior, Clais—the stewardship-educated ruler of Dhirim—is anything but. His callous and stubborn behavior, both as a man and as a ruler, causes the people of Dhirim to chafe under his rule; yet rather than rise, they endure it, believing it better than the alternative of rule under the Nords or Vaegirs. Meanwhile, a recent conquest by the Swadians across the Trand River, Vyincourd, saw that land given to Clais' family, further dividing his attention.\n\nWhile the Duke plays at being a knight, his three brothers—Delinard, Ryis, and Deglan—rule their respective realms with respect and honor.\n\n#bold As Clais, will your eccentric behavior undo the work your father, the late and respected Duke Meltor, labored towards for decades, or can you hold off the war drums of the Nords and the bardiches of the Vaegirs? Will Dhirim stand?#!"
 clais_bm_subheading: "Duke of $cn_dhirim$" # and d_balasog

 delinard_bm: "Delinard"
 delinard_bm_desc: "Marshal of the realm and the greatest strategist of Swadia, Duke Delinard rules from the old city of Uxkhal, once known as Ocs Hall. The oldest of the “Four Sons,” the sons of the late and influential Duke Meltor dey Uxkhal, Delinard follows his father’s teachings as the son of a marshal himself. While Uxkhal is known as a great trading city for its renowned dyeworks and linen, grain from its farms is sent to Praven to be made into ale.\n\nWith such an important city under his control, Delinard must balance his responsibilities as both marshal and lord to ensure that neither duty is neglected.\n\n#bold As Delinard, can you balance your role as marshal and lord of Uxkhal?#!"
 delinard_bm_subheading: "Duke of $cn_uxhal$" # and d_verecsand

 ryis_bm: "Ryis"
 ryis_bm_desc: "The youngest of the "Four Sons" of the late and influential Duke Meltor dey Uxkhal, Ryis inherited his father’s holdings in the Duchy of Trand, while his brothers hold Uxkhal, Rhennod, and Dhirim. Although Trand is a modest realm, Tevarin Castle stands near the edge of the sea, where trade from Jumne and Balion passes through. While Ryis may feel secure within Tevarin Castle, with its high stone walls and distance from most hostile borders, the Duchy of Trand is not safe from raids by sea raiders.\n\n#bold As Ryis, can you build Tevarin into a great castle, perhaps even a city, or will the constant Nordic-sponsored raids into your lands prove too much?#!"
 ryis_bm_subheading: "Duke of $d_trand$"

isolla_bm: "Lady Isolla"
isolla_bm_title: "#weak Rightful#!" # todo update desc based on game gender rule?
isolla_bm_desc: "The only beloved child of King Esterich and named as [heir|E] - not once, but several times, before the grandest nobles of the land so that none could doubt his intention. \n\nThere is no [GetLawGroup('succession_gender_laws').GetName] that bars a woman from ruling - indeed, Swadians tell tales of warrior queens who ruled in the distant past." #swadian_rebellion_pretender_story_1
isolla_bm_subheading: "$isolla_bm_title$ [Glossary('Queen', 'equal_law_effects')] of the Swadians" #swadian_rebellion_pretender_intro
 ## Rhodok Bookmark
 bm_1257_rhodok: "Kingdom of Rhodoks"
 bm_1257_rhodok_desc: "The Kingdom of Rhodoks came about soon after the turn of the 12th century, when Rhodoks fought a brutal war of independence against the domineering and arrogant Swadians.\n\nSince then, the Rhodoks swore to never bow to any king again, in honor of Grunwalder. However, the Count of Culmarr, in the years following the rebellion, managed to leverage his wealth to become King of the Rhodoks in an election. Henceforth, every elected ruler of the Rhodoks is known to people as 'king.' \n\nToday, the Rhodoks are led by the opportunist and shrewd King Graveth. With Swadians in the north and Sarranids to the south, the kingdom lies beset by enemies with renowned cavalry. However, should the enemy foolishly charge into Rhodok territory, the renowned pikewalls of the Rhodoks will meet their cavalry."
 graveth_bm: "$main_rhodoks$"
 graveth_bm_desc: "$main_rhodoks_desc$"
 graveth_bm_subheading: "$main_rhodoks_subheading$"

 raichs_bm: "Raichs"
 raichs_bm_desc: "Whilst Raich's old brother received Yalen as his share of the inheritance, Raichs himself received the castle of Hongard, its walls riddled with cobwebs. The old castle dates back to before even the Vlandians first made landfall, and its age is showing. Even more, it directly borders the Kingdom of Swadia to the north, a people who only see the Rhodoks as rebellious upstarts. Because of this, Raichs has to deal with numerous border raids from the Swadians while his older brother sits in wealth from his own palace in Yalen.\n\n#bold As Raichs, will you successfully rebuild Hongard and elevate it into a castle to be feared across Calradia, or will you attempt a push south and drive out your brother from Yalen?#!"
 raichs_bm_subheading: "Duke of $d_hongard$"

 talbar_bm: "Talbar"
 talbar_bm_desc: "When Talbar's father, Duke Dragan, died, the eldest son inherited Yalen whilst his younger brother, Raichs, inherited the old, decaying Hongard Castle. In the time since, Talbar has learned the emerging theory of mercantilism and has worked as King Graveth's steward to ensure a steady flow of wealth for the Rhodoks. With ships sailing in all cardinal directions, the Rhodoks seek to export many things, including their revered wine.\n\n#bold As Talbar, will your merchant empire grow to become even larger than the Kingdom of Rhodoks itself, or will you, as someone ahead of his time, switch focus and make expeditions into the unknown?#!"
 talbar_bm_subheading: "Duke of $cn_yalen$"

 gharmall_bm: "Gharmall"
 gharmall_bm_desc: "Gharmall is the oldest living ruler in the Kingdom of the Rhodoks, and he certainly feels it. The ailing Gharmall rules over the Duchy of Weyard, a frontier realm bordering the very capital of the Sarranids, Shariz. One will walk along the border of Weyard, shadowed by Sarranid guards on the other side. If war were to come to the Rhodoks from the south, Weyard would be the first immediate target.\n\n#bold Gharmall is aging and ailing, with only one son to carry on his legacy. Between now and your passing, can you ensure that Jalmiche Castle stands firm against the Sarranids, or will you and your realm fade away under the boot of conquest?#!"
 gharmall_bm_subheading: "Duke of $d_weyard$"

 matheas_bm: "Matheas"
 matheas_bm_desc: "While Jelkala may be the capital of the Rhodok kingdom, Veluca is the kingdom's crown jewel. With its many vineyards and beautiful streets, Veluca is a testament to the ingenuity and wealth of its rulers. Although it's a relatively new city, its position between the Sarranids and Swadians has enabled it to host and sponsor caravans. Through these enterprises and partnerships, what was once a small town in Vlandia grew into a city within two centuries.\n\nNow, the city is ruled by Duke Matheas, who takes less interest in the stewardship of his city and takes more interest in warfare, much to the chagrin of his own vassals.\n\n#bold As Matheas, Veluca calls for your attention with its bickering landlords and unruly peasantry, but you would rather go forth and beat back your enemies on horseback than govern a city.\nWhat will it be?#!"
 matheas_bm_subheading: "Duke of $cn_veluca$"

 laruqen_bm: "Laruqen"
 laruqen_bm_desc: "The Duke of Saren, Laruqen, is a callous, cold man with little in common with his wealthier, older brother, Matheas. Although the two share a common interest in warfare, Laruqen remains jealous of his older brother's inheritance.\n\nThe great city of Veluca belongs to him and no one else—or so he says.\n\n#bold As Laruqen, will your callous and arrogant behavior lead you to lash out against allies, or can you successfully take what is rightfully yours?#!"
 laruqen_bm_subheading: "Duke of $d_saren$"
 ## Khergit Bookmark
 bm_1257_khergit: "Khergit Khanate"
 bm_1257_khergit_desc: "The Khergits, great successors to the Khuzic Invasion two centuries ago, have firmly lodged themselves in the very heart of Western Calradia. The last echo of the Khuzait horde that trampled the steppes in the far east, the Khergit remain relentless in their conquest and search for a homeland.\n\nSanjar Khan took the Khanate of his forefathers by force, forsook his brother, and shook to the very core all established traditions, while also centralizing and strengthening his realm. Dispute as they may, the Khergits are a terrifying foe. Led by the fearsome Sanjar Khan, they aim to crush the west under thunderous hooves to establish a great realm under his banner, from the sandy coasts of Yalen to the rocky crags of Rivacheg."
 sanjar_bm: "$main_khergits$"
 sanjar_bm_desc: "A ruthless pragmatist, Sanjar Khan broke the traditions of his people, and claimed his family's birthright for himself. Opposition did rear its head in the more traditional of his clans, but support from younger clans soon outgrew the dissenters. He moves his gaze over to his western and northern frontiers, land never reached by his forefathers. The sly Sarranid nor the opportunistic Vaegir know not the art of war. He, by his name "Greatest of Khans" is destined to trample their cities and shake their world to its core.\n\n#bold As Sanjar Khan, you are poised to stampede your hordes to the west, and claim the dream that was once Urkhun's. Will you succeed in greating a great empire from the remains of an old one, or will you succumb to forces beyond your own control?#!"
 sanjar_bm_subheading: "$main_khergits_subheading$"
 tonju_bm: "Tonju Noyan"
 tonju_bm_desc: "A proud Bahadur turned Noyan, Tonju Noyan is the military backbone of the Khanate, with his martial prowess and might. Born and raised on the saddle his whole life, Tonju's father instilled in him the disciplines and knowledge of the nomadic heritage passed down from his great-grandfather and namesake, Tonju. Today, the Tonjits, Tonju's clan, rely on their powerful and fierce cavalry trained and saddled by their greatest commanders. Many of his enemies have come to recognize and fear the black banner of the Tonjits.\n\n#bold How will you, as Tonju, act to claim the respect his clan deserves? Will he remain a great soldier or become a Khan in his own right?#!"
 tonju_bm_subheading: "Noyan of $cn_ichamur$"
 belir_bm: "Belir Noyan"
 belir_bm_desc: "Belir, the Crow of Narra, loyalest to the Khan, perched upon the corpse of the once great Jalmarys, is well-disliked across Calradia for his pitiless raids and taxes. As an infamous raider, many believe he raids the independent realms to his south, rather than directly conquer, for the sadistic satisfaction it brings him to plunder them. Although incredibly ruthless, those in his orbit recognize that his unorthodox tactics do yield results. Despite this, his city of Narra has flourished under his governance, with wealth and prosperity, and his influence is second only to the Khan's.\n\n#bold As Belir, will you finish what he started and trample across the corpse of the Calradian Empire, or will you bide your time for more?#!"
 belir_bm_subheading: "Noyan of $cn_narra$"
 kramuk_bm: "Kramuk Noyan"
 kramuk_bm_desc: "Kramuk, the good Noyan holding the vanguard against the Vaegir, is a seasoned warrior, both proud and loyal to the Khanate. Upholding tradition and guiding the clans in many matters, his house is well-known and respected across Calradia. The passing of time, though, has caught up with him as the clouds of war are gathering over Calradia once again. Kramuk, the old wolf, must position his clan to come out on top of these coming conflicts.\n\n#bold Kramuk Noyan has been long respected as voice of reason in the Khanate. But with war looming in the near future, can you, as Kramuk, ensure your family comes out more powerful and influential than before?#!"
 kramuk_bm_subheading: "Noyan of $cn_sungetche$"
 asugan_bm: "Asugan Noyan"
 asugan_bm_desc: "The eastern vanguard of the Khanate and a feared, proud warrior. Asugan Noyan is infamously known to ensure his enemies suffer aplenty before they perish, whether in battle or his dungeons. Through his ruthlessness, he has pacified the locals and any foreigners looking to raid the Khanate, much to the Khan's delight. Cunning and sadistic, Asugan is poised to exploit the weakness of the successor states to the Calradians in the east, and forcefully write his name in history, whether through cunning or blood.\n\n#bold As Asugan, will you lose yourself in your sadistic inhibitions, or can you grow a realm from the shattered realms of the Calradian Empire to your east?#!"
 asugan_bm_subheading: "Noyan of $cn_aruci$"
 ## Sarranid Bookmark
 bm_1257_sarranid: "Sarranid Sultanate"
 bm_1257_sarranid_desc: "The Sarranid Sultanate is a relatively recent arrival in Calradia, emerging in the mid-12th century and marking a significant turning point in the politics of Southwest Calradia. Originally united under the banner of Asera, the Banu Sarran emerged from the collapse of the Aserai Sultanate as an independent power, with the house’s seat of power shifting from Razih to Shariz.\n\nToday, the Sultanate is ruled by Sultan Hakim, who has held power for only thirteen years. Before him, Arwa “the Pearled One,” the adopted daughter of Sultan Ayzar, ruled alongside her husband, Baybak, for years before his untimely death at the hands of the Khergits. Taking advantage of the situation, Hakim overthrew Arwa, proclaimed her a witch, and has ruled the Sultanate ever since."
 hakim_bm: "$main_sarranids$"
 hakim_bm_desc: "$main_sarranids_desc$"
 hakim_bm_subheading: "$main_sarranids_subheading$"

 nuam_wb: "Emir Nuam"
 nuam_wb_desc: "Although the Emir of Caraf appears to be a mean, older man, Nuam is, in fact, a generous, humble, and just ruler. Those who have had the opportunity to know him speak of his caring nature and character, with no ill words about the Emir. Those who seek mediation or advice come to him for guidance and more.\n\n#bold As Nuam, you preach many of the virtues of your faith and extend kindness to those in need.\nWill it secure your position in the Sultanate, or will kindness become your undoing in a Calradia full of strife and hatred?#!"
 nuam_wb_subheading: "Emir of $cn_caraf$"

 dhiyul_wb: "Emir Dhiyul"
 dhiyul_wb_desc: "Many armies fear the white-and-orange sun banner of the Banu Jihanid, led by the strategic and decisive Emir Dhiyul. The Jihanids are a long-storied family, with the founder, Jihan, a general who led a slave revolt on the island of Konios back in the 11th century. Jihan soon returned to the Aserai and sired a family that would later follow the Banu Sarran westwards into the mainland.\n\nToday, Dhiyul is the marshal of the realm, feared and respected across the continent for his brilliant strategies. As a humble and just ruler, he holds the respect, if not reverence, of his people.\n\n#bold As a descendant of the general Jihan, Dhiyul has succeeded his ancestor in name and legend. As Dhiyul, will you lead the Sarranids to greatness, or is it time for a Jihanid Sultanate to come into being?#!"
 dhiyul_wb_subheading: "Emir of $cn_sharwa$"

 hamezan_wb: "Emir Hamezan"
 hamezan_wb_desc: "The Flame of the South, the Emir of Ahmerrad, is perhaps the most ardent and zealous ruler of the Ardallah faith, with his many victories against the kuffar numbering in the dozens. At the age of fifty-eight, however, the end of his days of warfare is fast approaching as he begins to look toward succession. Yet not even old age can quell the fire in Hamezan’s heart—a fire that even Hakim fears.\n\nHamezan's passionate zealotry can be off-putting to many within his faith, but he dismisses them as misguided.\n\n#bold Will your zealotry prove that God favors the Sarranids in their conquest of Calradia, or will it ultimately lead you astray?#!"
 hamezan_wb_subheading: "Emir of $cn_ahmerrad$"

 nuwas_wb: "Emir Nuwas"
 nuwas_wb_desc: "Isolated on the small Perassic island of Durrin, Emir Nuwas is a greedy and stubborn bastard of a man. When the Sarrans moved westwards after the capture of Shariz, the Khamalids travelled with as lieutenants and were awarded the island of Durrin. At the time, the island was riddled with pirate coves and Western Calradian holdovers, but Khamalids were able to root out the Calradians, and even utilized the pirates as personal corsairs.\n\nToday is no different under Nuwas' rule. He still utilizes the corsairs to carry out attacks against enemies of the Sarranids, but he also tires of the isolation and seeks to expand anywhere he can.\n\n#bold As Nuwas, your family's relative isolation on Durrin is almost driving you mad. Can you endure it or will you force yourself to seek out a larger realm to call home?#!"
 nuwas_wb_subheading: "Emir of $cn_durrin$"

 ## Vaegir Bookmark
 bm_1257_vaegir: "Kingdom of Vaegirs"
 bm_1257_vaegir_desc: "Vaegir Guardsmen who escaped the collapse of the Calradian Empire founded the Kingdom of Vaegirs, a realm nestled in the taiga and forests of northern Calradia, and have since maintained the martial traditions of those renowned and feared guardsmen.\n\nFirst founded as a Principality under the leadership of Vulfyr Krasnoving, a former Vaegir Guard himself, his subsequent heirs and successors would go on to found the Kingdom of Vaegirs following the dissolution of the Grand Principality of Sturgia.\n\nAlthough the Dolinak, the predecessors of the Vaegirs, were very independent-minded and disdainful of the authority of Princes, the Vaegirs have since accepted the hegemony and leadership of a single king who will lead them into the future."

 yaroglek_bm: "$main_vaegirs$"
 yaroglek_bm_desc: "$main_vaegirs_desc$"
 yaroglek_bm_subheading: "$main_vaegirs_subheading$"

 ralcha_bm: "Boyar Ralcha"
 ralcha_bm_desc: "The elderly and wise Boyar Ralcha has long served the Kingdom of Vaegirs as its chancellor. First under King Kurzak, then King Burelek after he usurped the throne from Prince Valdym, and finally King Yaroglek. In that time, Ralcha made friends across Calradia and learned both the Nords' and the Khergits' languages. He shares a friendship with Jarl Knudarr, another chancellor and his direct neighbor to the west.\n\n#bold The Kingdom of Vaegirs will need its chancellor in the days ahead. As Boyar Ralcha, are you up to the task of ensuring the Vaegirs come out at the top of Calradia?#!"
 ralcha_bm_subheading: "Boyar of $cn_jeirbe$"

 meriga_bm: "Boyar Meriga"
 meriga_bm_desc: "For decades, the Nords have thrown themselves against the walls of Rivacheg in an effort to subdue the Vaegirs. Each time, the Vaegirs bloodied Rivacheg Rock with the bodies of Nordic warriors both old and young.\n\nToday is no different under the watchful gaze of Boyar Meriga who stubbornly guards the Strait of Rivacheg as the Nords look on in jealousy. Though he's known for successfully fending off Nord attacks, Meriga is known to his subjects as a greedy and arrogant ruler who takes more than is just.\n\n#bold Although the Nords will inevitably continue their assaults, will you, as Meriga, continue to hold them off, or will your subjects grow tired of your greed and rise?#!"
 meriga_bm_subheading: "Boyar of $c_rivacheg$"

 vuldrat_bm: "Boyar Vuldrat"
 vuldrat_bm_desc: "King Yaroglek trusts Boyar Vuldrat with many of the military's everyday affairs. As the Kingdom's marshal, Vuldrat positions himself in a highly regarded position and can influence his liege's attention towards a particular foe. \n\nOutside of his duties as marshal, the descendant of Olek 'the Old' governs the old Sturgian city of Omor, known today as Slezkhgan, and oversees construction projects to help improve the city, bringing it into the current age.\n\n#bold As marshal, will you succeed in directing King Yaroglek towards targets for the betterment of the Kingdom of Vaegirs, or will you push him into making a mistake for the betterment of you?#!"
 vuldrat_bm_subheading: "Boyar of $cn_slezkh$"

 vlan_bm: "Boyar Vlan"
 vlan_bm_desc: "When the Vaegirs conquered the Imperial city of Diathma over a century ago, the populace was very reluctant to their new heathen overlords. After a few decades, the Vaegirs soon formed their own Calradic faith, and by then the locals had become accustomed to Vaegir rule. By the turn of the 13th century, the populace practiced Vaegir customs, traditions, and faith, and referred to themselves as Vaegirs.\n\nToday, the city is a bustling trading hub on Lake Laconis with trade routes connecting West Calradia to the Transtanaesian realms in the east. As its ruler, Boyar Vlan ensures trade routes and city affairs remain effective and efficient.\n\n#bold Diathma is now known as Khudan, and is ruled by the diligent Boyar Vlan. As Vlan, will Khudan, and therefore the rest of the Vaegir realm, prosper under your rule, or will outside forces bring it all down?#!"
 vlan_bm_subheading: "Boyar of $cn_khudan$"

 ## Nord Bookmark
 bm_1257_nord: "Kingdom of Nords"
 bm_1257_nord_desc: "When the united Nordyg jarldoms invaded the south at the behest of their Nord king, Northern Calradia shattered and burned as the West beheld the greatest heathen invasion this side of Calradia. From their throne made of walrus ivory and bone in Sargoth, the Nordic kings rule over the Nordic Jarldoms with a closed fist.\n\nThe line of kings was broken when King Hakrim died and his son, Lethwin, was shipwrecked and lost at sea. With no clear succession, a thane named Ragnar rose, took the Nordic throne, and has ruled since."

 ragnar_bm: "$main_nords$"
 ragnar_bm_desc: "$main_nords_desc$"
 ragnar_bm_subheading: "$main_nords_subheading$"

 irya_bm: "Jarl Irya"
 irya_bm_desc: "The younger brother of Jarl Gundur, Irya rules Aválaðr from $cn_jelbegi_castle$ and its strong Nordic walls. From these walls and the keep within, the martial-inclined Irya strategizes and conducts tactics for his King. Irya and his father came from relative obscurity in Ragnar's shieldwall. Still, when they both distinguished themselves, Ragnar sought to elevate the Urickings to Jarldom and gifted them $cn_jelbegi_castle$ as a reward.\n\n#bold As Irya, can you guide the Nords southwards to conquer Calradia under the raven banner of the Nords, or will you strike your own path given your martial gifts?#!"
 irya_bm_subheading: "Jarl of $cn_avaladr$"

 turegor_bm: "Jarl Turegor"
 turegor_bm_desc: "When the Nords invaded from Nordvyg into northern Calradia, the Swadians held strong in Rovalt but were crushed when the Nord king set the city ablaze. Since then, the city has remained a shadow of its former self and has passed through different Nordic families over the decades, with little improvement. The previous ruler of Rovalt, Jarl Hallsteinn, instructed his son, Turegor, to rebuild the city at any cost and to ensure the Teigrings became renowned and revered throughout Calradia.\n\n#bold As Jarl Turegor, opportunities lie in the rich south, and if you wish to rebuild Rovalt truly, then you need the wealth that is required.#!"
 turegor_bm_subheading: "Jarl of $d_rovalt$"

 gundur_bm: "Jarl Gundur"
 gundur_bm_desc: "For a Nord, Jarl Gundur is particularly callous and mean. The older brother of Jarl Irya, Gundur, was given Wercheg as part of his inheritance and is known to be a hard ruler. In addition to his wretched personality, Gundur is also notoriously greedy. He punishes taxpayers and shopkeepers alike for any late taxes.\n\n#bold As Gundur, will you successfully horde all the wealth within your realm, or will your greed become your undoing?#!"
 gundur_bm_subheading: "Jarl of $cn_wercheg$"

 haeda_bm: "Jarl Haeda"
 haeda_bm_desc: "The young Jarl of Kachyar takes after his father's love of archery and hunting, but little for warfare. His younger sister, Bergit, takes after their grandfather's love of warfare, though, and has studied it for a decade. She hopes to one day become a shieldmaiden in King Ragnar's shieldwall. Still, her mother forbade it.\n\nHaeda and Bergit's mother could remain content with her son's activities as long as he stayed out of the frontlines. Still, those amongst the Nords in the Kachyar Peninsula grow weary of the Jarl's behavior.\n\n#bold As Jarl Haeda, will you continue to pursue your passion for hunting and sports, or will your thanes force you to commit to your duties as a Nord and fight in the shieldwall?#!"
 haeda_bm_subheading: "Jarl of $d_kachyar$"

 knudarr_bm: "Jarl Knudarr"
 knudarr_bm_desc: "Known well throughout Calradia as perhaps the most honorable man alive, Knudarr did not build this reputation easily. At just fifty-seven years old, Knudarr worked for decades towards the betterment of all of his subjects and fellow vassals. Though King Ragnar enjoys his wars and raids, he knows to rely on Knudarr's word to help broker any sort of peace.\n\n#bold As Knudarr, will your role as chancellor help shape the Nords into a force of peace, or will Ragnar's ambitions shatter those efforts?#!"
 knudarr_bm_subheading: "Jarl of $cn_skogr$"

