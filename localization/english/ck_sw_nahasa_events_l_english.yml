l_english:
 west_nahasa.0001.t: "[GetBuilding('indurar').GetName]"
 west_nahasa.0001.desc: "As I walk up to the great walls of [GetBuilding('indurar').GetName], built and sculpted into the side of the great sandstone cliffs of Indurar, I stop and stand in awe of the great work that must have went into its construction. For a mile each way, I can observe the movement of people along its great facets like little ants in a colony. In other parts though, I see the effects of wear as seasons of torrential rain tear away at the stone.\n\nFinished admiring the architecture, I begin making my way inside to look at the vast library."
 west_nahasa.0001.a: "Exciting!"
 west_nahasa.0001.b: "Better yet, I will return another time."
 west_nahasa.0001.b.tt: "You will return home and can return whenever."
 west_nahasa.0002.t: "The Library"
 west_nahasa.0002.desc: "After making my way inside of the great city, I make my way to the library. The size of the library is the first thing that astounds me. Next is the sheer amount of scrolls and dusty tomes littered across the room's shelving.\n\nIt's here where marabouts and scholars have chronicled events for the past thousand years. From the newer tomes, near the front, relating to the Calradian expedition in the west, to the older tomes, towards the back, dealing with the first Mahdi, there is something for anything.\n\nWhere I should begin my studies on the Mahdi?"
 west_nahasa.0002.desc.no_calradian: "After making my way inside of the great city, I make my way to the library. The size of the library is the first thing that astounds me. Next is the sheer amount of scrolls and dusty tomes littered across the room's shelving.\n\nIt's here where marabouts and scholars have chronicled events for the past thousand years. From the newer tomes near the front, relating to Thalas al-Aserai's unification of the Aserai tribes, to the older tomes, towards the back, dealing with the first Mahdi, there is something for anything.\n\nWhere I should begin my studies on the Mahdi?"
 west_nahasa.0002.a: "I will study [diplomacy|E]."
 west_nahasa.0002.a.reread: "Should I give [diplomacy|E] another read?"
 west_nahasa.0002.tt: "Each [skill|E] is divided into six subjects.\n\nReading more than one subject each reading session will increase your [stress|E]"
 west_nahasa.0002.tt.reread: "Each [skill|E] is divided into six subjects.\n\nYou have completely read this [skill|E] subject and therefore gain no [stress|E] from reading it again"
 west_nahasa.0002.b: "I will study [stewardship|E]."
 west_nahasa.0002.b.reread: "Maybe I missed something in [stewardship|E]?"
 west_nahasa.0002.c: "I will study [martial|E]."
 west_nahasa.0002.c.reread: "Wonder what more I can read in [martial|E]?"
 west_nahasa.0002.d: "I will study [intrigue|E]."
 west_nahasa.0002.d.reread: "Perhaps I can learn more in [intrigue|E]?"
 west_nahasa.0002.e: "I will study [learning|E]."
 west_nahasa.0002.e.reread: "There is more to learn in [learning|E]."
 west_nahasa.0002.f: "I'm finished here."
 west_nahasa.0002.f.flavor: "You will return home to [ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitly]"
 west_nahasa.0002.f.tt: "@warning_icon!#X [GetDecisionWithKey('read_the_mahdi_tomes').GetName] [decision|E] will be unavailable for 4 months#!"

 ## Reading the Subjects
 west_nahasa.0003.t: "Reading:"
 west_nahasa.0003.t_d: "Diplomacy"
 west_nahasa.0003.t_s: "Stewardship"
 west_nahasa.0003.t_m: "Martial"
 west_nahasa.0003.t_i: "Intrigue"
 west_nahasa.0003.t_l: "Learning"
 west_nahasa.0003.books_read: "[GetPlayer.Custom('ck_library_subjects_mahdi')]"
 # Numbered
 library_mahdi_diplomacy: "@diplomacy_lifestyle_icon! Read [GetPlayer.MakeScope.Var('num_read_subject_diplomacy').GetValue] subject(s) out of six total"
 library_mahdi_stewardship: "@stewardship_lifestyle_icon! Read [GetPlayer.MakeScope.Var('num_read_subject_stewardship').GetValue] subjects out of six total"
 library_mahdi_martial: "@martial_lifestyle_icon! Read [GetPlayer.MakeScope.Var('num_read_subject_martial').GetValue] subjects out of six total"
 library_mahdi_intrigue: "@intrigue_lifestyle_icon! Read [GetPlayer.MakeScope.Var('num_read_subject_intrigue').GetValue] subjects out of six total"
 library_mahdi_learning: "@learning_lifestyle_icon! Read [GetPlayer.MakeScope.Var('num_read_subject_learning').GetValue] subjects out of six total"
 # All
 library_mahdi_diplomacy_all: "@diplomacy_lifestyle_icon! You have read all you can in this subject."
 library_mahdi_stewardship_all: "@stewardship_lifestyle_icon! You have read all you can in this subject."
 library_mahdi_martial_all: "@martial_lifestyle_icon! You have read all you can in this subject."
 library_mahdi_intrigue_all: "@intrigue_lifestyle_icon! You have read all you can in this subject."
 library_mahdi_learning_all: "@learning_lifestyle_icon! You have read all you can in this subject."

 west_nahasa.0003.desc.scroll: "I find a dusty scroll that I am told belongs to the subject I'm attempting to read up on. Hopefully, it gives me more information on the true life of the Mahdi and the gods.\n\n"
 west_nahasa.0003.desc.tome: "Looking around the library, my eyes come upon an old tome, likely written. I open it up and look over the pages before taking a seat to read it.\n\n"
 west_nahasa.0003.desc.book: "Books and tomes are a more relative newcomer to the library. An export from the Calradian continent that the marabouts wasted no time enscribing in. They say it allows for limitless experiences to be written within its bounds, but as I look through the pages, I find only limit in the size one book can have before it comes a nightmare to read.\n\n"
 west_nahasa.0003.desc.d_1_pre: "#weak "Thalas al-Asera once came to parlay with [GetCultureByKey('tamarken').GetName] many years ago to receive aid in throwing off the yoke of Calradian authority. With the assistance of the Tamarken under King Ghuzid, an alliance was formed that succeeded in reclaiming the desert lands from foreigners."#!\n\nThe author speaks of alliances in further detail and how even the Mahdi utilized such tools in his unification of the land."
 west_nahasa.0003.desc.d_1_post: "#weak "When the Calradians came to our golden shores those many years ago, with promises of wealth and 'civilization', our people balked at the absurdity. Forge alliances with brothers and sisters to rebuke the encroachment of imperialism."#!\n\nThe author speaks of the Sinaysian Expedition of Calradians who landed on the islands to our west. They speak of the wisdom of alliances and how even the Mahdi utilized such tools in his unification of the land."
 west_nahasa.0003.desc.d_2: "#weak "Interpersonal bonds are stronger than the bindings that hold the land together. Long after we are gone from this world, our souls remain tethered to the connections we make in life. Remember this. Bi-lal kaifa."#!\n\nThis author notes how the friendships and families we make along our path in life will define our souls in the afterlife, at least until our souls manifest back into the world of the living."
 west_nahasa.0003.desc.d_3: "#weak "Take heed of friends and foes. Understand the matters that lead brothers to conflict. Mediate fairly with wisdom but never relinquish authority in doing so."#!\n\nThe name of the author of this quote has since faded but it is believed to have been the words spoken by the Mahdi. I turn the pages and see more quotations on arbitration. Seems this author really took matters of clan disputes seriously."
 west_nahasa.0003.desc.d_4: "#weak "Though a heavy hand may be among the least diplomatic avenues to problems, we must learn to respect the elders and their wisdom. Sometimes, disrespect to ones authority must be met with a heavy hand, lest we fall into the same trappings our ancestors did."#!\n\nInteresting... it seems they're explaining that if we do not learn from the mistakes of the past, we are doomed to repeat them."
 west_nahasa.0003.desc.d_5: "#weak "Haliz ul-Gharab was a man carrying honeyed words and great gifts, but none of that helped him in the end. When Haliz attempted to court a beautiful princess, her father demanded Haliz to work his fields for a summer. Unfortunately for Haliz, and fortunately for the princess, the man who never labored a day in his life overworked himself and perished in those fields."#!\n\nThe author goes into detail starting that the respect of a person starts with how humble and hardworking they can be. Do not presume status and wealth can carry respect alone."
 west_nahasa.0003.desc.d_6: "#weak "The Mahdi awoke with a start at the sound of a great quake. When he came to and saw the mighty tyrant erupting across the sky, he ran to evacuate the village. Putting himself between the danger and his people, he trusted Urzor to protect him... and so Urzor did, making the Mahdhi his prophet then and there."#!\n\nFascinating! So this is how the Mahdi became Urzor's prophet, by selflessly helping an entire village escape a volcanic eruption. Selflessness seems to be a reoccuring theme in any Mahdi story."
 west_nahasa.0003.desc.read_all_of_this_subject: "I close a book and see that I have finally finished everything on this subject. I should go back and check through other writings.\n\nHowever, I am feeling pretty tired and stressed from all of this reading, so maybe it would also be for the best if I leave and return another day."
 west_nahasa.0003.desc.m_1: "#weak "An army marches not upon courage alone. A thousand brave men without food will scatter before a hundred well fed men. Before drawing the sword, know first how you intend to feed the hand that carries it."#!\n\nThe author spends several pages discussing supplies, pack animals, and the keeping of grain during a campaign. I suppose there is little glory in any of it, but even the greatest warrior cannot fight on an empty stomach."
 west_nahasa.0003.desc.m_2: "#weak "When the Mahdi found his followers outnumbered, several among them begged him to attack before their enemy could gather more men. Instead, he withdrew into the hills and waited. His enemies followed, tiring themselves upon the narrow paths until their numbers meant nothing. Only then did the Mahdi turn to face them."#!\n\nInteresting... the passage praises knowing when not to fight just as much as knowing when to fight. Apparently patience can win battles before a sword is ever swung."
 west_nahasa.0003.desc.m_3: "#weak "A commander who knows only victory knows nothing of war. When defeat comes, as it comes to all men, preserve what can be preserved. Land may be retaken, walls may be rebuilt, and pride may be restored, but the dead do not return merely because their commander refused to yield."#!\n\nA rather grim lesson on retreat. The author seems to believe that accepting a smaller defeat can sometimes prevent a much greater one."
 west_nahasa.0003.desc.m_4: "#weak "Nasir the Lion commanded men who feared him greatly. They marched when ordered and fought when ordered, yet when Nasir fell from his horse, they fled. His brother commanded with patience, ate beside his men, and listened when they spoke. When his brother fell, his soldiers carried him home and continued fighting."#!\n\nThe author makes their point rather plainly. Fear can force a soldier forward, but loyalty appears much harder to break."
 west_nahasa.0003.desc.m_5: "#weak "The fool sees a river and curses that it bars his path. The wise commander sees the same river and asks how it might bar the path of his enemy. Hills, forests, heat, mud, and stone take no side in war until a clever mind gives them one."#!\n\nI turn the page to find several accounts of battles decided by terrain rather than numbers. It seems the battlefield itself is being treated almost like another soldier under one's command."
 west_nahasa.0003.desc.m_6: "#weak "Before battle, the Mahdi walked among those who would fight beside him. He did not promise that Urzor would spare them, nor did he promise that victory was certain. He told them only why they fought and what would be lost should they fail. When dawn came, not one abandoned his place."#!\n\nSo courage is not supposed to come from believing oneself invincible. According to this author, true courage comes from understanding the danger and choosing to face it anyway."
 west_nahasa.0003.desc.i_1: "#weak "A lie told plainly is easily challenged. A truth told carefully can accomplish far more. Speak no falsehood when the truth itself may be arranged to reveal only what another needs to hear."#!\n\nThat is... surprisingly devious. The author appears less interested in lying than in understanding how much of the truth should be spoken and when."
 west_nahasa.0003.desc.i_2: "#weak "The Mahdi once entered the camp of a chieftain who despised him. There he listened as the chieftain's men boasted, complained, drank, and quarreled. By sunrise, the Mahdi knew which men were loyal, which were afraid, and which merely waited for someone stronger to follow. He departed without drawing a blade."#!\n\nFascinating. Nothing was stolen and no one was threatened. The lesson seems to be that simply listening can uncover more than interrogation ever could."
 west_nahasa.0003.desc.i_3: "#weak "Guard your anger before those who wish to understand you. A man who knows what insults you knows how to provoke you. A man who knows what you fear knows how to guide you. Let others see only the face you have chosen for them."#!\n\nThe author considers self control a form of secrecy in itself. If others cannot easily read my emotions, they cannot so easily use them against me."
 west_nahasa.0003.desc.i_4: "#weak "Two servants accused one another of stealing a silver cup. The master threatened both with punishment and watched closely. One protested his innocence. The other immediately accused the cook, the stable boy, and three guests besides. The cup was later found beneath the second servant's bed."#!\n\nA simple story, but I understand the point. Sometimes what a person volunteers reveals far more than what they are directly asked."
 west_nahasa.0003.desc.i_5: "#weak "Never mistake secrecy for wisdom. A fool may conceal his intentions perfectly and remain a fool. Before hiding a plan, ask whether the plan deserves to survive at all."#!\n\nInteresting... after so many passages praising subtlety, this author warns against becoming too enamored with it. A clever scheme is apparently still worthless if the idea behind it is poor."
 west_nahasa.0003.desc.i_6: "#weak "When the Mahdi learned that one of his companions intended to betray him, he said nothing. For seven days he continued as before, changing only the destination of his journey. On the eighth, armed men waited upon the road he had first intended to travel. The traitor fled before sunset."#!\n\nRather than confronting the traitor, the Mahdi allowed the betrayal itself to prove their guilt. Patience seems to be a reoccurring lesson in these writings, though here it takes a much more suspicious form."
 west_nahasa.0003.desc.s_1: "#weak "A ruler who empties every granary during a year of plenty will curse Urzor when famine comes. A ruler who fills every granary and never opens them will be cursed by his own people. Wealth has value only when one knows when to preserve it and when to spend it."#!\n\nThe author describes stewardship as a balance between preparation and use. Hoarding everything is apparently considered almost as foolish as wasting everything."
 west_nahasa.0003.desc.s_2: "#weak "The Mahdi came upon a village where the fields were fertile yet the people starved. Their lord demanded the same levy after poor harvests as he did after rich ones. The Mahdi asked him whether he intended to collect grain from graves once every farmer was dead."#!\n\nThe lord apparently lowered his demands shortly afterward. A rather direct lesson that taxes which ruin the people paying them eventually ruin the person collecting them as well."
 west_nahasa.0003.desc.s_3: "#weak "If a wall collapses each winter, do not praise the mason who rebuilds it each spring. Ask instead why the wall continues to fall."#!\n\nThat passage is almost insultingly simple, yet the author expands upon it for several pages. Their argument seems to be that preventing a recurring expense is often worth more than repeatedly finding the money to pay for it."
 west_nahasa.0003.desc.s_4: "#weak "A merchant arrived with ten camels of salt and departed with ten camels of wool. Both villages called him greedy, yet both villages ate better that winter because he had come. Judge trade not by how much another man gains, but by whether both hands leave the exchange carrying something they value."#!\n\nInteresting... the writer does not seem particularly bothered by merchants becoming wealthy so long as their wealth comes from exchanges that benefit everyone involved."
 west_nahasa.0003.desc.s_5: "#weak "When the Mahdi ordered a well dug, one follower asked why they should waste coin upon a village they would leave within the month. Years later, the Mahdi returned to find a market built around that very well and caravans stopping there for water. 'Coin leaves the hand,' he told them, 'but what it builds may remain.'"#!\n\nSo expenditure and waste are not considered the same thing. The author seems especially interested in works whose benefits continue long after their cost has been forgotten."
 west_nahasa.0003.desc.s_6: "#weak "Count not only your herd but the hands that raised them. A field neglected because its farmer has fled is worth nothing. A workshop without craftsmen produces nothing. The prosperity of the ruler begins with the prosperity of those beneath him."#!\n\nThe author goes on at length about farmers, craftsmen, herders, and traders. Apparently a treasury is treated less as a pile of wealth and more as the final result of countless people being able to work."
 west_nahasa.0003.desc.l_1: "#weak "The man who fears a question fears also the answer. Ask why the stars move, why sickness spreads, why kingdoms rise, and why scripture speaks as it does. Urzor did not grant mankind reason so that reason might remain unused."#!\n\nI was expecting a warning against questioning sacred matters, yet this author appears to encourage it. They seem to regard curiosity itself as one of Urzor's gifts."
 west_nahasa.0003.desc.l_2: "#weak "A physician treated twenty men with the same herb and proclaimed it a cure when twelve recovered. The Mahdi asked what became of the other eight. The physician had no answer, for he had chosen to remember only those who proved him correct."#!\n\nInteresting... the passage warns against seeking only the evidence that confirms what one already believes. That seems useful well beyond medicine."
 west_nahasa.0003.desc.l_3: "#weak "Memorize the words of your teachers, but do not mistake their words for understanding. A parrot may repeat a prayer without knowing Urzor. Knowledge begins in memory, but wisdom begins when one understands why the words were worth remembering."#!\n\nThe author is rather harsh toward rote learning. Simply reciting these passages would apparently accomplish very little if I never stop to think about what they actually mean."
 west_nahasa.0003.desc.l_4: "#weak "Three scholars argued over the age of a ruined tower. One cited an old chronicle, another the stories of nearby villagers, and the third examined the stones themselves. In the end, all three had been partly wrong and partly correct."#!\n\nThe writer uses the story to argue that no single source of knowledge should be trusted blindly. Written histories, spoken memories, and physical evidence can apparently correct one another."
 west_nahasa.0003.desc.l_5: "#weak "When asked where the soul resides before returning to the world, the Mahdi answered, 'Bi-lal kaifa.' His followers pressed him further, but he refused to invent an answer merely to satisfy them. 'There is no shame in ignorance,' he said. 'Only in disguising ignorance as certainty.'"#!\n\nFascinating! Even the Mahdi was willing to admit when something could not be known. Perhaps wisdom is as much about recognizing the limits of knowledge as expanding them."
 west_nahasa.0003.desc.l_6: "#weak "A scribe copied a sacred verse incorrectly, changing a single word. For eighty years every copy made from his manuscript carried the same error. When the mistake was finally discovered, some demanded the older wording remain simply because their fathers had known it. The marabouts refused."#!\n\nThe author spends the rest of the passage discussing how traditions can preserve mistakes just as easily as truths. Age alone, it seems, does not make an idea correct."

 west_nahasa.0003.a: "I must go deeper!"
 west_nahasa.0003.a.2: "There must be more."
 west_nahasa.0003.a.3: "Interesting. Is there more?"
 west_nahasa.0003.a.4: "#EMP *Turn the next page*#!"
 west_nahasa.0003.b: "Let me check the other literature."
 west_nahasa.0003.b.2: "Enough with this subject for now."
 west_nahasa.0003.c: "I think that will do it for me today."