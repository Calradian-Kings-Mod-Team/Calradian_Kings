l_english:
 ## ck_contracts_events.0001 - Herd Contract
 ck_contract_events.0001.t: "Cattle Wrangler"
 ck_contract_events.0001.desc: "[employer.GetTitledFirstName], hand on [employer.GetHerHis] temple attempting to nurse a migraine, spots me approaching.\n"Have you come for the contract? My livestock numbers have dwindled to a point where they cannot survive without adding more. Speak with my herder, [employer_herdsman_character.GetTitledFirstName], and ask them more."\n\n I head to the local pasture to find [employer_herdsman_character.GetTitledFirstName] tending to the very few heads of cattle left. [employer_herdsman_character.GetSheHe|U] sees me approach, "Ah! Greetings, [ROOT.Char.Custom('GetMadameSir_ck')]! I suppose you are here to help in our livestock issue? "
 ck_contract_events.0001.desc.stolen: "My [employer.GetLadyLord]'s herd was stolen in a cowardly move by [employer.GetHerHis] enemies! "
 ck_contract_events.0001.desc.bandits: "We lost most heads of livestock from a recent bandit attack. "
 ck_contract_events.0001.desc.fallback: "Bad harvests and weather have unfortunately diminished our heads of livestock. "
 ck_contract_events.0001.desc.2: "\n\nWith your help, we can increase our numbers once again! I would help you, but I must keep an eye on what livestock we have left. But here, let me show you some places nearby you could some more from."\n[employer_herdsman_character.GetTitledFirstName] grabs my map and notes down some local counties where I can buy livestock from. "Please hurry. I don't know if our current herd can last after winter.""
 ck_contract_events.0001.a: "Onwards and away"
 ck_contract_events.0001.tt.destination_list: "You immediately begin traveling to nearby realms to purchase livestock for [employer.GetTitledFirstName]"
 ck_contract_events.0001.tt.explanation: "#TUT To complete the [task_contract|E]:\n$EFFECT_LIST_BULLET$Purchase livestock at your destination\n$EFFECT_LIST_BULLET$You must return with the ruler's desired number of livestock\n$EFFECT_LIST_BULLET$Returning with none will result in you failing the $game_concept_task_contract$#!"
 ## ck_contracts_events.0003 - Approaching Settlement
 ck_contract_events.0003.t.not_capital: "Cattle Herding: [ck_contract_events_settlement_county.GetNameNoTier]"
 ck_contract_events.0003.t.capital: "Returning: [ck_employer_capital.GetNameNoTier]"
 ck_contract_events.0003.desc.intro.preamble.first_destination: "We have arrived at our first destination, [ck_destination_1.GetName]."
 ck_contract_events.0003.desc.intro.preamble.second_destination: "We have arrived at our next destination, [ck_destination_2.GetName]."
 ck_contract_events.0003.desc.intro.preamble.third_destination: "We have arrived at our third stop on this journey, [ck_destination_3.GetName]."
 ck_contract_events.0003.desc.intro.preamble.fourth_destination: "We have finally arrived at [ck_destination_4.GetName], our final destination."
 # Return
 ck_contract_events.0003.desc.intro.preamble.final_destination: "It's almost a blessing to see [ck_employer_capital.GetNameNoTier] after this journey."
 ck_contract_events.0003.desc.intro.plains: "The land in all directions is surrounded by rolling plains. "
 ck_contract_events.0003.desc.intro.steppe: "The grass of the steppe tickles my hands as we approach our destination. "
 ck_contract_events.0003.desc.intro.hills: "Cresting over a large hill, we look down upon the settlement beneath us. "
 ck_contract_events.0003.desc.intro.hills_winter: "Cresting over a large hill, we look down upon the settlement beneath us, surrounded by blinding white snow. "
 ck_contract_events.0003.desc.intro.farmlands: "As we approach the settlement, farmers tending to their land wave as we pass by. "
 ck_contract_events.0003.desc.intro.farmlands_winter: "As we approach the settlement, we see numerous fields around us emptied of their harvest. "
 ck_contract_events.0003.desc.intro.mountains: "The journey through these mountains was treacherous, particularly whenever we encountered mountain goats; the insufferable hard-headed bastards. Regardless, we wind around a path on the mountain and see the settlement. "
 ck_contract_events.0003.desc.intro.desert: "My lips are dry as the hot desert winds kiss my face. I've almost considered giving up on this until I see the settlement in the distance. "
 ck_contract_events.0003.desc.intro.desert_mountains: "The heat accompanied by the trudgery of walking these mountains is killing my legs. When I finally see the settlement, I give an audible sigh of relief. "
 ck_contract_events.0003.desc.intro.oasis: "I have to rub my eyes to ensure I am not hallucinating, but I am surprised to see the water isn't fake! I refill my water and see a settlement across the water. "
 ck_contract_events.0003.desc.intro.forest: "The sounds of nature flood the air around us in this forest. Birds sing their songs high in the canopies above us. Eventually, I see what appears to be a settlement in a clearing. "
 ck_contract_events.0003.desc.intro.forest_winter: "The sounds of this forest have since died out since winter arrived. However, there still remains a faint beauty in this winter landscape. We soon approach the settlement. "
 ck_contract_events.0003.desc.intro.taiga: "The cold taiga forest comes alive with the sound of woodpeckers and the occasional howl of a wolf. "
 ck_contract_events.0003.desc.intro.taiga_winter: "The taiga and its foliage is coated in a thick layer of snow. With a cold winter wind blowing into our faces, I'm almost worried we would have to make camp here. Fortunately, I can see the settlement in the distance. "
 ck_contract_events.0003.desc.intro.wetlands: "It is incredibly difficult finding any dry spots in these wetlands. I can already feel my boots filling with water and smelly muck. Fortunately, I can see the settlement nestled in here. "
 ck_contract_events.0003.desc.intro.floodplains: "The humditiy of the floodplains hits me hard. "
 ck_contract_events.0003.desc.intro.drylands: "With its sparse vegetation and strange animals, it's a wonder anything survives in the drylands. Eventually, I see my destination. "
 ck_contract_events.0003.desc.intro.jungle: "I had hoped to avoid the jungles in my travels, but here I am trudging through the thick vines and foliage. I eventually see my destination. "
 # Randomized Local Interactions
 ck_contract_events.0003.desc.locals.1_hospitality: "\n\nThe locals greet us with gifts and immense hospitality. We spend the evening celebrating local customs and traditions. If it wasn't for my ongoing contract, I might enjoy staying in this area more."
 ck_contract_events.0003.desc.locals.2: "\n\nThe locals toil away at their duties. Some of them pay us respects, and some of the children come running up to tease the new 'strangers'. "
 ck_contract_events.0003.desc.locals.3: "\n\nWalking into the settlement, there's a ruckus going on between two men. One of them soon falls, bloodied and beaten. Not long after, guards arrive to clean up the scene. "
 ck_contract_events.0003.desc.locals.4: "\n\nThe settlement has an odd odor to it as we get closer. I look around for the source but cannot seem to find it. "
 ck_contract_events.0003.desc.locals.poor.1: "\n\nLooking around, I see the settlement's pastures only number at most five heads of livestocks. The inhabitants look on at us from a distance as I make my way through. "
 ck_contract_events.0003.desc.locals.poor.2: "\n\nVisible signs of decay are showing throughout the settlement. I can only assume the local ruler has made some budgetary cuts because so much of it looks decrepit; that or there's an unseen plague nearby. "
 # Meeting the local herder
 ck_contract_events.0003.desc.local_herdsman.1: "After making my way through [ck_contract_events_settlement_county.GetNameNoTier], I finally meet the local herder, a rugged and dirty [destination_character.Custom('GetLadyGentleman_ck')]. [destination_character.GetSheHe|U] notices me approaching, wipes [destination_character.GetHerHis] hands and offers to shake my hand.\n\n"I assume you're here for my livestock, [ROOT.Char.Custom('GetMadameSir_ck')]? No finer livestock this side of [ROOT.Char.Custom('GetRegionCK')]! We have [SCOPE.Custom('GetLivestockCount')] for you to choose from. What will it be?""
 ck_contract_events.0003.desc.local_herdsman.2: "After making my way through [ck_contract_events_settlement_county.GetNameNoTier], I finally meet the local herder, [destination_character.GetHerHis] clothing torn and ragged. [destination_character.GetSheHe] notices me approaching the pasture and sighs, "[ROOT.Char.Custom('GetMadameSir_ck')], our pastures are closed. We cannot afford to let go of any of our remaining herd. I apologize but you will need to look elsewhere.""
 # Returning to the contractor
 ck_contract_events.0003_desc.ending.critical: "\n\nThe herder, [employer_herdsman_character.GetTitledFirstName], sees me approach with more livestock than was asked for and seems elated. "[ROOT.Char.Custom('GetMadameSir_ck')]! You have done a great service bringing more than what was asked! I know our circumstances may not be the best, but please take this reward and more, from my [employer.GetLadyLord], as payment for your services!"\n\n[employer_herdsman_character.GetTitledFirstName] hands me my reward and bids me on my way."
 ck_contract_events.0003_desc.ending.success: "\n\nReturning to [ck_employer_capital.GetNameNoTier], I find the herder, [employer_herdsman_character.GetTitledFirstName] tending to some of [employer_herdsman_character.GetHerHis] livestock. [employer_herdsman_character.GetSheHe] sees the livestock behind me and smiles. "These animals look healthy and in great shape! I thank you on behalf of my [employer.GetLadyLord] for the work you did to help us improve our herd numbers. Please accept this reward from my [employer.GetLadyLord] as gratitude for your service."\n\n[employer_herdsman_character.GetTitledFirstName] hands me my reward and bids me on my way."
 ck_contract_events.0003_desc.ending.sub_success: "\n\nThe herder, [employer_herdsman_character.GetTitledFirstName], sees me approach the pastures of [ck_employer_capital.GetNameNoTier] with a small posse of livestock behind me. "[ROOT.Char.Custom('GetMadameSir_ck')], my [employer.GetLadyLord] has requested that you bring [ROOT.Char.Custom('GetDesiredLivestockCount')] of livestock! Oh dear, [employer.GetSheHe] is going to be upset. At least you brought something. Here, take this and please leave." [employer_herdsman_character.GetTitledFirstName] passes me a light pouch and beckons me away."
 ck_contract_events.0003_desc.ending.failure: "\n\nI enter [ck_employer_capital.GetNameNoTier] with the company I keep, albeit without any livestock. The herder, [employer_herdsman_character.GetTitledFirstName], sees me and my entourage. "[ROOT.Char.Custom('GetMadameSir_ck')], where is the livestock? You promised to bring what was asked of you, and you have not. My [employer.GetLadyLord] will be very displeased at this. Please leave before you make things worse!" [employer_herdsman_character.GetTitledFirstName] waves me off and away."
 # Options
 ck_contract_events.0003.a: ""I'll take one head of livestock.""
 ck_contract_events.0003.a.tt: "#TUT You will buy only one head of livestock#!"
 ck_contract_events.0003.a.2: ""Two heads of livestock.""
 ck_contract_events.0003.a.2.tt: "#TUT You will buy two heads of livestock#!"
 ck_contract_events.0003.b: ""I'll take all three heads of your livestock.""
 ck_contracts_event.0003.b.tt: "#TUT You will buy threes heads of livestock#!"
 ck_contract_events.0003.c: ""I'm sure we could come to an understanding?""
 ck_contracts_event.0003.c.tt: "#TUT You will attempt to bargain for one head of livestock#!"
 ck_contract_events.0003.c.success: "You successfully bargained for one head of livestock"
 ck_contract_events.0003.c.failure: "Your bargaining skills failed to impress the herder"
 ck_contract_events.0003.c.failure.tt: "#TUT You pay the standard price of one head of livestock#!"
 ck_contract_events.0003.d: "I'll try to steal one!"
 ck_contracts_event.0003.d.tt: "#TUT You will only attempt to steal one#!"
 ck_contract_events.0003.d.success: "You successfully stole one"
 ck_contract_events.0003.d.failure: "You were caught and driven off"
 ck_contract_events.0003.d.2: "I will try to steal them all!"
 ck_contracts_event.0003.d.2.tt: "#TUT You will attempt to steal all of their livestock#!"
 ck_contract_events.0003.d.2.success: "You succeeded in stealing [ROOT.Char.Custom('GetLivestockCount')]"
 ck_contracts_events.0003.e: "It's time I moved on."
 ck_contracts_event.0003.e.tt: "#TUT You will not earn any progress towards success#!"
 ck_contracts_events.0003.f: "I'm cutting my losses"
 ck_contracts_events.0003.f.tt: "@warning_icon! #X You steal the livestock and your [task_contract|E] is a #N Failure#!#!"
 ck_contract_events.0003.g.cs: ""It's been a pleasure.""
 ck_contract_events.0003.g.s: ""Of course.""
 ck_contract_events.0003.g.ss: ""I did my best.""
 ck_contract_events.0003.g.f: ""Whatever, I'm just glad it's over.""
 # tooltip - 
 ck_contracts_event.0003.tt.success_num: "#TUT You have enough livestock to qualify for a success, but be mindful of the trip back#!"
 ck_contracts_event.0003.tt.crit_success_num: "#TUT You have enough livestock to qualify for a critical success, but be mindful of the trip back#!"
 ck_contract_events.0003.number_of_heads: "#TUT You have #V #UND [task_contract.MakeScope.Var('ck_livestock_tally').GetValue]#!#! livestock out of the desired #V #UND [task_contract.MakeScope.Var('ck_livestock_desired').GetValue]#!#!#!"
 DESIRED_LIVESTOCK_DEBUG: "DESIRED LIVESTOCK SET TO [task_contract.MakeScope.Var('ck_livestock_desired').GetValue]"
 LIVESTOCK_TALLY_SET_LOG: "LIVESTOCK TALLY IS NOW [task_contract.MakeScope.Var('ck_livestock_tally').GetValue]"
 NOMAD_LIVESTOCK_COST_SET: "NOMAD HERD COST FOR LIVESTOCK IS: [task_contract.MakeScope.Var('location_herd_nomad_cost').GetValue]"
 ck_reason_gallowsbait_tt: "This option is available to you due to your high [GetTrait( 'gallowsbait' ).GetTraitTrackByKey( 'thief' ).GetName] skill\n"
 # Reward Tooltips $label_success_critical$
 task_contract_reward_effect_success_substandard_desc: "$label_success_qualified$"
 task_contract_reward_effect_failure_stole_herd_desc: "$label_failure_criminal$"