 ghavati_religion_adj: "Ghaavati"
 ghavati_religion_desc: "The oldest religion on the Makhanian subcontinent, Ghaavatis recognize a supreme infinite reality called Brahman in which a person's Atman, or an eternal soul, is connected through a continuing cycle of Samsara. Many adherents take difference paths to achieve Moksha, the ultimate liberation from that unending cycle. Many turn to spirtuality while others turn to the full realizement of their potential, creating theologians and warmongers alike, but the karma one incurs in this life will determine their lot in the next life."
