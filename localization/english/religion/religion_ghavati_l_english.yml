 # Ghavati Religious Artifacts #
 artifact_pedestal_branch_kalpa: "the Woven Wreath of the Kalpa"

 #### SHANTAYA - Ancient religion tied to the Ghavati through history. Rejects the idea of a self atman and instead liberation from the cycle of suffering through the Eight Fold Path to achieve nirvana. Founded by the younger brother of a Ghavati king (prince), later prosecuted and killed but adherents carry on in hiding. Said to have reached final liberation before his execution, thus being the first to truly achieve nirvana.
 shantaya_religion: "Shantayaism" 
 shantaya_religion_adherent: "Shantayist" 
 shantaya_religion_adherent_plural: "Shantayists" 
 shantaya_religion_desc: "Shantayaism emphasises the rejection of Atman in favor Annata, or no permanent soul, and that to escape the cycle of Samsara one must let go of desire, attachments, ambition, and ignorance of nature to achieve Nirvana. The cycle of Samsara is one of continued suffering. So in order to achieve Nirvana, adherents are expected to meditate to achieve insight and cultivate [Glossary( 'mindfulness', 'CK_GLOSS_MINDFULNESS')], and to conduct acts of generosity and [Glossary( 'ethical conduct', 'CK_GLOSS_ETHICAL_SHANTAYA')].\n\nOriginally a Prince of Makhania, the Shantaya rejected the [GetReligionByKey('ghavati_religion').GetAdjective] notion that ones soul is unchanging and eternal, and instead believed that this cycle of reincarnation is naught but a cycle of suffering. With such radical ideas, even for a privileged prince, he was shunned from court and eventually set out to spread his teachings. Decades later, much of his congregant would be pursued by the King of Makhania to be systematically and brutally killed, including the Shantaya himself who was said to have achieved Nirvana before being slain in an event known as Mahāvikīrṇa."
 CK_GLOSS_ETHICAL_SHANTAYA: "Also known as Śīla"
 CK_GLOSS_MINDFULNESS: "Smṛti"
 
 margananda: "Mārgānanda"
 margananda_adherent: "Mārgānandan"
 margananda_adherent_plural: "Mārgānandans"
 margananda_desc: "After the devastating Mahāvikīrṇa sent the adherents of Shantaya across the world, the $margananda_adherent_plural$ eventually came around to believe that the vehicle for liberation from Samsara was in fact the very road they walked on. In their travels while in exile, the mārgānandans performed acts of charity, helped build up villages, and blessed foreign courts with the teachings of the Shantaya. Through all of this, it became believed that these acts were only possible due to the circumstances that put them on the road to begin with."