FAITH_VIEW_NAHASA_SUBHEADING: "$unreformed_faith_doctrine_name$ [Faith.GetReligion.GetAdjective] @jungle![GetFaithDoctrine('sw_nahasan_unreformed_faith_doctrine').GetBaseName, '')] [faith|E]"
FAITH_VIEW_ORIGINAL_SUBHEADING:2 "$unreformed_name$ [Faith.GetReligion.GetAdjective] [faith|E]"
# FAITH_VIEW_UNREFORMED_SUBHEADING:2 "$unreformed_name|E$ [Faith.GetReligion.GetAdjective] [Select_CString(Faith.HasDoctrineByKey('tenger_unreformed_faith_doctrine'), GetFaithDoctrine('tenger_unreformed_faith_doctrine').GetBaseName, '')][Select_CString(Faith.HasDoctrineByKey('sw_nahasan_unreformed_faith_doctrine'), GetFaithDoctrine('sw_nahasan_unreformed_faith_doctrine').GetBaseName, '')][faith|E]"
doctrine_parameter_hostility_override_tenger_unreformed_faith_doctrine:0 "Does not believe [GetFaithDoctrine('tenger_unreformed_faith_doctrine').GetBaseName] [faiths|E] are $hostility_evil_tooltippable$, and is likewise considered [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 tenger_unreformed_faith_doctrine_name: "East Steppe"
 tenger_unreformed_faith_doctrine_desc: "$mpo_special_flavor_events.0001.desc$" # placeholder blurb about moving to water

doctrine_parameter_hostility_override_sw_nahasan_unreformed_faith_doctrine:0 "Holds [GetFaithDoctrine('sw_nahasan_unreformed_faith_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 sw_nahasan_unreformed_faith_doctrine_name: "Southwest Nahasan"
 sw_nahasan_unreformed_faith_doctrine_desc: "The faiths and religions of the [GetGeographicalRegion('region_far_southwest_nahasa').GetName], deep in the savannahs and jungles, carry little importance on hierarchical clergy to pass on the teachings of their respective gods, or spirits. Rather, for centuries, these people come together in their collective tribes to practice celebrations and rituals. Unlike the more stringent clergy of Calradia, these people hold no power to a patriarchy and as such tend to behold each other with equal eyes."

 #Northern Hostility
 northern_hostility_name:0 "Northern Syncretism"
 special_doctrine_northern_hostility_sturgian_name:0 "Northern Syncretism"
 special_doctrine_northern_hostility_sturgian_desc:0 "Although we may share dissimilar beliefs, our Northern brethren are still children of Orkūnos, and we shall meet again in Vyrajoll when our end has come."
 doctrine_parameter_hostility_override_special_doctrine_northern_hostility_other_northern:0 "Other Northern [faiths|E] are considered to be $hostility_astray_tooltippable$ instead of $hostility_hostile_tooltippable$."
 special_doctrine_northern_hostility_other_northern_name:0 "Northern Coexistence"
 special_doctrine_northern_hostility_other_northern_desc:0 "For centuries, the Sturgics have lived in relative peace with the Vakken and Nords. This has created an environment of coexistence which has transcended religious barriers."
 doctrine_parameter_hostility_override_special_doctrine_northern_hostility_sturgian:0 "[GetReligionByKey('northern_gods_religion').GetAdjective] [religion|E] is considered to be $hostility_astray_tooltippable$ instead of $hostility_hostile_tooltippable$."
 #Baerlonic Hostility
 baerlonic_hostility_name:0 "Baerlonic Religious Differences"
 special_doctrine_baerlonic_hostility_kalasradi_name:0 "Faithful of Kalasrad"
 special_doctrine_baerlonic_hostility_kalasradi_desc:0 "Our practice of worshipping what others wrongly consider to be an evil God has set us apart from our brothers in faith."
 doctrine_parameter_hostility_override_special_doctrine_baerlonic_hostility_kalasradi:0 "[GetFaithByKey('kalasradii_faith').GetAdjective] [faith|E] is considered to be $hostility_evil_tooltippable$ instead of $hostility_astray_tooltippable$."
 doctrine_parameter_kalasradi_hostility_parameter:0 "Other [GetReligionByKey('balian_religion').GetAdjective] adherents consider the [GetFaithByKey('kalasradii_faith').GetAdjective ] to be $hostility_evil_tooltippable$."
 special_doctrine_baerlonic_hostility_hetjurist_name:0 "Divine Saints"
 special_doctrine_baerlonic_hostility_hetjurist_desc:0 "Though we do not claim the Saints were divine themselves, they were certainly divinely guided. So too will they return at the end to fight against the great evil."
 doctrine_parameter_hostility_override_special_doctrine_baerlonic_hostility_hetjurist:0 "[GetFaithByKey('hetjur').GetAdjective] [faith|E] is considered to be $hostility_astray_tooltippable$ instead of $hostility_evil_tooltippable$."
 special_doctrine_baerlonic_hostility_baerlonic_name:0 "Baerlonic Heroes"
 special_doctrine_baerlonic_hostility_baerlonic_desc:0 "The Evils of Kalasrad must be banished at all costs. However, there is room for cooperation with those willing to accept the Heroes as warriors against Kalasrad."
 doctrine_parameter_hostility_override_special_doctrine_baerlonic_hostility_baerlonic:0 "[GetReligionByKey('balian_religion').GetAdjective] [religion|E] is considered to be $hostility_astray_tooltippable$ instead of $hostility_evil_tooltippable$."
 #Mandate stances
 special_doctrine_anti_mandatist_name:0 "Anti-Mandatist"
 special_doctrine_anti_mandatist_desc:0 "This faith has an Anti-Mandatist stance on the [GetReligionByKey('calradian_religion').GetName], believing that rather than being a physical, real thing that can be actually be attained on Earth, Heaven's Mandate is a spiritual concept that should be strived for, but not physically represented in any Empire."
 doctrine_parameter_hostility_override_special_doctrine_anti_mandatist:0 "Other Anti-Mandatist [faiths|E] are considered to be $hostility_astray_tooltippable$ instead of $hostility_hostile_tooltippable$."
 special_doctrine_amandatist_name:0 "Amandatist"
 special_doctrine_amandatist_desc:0 "This faith adopts an Amandatist stance on the [GetReligionByKey('calradian_religion').GetName], believing in an entirely seperate view of the Mandate than other Calradic faiths."
 doctrine_parameter_amandatist_hostility_parameter:0 "Other [GetReligionByKey('calradian_religion').GetAdjective] faiths consider our [faith|E] to be $hostility_hostile_tooltippable$."
 special_doctrine_ascensionist_name:0 "Ascensionist"
 special_doctrine_ascensionist_desc:0 "This faith has an Ascensionist stance on the [GetReligionByKey('calradian_religion').GetName], believing that rather than the Vague God granting the Mandate out to emperors to rule over the world, it is instead given to mortals so that they can ascend to Heaven. Without this mandate, souls will eternally reincarnate within Earth, until they one day are granted the Mandate."
 doctrine_parameter_hostility_override_special_doctrine_ascensionist:0 "Other Ascensionist [faiths|E] are considered to be $hostility_astray_tooltippable$ instead of $hostility_hostile_tooltippable$."
 special_doctrine_darusian_name:0 "Darusian-Mandatist"
 special_doctrine_darusian_desc:0 "This faith has a Darusian stance on the [GetReligionByKey('calradian_religion').GetName], believing that Darusos will return again to lead humanity in a grand new Empire of God in paradise."
 doctrine_parameter_hostility_override_special_doctrine_darusian:0 "Other Darusian [faiths|E] are considered to be $hostility_astray_tooltippable$ instead of $hostility_hostile_tooltippable$."
 special_doctrine_postmandatist_name:0 "Post-Mandatist"
 special_doctrine_postmandatist_desc:0 "This faith has an Post-Mandatist stance on the [GetReligionByKey('calradian_religion').GetName], heavily influenced by the fall of the Calradian Empire. Post-Mandatist belief is structured around a prophesized rebirth of the Empire. Whether this would be a return of the Calradian Empire, or paradise, is a subject of much debate between the Post-Mandatists."
 doctrine_parameter_hostility_override_special_doctrine_postmandatist:0 "Other Ascensionist [faiths|E] are considered to be $hostility_astray_tooltippable$ instead of $hostility_hostile_tooltippable$."

