 # Gaozi was a Chinese philosopher 
 daoxue_ph: "Gaozism"
 daoxue_ph_adj: "Gaozism"
 daoxue_ph_adherent: "Gaozist"
 daoxue_ph_adherent_plural: "Gaozist"
 daoxue_ph_desc: "Gaozians adhere to the teachings of [Glossary( 'Gàozǐ', 'GAOZI_GLOSS' )] and strictly believe that the state must instill morality into both how it conducts itself but also into the people it governs."
 GAOZI_GLOSS: "Gàozǐ was a philosopher who founded a belief system around human morality and conduct, believing human nature is neither inherently good nor evil, but rather something malleable like the flow of water. His teachings would go on to inspire later rulers of $h_china$"

