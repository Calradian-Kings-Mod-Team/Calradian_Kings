 Imp_Calradios_obscured_desc: "The Holy Imperial Father, a son of Heaven who led his band of exiles into the land that would come to be known as Calradia."
 Imp_Rhovanis_obscured_desc: "Trusted companion of Calradios in exile and founder of the Hagía Hédra, and therefore the Calradic Church.\n\nRhovanis wrote much of the scripture read today alongside the Five Saints, whom themselves would wander into the world to proselytize Heaven's Mandate."
 Imp_Echerion_obscured_desc: "Slayer of tyrants, first Consul of Calradia, no man embodies the spirit of Calradia than Echerion!\n\nGlory to his house and his name, for through him the legacy of Calradia will endure!"
 Imp_Darusos_obscured_desc: "O' blessed Son of Heaven!\nBeloved saintly custodian of the Empire!\n\nWoe to all who dealt with Hell to squander your Mandate.\n\nYour compassion and love of your subjects made you the enemy of evil. Now, you rest among the heroes of Calradia as we conduct the mission you commanded us to complete!"