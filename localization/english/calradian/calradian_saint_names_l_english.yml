 Imp_Calradios_obscured_desc: "#color_porple;medium_glow The Holy Imperial Father, a son of Heaven who led his band of exiles into the land that would come to be known as Calradia.#!"
 Imp_Rhovanis_obscured_desc: "#color_porple;medium_glow Trusted companion of Calradios in exile and founder of the Hagía Hédra, and therefore the Calradic Church.\n\nRhovanis wrote much of the scripture read today alongside the Five Saints, whom themselves would wander into the world to proselytize Heaven's Mandate.#!"
 Imp_Echerion_obscured_desc: "#color_porple;medium_glow Slayer of tyrants, first Consul of Calradia, no man embodies the spirit of Calradia than Echerion!\n\nGlory to his house and his name, for through him the legacy of Calradia will endure!#!"