l_english: 
 ### Bathe in the Olokun River (from special building)
 oroki_bathe_in_waters: "Bathe in the Olokun River"
 oroki_bathe_in_waters_desc: "Olokun, the water òrìṣà, blessed humanity with the waters of his namesake before he left for the seas. Bathing oneself in the divine waters is thought to cure many ailments, but for many the warm waters are enough to just relax in.\n\nI have an opportunity to take this moment to either cleanse myself or just relax."
 oroki_bathe_in_waters_desc_non_faith: "From what I have gathered by locals, the waters of this great river are said to have medicinal purposes but others say the warm waters provide an excellent moment for relaxation from a day's work."
 oroki_bathe_in_waters_desc_pregnant: "\n\nLocal mothers are also saying the waters helped with any troubled pregnancies. Perhaps they will help me too?"
 oroki_bathe_in_waters_confirm: "I smell like death!"
 olokun_wash_self_effect: "$EFFECT_LIST_BULLET$Locals and [adventurers|E] can take the [GetDecisionWithKey('oroki_bathe_in_waters').GetName] [decision|e] to reduce [stress|E] and gain [health|E] benefits"
 oroki_bathe_in_waters_tooltip: "You will bathe and relax in the warm waters of the Olokun River"
 oroki_bathe_in_waters_notification: "Relaxed in the clear, warm waters of the Olokun"
 # Important Action
 action_bathe_in_olokun: "Bathe in the Olokun River"
 action_bathe_in_olokun_label: "@activity_hike! Wash yourself in the Olokun River"
 action_bathe_in_olokun_desc: "Because you are near the [GetBuilding('olokun').GetName], you can choose to relax and wash yourself in its warm waters."
 action_bathe_in_olokun_click: "#I Click to view#!"

 ### Read the Mahdi Tomes (sacred books)
 read_the_mahdi_tomes: "Read the Tomes of the Mahdi"
 read_the_mahdi_tomes_desc: "To better enlighten ourselves with the struggles and tribulations of the [Glossary( 'Mahdi', 'CK_GLOSS_MAHDI' )], we must first reflect on his life in written words. If I am seeking to conduct his trials, learning these things will also ensure my success should the marabouts deem me worthy of the title of Mahdi.\n\nIf I decide on this, I will travel to the sacred city of [GetBuilding('indurar').GetName] and learn from the many tomes left behind by the Mahdi and his subsequent followers."
 read_the_mahdi_tomes_effect_tt: "You travel to [GetTitleByKey('b_saajid').GetNameNoTier]:\n$EFFECT_LIST_BULLET$Visit the vast library in [GetBuilding('indurar').GetName]\n$EFFECT_LIST_BULLET$Can leave at any time"
 read_the_mahdi_tomes_confirm: "Let me get my ink and quill!"
 read_the_mahdi_tomes_tooltip: "You will travel to the library of [GetBuilding('indurar').GetName] and read on the Mahdi, improving your own [skills|E] as well."
 declare_myself_the_mahdi: "Declare Myself the Mahdi"
 declare_myself_the_mahdi_desc: "Having completed my trials and holding dominion over most of the Azrughen, no one will oppose me declaring myself [Glossary( 'Mahdi', 'CK_GLOSS_MAHDI' )] this day! I will bring our people back together under a holy rule not seen for nearly a thousand years!\n\nLet the foreign tyrants quake!\n\nLet all detractors learn the holy word!\n\nLet the people chant my name! #EMP "[ROOT.Char.GetFirstNameNicknamedNoTooltip]! [ROOT.Char.GetFirstNameNicknamedNoTooltip]! [ROOT.Char.GetFirstNameNicknamedNoTooltip]!"#!"
 declare_myself_the_mahdi_confirm: "Glory to the Prophesized One!"
 declare_myself_the_mahdi_effect_tt: "Choose an aspect of the Mahdi you wish to commit to"
 declare_myself_the_mahdi_tooltip: "Declare yourself the Mahdi, the prophesized one, to all. There will be detractors however."
 finished_all_mahdi_steps_tt: "Completed all "Path of the Mahdi" [pilgrimages|El]"
 control_over_half_of_the_west_nahasa_tt: "You must [completely_control|E] at least 30% of [GetGeographicalRegion('wb_province_west_nahasa').GetName] [region|E] (Current: [SCOPE.ScriptValue('held_counties_in_west_nahasa_percentage')|0]%)"
 control_over_half_of_the_west_nahasa_no_one_else: "No one else must [completely_control|E] at least 30% of [GetGeographicalRegion('wb_province_west_nahasa').GetName]"