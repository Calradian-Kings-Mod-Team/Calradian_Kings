l_english:
 treasure_hunting_contract_decision_option_search_region_darshi: "[GetGeographicalRegion('region_darshi_west').GetNameNoTooltip]"
 search_region_darshi_tooltip: "$search_region_tooltip$ [GetGeographicalRegion('region_darshi_west').GetName]"
 # Delivering Herd - laamp_ck_deliver_herd
 laamp_ck_deliver_herd_contract: "Cattle Herding"
 laamp_ck_deliver_herd_desc_title: "To all respect cattle wranglers,"
 laamp_ck_deliver_herd_desc: "The [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] of [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] is asking all good livestock wranglers for assistance in delivering heads of livestock."
 laamp_ck_deliver_herd_request: "This [task_contract|E] requires you to bring your employer their desired number of livestock from nearby provinces."
 ck_contract_event.0001.tt_deliver_herd: "You will [travel|E] to [task_contract_destination.GetName] escorting cattle"
 invalidated_laamp_ck_deliver_herd: "[GetTaskContractType('laamp_ck_deliver_herd').GetName] contract"
 # Vedmak's Treasure
 laamp_ck_vedmak_treasure_contract: "A Vedmak's Treasure"
 laamp_ck_vedmak_treasure_desc_title: "To all [TaskContract.GetEmployer.GetFaith.HighGodName]-fearing mercenaries,"
 laamp_ck_vedmak_treasure_desc: "The [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] of [TaskContract.GetEmployer.GetPrimaryTitle.GetNameNoTier] is asking for assistance in driving out a local [Glossary( 'vedmak', 'VEDMAK_GLOSS' )] from our lands who continues to extort our people with threats of black magic!"
 VEDMAK_GLOSS: "A Vedmak is a male witch, in the lands of the Sturgians, who tends to make a living from healing and so-called love potions. However, angering a vedmak can cause mass hysteria and paranoia in a populace prone to superstition, believing a vedmak also deals in black magic."
 laamp_ck_vedmak_treasure_request: "This [task_contract|E] requires you to seek out the vedmak and have them leave the locals alone."
 ck_contract_event.0001.tt_deliver_herd: "You will [travel|E] to [task_contract_destination.GetName] and seek out the vedmak in the wilderness"
 invalidated_laamp_ck_vedmak_treasure: "[GetTaskContractType('laamp_ck_vedmak_treasure').GetName] contract"