 # ep2_locale_events.2501 - Larp as the Pope
 ep2_locale_events.2501.t.ck: "$tournament_locale_tailor$: Papás-sable Clothing"
 ep2_locale_events.2501.desc.ck: "The fabrics and textiles on offer at the tailor range from rough hemp all the way up to the finest damasks, velvets, and sable furs. As I peruse through them alongside my [ROOT.Char.Custom2('RelationToMeShort', random_knight)] [random_knight.GetFirstName], a strangely familiar pattern makes me pause.\n\nHefting the full robe into the light, my eyes widen. It is a full reconstruction of a Papás' regalia!\n\n"We have some for Cardinals too, [ROOT.Char.Custom('FormOfAddressForLiege')]!" [tournament_tailor.GetFirstName] the tailor hovers behind the two of us. [random_knight.GetFirstNamePossessiveNoTooltip] eyes are shining with glee as [random_knight.GetSheHe] nudges me furiously in the ribs. The tailor speaks again.\n\n"And that one comes with a matching hat.""