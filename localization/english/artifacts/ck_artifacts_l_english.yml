 artifact_pedestal_reliquary_calradic_sandals:1 "the shattered purported blade of Catomenys' sword"
 artifact_pedestal_reliquary_calradic_sandals_name:1 "Shattered Sword"
 artifact_pedestal_reliquary_calradic_girdle:1 "one of many girdles worn by Calyta, Darusos' $relation_wet_nurse_female$"
 artifact_pedestal_reliquary_calradic_girdle_name:1 "girdle of Calyta"
 artifact_pedestal_reliquary_calradic_skull: "ash-blessed vestiges of a holy man"
 artifact_pedestal_reliquary_calradic_skull_name: "skull of Arthon the Blaze"
