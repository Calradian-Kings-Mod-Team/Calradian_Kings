artifact_pedestal_crown_calradios_name:0 "Crown of Calradios"
artifact_pedestal_crown_calradios:1 "This is the ancient crown of Calradios the Great: golden and inlaid with precious stones, it still holds all the authority and learning of the glorious conqueror!"
artifact_arms_of_alix_name:0 "Alixenus's Armor"
artifact_arms_of_alix_description:0 "This ancient set of laminated linen armor is said to have once belonged to Alixenus the Great. While no longer fit for wear, the armor itself carries the legacy of the great conqueror, known from the Perassic to the edges of the Near East."
artifact_dagger_of_sam_name:0 "Blade of Sām"
artifact_dagger_of_sam_description:0 "This intricate shortsword is claimed to be the one that Sām used to kill the great tyrant demon, Xandarās."
 
artifact_scroll_aserai_name: "Writings of Asera"
artifact_scroll_aserai_description: "This is purportedly one of the Prophet's original writs, passed through the tribe in the hopes of guiding those on $aserai_religion$."

 artifact_pedestal_reliquary_aserai_name:0 "[SCOPE.Custom('IslamRelic')|U]"
 artifact_pedestal_reliquary_aserai_description:1 "An elegant reliquary containing a holy relic: [SCOPE.Custom('IslamRelic')|l]."
 artifact_pedestal_reliquary_6050_ck_saint_name:1 "Holy Finger of [6050_holy.GetTitledFirstNameNoTooltip]"
 artifact_pedestal_reliquary_6050_ck_saint_desc:1 "An elegant reliquary containing a holy relic: the finger of a local saint, [6050_holy.GetTitledFirstNameNoTooltip]."
 artifact_throne_stone_scone_name_ck:0 "Stone of Glanys"
 artifact_throne_stone_scone_ck:0 "A simple seat of dark volcanic rock on which all monarchs of Battania have been crowned since High King Kangrith."
 artifact_byz_throne_name_ck:0 "Throne of Calradios"
 artifact_byz_throne_description_ck:0 "An elegant throne from which the Calradian Emperors administer justice with wisdom equal to their founding king. Its most distinguished feature is the hidden mechanism that allows it to be risen as high as the ceiling and then lowered again."
 artifact_sculpture_armor_babr_ck:0 "This is the legendary Babr-e Bayan, the armor worn by the Darshi hero Rostam."
 artifact_pedestal_spear_destiny_name_ck:0 "Spear of Heaven"
 artifact_pedestal_spear_destiny_ck:0 "This is the head of a spear, said to have been used by [Glossary( 'Catomenys', 'CK_CATOMENYS_GLOSS')] to pierce a Darshi Padishah's great elephant."
 artifact_pedestal_crown_thorns_name_ck:0 "Holy Laurel"
 artifact_pedestal_crown_thorns_ck:1 "The entirely preserved Laurel Crown of Darusos, worn during his crucifixion"
 artifact_pedestal_veil_veronica_name_ck:1 "Veil of Silvina"
 artifact_pedestal_veil_veronica_ck:1 "The authentic Veil of Silvina: a piece of cloth on which Darusos' face was miraculously impressed during his crucifixion. It is said to heal the ill through the Grace of Heaven"
 artifact_sculpture_religious_deianiras_name: "Statue of Deianiras"
 artifact_sculpture_religious_deianiras_description: "A carved and painted statue of the Mother of Darusos. The base is inscribed with a quote from the [owner.GetFaith.GetAdjective] [owner.GetFaith.ReligiousText]."
 # Crown of Justinian Rename
 artifact_pedestal_crown_justinian_name_ck: "Crown of Catomenys"
 artifact_pedestal_crown_justinian_ck: "This is the ancient crown of Emperor Catomenys: golden and inlaid with precious stones, it still holds all the authority and learning of the legendary founder of the Calradian Empire."

