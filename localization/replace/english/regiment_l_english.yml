l_english:
 huscarl: "Hearthguards" # from the warsails tree
 huscarl_flavor: "#F Nordvyg Hearthguards are masters of using shield walls to block incoming volleys of arrows.#!"
 landsknecht_flavor: "#F $balian_prefix$ Landsknechts can use their massive zweihanders to tear through the massed ranks of enemy spearmen.#!"
 longbowmen_flavor: "#F Though they require a lifetime to properly master, these longbows are powerful enough to pierce plate and can loose volleys at an almost-unequaled rate.#!"
 goedendag_flavor: "#F The $rhodok_prefix$ goedendag is a spiked club which can be braced against cavalry charges.#!"
 gendarme_flavor: "#F Gendarmes are the shining pinnacle of heavy cavalry, inspiring awe around the world.#!"
 chasseur_flavor: "#F These knights have mastered both horsemenship and desert tactics.#!"
