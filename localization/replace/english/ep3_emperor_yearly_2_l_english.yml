 ep3_emperor_yearly.2140.desc: ""Managing [ROOT.Char.GetPrimaryTitle.GetDefinitiveName] is an expensive business, and I might have been a bit too careless with our finances. Debts have been piling up upon debts, and the coffers are empty.\n\nWhere can I get some gold #EMP right now#!?\n\nA shameful, blasphemous, #EMP brilliant#! idea suddenly hits me: the great emperors of days past have always been buried with luxurious grave goods! I would only need to reappropriate some of these goods to pay for our debts. All these riches belong to the Empire anyway, don't they?""