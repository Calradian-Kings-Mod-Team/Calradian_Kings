 doctrine_temple_authority_name:0 "Halakh'ta Authority"
 doctrine_temple_authority_desc:0 "Halakh'ta refers to a set of laws and rules by which an Arazi must live their life. After centuries of displacement and war, Arazi groups diverged into numerous schools of thought on how to properly interpret Araz's Song."
 temple_authority_rabbinic_doctrine_name:0 "Maric"
 temple_authority_rabbinic_doctrine_desc:0 "Maric Arazi believe that the Halakh'ta can be interpreted by the Kohanim alone. They believe in the Written and Oral Song, passed on through the Kohanim. All Maric belief is codified in the Husnqid Dat, which is held as the primary source from which Halakh'ta is interpreted and distributed."
 temple_authority_toric_doctrine_name:0 "Sufet"
 temple_authority_toric_doctrine_desc:0 "Sufetic Arazi rejects the Dat and the Oral Song, passing authority to the written Song alone. Kohanim cannot change or adapt the Halakh'ta, their duty is solely to interpret the Song's literal meaning."
 temple_authority_kohanim_doctrine_name:0 "Hahmim'nal"
 temple_authority_kohanim_doctrine_desc:0 "Hahmim'nal Arazi asserts that their Court of the Law of Araz is the ultimate authority of the Written and Oral Songs of Araz. They hold among their truths the belief that Arishat, daughter of Ahumm, consorted with Araz and gave birth to birthed [Glossary('Safan','CK_GLOSS_SAFAN')], the forefather of all Safanit."
 CK_GLOSS_SAFAN: "And so Araz said to Safan, "You are my body, my blood, Our God, and through this covenant you shall shepherd our children to a land of their own.""
 temple_authority_samaritan_torah_doctrine_name:0 "Samaritan"
 temple_authority_samaritan_torah_doctrine_desc:0 "The Samaritans reject the authority of the Halakh'ta altogether, instead granting supreme authority to the Samaritan Halakh'ta. Their rejection of the Halakh'ta causes them to be universally seen by their fellows as heretics."

 tenet_communal_identity_chosen_people_name:0 "Chosen People"
 tenet_communal_identity_chosen_people_desc:0 "We were chosen by [ROOT.Faith.HighGodName] for a holy covenant. While this unites our people with a single purpose, it can act as a deterrence to converts."

 prophecy_of_malachi_name: "The Prophecy of [Glossary('Azariah','CK_GLOSS_AZARIAH')]"
 prophecy_of_malachi_desc: "Under traditional Arazi doctrine, a new High Priest can only be named either with the coming of the Prophet or if a descendant of [Glossary('Safan','CK_GLOSS_SAFAN_EXPLAINER')] fit to serve as priest is found."
 CK_GLOSS_SAFAN_EXPLAINER: "Safan is said to be the firstborn of Araz or God, and the first patriarch to the Safanits."
 CK_GLOSS_AZARIAH: "Azariah was a priest of the angel, Zurran, who foresaw a High Priesthood devoid of its purpose and piety, with women consorting with men out of the faith, and until a day comes when a sire of Safan returns, the Priesthood would remain empty.."
 
 special_doctrine_maitreya_hostility_desc: "$maitreya_adherent_plural$ seek to destroy all other followers of the Buddha's teachings. While not all follow the same path, the ways of $maitreya$ are intolerable."