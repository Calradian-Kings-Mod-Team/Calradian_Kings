 special_tolerance_name: "Mandate Stance"
 special_doctrine_ecumenical_christian_name: "Mandatist"
 special_doctrine_ecumenical_christian_desc: "This faith has a Mandatist stance on the [GetReligionByKey('calradian_religion').GetName], believing that the Mandate is both a spiritual and physical thing. It can be achieved on earth and represented in Empire, as was the case with the Empire of Calradios and many subsequent rulers."
 doctrine_parameter_hostility_override_special_doctrine_ecumenical_christian: "Other Calradian [faiths|E] that have the #High $special_doctrine_ecumenical_christian_name$#! doctrine are considered [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] instead of $hostility_hostile_tooltippable$"
 #  adoptionist_school_name: "Adoptionist Creed"
#  special_doctrine_adoptionist_school_elipandic_doctrine_name: "Elipandic School"
 special_doctrine_adoptionist_school_elipandic_doctrine_desc: "Preferring to focus on subtle variations in Darusology, the Elipandic variant of $adoptionist$ stresses the importance of #EMP precise#! differences from Trinitarian dogma. A complex distinction well made is considered infinitely better than a simple explanation poorly justified."
#  special_doctrine_adoptionist_school_felicitous_doctrine_name: "Felicitous School"
#  special_doctrine_adoptionist_school_felicitous_doctrine_desc: "Felician $adoptionist$ believes in practicality above purity, understanding that it must work within hostile systems to undermine them. A heinous lie in pursuit of a noble cause is thought to be worth a thousand blunt truths."
 special_doctrine_adoptionist_school_radical_doctrine_name: "Radical School"
 special_doctrine_adoptionist_school_radical_doctrine_desc: "Radical $adoptionist_adherent_plural$ admit no God but Heaven, accept no divinity from mortal flesh, and acknowledge no $christianity_religion_adherent_plural$ but themselves. To receive Darusos without agreeing on every #EMP letter#! of canon is to acknowledge apostasy."

 special_doctrine_is_christian_faith_name: "Will of Heaven"
#  is_christian_faith_name: "$special_doctrine_is_christian_faith_name$"
 special_doctrine_is_christian_faith_desc: "There are those who seek the guidance of Heaven, but are confused about its true nature. This is to be expected, and we should not treat them as sinners, but as those who have just begun their walk on the path of [Glossary( 'Calradios', 'CK_CALRADIOS_GLOSS')]."
 doctrine_parameter_hostility_override_tenet_christian_syncretism:3 "Non-Calradic [faiths|E] with the $tenet_christian_syncretism_name$ tenet are considered [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] instead of $hostility_evil_tooltippable$"

 doctrine_parameter_mandatory_hajj: ""
