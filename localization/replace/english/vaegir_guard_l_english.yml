l_english:
 # Cultural MaA
 bondi:0 "Bondí"
 vigmen:0 "Vigmen"
 varangian_veterans:0 "Vaegir Veterans"
 jomsviking_pirates:0 "Skolderbroda"

 # MaA Flavour
 bondi_flavor:0 "#F The Bondí are part of a class of free landholders, often competent sailors, that use longships to trade or to go viking. They fight using spears and shields.#!"
 vigmen_flavor:0 "#F Warriors in the front present an impenetrable wall of shields to protect archers in the rear. This tactic deters skirmishers while allowing a steady advance.#!"
 varangian_veterans_flavor:0 "#F Explorers, adventurers, warriors, and mercenaries from all around the far-flung Nordic colonies. Some have even served in the Vaegir Guard.#!"
 jomsviking_pirates_flavor:0 "#F Some of the most notorious reavers ever to ply the Byalic, the Skolderbroda excel at injecting chaos into battle, drawing it out before excelling in the aftermath.#!"

 varangian_guards: "$varangian_guards_ck$" # Vaegir Guards, static plural
 vaegir_guard_link: "[GetMaA('varangian_guards_ck').GetName]" # dynamic link when called for, plural
 vaegir_guard_icon: "@varangian_guard_icon![GetTrait('varangian').GetName(GetNullCharacter)]" #trait_varangian=>Vaegir, singular
 vaegir_guard_noun: "$d_vaegir_guard_article$#glow_color:{0.7,0.7,0.7,1} $d_vaegir_guard$#!" #the Vaegir Guard, not an actual GetTitleByKey('d_vaegir_guard')
 vaegir_guard_phrase: "#color:{0.7,0.7,0.7,1} Guards#!" # replacing Varangians with just Vaegirs sounds weird - can pull from bodyguard/akolouthos_court_position if those are renamed further
#interaction
 send_to_varangian_guard_interaction: "Send to $vaegir_guard_noun$ #weak (Dynasty)#!"
 send_to_varangian_guard_interaction_desc: "$dynasty_interaction_header$Send [recipient.GetShortUINameNoTooltip] away to gain glory and fortune in the $vaegir_guard_noun$. Who knows, it might even help build character!"
 send_to_varangian_guard_interaction_toast: "[recipient.GetShortUIName] left for $vaegir_guard_noun$"
#  send_to_varangian_guard_interaction_toast_desc: "Fame and glory awaits!"
 clan_unity_vaering.desc: "sent [unity_target.GetName] to $vaegir_guard_noun$"
#culture/effects
 LEGACY_DYNASTY_MEMBERS_GAIN_BONUS_TROOPS_WHEN_VARANGIAN_ADVENTURING: "Receive bonus troops above the cap when [varangian_adventuring|E]\n[dynast_interaction|E]: #V $send_to_varangian_guard_interaction$#!\n#weak The [dynast] gains the ability to pay [prestige] [prestige_i] in order to send away unlanded adult [dynasty] members to potentially gain [skills] and [traits]#!"
 send_to_varangian_guard_interaction_effect_desc: "#weak While serving in the $varangian_guards$, [CHARACTER.GetShortUIName] might increase [CHARACTER.GetHerHis] [skills|E] or gain [traits|E] — but [CHARACTER.GetSheHe] might also become wounded, or worse. [CHARACTER.GetSheHe|U] will return within a few years, but cannot be recalled.#!"
 culture_parameter_unlock_akolouthos: "Can appoint the [GetCourtPositionType('akolouthos_court_position').GetName()] [court_position|E], when $vaegir_guard_noun$ has been founded."
#events
 varangian_arrived.title: "A New Guard"
 varangian_arrived.desc: "[varangian_candidate.GetShortUIName] has joined $vaegir_guard_noun$"

 varangian.0002.t: "$vaegir_guard_noun|U$"
 varangian.0002.opening: "By the time [varangian_candidate.Custom2('MyCharacterIntroduction', ROOT.Char )] comes to me with [varangian_candidate.GetHerHis] plan, [varangian_candidate.GetSheHe] seems to have already made up [varangian_candidate.GetHerHis] mind.\n\n\"Serving with the $vaegir_guard_link$ in"
 varangian.0002.miklagard: "$b_palace_district$"
 varangian.0002.elsewhere: "the [emperor.GetTitleTierNamePossessive] $vaegir_guard_phrase$"
#  varangian.0002.end:0 "will bring both wealth and glory!"\n\nI cannot deny that part, but I could deny [varangian_candidate.GetHerHis] request. On the other hand, would it be right to stop someone in their pursuit of glory?"
 varangian.0002.a: "#P Go,#! with [ROOT.Char.GetFaith.WarGodNamePossessive] blessing!"
 varangian.0002.b: "#N No,#! I forbid it! You are needed here."

 varangian.1002.t: "Returning From $vaegir_guard_noun$"
 varangian.1002.opening: "I barely recognize [returning_varangian.Custom2('MyCharacterIntroduction', ROOT.Char )] when [returning_varangian.GetSheHe] appears in my [SelectLocalization( IsLandlessAdventurer( ROOT.Char ), 'camp', 'great_hall')]."
 varangian.1002.new_partner: "And I certainly don't recognize the [partner.GetWomanMan] at [returning_varangian.GetHerHis] side!"
 varangian.1002.ending: "\n\n"I am back, [returning_varangian.Custom2('RelationToMeShort', ROOT.Char )]!" [returning_varangian.GetFirstNameNoTooltip] bellows. "There was many a time I thought I would never see your likes again, but I have returned at last."\n\nAs strange as it is to see my [ROOT.Char.Custom2('RelationToMeShort', returning_varangian )] after all these years, I cannot deny that I am impressed with [returning_varangian.GetHerHis] [emperor.GetCulture.GetNameNoTooltip] dress, [returning_varangian.GetHerHis] foreign jewelry, and the heavy coffer [returning_varangian.GetSheHe] has brought with [returning_varangian.GetHerHim]."
 varangian.1002.a: "Welcome home, [returning_varangian.GetFirstNameNoTooltip]!"

 varangian.3001.t: "$vaegir_guard_noun$: An Honorable Death"
 varangian.3001.desc: "[varangian.Custom2('MyCharacterIntroduction', ROOT.Char)] has died while serving in the $vaegir_guard_phrase$!\n\nI have received a missive from the [emperor.GetTitledFirstName] praising [varangian.GetHerHis] name, and describing how [varangian.GetSheHe] fought valiantly to save the life of the [emperor.GetTitleAsNameNoTooltip] from vicious assassins.\n\nNothing can ever bring [varangian.GetFirstNameNoTooltip] back, but the posthumous reward of gold from the [emperor.GetTitleAsNameNoTooltip] helps ease the sorrow."
 varangian.3001.a: "[GetTrait('brave').GetName(varangian)] until the end, [varangian.GetFirstNameNoTooltip]..."

 ep3_akolouthos_events.1000: "Akolouthos Steels the $vaegir_guard_icon$"
 ep3_akolouthos_events.1000_varangian_notification_tooltip: "[akolouthos.GetName] honors a redoubtable $vaegir_guard_phrase$[trait_getter.GetWomanMan] with [trait_getter.GetHerHis] ruby earring and dragon-emblazoned armor."
 ep3_akolouthos_events.1000_loyal_notification_tooltip: "[akolouthos.GetName] renews the $vaegir_guard_link$ oaths of loyalty unto death."
#  akolouthos_effect_tooltip: "From [GetCourtPositionType('akolouthos_court_position').GetName()] [court_position|E]"

 ep3_akolouthos_events.1001: "Akolouthos Recruits $vaegir_guard_icon$"
#  ep3_akolouthos_events.1001_notification_tooltip: "[akolouthos.GetName] presents a worthy warrior, one who has traveled far to serve the [ROOT.Char.GetTitleAsNameNoTooltip]."

 ep3_emperor_yearly.3000.t: "The Palace-Pillaging Right"
 ep3_emperor_yearly.3000.desc: "Hulking, hairy $vaegir_guard_link$ stagger about my new imperial halls, their arms laden with gold and jewels.\n\nWith [dead_emperor.GetTitledFirstNamePossessive] death, those who would have defended him to the last have taken to the treasure-chambers. It is their traditional right, and none dare stop these elite foreigners from claiming glittering bonuses.\n\nThis is the price paid to keep my $vaegir_guard_link$, my oathsworn hounds, content on their leashes.\n\n"

ep3_emperor_yearly.3000.desc_leader: "And so, under [varangian_leader.GetFullName], they reach into the purse of [ROOT.Char.GetFaith.HighGodNamePossessive] chosen monarch."
ep3_emperor_yearly.3000.desc_no_leader: "And so the $vaegir_guard_icon$ reach into the purse of [ROOT.Char.GetFaith.HighGodNamePossessive] chosen monarch."

 ep3_emperor_yearly.3000.a: ""Stop them, Akolouthos! Recover my gold!""
 ep3_emperor_yearly.3000.a.flavor: ""[varangian_leader.GetFirstNameNoTooltip]! You were named leader of the Guard so you might control the Guard. #EMP Do so!#!""
#  ep3_emperor_yearly.3000.b: "A custom or no, I will chastise these brutes!"
#  ep3_emperor_yearly.3000.b.flavor: "Let them have their pay — but the Imperial palace must have its dignity. Examples should be made!"
#  ep3_emperor_yearly.3000.c: "Loyalty has its price."
ep3_emperor_yearly.3000.c.flavor: "The $vaegir_guard_phrase$ forego regular rich salaries and travel far seeking this great windfall." 
ach_coronation.0015.d.byzantines: "Set loose the $vaegir_guard_icon$!"
court_position_desc_akolouthos: "leading the imperial guard, particularly the imposing Vaegirs."

disrespected_varangians_modifier: "Disrespected the $vaegir_guard_phrase$"
disrespected_varangians_modifier_desc: "Challenging $vaegir_guard_noun$'s right to a bonus has seriously damaged their loyalty, and that of similar hired troops."
major_gold_to_varangians_tooltip: "You pay [gold_i]#negative_value 75#! due to #high 3#! $vaegir_guard_icon$ [court_position|E] holders"
medium_gold_to_varangians_tooltip: "You pay [gold_i]#negative_value 50#! due to #high 2#! $vaegir_guard_icon$ [court_position|E] holders"
minor_gold_to_varangians_tooltip: "You pay [gold_i]#negative_value 25#! to a $vaegir_guard_icon$ [court_position|E] holder"

loyal_varangians_modifier: "Valiant $vaegir_guard_phrase$"
loyal_varangians_modifier_desc: "Bolstered by unshakable $vaegir_guard_link$, this character's heavy infantry formations stand firm and strike hard."

attentive_varangians_modifier: "Dutiful $vaegir_guard_phrase$"
attentive_varangians_modifier_desc: "Rewarded well for their service, $vaegir_guard_link$ eschew brawling and carousing in favor of diligent protection."
eager_varangian_army: "Vaegir Horde"
ep3_emperor_yearly.8050.b.byz: "I could use such a brazen $vaegir_guard_icon$."
# frankokratia_byz_slaughter_varangian_tooltip: "Amidst the carnage wrought by the raging Latins, #N [slaughtered_byzantines]#! nobles were slaughtered.\n\nVarangians led by [varangian_victim.GetShortUIName] defended the imperial family to the bitter end."
 single_combat.0001.tt.stoic_veteran: "#BOL Stoic Veteran:#! using your $vaegir_guard_icon$ experience, you hew at [my_foe.GetFirstNameNoTooltip]"
 single_combat.0001.desc.my_feedback.stoic_veteran: "The $vaegir_guard_link$ doesn't encourage laxity. It takes a vigilant eye and a firm arm to excel as one of the Emperor's bodyguards, and with every blow, I show [my_foe.GetFirstNameNoTooltip] how the $vaegir_guard_icon$ fight."
 single_combat.0001.desc.opponent_response.stoic_veteran: "[my_foe.GetFirstNamePossessiveNoTooltip] time in the $vaegir_guard_link$ has left [my_foe.GetHerHim] stoic, brutal, and deadly with [my_foe.Custom('SignatureWeaponArticle')] [my_foe.Custom('signature_weapon')], delivering [my_foe.Custom('SignatureWeaponAttemptedHeavy')] after [my_foe.Custom('SignatureWeaponAttemptedHeavy')] to my torso."
 single_combat.0031.desc.sc_attacker.stoic_veteran: "In $vaegir_guard_noun$, we chiefly protected the Emperor against assassins, but most assassins flee at the sign of heavily-armed $vaegir_guard_icon$. My opponent, to [sc_victor.GetHerHis] credit, doesn't seem phased by my intimidating appearance, and my stoic hewing is met by with determined parry after determined parry.\n\n"
 single_combat.0041.desc.opponent_response.stoic_veteran: "[sc_loser.GetFirstNameNoTooltip] uses [sc_loser.GetHerHis] [sc_loser.Custom('signature_weapon')] with all the competence typical of a $d_vaegir_guard$, hewing at me with long, even strikes of [sc_loser.GetHerHis] weapon. It's difficult, but nothing I'm not able to parry well enough.\n\n" 
 single_combat.0041.desc.opponent_response.stoic_veteran.fatality: "We fall into a tense pattern of strike-parry-riposte, with me slowly gaining the upper hand, wearing [sc_loser.GetFirstNameNoTooltip] down blow by blow, till [sc_loser.GetSheHe]'s accrued enough welts and wounds to kill most [sc_loser.GetWomenMen] twice over.\n\nEven [sc_loser.GetSheHe] has [sc_loser.GetHerHis] limits, though. And as the $vaegir_guard_noun$ collapses to [sc_loser.GetHerHis] knees, ready for the deathblow, it becomes clear that we both know it."

 # Saved by a Varangian
 murder_save.0010.t:0 "$murder_save_header$ $vaegir_guard_icon$"
 murder_save.0010.desc:0 "My attempt on [target.GetTitledFirstNamePossessive] life has been thwarted!\n\nThe assassin was stopped by one of those insipid $vaegir_guard_link$! I suppose the [target.GetTitleAsNameNoTooltip] got [target.GetHerHis] $vaegir_guard_phrase$ after all..."
#  murder_save.0010.varangian_dies:0 "\n\nAt least the assassin got the better of the guard. [varangian.GetTitledFirstName] won't get in my way again."
#  murder_save.0010.a:0 "I will never get [target.GetHerHim] now!"
#  murder_save.0010.b:0 "I need a new plan..."

