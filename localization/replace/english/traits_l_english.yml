 KYANOLIMOS_GLOSS: "The Blue Plague in Calradic, is a unique pestilence that attacks the body's blood vessels and tears them apart. The name comes from the grayish appearance of its victims, but most notably the dark blue spots on the skin where just beneath the surface the body is internally bleeding."
