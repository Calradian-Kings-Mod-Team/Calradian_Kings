l_english: 
#  feudal_government:0 "Feudal"
 feudal_government_desc:1 "\n$game_concept_feudal_desc$\n\n#F Feudalism was the dominant government form in Calradia between the 9th and the 15th century. The feudal system is based on the relationship between the landholder and those who provide services and labor in order to live there. The rulers who hold the land appoint vassals which are given fiefs to govern. In return, the vassals provide their liege with [soldiers|E] and [taxes|E].#!"
 
#  deqhan_special_rights_tax_collector: "Dehqan"
 deqhan_special_rights_tax_collector_flavor_desc: "Darshi magnates within an ancient, decentralized tax collection system, the deqhans closely manage their lands to promote productivity - and their own prestige."
