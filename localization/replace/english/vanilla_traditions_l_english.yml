 ## Combat Traditions ##
 tradition_horn_mountain_skirmishing_name: "$innovation_mountain_skirmishing_ck$"
 tradition_horn_mountain_skirmishing_desc: "The great mountains in the Horn of the Nahasa pose logistical challenges to many types of armies, but our skirmishers can easily adapt to these conditions to rout enemy invaders."
 tradition_land_of_the_bow_name:0 "Land of the Bow"
 tradition_land_of_the_bow_desc:0 "In a land of plenty, enriched by the Silver Sea and their own ingenuity, the Merechati have prospered for generations. For almost as long, the bow has been the weapon of choice to deter the raiders and brigands of the surrounding deserts."