l_english:
# a drop-in replacement for the "Orthodox Church" although it doesn't use the owner/creator faith key since the decision is locked
calradian_church: "[GetReligionByKey('calradian_religion').GetAdjective] [GetFaithByKey('calradic').HouseOfWorship]"
 artifact_wall_court_icon_large_name: "Large Icon"
 artifact_wall_court_icon_large_description: "An imposing icon, painted in the traditional style of the $calradian_church$, depicting a solemn religious scene: [owner.Custom('RandomIconTopic')]."
 artifact_wall_court_icon_small_name: "Small Icon"
 artifact_wall_court_icon_small_description: "A small but evocative icon, painted in the traditional style of the $calradian_church$, depicting in vivid colors a religious scene: [owner.Custom('RandomIconTopic')]"
 artifact_trinket_icon_name: "Portable Icon"
 artifact_trinket_icon_description: "A portable icon, painted in the usual style of the $calradian_church$, depicting a traditional religious scene: [owner.Custom('RandomIconTopic')]. Despite its diminutive size, the pictorial traits are neat, the colors are vivid, and the tone is solemn."
 convert_to_feudalism_from_administrative_decision_desc: "Less bureaucracy and more #EMP doing#! is what this realm needs. If [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] is to blossom, we must cut our ties with those things that hamper us."