l_english:
 #### GREAT SCHISM RELATED EVENTS ####
 ## pam_clergy_events_l_english.yml
 pam_clergy_events.0001.t: "Tíni Onómati Boúlei Kaleísthai?"
 pam_clergy_events.0001.desc: "My [chaplain.GetCouncilTitle|l] [chaplain.GetFirstName] turns to the next blank line in the register of Saint Peter's successors, a living testimony to [GetTenetType('tenet_apostolic_succession').GetName( GetPlayer.GetRite )].\n\n#emp \"The name you choose will outlive your reign by a thousand generations.\"#! \n\n[chaplain.GetHerHis|U] quill marks the place where the ink must be placed.\n\n#emp \"Tíni onómati boúlei kaleísthai?\"#!"
 pam_clergy_events.0030.desc: "White smoke proclaims the new [new_pope.GetTitledFirstName] in the center of [new_pope.GetCurrentLocation.GetName]:\n\n"May the Holy Founders Leosios and Paul, in whose power and authority we trust, intercede for us before the Lord. And may the blessing of Almighty Heaven, the Saint, and the Prophet, and the Holy Spirit of Darusos, come down on you and remain with you forever."\n\n"Amen.""
 pam_clergy_events.0030.a: "Glory to the throne of Saint Leosios."
 pam_clergy_events.0041.opening: "To the seat of Saint Leosios,"
 pam_clergy_events.0060.t.pope: "A [new_prelate.GetDynasty.GetNameNoTooltip] on Saint Leosios' Throne"
 pam_clergy_events.0060.desc.intro: "Long has our dynasty sought to guide [christendom|E]. Now [new_prelate.GetFaith.HighGodName|U] has seen fit to elevate the [new_prelate.GetDynasty.GetName] to new heights.\n\n"
 pam_clergy_events.0060.desc.pope: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] has been raised to the Throne of Saint Leosios, [new_prelate.GetFaith.HighGodNamePossessive] vicar on earth."
 ## jewish_events.txt
 jewish_events.0001.desc:0 "Throughout the centuries, it has been unclear whether or not taking multiple spouses is permissible, but following a small council of [ROOT.Char.GetFaith.GetName]'s most influential [ROOT.Char.GetFaith.PriestNeuterPlural], it has been decided that polygamy is no longer a pratice permitted by the [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] faith.\n\nThe decision is motivated largely from concern that one person would not be able to adequately provide for multiple spouses, and that the practice of polygamy can lead to spouses committing sinful acts of jealousy against one another."
 jewish_events.0001.c:0 "I think the [ROOT.Char.GetFaith.PriestNeuterPlural] forget their place!"
 ## pam_christian_situation_events_l_english.yml
 pam_the_christian_church.0061.desc: "Envoys from [schism_western_faith.GetReligiousHead.GetCapitalLocation.GetNameNoTooltip] have cast their sentence upon the altar:\n\n"May [schism_eastern_faith.GetReligiousHead.GetFirstName], falsely called [schism_eastern_faith.ReligiousHeadName], and all his followers be anathematized. [Glossary( 'Ouranè elthé', 'MARANATHA_GLOSS' )] with all heretics! Nay, with Darusos and his followers of devils, unless they should repent."\n\n"This impious declaration shall be anathematized along with those who edited it, wrote it, or had anything to do with it. Until the day they repent, all followers of the false prophet Darusos are no children of Heaven!" Replies [schism_eastern_faith.GetReligiousHead.GetTitledFirstNameNoTooltip].\n\nThe faithful are divided into [schism_western_faith.GetAdherentNamePlural] and [schism_eastern_faith.GetAdherentNamePlural]. My soul is now [ROOT.Char.GetFaith.GetAdjectiveNoTooltip]."
 MARANATHA_GLOSS: "An old Calradic cry meaning #bold "Heaven, come!"#! From From old scripture brought over with Calradios when he fled into exile before he founded his kingdom, it became a formula of anathema: those cursed are cast out until Heaven's final judgement arrives."
 ## Church Situation:
 #Fragile Unity Phase
 pam_the_christian_church.0051.desc.intro: "[GetSituation('the_christian_church').GetTopSubRegion.GetName] spans many realms and is composed of myriad, diverse peoples along with their tongues, cultures, and conflicts.\n\nWhile doctrinal disputes are as old as the Church, in these end times, ravaged by plague, war, and heresy, our unity is tested.\n\nAs [st_paul.GetName] united the Calradian exiles and proclaimed that none stand divided in this new land, so too should all [christians|E] heed [st_paul.GetHerHis] guidance and [Glossary( 'kai mē ē en hymin schismata', '1_CORINTHIANS_1_10_CALRADIAN_GLOSS' )]. If not, we shall find ourselves mired in heresy, to be but playthings for Hell.\n\n"
 pam_the_christian_church.0051.desc.unreformed_pagan: "Our soft-bodied neighbors, the [christians|E] follow their weak-willed conception of the afterlife called Heaven, bickering like children over the nature of their doll. All the while their vigilance is dulled, their swords starve, so long it's been since they've feasted on honest bloodletting.\n\nThey hope to send us holy men to spread their weakness in our lands. Might we make our own visitation and pillage their coffers! By our example they may learn again to be strong."
 pam_the_christian_church.0051.desc.heretic_rulers: "The jester in the seat of [st_peter.GetName] would name us heretics for being true believers to Heaven's cause. Were Calradios reborn, he would surely reclaim this land in the name of Heaven.\n\nLook at the division among us who call Heaven the divine force of nature! The false priest in the West is the seedman to this tillage of discord.\n\nThis vice regent of Hell would seek to martyr us. Truly this canker must be crucified for the salvation of all [christians|E]!"
 pam_the_christian_church.0051.desc.western: "With the Bishop of the West's power diminished we must mend these fissures in the faith as we approach the Last Judgement of Heaven." 
 pam_the_christian_church.0051.desc.eastern: "Hemmed in by enemies of Heaven, we must seek common cause with the Bishop of the West as we approach the Last Judgement."
 pam_the_christian_church.0051.a: "With Heaven as our guide!"
 pam_the_christian_church.0051.b: "We must keep an eye on these followers of Heaven."
 1_CORINTHIANS_1_10_CALRADIAN_GLOSS: "Old Calradic meaning, "and that there be no divisions among you""
 #Saeculum Obscurum Phase
 pam_the_christian_church.0052.desc.intro: "A chorus of voices ring out in the darkness that envelopes [GetSituation('the_christian_church').GetTopSubRegion.GetName].\n\n#EMP "Rome casts itself to play a modern Sodom!"#!\n\n#EMP "The Papás makes himself both pimp and prostitute!"#!\n\nEven those with a more tempered view must admit the Church is in crisis and reform must be sought." 
 pam_the_christian_church.0052.desc.unreformed_pagan: "Our weak-spirited neighbors, the [christians|E] cry out, "Our end is near! Our Papás is as savage as a pagan."\n\nAt least one of those things is true. Let us help them find the end they so often call into being!"
 pam_the_christian_church.0052.desc.heathen_rulers: ""Our Church is in crisis!" the [christians|E] cry out.\n\nGood of them to acknowledge what we have always known. These heathen fools may but hope to one day follow our example in embracing the ways of [ROOT.Char.GetFaith.HighGodName].\n\nTheir treasures, meager as they are, are there for the taking. Their people, ill disciplined as they are, are ripe for subjugation."
 pam_the_christian_church.0052.desc.heretic_rulers: "This incarnation of Hell in the robes of St. Rhovanis must be stopped!"  
 pam_the_christian_church.0052.desc.western: "Change must first be found in the West, only then can [GetSituation('the_christian_church').GetTopSubRegion.GetNameNoTooltip] heal."
 pam_the_christian_church.0052.desc.eastern: "Hemmed in by enemies of Heaven, we must cure the corruption in the West or be consumed by it."
 pam_the_christian_church.0052.a: "May Heaven light our path!"
 #Conversion Phase
 pam_the_christian_church.0053.desc.intro: "We must rejoice at the great progress of our mission! The borders of [GetSituation('the_christian_church').GetTopSubRegion.GetName] expand as pagan brutes learn to walk under the light of Heaven!\n\nRegrettably not all welcome the teachings of the Church. Fear not, if they deny our missionaries, they may learn our prayers at the tip of a sword!\n\n" 
 pam_the_christian_church.0053.desc.unreformed_pagan: "The [christians|E] come to our lands with their holy men. If we turn them away, they come again with their swords.\n\nWhile many of us try to maintain the ways of [ROOT.Char.GetFaith.HighGodName], there are some who see advantages to serving this fiction, this "Heaven". One's power becomes divinely ordained, the church may serve as our messengers and most enticing, they collect tax."
 pam_the_christian_church.0053.desc.heathen_rulers: "Our neighbors the [christians|E] forcibly convert the idolaters, when they are worth little more than to be slaughtered.\n\nWhile their swords are pointed away from us, [ROOT.Char.GetFaith.HighGodName] opens a window of opportunity. Their treasures, meager as they are, are there for the taking. Their people, ill disciplined as they are, are ripe for subjugation."
 pam_the_christian_church.0053.desc.heretic_rulers: "The pretender in the West hopes to convert pagans to his misguided worship! This hellish brute is not satisfied with simply poisoning the minds of [christians|E], but his perverse appetite calls for bringing those callow idolaters into his hellish embrace."
 pam_the_christian_church.0053.desc.western: "We must be careful these newly born [christians|E] are shepherded to worship [ROOT.Char.GetRite.GetName], as sanctioned by the seat of St. Rhovanis."
 pam_the_christian_church.0053.desc.eastern: "While the West claims to only seek the conversion of those outside of [GetSituation('the_christian_church').GetTopSubRegion.GetName], we must stay vigilant, should they rob of us our [ROOT.Char.GetRite.GetName], or worse, turn their swords freshly whetted with pagan blood on their fellow [christians|E]."
 #Reform Phase
 pam_the_christian_church.0054.desc.intro.no_head: "$pam_the_christian_church.0054.desc.intro.common$\n\nYet, the Church is not beyond rescue!\n\n"
 pam_the_christian_church.0054.desc.intro.common: "Our faith in Heaven may be unwavering, but many have lost faith in the Church. Once exemplary in their virtuous actions, the clergy now bicker about the most basic doctrines."
 pam_the_christian_church.0054.desc.unreformed_pagan: "The [christianity.GetAdherentNamePlural] are tearing at their own clerical finery, hoping Heaven will not notice the patches. If they are busy mending chasubles and annals, perhaps they will send fewer clerics to trouble our groves and river-shrines."
 pam_the_christian_church.0054.desc.heretic_rulers: "The sectaries of the West now squabble over reformation! What they call renewal is a reordering of the same yoke, tightened by a deadlier self-righteousness. Let their reform crack skulls in their own basilicas before they remember ours."
 pam_the_christian_church.0054.desc.eastern: "The West, or whichever curial chamber styles itself the arbiter of the oikoumene, labors to polish its rites: new canons, new oaths, new scolds for ancient sins. We watch, we rebuke, and we strengthen our own synods, lest a western temperance be mistaken for a universal yoke."
 #Investiture Crisis Phase
 pam_the_christian_church.0055.desc.unreformed_pagan: "While [christianity.GetAdherentNamePlural] feud about which ordains a bishop, the crown or the cope, fewer missionaries look our way. May kings and pontiffs choke on each other's charters; their division leaves our groves in peace."
 pam_the_christian_church.0055.desc.heathen_rulers: "$pam_the_christian_church.0054.desc.heathen_rulers$"
 pam_the_christian_church.0055.desc.heretic_rulers: "The West cries tyranny over investiture, yet would clap our teachers in fetters if it could grasp them! Strike the collars from your necks, and then lecture us!"
 pam_the_christian_church.0055.desc.eastern: "Western kings squabble with the Darusites over rings and staffs, and their sins stain the entire Church.\n\n"
 #Crusade Phase
 pam_the_christian_church.0056.desc.intro: "Across all [GetSituation('the_christian_church').GetTopSubRegion.GetName] the faithful claim for the liberation of the Holy Tomb of Calradios. Blades are polished for march, relics pawned into war chests.\n\nFervor burns with a passion, but should this fever cool, zeal may curdle into doubt as quickly as ash drifts from a pyre.\n\n"
 pam_the_christian_church.0056.desc.heretic_rulers: "Their war-preachers call crusade while neglecting their own lands: let the Darusites exhaust themselves on distant dunes."
 pam_the_christian_church.0056.desc.eastern: "The western hosts march towards our holy lands.\n\n"
 #Concord Phase
 pam_the_christian_church.0057.desc.western: "The schools may pile argument on argument, yet most souls still catch Heaven through the words of a priest.\n\nWe must not forget that ours is a religion of the people."
 #Shared notification: the Investiture Council has convened (fired from the activity as it starts)
 pam_the_christian_church.0059.desc.located: "The summons are sent, and the fathers of the Church gather for the Investiture Council, convened by [investiture_convene_host.GetTitledFirstName] in [investiture_convene_location.GetName]. For all of [christendom|E], their ruling will decide which invests the clergy: the Church or the crown."
 pam_the_christian_church.0059.desc: "The summons are sent, and the fathers of the Church gather for the Investiture Council. For all of [christendom|E], their ruling will decide which invests the clergy: the Church or the crown."
 # pam_the_christian_church.0060
 pam_the_christian_church.0060.t: "No Kingdoms of Dust"
 pam_the_christian_church.0060.desc: "[christendom|E] balances on a knife's edge. [schism_mainline_rite.GetName] claims the inheritance of the Exiles, and [schism_competitor_rite.GetName] refuses to yield.\n\Calradios Himself warned that [Glossary( 'Eàn pèsē hē basileía hēmōn, ho politismòs hēmōn eis choūn straphēsetai', 'CALRADIOS_WARNING_GLOSS' )]. If the wound festers through this crisis, the Church may never again have one voice."
 CALRADIOS_WARNING_GLOSS: "A warning Calradios gave to his followers should they chose to abandon the teachings of Rhovanis.\n\n"If our kingdom falls, our civilization will be turned into dust.""
 # pam_the_christian_church.0062
 pam_the_christian_church.0062.desc: "The wound that threatened to split [christendom|E] is stitched closed. Through the labors of [schism_peacemaker.GetTitledFirstName], the quarreling sees share a table once more.\n\n[Glossary( 'Heis Ouranos, hen Thespisma, heis Politēs; doxa Kalradiō, tō prōtotokō tou Ouranou.', 'ONE_MANDATE_GLOSS' )]\n\n[ROOT.Char.GetFaith.GetName] stays in communion."
 pam_the_christian_church.0062.a: "Blessed be the Lord."
 ONE_MANDATE_GLOSS: ""One Heaven, one Mandate, one Citizen; Glory to Calradios, the first-born of Heaven.""
 # pam_the_christian_church.0063
 pam_the_christian_church.0063.a: "Heaven hears us both."
 pam_the_christian_church.0064.desc: "I hear no path back to concord between [schism_mainline_rite.GetName] and [schism_competitor_rite.GetName].\n\nCalradios' warning has become a sentence: [Glossary( 'Eàn pèsē hē basileía hēmōn, ho politismòs hēmōn eis choūn straphēsetai', 'CALRADIOS_WARNING_GLOSS' )]. Communion within [christianity.GetName] has not yet broken, but the wound will open. Its hour is inevitable."
 #### Heresies ####
 heresy_historical.0050.gloss.ember: "[founder.GetSheHe|U] preaches that the late Emperor Darusos was not the ineffectual emperor many knew him as, but that instead he was a son of Heaven, second to only Calradios. [founder.GetHerHis|U] followers seeks to deify the late teenage emperor."
 heresy_historical.0050.history.ember: "\n\nThis movement began soon after Emperor Darusos was overthrown by his trusted generals and crucified on the slopes of Mount Erithrys. The followers of Darusos later murdered those involved, and took to the countryside to preach a life of dignity, prayer, forgiveness, and charity. Albeit it seems they did not take forgiveness to heart. Nowadays they are little more than bandits."
 # ep3_interactions_l_english.yml
 VESTES_GLOSS: "A prestigious Calradian court title related to the imperial wardrobe, available to both bearded holders and eunuchs."
 PATRIKIOS_GLOSS: "The title of #bold patrikios#! — patrician — used in Calradian times as both an honorary title as well as an actual title for an influential landowner."