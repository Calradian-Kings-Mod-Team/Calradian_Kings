l_english:
 AD_SUCCURRENDUM_GLOSS: "To die #G eis boētheian#! — taking a monk's vows and habit on the deathbed — was a last resort of great lords throughout medieval [christendom|E]. Buried in a simple cowl instead of silks, the dying ruler hoped to face judgment as a humble brother and not as a prince."
 BELL_BAPTISM_GLOSS: "Church bells were consecrated much as [christians|E] were: washed with holy water, anointed with oil, given a saint's name — some even stood godparents for them, and the custom carried on regardless for centuries. A christened bell was trusted to scatter storms, hail, and demons wherever its voice reached; later founders cast their bells with the motto #G Syntrívo tous keravnoús#! — 'I shatter the thunderbolts.'"