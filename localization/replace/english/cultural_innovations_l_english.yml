 innovation_wootz_steel:0 "Wootz Steel"
 innovation_wootz_steel_desc:0 "Also known as Hinduwani or Seric steel, this carbon-rich metal is excellent for making weapons. Wootz steel is widely traded and is deemed the finest steel in the world. Throughout most of history, it has drawn the attention of Nahasan, Serican, and even Calradian traders."
 
 innovation_african_canoes:0 "West Nahasan Canoes"
 innovation_african_canoes_desc:0 "The great canoes of West Nahasan are excellent for navigating rivers and allows us to quickly ferry troops to where we need them."
 
#  innovation_table_of_princes:0 "Table of Princes"
 innovation_table_of_princes_desc:0 "The Table of Princes is the royal seat of [GetPlayer.GetCulture.GetName] rulers, with the one sitting at the table being recognized as the rightful ruler. Under the code of #High $single_heir_dynasty_house$#!, titles were given to the eldest living member of the ruling [dynasty|E]."
#  unlock_single_heir_dynasty_house_changing:0 "Can enact $single_heir_dynasty_house$ at any [crown_authority|E]"


#  tradition_visigothic_codes_name:0 "$innovation_visigothic_codes$"
#  tradition_visigothic_codes_desc:0 "$innovation_visigothic_codes_desc$"
 innovation_visigothic_codes:0 "Vlandian Codes"
 innovation_visigothic_codes_desc:0 "Although many of the older Calradian traditions have long been wiped from the world, the children of the Calradios remember the ancient ways, and how land was divided between sons and daughters practically but fairly. The Vlandians have taken to these customs and traditions in lieu of the Calradians instead."
#  unlock_equal_succession_changing:0 "Can enact $equal_law$ [law|E] at any [crown_authority|E]"

