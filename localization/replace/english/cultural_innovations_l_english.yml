 unlock_maa_armored_horsemen: "Can recruit [GetMaA('armored_horsemen').GetName] or [heavy_cavalry|E] if allowed by [heritage|E]"
 #Regional


 innovation_stem_duchies:0 "Tribuduche"
#  innovation_stem_duchies_desc:0 "Despite coming from different tribes, we recognize the importance of unity and cooperation. Independence is overvalued when stability is what leads to safety and prosperity. "

#  innovation_ghilman:0 "Ghilman"
 innovation_ghilman_desc:0 "Slave-soldiers taken as prisoners of war, ghilman and mamelukes are dedicated fighters who are both more loyal to us and cheaper to pay than common mercenaries."

#####################
# High Medieval Era #
#####################

#  innovation_development_03:0 "Urbanization"
 innovation_development_03_desc:0 "The great cities of Charasea, Lycaron, and Haashar have long stood out as relics of a great, unmatchable legacy. As our infrastructure and population grow, we finally have the means to develop new settlements which rival these ancient urban centers."

#####################
# Late Medieval Era #
##################### 

#  innovation_cranes:0 "Cranes"
 innovation_cranes_desc:0 "A forgotten marvel of engineering, the Calradians used tread-wheel cranes to great effect when building their empire, and so too shall we."

#  innovation_condottieri:0 "Condottieri"
 innovation_condottieri_desc:0 "Being both wealthy and centrally located in the Perassic, Geroia has become a major center for mercenary companies to travel to when not on active campaign. Since they are already here, we should be able to negotiate a better rate for them than they would normally charge."

