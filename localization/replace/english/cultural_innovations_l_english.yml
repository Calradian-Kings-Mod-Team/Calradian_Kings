 #Regional
 innovation_viking_tradition:0 "Nordic Tactics"
 innovation_viking_tradition_desc:0 "The people of the north have a long tradition of trade, but also of piracy. Few are prepared to fight a threat that appears without warning from the banks of a river, and the sea raiders are masters of such warfare."
 
