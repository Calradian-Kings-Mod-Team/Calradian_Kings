l_english:
 game_concept_the_christian_church: "The Calradic Church"
 game_concept_the_christian_church_desc: "The Calradic Church is the ecclesiastical body that oversees and guides the followers of Heaven's Mandate, represented as a [situation|E] that advances through a sequence of [the_christian_church_chapters_short|E].\n\nIts boundaries encompass every [archdiocese|E] in the world; every [christian|E] [ruler|E] of [county|E] rank or higher with any part of their [realm|E] inside an Archdiocese is a member, be they clergy or secular."
 game_concept_christendom: "Mandatism" 
 game_concept_christendom_desc: "$game_concept_christendom$ encompasses the [realm|E]s of all [independent|E] [christian|E] [ruler|E]s who are members of [the_christian_church|E] [situation|E]."
 game_concept_christian: "Mandatist"
 game_concept_christians: "Mandatists"
 game_concept_christian_possessive: "Mandatist's"
 game_concept_christian_desc: "A follower of the Calradic [religion|E]."

 game_concept_papal_bull_desc: "A Papal Bull is a solemn decree of the [head_of_faith|E] of a [christian|E] [faith|E], backed by the authority of [the_christian_church|E].\n\nA [christian|E] [head_of_faith|E] with sufficient [church_authority|E] may proclaim a Bull through the [GetDecisionWithKey('enact_a_bull_decision').GetName] [decision|E], spending [piety|E] to:\n\n$EFFECT_LIST_BULLET$Summon a [great_holy_war|E]\n$EFFECT_LIST_BULLET$Denounce a [rite|E] as a [heresy|E]\n$EFFECT_LIST_BULLET$Declare a [core_tenet|E] [permitted_tenet_status|E] or [prohibited_tenet_status|E]"

 game_concept_ecumenical_council_desc: "An $game_concept_ecumenical_council$ is an [activity|E] in which the top [clergy|E] in all of [christendom|E] gather to settle the future of the Church.\n\nOver successive debates, the assembled prelates rule on the [tenet_status|E] of contested [core_tenets|E] — declaring them [permitted_tenet_status|E] or [prohibited_tenet_status|E], or elevating them to [core_tenet_status|E] — and settle the [doctrines|E] of the [faith|E]."

 game_concept_schism_desc: "The Great $game_concept_schism$ is the moment the unified $calradic_faith$ [faith|E] breaks apart along its Western and Eastern [rites|E] due to immense theological disagreements, splitting into $darusan$ and $calradic$.\n\nIt threatens when [the_christian_church|E] [situation|E] enters certain [the_christian_church_chapters_short|E], and rulers across Christendom must pick a side. Unless the divisions are mended — or forced apart — through [decisions|E], the split becomes permanent when the chapter ends."
 game_concept_situation_the_christian_church_phase: "The Calradic Church Chapter"
 game_concept_situation_the_christian_church_phases: "The Calradic Church Chapters"
 game_concept_grand_cathedral_desc: "A Grand Cathedral is a [great_building|E] raised through a [great_project|E] in the capital of an [archdiocese|E], the seat of its [archbishop|E].\n\nRaising the first Cathedral is a monumental act of devotion: its founder gains lasting [piety|E], [legitimacy|E] and [spiritual_fulfillment|E], an additional [personal_tenet|E] slot, and a standing bonus to their same-[faith|E] [opinion|E]. Once raised, it draws Mandatist pilgrims from across [christendom|E], expands the holder's [cathedral_complex|E], and may later be enlarged into a [GetBuilding('great_project_cathedral_02').GetName|V] or [GetBuilding('great_project_cathedral_03').GetName|V]."
 game_concept_archbishop_desc: "An Archbishop is the Mandatist holder of an [archdiocese|E], a duchy-tier [clerical_title|E] whose [clerical_region|E] may span several [realms|E].\n\nAs the [religious_superior|E] of the [bishops|E] and lesser [clergy|E] within that region, an Archbishop ranks above an ordinary [bishop|E] and answers in turn to the [head_of_faith|E]."
 game_concept_bishop_desc: "A $game_concept_bishop$ belongs to the [clergy|E] of a Mandatist [faith|E], and holds or leases [temple_holdings|E].\n\nA Bishop resides within an [archdiocese|E] and answers to the [archbishop|E] there as [religious_superior|E]. An unlanded Bishop with [leased|E] titles serves under a secular [liege|E]; a Bishop with unleased [landed|E] [titles|E] may rule as an [ecclesiastical|E] [ruler|E]."
 game_concept_cardinal_desc: "A [clergy|e] member selected by the $head_of_faith_papas$ to help further exert the will of [the_christian_church|e]. All members of the [college_of_cardinals|E] are both candidates and electors for the Papacy and have a [papabile_score|E]."