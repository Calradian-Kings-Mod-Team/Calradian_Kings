 tenet_jewish_syncretism_name: "Zurrani Syncretism"
 tenet_jewish_syncretism_desc: "Though we do not agree with its claims about God's chosen people, the wisdom of the Sharazwa is undeniable, and there is much to be learned from it."

 special_doctrine_is_islamic_faith_name: "Teachings of Asera"
 special_doctrine_is_islamic_faith_desc: "Although they do not follow all of the laws of Asera, there are some in this world who are more guided by the will of [ROOT.Faith.HighGodName] than they know. With time, these half-converts may even give up their evil ways and become true members of the Ummah!"

 special_doctrine_is_eastern_christian_faith_name: "Eastern Calradic"
 special_doctrine_is_eastern_christian_faith_desc: "Belongs to an Eastern Calradic tradition (Calradic Mandate, Amandatists, Merechati Mandatist, etc.)."
 christian_tradition_classification_name: "Calradic Tradition"
 special_doctrine_is_western_christian_faith_name: "Western Calradic"
 special_doctrine_is_western_christian_faith_desc: "Belongs to the Western Calradic tradition."
 special_doctrine_is_jewish_faith_name: "Teachings of Zurran"
 is_jewish_faith_name: "$special_doctrine_is_jewish_faith_name$"
 special_doctrine_is_jewish_faith_desc: "Not all among the gentility dwell in sin. There are those who respect God's chosen people, and these deserve a measure of our respect in turn."
 special_doctrine_immaterial_harmony_desc: "There is no conflict between our traditions and the teachings of the Shantaya or the sages. One may practice any of them, or even all at once, without spiritual difficulty."
 tenet_extinction_of_dharma_desc: "Demons walk the earth in the guise of the pious and the devout; whomsoever slays one shall take one step toward Shantayahood, whomsoever slays ten shall take ten steps toward Shantayahood."
 tenet_pure_land_desc: "Here in #EMP paścima-kāla#! — the Degenerate Age of Dharma — riches, study, nor high birth offer solace. Only true devotees of the Shantaya's precepts may find rebirth in the Pure Land."
 tenet_unrelenting_faith_greek_desc: "Faith is the assurance of things hoped for, the conviction of things not seen. Through unshakeable belief, the faithful overcome all trials and persecutions, standing firm unto death."
 tenet_mendicant_preachers_default_desc: "Religious orders devoted to poverty and preaching, wandering without possessions to spread the faith, trusting in divine providence for their daily needs."
 tenet_aniconism_default_desc: "You shall not make for yourself an idol or a likeness of anything. The worship of images is a corruption of the true faith."
 tenet_consolamentum_greek_desc: "By the laying on of hands and the prayer of the faithful, the spirit receives divine consolation. The good fight is fought, the race is finished, and faith is kept unto the very end."
 tenet_divine_marriage_greek_desc: "Marriage within the community of faith preserves the sacred bloodline and maintains purity before Heaven. Not in lust but in truth are such unions blessed, that mercy may be found for husband and wife.
 tenet_gnosticism_greek_desc: "True salvation comes through gnosis, the secret knowledge of divine things hidden from the material world. We speak Heaven's wisdom in mystery, the hidden wisdom decreed before the ages for our glory."