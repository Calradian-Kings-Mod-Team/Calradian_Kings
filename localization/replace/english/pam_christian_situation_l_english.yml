l_english:
 CHRISTIAN_CHURCH_SCHISM_PROGRESS_TT: "How near the quarrels between the [GetRiteByKey('darusan').GetAdherentNamePlural] and the [GetRiteByKey('calradic').GetAdherentNamePlural] have brought the Mandatist world to the [Concept( 'schism', 'Great Schism')|E].\n\nWhen grievances mount, the Church may split. $GREAT_SCHISM_PROGRESS_EFFECT_TT$\n\n@alert_icon! #alert_trial [GetFaithByKey( 'calradic').GetName] cannot establish a [head_of_faith|E] as long as the [Concept( 'schism', 'Great Schism')|E] remains undecided#!\n\n#help Increased by:\n$BULLET_WITH_TAB$[GetActivityType('activity_ecumenical_council').GetName] vote removing a [core_tenet|E] or [doctrine|E] from the [rites|E]\n$BULLET_WITH_TAB$A quarrel between the Rites ahead of the debates of an [GetActivityType('activity_ecumenical_council').GetName]\n$BULLET_WITH_TAB$A [war|E] between [kings|E] or greater rulers of the Rites within [GetSituation('the_christian_church').GetName]\n$BULLET_WITH_TAB$A [holy_site|E] converting from Rite to Rite\n$BULLET_WITH_TAB$Demoting a [holy_site|E] of either Rite\n$BULLET_WITH_TAB$A [head_of_rite|E] murdered by the other Rite#!"
 the_christian_church_participant_group_christian_regular_main_power_rulers_desc: "A [secular_ruler|E] of at least [county|E] [title_tier|E] who follows the Calradic [faith|E] that currently controls the most [counties|E] in the world."
 the_christian_church_participant_group_christian_clerical_main_power_rulers_desc: "A [ruler|E] with [theocratic_government|E] or [ecclesiastical_government|E], of at least [county|E] [title_tier|E], who follows the Calradic [faith|E] that currently controls the most [counties|E] in the world."
 investiture_crisis_desc: "Crown and crozier stand toe to toe over who owns the keys to Heaven's barns; secular patrons invest prelates with staff and ring while the Church refuses to recognise their legitimacy."
 concord_desc: "Concord is a settled chapter for [christendom|E]. The Church gives its energy to reason, law, and systematic theology, and the rediscovered classics teach it to answer doubt with argument instead of crisis."
 crusade_phase_desc: "The cross is taken up as a sword. Armies of penitent lords flow toward the Holy Land to defend every threatened temple."
 reform_phase_desc: "Discipline, law, and puritan zeal return to the clergy. The internal structure of Mandatism is put under scrutiny, and the price of a cleaner Church is often paid in blood."
 fragile_unity_desc: "The Calradian world lacks a single throne that all must obey. Kings, bishops, and heretics all claim to speak in Heaven's name, yet none seems to listen."
 saeculum_obscurum_desc: "The dark age in Calradia: a Church surrounded by sin and secured in the beds of the powerful."