 CHRISTIAN_CHURCH_SCHISM_PROGRESS_TT: "How near the quarrels between the [GetRiteByKey('darusan').GetAdherentNamePlural] and the [GetRiteByKey('calradic').GetAdherentNamePlural] have brought the Mandatist world to the [Concept( 'schism', 'Great Schism')|E].\n\nWhen grievances mount, the Church may split. $GREAT_SCHISM_PROGRESS_EFFECT_TT$\n\n@alert_icon! #alert_trial [GetFaithByKey( 'calradic').GetName] cannot establish a [head_of_faith|E] as long as the [Concept( 'schism', 'Great Schism')|E] remains undecided#!\n\n#help Increased by:\n$BULLET_WITH_TAB$[GetActivityType('activity_ecumenical_council').GetName] vote removing a [core_tenet|E] or [doctrine|E] from the [rites|E]\n$BULLET_WITH_TAB$A quarrel between the Rites ahead of the debates of an [GetActivityType('activity_ecumenical_council').GetName]\n$BULLET_WITH_TAB$A [war|E] between [kings|E] or greater rulers of the Rites within [GetSituation('the_christian_church').GetName]\n$BULLET_WITH_TAB$A [holy_site|E] converting from Rite to Rite\n$BULLET_WITH_TAB$Demoting a [holy_site|E] of either Rite\n$BULLET_WITH_TAB$A [head_of_rite|E] murdered by the other Rite#!"