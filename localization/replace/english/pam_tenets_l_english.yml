l_english:
 tenet_miles_christi_default_name: "Soldiery of Heaven"
 tenet_hyperdulia_default_name: "Consort to Heaven"
 tenet_hyperdulia_default_desc: "Blessed mother of the son of Heaven, bearer of divinity, give us refuge in your heart so that we may be enlightened by Heaven's Mandate. Know our words and our hearts so that we may deliver salvation to all who speak your divine name, oh Deianiras, mother of Darusos."
 tenet_peace_of_god_default_desc: "Senseless violence against our brothers and sisters is an affront to Heaven."
 tenet_dulia_default_desc: "Let all who seek the intercession of the saints approach them with reverence and devotion."
 tenet_transubstantiation_default_desc: "Before the consecration it has another name, after it is called Blood. And you say, Amen, that is, It is true."
 tenet_ora_et_labora_default_desc: "To pray is to work and to work is to pray. Idleness is the enemy of the soul, one must be diligent in both thought and action."
 tenet_simony_default_desc: "Heaven created gold beneath the Earth It hath given us, as a favor to Its chosen."
 tenet_monophysitism_default_desc: "Heaven has only one nature, fully divine."
 tenet_acts_of_apostles_default_desc: "Bring Heavenly light to those in darkness, and hope to those in despair."
 tenet_purgatory_default_desc: "The final cleansing of those who died in the State of Grace, and leaves in them only the holiness necessary to enter the Joy of Heaven."
 tenet_be_fruitful_and_multiply_default_desc: "In Heaven's plan family is an intimate community of life and love, an effort that will find fulfillment, as will everything created and redeemed, in the Kingdom of Heaven."
 tenet_apostolic_succession_default_name: "Saintly Succession"
 tenet_apostolic_succession_default_desc: "The unbroken line of bishops from St. Rhovarion to the present day, ensuring the authentic transmission of the faith."
 tenet_confession_default_desc: "Through confession sinners may receive absolution and be reconciled with Heaven and the Church."
 tenet_original_sin_default_desc: "All humanity inherits the stain of Aden's first sin, from which only divine grace through Heaven can redeem us."
 tenet_celestial_hierarchy_default_desc: "Angels are organized into nine orders, from Seraphim to common Angels, each serving Heaven in their appointed role and ministering to humanity."
 tenet_miles_christi_default_desc: "The faithful are called to be spiritual warriors, fighting against sin and evil with the armor of Heaven, ready to suffer as soldiers suffer for their commander."
 tenet_philanthropia_default_desc: "The Faith esteems the generous giving of alms, care for the poor, and institutional charity as a central duty, following the forefathers and the example of the early hospices and hospitals."
 tenet_scholasticism_default_desc: "Through rigorous intellectual inquiry and dialectical method, faith and reason can be reconciled, and deeper understanding of divine truth achieved."
 tenet_love_thy_neighbour_default_desc: "The love of neighbor is inseparable from the love of Heaven, and through acts of charity and mercy, we fulfill the whole of the divine law."
 tenet_divine_liturgy_default_desc: "The liturgy is the primary expression of faith, where heaven and earth meet, and the faithful participate in the eternal worship of Heaven alongside angels and saints."
 tenet_aniconism_default_desc: "You shall not make for yourself an idol or a likeness of anything. The worship of images is a corruption of the true faith."
 tenet_alexandrian_catechism_default_desc: "The Catechetical school emphasizes allegorical interpretation of Church doctrine and the synthesis of Calradic theology with ancient philosophy, seeking deeper spiritual meanings beneath the literal text."
 tenet_adoptionism_default_desc: "O Lord, help us understand the mystery of Thy Son's exaltation. May we follow Its example of righteousness, that we too may be called children of Heaven."
 tenet_armed_pilgrimages_default_desc: "Pilgrimage to the holy places is a sacred duty, and the faithful are called to protect these sites and fellow pilgrims by force of arms if necessary."
 tenet_communal_identity_default_desc: "The faithful are united as Heaven's chosen people, a community set apart from the world, sharing a common identity and purpose."
 tenet_consolamentum_default_desc: "Through the sacred rite of spiritual consolation, believers receive the Holy Spirit and are prepared for their journey from this world to the next."
 tenet_divine_marriage_default_desc: "Sacred marriage within the community of faith maintains spiritual purity and preserves the sanctity of the religious bloodline across generations."
 tenet_gnosticism_default_desc: "Salvation is achieved through secret spiritual knowledge, revealing the divine spark within and the path to escape the material world created by the Demiurge."
 tenet_mendicant_preachers_default_desc: "Religious orders devoted to poverty and preaching, wandering without possessions to spread the faith, trusting in divine providence for their daily needs."
 tenet_pentarchy_default_desc: "The universal Church is governed by five ancient patriarchal sees, each with authority over its region, maintaining unity through conciliar communion."
 tenet_unrelenting_faith_default_desc: "A faith that cannot be shaken by persecution, hardship, or doubt. Believers are called to stand firm in their convictions regardless of worldly consequences."
 tenet_miaphysitism_default_desc: "The Son of Heaven has one united nature that is both divine and human, inseparably joined in the Incarnation."
 tenet_hesychasm_default_desc: "Through inner stillness, contemplative prayer, and the repetition of prayer, the faithful may experience direct communion with Heaven and behold Its uncreated light."
 tenet_anachoresis_default_desc: "Through withdrawal from worldly society into the wilderness, the faithful may achieve spiritual purity, conquer the passions, and draw closer to Heaven through solitary prayer and ascetic discipline."
 tenet_mortification_of_the_flesh_default_desc: "The faithful mortify the flesh and its sinful desires, sharing in suffering to purify the soul and achieve spiritual perfection."
 tenet_holy_myron_default_desc: ""
 tenet_khachkar_default_desc: "Stone crosses carved with intricate religious imagery serve as sacred monuments marking holy sites, commemorating the dead, and celebrating divine providence."
 tenet_pentarchy_greek_desc: "Our Church is governed by the five patriarchates established in the founding of Charasea. Heaven is present wherever its sons and daughters gather, and through the pentarchy Its authority is exercised over all the world."