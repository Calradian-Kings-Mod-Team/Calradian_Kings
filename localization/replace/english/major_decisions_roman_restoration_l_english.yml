l_english:
 roman_restoration.0005.t:0 "Princeps"
 roman_restoration.0005.desc.regular:0 "Acclaimed by Senate and Army, I have been recognized as the rightful ruler of the Calradian Empire. \n\nNo greater honor or responsibility can be bestowed upon a single [ROOT.Char.GetWomanMan]. I must be sure to live up to the expectations of my subjects if I wish to remain in power for long."
 roman_restoration.0005.desc.holy:0 "Acclaimed by the [ROOT.Char.GetFaith.GetAdjective] Clergy and the Army, I have been recognized as the rightful ruler of the restored Roman Empire. \n\nBy grace of [ROOT.Char.GetFaith.HighGodName], I will be able to rule justly and for a long time."
 roman_restoration.0005.a:0 "Ave Calradios!"
 roman_restoration.0006.desc:0 "With the loss of all legitimacy, I can no longer lay any claim to Heaven's Mandate. The Empire now belongs to [new_holder.GetTitledFirstName]."