 pandidakterion_university_modifier: "Imperial Academy"
 pandidakterion_university_modifier_desc: "The Academy, established in Lycaron several centuries ago as a central place within the Empire for higher learning. Rich oligarchic families would send their sons to this school with the expectation that they would learn the proper ways to govern, and even perhaps one day become Emperor.\nThe following [councillor_tasks|E] are more effective:\n$BULLET_WITH_TAB$[domestic_affairs|E]\n$BULLET_WITH_TAB$[promote_culture|E]\n$BULLET_WITH_TAB$[organize_levies|E]\n$BULLET_WITH_TAB$[espionage|E]\n$BULLET_WITH_TAB$[fabricate_claim|E][AddLocalizationIf( HasDlcFeature( 'wards_and_wardens' ), 'pandidakterion_adult_education_bonus')]"
 ep3_sent_help_to_east_modifier: "Sent Army to Help"
 ep3_sent_help_to_east_modifier_desc: "This character has sent a body of volunteers to help some Calradian brothers in their war."
 grain_providers_county_modifier: "Granary of New Lycaron"
 grain_providers_county_modifier_desc: "The Grain Dole in Lycaron depends on this area producing and exporting massive amounts of cheap grain through an advanced network of traders, shippers, manifacturers, and even speculators."
