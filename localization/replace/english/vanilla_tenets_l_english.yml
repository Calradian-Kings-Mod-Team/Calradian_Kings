l_english:
 tenet_peace_of_god_default_name: "Peace of Heaven"
 tenet_peace_of_god_irish_desc: "Known also as Law of Innocents, it established rules to guarantee safety of non-combatants in warfare. Transgressors, together with bystanders who did nothing to prevent the crime, were subject to secular fines and ritual curses.\n\n[Glossary('Cáin Niásen Historical Background','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_default_desc: "Senseless violence against our brothers and sisters is an affront to Heaven.\n\n[Glossary('Peace of God Historical Background','tenet_peace_of_god_historical_desc')]"
 tenet_peace_of_god_historical_desc: "Throughout the Imperial Age, various Calradic movements sought to limit bloodshed by establishing formal rules of engagement. From the Peace of Heaven movement in 8th century Paravenos Province to the the Tyvallian Cáin Niásen in the 12th century, these efforts focused on protecting church property and persons, limiting violence against non-combatants, and restricting warfare among the nobility to particular times and places.\n\nThese rules were often extended to non-believers."
