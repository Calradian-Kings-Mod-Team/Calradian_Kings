 game_concept_rightful_liege_desc_part2:0 "#weak Example: The Count of $c_charas$ is a direct vassal of the Emperor of $e_western_empire$. Since the Emperor is neither Duke of $d_charas$ nor Strategos of $k_vlandia$, the Count of $c_charas$ only contributes a tiny amount of their taxes and levies.\n\nThe Count of $c_jalmarys$ is also a direct vassal of the Strategos of $k_wempire_k_1$. The Strategos does not hold the Duchy of $d_jalmarys$, so the Komissa also contributes reduced taxes and levies. However, because the $k_wempire_k_1$ is the De Jure Kingdom of $c_jalmarys$, the Count of $c_jalmarys$ still contributes significantly more tax and levies to the Strategos than the Count of $c_charas$ does.#!"
 game_concept_major_city_holding:0 "Major City Holding"
 game_concept_major_city:0 "Major City"
 game_concept_major_city_holding_desc:0 "Major cities are the pinnacle of civilization in the region they reside. These cities are upgraded forms of [castles|E] or [cities|E] and provide significantly better rewards in the form of [levies|E], [taxes|E], and [prestige|E]. Buildings unique to cities can be built to leverage bonuses in [prestige|E], [piety|E], and [legitimacy|E]!"
 game_concept_major_cities:0 "Major Cities"
 game_concept_city_holding:0 "Village Holding"
 game_concept_city:0 "Village"
 game_concept_cities:0 "Villages"
 game_concept_city_holdings:0 "Village Holdings"
 game_concept_city_holding_desc:1 "Villages are primary resource producing [holding_type|E], favoring [taxes|E] over [levies|E] and [resources|E]. They are associated with [republics|E], and holding them as any of the playable [government_forms|E] will always incur a penalty."
# game_concept_holding_types:0 "Holding Types"
 game_concept_holding_type_desc:2 "There are five types of [holdings|E] in Calradia: [castles|E], [major_cities|E], [cities|E], [tribes|E], and [temples|E]. Each type allows different types of [buildings|E]. A [ruler|E]'s [government_form|E] determines which types of Holding the Ruler can personally own without penalty. In the case of Temples, the [doctrines|E] of their [faith|E] may also play a role. One can also upgrade from a [castle|E] or [city|E] into a [major_city|E] by expending enough [gold|E]."
# game_concept_archer_cavalry:0 "Archer Cavalry"
 game_concept_archer_cavalry_desc:0 "$game_concept_archer_cavalry$ are mounted [men_at_arms|E] equipped with ranged weapons.\n\nWhile each kind of $game_concept_archer_cavalry$ is unique, they generally [counter|E] [heavy_infantry|E], and are in turn Countered by [archers|E] equipped with crossbows or special [light_cavalry|E].\n\n$game_concept_archer_cavalry$ are also often strong on flat [terrain|E], particularly [GetTerrain('steppe').GetName]."
# game_concept_legitimacy: "Legitimacy"
 game_concept_initial_legitimacy_desc: "The $game_concept_legitimacy$ a [character|E] has when they become landed.\n\nIt is calculated based on [dynasty_prestige_level|E], relation to their predecessor, [court_grandeur|E], gender, [bastardy|E], years as a [ruler|E], the [legitimacy|E] [dynasty_perk|E], [diplomacy|E], [virtues|E], [sins|E] and other special [traits|E], like [GetTrait('diplomat').GetName( GetNullCharacter )] and [GetTrait('just').GetName( GetNullCharacter )].\n\n[heirs|E] will inherit [GetDefine( 'NCharacter', 'LEGITIMACY_INHERITED' )|V%^] of the previous ruler's $game_concept_legitimacy$ if inheriting a higher [title_tier|E] [title|E]."