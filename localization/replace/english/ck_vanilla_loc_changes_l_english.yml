 # epidemic_events.5900
 epidemic_events.5900.t: "Kyanolimos"
 epidemic_events.5900.desc: "Pestilence stalks the land.\n\nVictims' skin are of an unnatural gray hue with dark blotches of blue skin from where the disease has destroyed their blood vessels. The afflicted groan in intense pain from the devastation of their body, but can only manage a breathless whimper as the plague also rips into their lungs.\n\nFrom the lowliest urchin to the most fêted emperor, all dread the indiscriminate scythe of the merciless plague. Those that survive must watch helplessly as all around them perish.\n\nThe devoted look to the divine for a savior, and the powerful their riches, but none can truly be safe. Dreadful tendrils spread across the land, constricting it until it no longer breathes.\n\nKyanolimos, the Blue Plague, is upon us. [ROOT.Char.GetFaith.HighGodName] save us all."
 epidemic_events.5900.desc_asia: "Pestilence walks among us.\n\nThe afflicted are covered in dark blue lumps, their cries fading to gurgles as blood fills their lungs. In death, even the loudest are made quiet.\n\nNo one is spared. From the barefoot laborer to the cloistered prince, the wheel of suffering turns for all. The living are left to sweep ash from thresholds and count the empty mats.\n\nSome chant sutras, others cling to ritual and rank — but no decree halts decay, no merit offsets the toll. Like mist in a valley, the plague spreads unseen, yet felt in every still morning.\n\nKyanolimos, the Blue Plague, is here. Heaven avert its gaze."
 epidemic_events.5900.christian: "Heaven preserve us and your holy children..."
 # health.1011 - Black Death -> Blue Death
 health.1011.t:1 "[SCOPE.Custom('EventTitleDisease')]: Hell's Mandate"
 health.1011.desc:0 "Fear of the plague has been a constant companion throughout my life. My childhood nurse told me haunting bedtime stories of travellers and merchants who returned west with skin covered in blue patches and coughing blood from deep within their lungs.\n\nBut the plague is no longer just a scary story. Gingerly, I push my fingers against a darkening spot on my skin. A dark and deadly force is tainting my flesh, consuming me as I still breathe."
 # ep2_locale_events.2501 - Larp as the Pope
 ep2_locale_events.2501.t: "$tournament_locale_tailor$: A Papás-priate Clothing"
 ep2_locale_events.2501.desc:0: "The fabrics and textiles on offer at the tailor range from rough hemp all the way up to the finest damasks, velvets, and silks. As I peruse through them alongside my [ROOT.Char.Custom2('RelationToMeShort', random_knight)] [random_knight.GetFirstName], a strangely familiar pattern makes me pause.\n\nHefting the full robe into the light, my eyes widen. It is a full reconstruction of a Papás' regalia!\n\n"We have some for Cardinals too, [ROOT.Char.Custom('FormOfAddressForLiege')]!" [tournament_tailor.GetFirstName] the tailor hovers behind the two of us. [random_knight.GetFirstNamePossessiveNoTooltip] eyes are shining with glee as [random_knight.GetSheHe] nudges me furiously in the ribs. The tailor speaks again.\n\n"And that one comes with a matching hat.""
 # pilgrimage.3004 - Some loony espousing the end times
 pilgrimage.3004.a: "Calradios' prophecy is clear; no man knows when the Day shall be!"
 ##### TRADITIONS AND INNOVATIONS
 tradition_byzantine_succession_name:1 "Calradian Traditions"
 tradition_byzantine_succession_desc:1 "This culture is closely associated with the imperial traditions of the Calradian Empire and its legacy in the form of a complex and intricate code of courtly conduct."
 tradition_african_tolerance_name:0 "Sub-Nahasan Tolerance"
 tradition_things_desc:1 "In Jumne, the distances and wilderness render centralized authority ineffective. When disputes must be resolved and decisions made, the #EMP Ting-meet #!is gathered, an assembly of peers presided over by a lawspeaker."
 tradition_chanson_de_geste_desc:0 "This culture values the heroic deeds of long gone ancestors. The romantic retelling of the lives of knights such as Cloviann, or Ragbard, will inspire generations to come."
 tradition_caucasian_wolves_name:0 "Ajiki Wolves"
 tradition_caucasian_wolves_desc:0 "Having spent centuries making themselves a home around the Devsegi Gates, this culture has grown well at home with everything that mountain warfare entails."
 culture_parameter_children_can_be_born_in_the_purple:2 "[children|E] born to a [ruler|E] holding the $e_calradian_empire$ may gain the [GetTrait('born_in_the_purple').GetName( GetNullCharacter )] [trait|E]. Having the Born in the Purple Trait increases a character's candidate score under $acclamation_succession_law$."
 culture_parameter_byzantine_faction_differences:0 "[vassals|E] of this [culture|E] are less likely to join [dissolution_factions|E] against the [holder|E] of the #V $e_calradian_empire$#!"
 culture_parameter_byzantine_faction_preffered_claimants:0 "[vassals|E] of this [culture|E] are much more likely to join [claimant_factions|E] against the [holder|E] of the #V $e_calradian_empire$#! if they are not the [preferred_heir|E]"
 
 tradition_female_only_inheritance_requirements: "You must have a [GetDoctrineType('doctrine_gender_female_dominated').GetBaseName] [faith|E] or the #V $heritage_domane_name$#!, #V $heritage_tefeyo_name$#!, #V $heritage_southwest_nahasan_name$#!, or #V $heritage_akoko_name$#! [heritage|E]"
 lack_iberian_heritage_or_language_penalty_desc:0 "The [culture|E] lacks $heritage_geroian_name$ [heritage|E] #EMP and#! the [culture_head|E] does not speak the $language_geroian_name$ [language|E]"
 cheaper_tradition_norse_washing: "$heritage_byalic_name$ [heritage|E]"
 mpo_siberian_permafrost_modifier: "Anburian Permafrost"
 culture_parameter_may_adopt_silk_road_innovations: "May access [silk_road_innovations|E] known to the [GetCultureByKey('han_ck').GetCollectiveNoun] [culture|E]"
 culture_parameter_can_adopt_chinese_culture: "May adopt the [GetCultureByKey('han_ck').GetCollectiveNoun] [culture|e]"
 innovation_desert_tactics_desc:0 "The East Perassic is an unfamiliar place with poor terrain for cavalry charges. We should adapt to these lands and field cavalry which is better suited to fight in our new home."