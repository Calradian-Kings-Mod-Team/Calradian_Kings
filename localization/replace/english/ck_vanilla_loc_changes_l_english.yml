 # epidemic_events.5900
 epidemic_events.5900.t: "Kyanolimos"
 epidemic_events.5900.desc: "Pestilence stalks the land.\n\nVictims' skin are of an unnatural gray hue with dark blotches of blue skin from where the disease has destroyed their blood vessels. The afflicted groan in intense pain from the devastation of their body, but can only manage a breathless whimper as the plague also rips into their lungs.\n\nFrom the lowliest urchin to the most fêted emperor, all dread the indiscriminate scythe of the merciless plague. Those that survive must watch helplessly as all around them perish.\n\nThe devoted look to the divine for a savior, and the powerful their riches, but none can truly be safe. Dreadful tendrils spread across the land, constricting it until it no longer breathes.\n\nKyanolimos, the Blue Plague, is upon us. [ROOT.Char.GetFaith.HighGodName] save us all."
 epidemic_events.5900.desc_asia: "Pestilence walks among us.\n\nThe afflicted are covered in dark blue lumps, their cries fading to gurgles as blood fills their lungs. In death, even the loudest are made quiet.\n\nNo one is spared. From the barefoot laborer to the cloistered prince, the wheel of suffering turns for all. The living are left to sweep ash from thresholds and count the empty mats.\n\nSome chant sutras, others cling to ritual and rank — but no decree halts decay, no merit offsets the toll. Like mist in a valley, the plague spreads unseen, yet felt in every still morning.\n\nKyanolimos, the Blue Plague, is here. Heaven avert its gaze."
 epidemic_events.5900.christian: "Heaven preserve us and your holy children..."
 # health.1011 - Black Death -> Blue Death
 health.1011.t:1 "[SCOPE.Custom('EventTitleDisease')]: Hell's Mandate"
 health.1011.desc:0 "Fear of the plague has been a constant companion throughout my life. My childhood nurse told me haunting bedtime stories of travellers and merchants who returned west with skin covered in blue patches and coughing blood from deep within their lungs.\n\nBut the plague is no longer just a scary story. Gingerly, I push my fingers against a darkening spot on my skin. A dark and deadly force is tainting my flesh, consuming me as I still breathe."