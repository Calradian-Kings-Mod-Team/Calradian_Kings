 pam_prevent_great_schism_decision_desc: "The divisions among the Mandatist flock can still be mended, if we act before the wound deepens."
 pam_prevent_great_schism_decision_tooltip: "Push the Mandatist situation toward stability."
 pam_cause_great_schism_decision_tooltip: "Force a settlement of the Mandatist crisis."
 pam_prevented_great_schism_dynasty_modifier_desc: "This dynasty prevented a final rupture in the Mandatist world, preserving ecclesiastical unity for generations to come."
