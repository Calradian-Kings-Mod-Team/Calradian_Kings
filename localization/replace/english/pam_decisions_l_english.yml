 pam_mended_great_schism_military_dynasty_modifier_desc: "This dynasty gathered the ancient sees under one banner and healed the rupture in the Mandatist world by force of arms."
 pam_mended_great_schism_military_character_modifier_desc: "This character gathered the ancient sees under one banner and healed the rupture in the Mandatist world by force of arms."
 pam_mended_great_schism_diplomatic_dynasty_modifier_desc: "This dynasty talked the rival patriarchs back into communion, healing the rupture in the Mandatist world without a drop of blood spilled."
