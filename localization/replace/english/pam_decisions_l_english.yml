 SACRAMENTARY_GLOSS: "Sacramentary or #EMP liturgikon#! were books used in liturgical services by a Calradic bishop or priest. Depending on the era and region, they could contain texts to be spoken or sung, along with those for the sacraments."
 pam_bull_events.0001.desc: ""I exhort all of you to oppose the infidels of the [title.GetName], to free the land from their tyranny and to snatch many thousands of your captive brothers from their hands."\n\n"So that the dignity of the Calradic name may be increased in your time, and that your valour which is praised throughout the whole world, may remain intact and unshaken.""
