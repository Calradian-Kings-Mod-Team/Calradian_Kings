 restore_papacy_decision:0 "Restore the Darusan Papacy"
 restore_papacy_decision_confirm:0 "The Darusan Papacy will be restored"
 restore_papacy_decision_desc:0 "If a pious Darusan were to recover the core territories of Saint Rhovanis' patrimony, the Holy See could be restored once more to its rightful place in Charasea."

 # Mend the Schism
 mend_the_great_schism_decision_tooltip: "I will reunite the Calradian world
 every_ecumenical_christian_faith.tt: "$EFFECT_LIST_BULLET$ Every Calradic [faith|E] with [GetDoctrineType('special_doctrine_ecumenical_christian').GetBaseName]"
 mend_the_great_schism_decision_confirm: "One Heaven, one Church!"
 mend_the_great_schism_decision_desc: "The Great Schism saw the Calradic Church divided, but if all five of the major Seats of the Pentarchy could be restored under the rule of a single Empire under the enlightened leadership of a saintly ruler, there may be a chance to finally reunite [christendom|E]."
 roman_restoration.0100.desc.orthodox:0 "\n\nNo longer will the arrogant Bishops in Charasea claim undue primacy over their peers, ignoring or outright disobeying Heavenly Mandates. With the reunification of the Pentarchy under Calradic Imperial rule, the Darusan faith now holds little sway over the people of Calradia. \n\nIt is only a matter of time before the few who still cling to outdated and heretical rites are brought into the fold of the true Ecumenical Church."
 roman_restoration.0100.desc.catholic:0 "\n\nThe centuries-long fight of the Papacy to assert is primacy over the Pentarchy has finally come to an end. With the reunification of the original seats under Darusan rule, the Calradic clergy has been forced to bow to the undeniable authority of the throne of Saint Rhovanis. \n\nThe few amongst them who still cling to their outdated and heretical rites will soon be brought into the fold of the true Ecumenical Church, one way or the other."
 roman_restoration.0100.desc.generic:0 "\n\nWith the Pentarchy firmly under [mending_faith.GetAdjective] control, in an unexpected turn of events, both the Papás in Charas and the Ecumenical Patriarch of Lycaron are no longer able to deny the primacy of [mending_faith.GetName] over all other branches of Mandatism."
 roman_restoration.0101.desc.intro:0 "The Great Schism that has plagued Mandatism for so long as at last come to an end."
 roman_restoration.0101.desc.orthodox:0 "\n\nAfter the conquest of all the Ecumenical seats of the original Pentarchy by [scoped_emperor.GetTitledFirstName], the Calradic Church has been able to force most of the Darusan world into recognizing its authority as the one legitimate branch of Mandatism. The corrupt Charasean aristocracy has been forced into exile, and its supporters are dwindling by the day."
 roman_restoration.0101.desc.catholic:0 "\n\nAfter the conquest of all the Ecumenical seats of the original Pentarchy by [scoped_emperor.GetTitledFirstName], the Holy See has finally achieved its long ambition to uproot the Calradic Church and become the only legitimate branch of Mandatism. With the Patriarch forced into exile and many notable Calradic theologians submitting to the authority of the throne of Saint Rhovanis, Calradic Mandate might soon dwindle into obscurity."
 roman_restoration.0101.desc.generic:0 "\n\nAfter the conquest of all the Ecumenical seats of the original Pentarchy by [scoped_emperor.GetTitledFirstName], the [mending_faith.GetAdjective] Church has forced its way into becoming the only legitimate branch of Mandatism in the eyes of many. With both Papacy and Ecumenical Patriarchate uprooted from their ancestral seats of power, many Calradic and Darusan followers are flocking to the new Universal Church."

 # Restore Papacy in Charasea
 restore_pope_in_rome_decision:0 "Restore Papás in Charasea"
 restore_pope_in_rome_decision_desc:0 "It is only right for the heir of Saint Rhovanis to hold the key to the holiest of cities, wherein lays the shrine of Calradios himself."
 clerical_electors_move_back_to_charas:0 "All [cardinals|E] move to Charas with the Papás"
 restore_pope_in_rome_decision_tooltip:0 "The Papacy will retake office in Rome."
 rome_held_by_you_or_vassal_tt:0 "$c_roma$ must be held by you or a [vassal|E]"
 # Destroy Papacy
 roman_restoration.0130.desc.muslim:1 "The Darusanite dominion over Shariz has finally come to an end. \n\nThanks to the committed efforts of many devoted servants of [scoped_destroyer.GetFaith.HighGodName], all of Shariz has fallen under [scoped_destroyer.GetFaith.GetAdjective] rule. The faithful have worked tirelessly to strip away all blasphemous icons and bring the decadent clergy that ruled over these lands to justice."
 roman_restoration.0130.desc.hellenic:1 "The tyranny of the invaders over holy Thexnyia has finally come to an end.\n\nFor centuries these glorified cultists have been given free rein to vilify and deface the ancient monuments of our divine protectors, but no more! By restoring [scoped_destroyer.GetFaith.GetAdjective] rule over Carazi and the Carazian Bay, we have squashed the very heart of the Church with their false Heaven."
 roman_restoration.0130.desc.fallback:0 "After centuries being belittled and deceived by their missionaries, the followers of [scoped_destroyer.GetFaith.HighGodName] have finally taken their revenge upon the followers of Calradios 'the Bane'. \n\nThe heartland of their faith has been conquered with the favor of our gods, their churches have been pillaged, their priests stripped of all power and dignity. Thanks to my glorious invasion, I have rid the world of this cowardly religion and avenged the dishonor brought upon our lands and ancestors by their trickery."
 roman_restoration.0130.desc.pope.submission:0 "\n\nIn the face of our undeniable religious supremacy, ex-Papás [scoped_pope.GetFullName] has even publicly recanted the [catholic.GetAdjectiveNoTooltip] faith and converted to [scoped_destroyer.GetFaith.GetNameNoTooltip]!"
 roman_restoration.0130.desc.pope.crucifixion:0 "\n\n[scoped_pope.GetFirstName], still defiantly clinging to the undeserved title of Archiereús, was crucified among the burning ruins of Carazi. So ends the disgraceful line of Calradic Pontiffs of 'Charasea'."
 roman_restoration.0130.desc.pope.sacrificed:0 "\n\nThe Darusan cathedral was sanctified and rededicated to [scoped_destroyer.GetFaith.HighGodName] using the blood of [scoped_pope.GetTitledFirstName] [scoped_pope.GetHerselfHimself], who was sacrificed on the very altar [scoped_pope.GetSheHe] used to preach from."
 roman_restoration.0130.desc.pope.exile: "\n\nThe former Papás [scoped_pope.GetFullName] escaped our grasp, fleeing into exile with a handful of loyal servants. The office [scoped_pope.GetSheHe] once held, however, is no more."
 roman_restoration.0131.desc.faithful:0 "Thanks to [scoped_destroyer.GetTitledFirstNamePossessive] relentless campaign of conquest, the entirety of Shariz has fallen to [scoped_destroyer.GetFaith.GetAdjective] rule.\n\nWith [scoped_destroyer.GetFaith.HighGodNamePossessive] help, [scoped_destroyer.GetSheHe] has hunted down all remaining cabals of Darusans still congregating nearby and stripped all major Bishoprics of wealth and influence, thus striking a severe blow to the authority of the false Church."
 roman_restoration.0131.desc.christians:0 "The monstrous campaign of terror of [scoped_destroyer.GetTitledFirstName] has brought ruin and darkness upon the heartland of Our Holy Mother Church!\n\nThe vile heathen has stripped the Papacy of all its possessions and dignity, brutally murdered countless theologians and will not stop until [scoped_destroyer.GetSheHe] has brought all Mandatism to heel! With Charasea destroyed and its hierarchy in shambles, the Darusan faith has been reduced to a disorganized cult."
 roman_restoration.0131.desc.fallback:0 "The daring campaign of conquest of [scoped_destroyer.GetTitledFirstName] has brought ruin and darkness upon the heartland of the Darusan Church!\n\nHaving already stripped the Papacy of most of its possessions and dignity, it seems [scoped_destroyer.GetSheHe] will only be satisfied when all Mandatism is brought to heel. With Charasea destroyed and its hierarchy in shambles, the Darusan faith has been reduced to a disorganized cult."
# Destroying the Papacy while a player is Pope, by Laurence Kennedy
 roman_restoration.0132.t: "Hell Shatters My Throne"
 roman_restoration.0132.desc: "[catholic.GetAdherentNamePluralNoTooltip] everywhere wake without a shepherd. The Papacy is dissolved, my clergy scattered, the holiest of relics carried off as spoil. Charasea is now the dominion of the agents of Hell."
 roman_restoration.0132.c.tt: "You take [translation_see.GetNameNoTierNoTooltip]. Your old [clerical_region|E] in Charasea is destroyed."