 ### pam_holy_myron_l_english.yml - Title references
 pam_prepare_holy_myron_decision_levant_desc: "Your [court_chaplain|E] gathers [Glossary('balsam of Judea','pam_myron_gloss_balsam')] at #V [GetTitleByKey('c_charas').GetNameNoTier]#! — a single destination, and the plainest blend.\n\nYields a [common|E] Ampulla of Holy Myron."
 pam_prepare_holy_myron_decision_arabia_desc: "Your [court_chaplain|E] gathers [Glossary('balsam','pam_myron_gloss_balsam')] in #V [GetTitleByKey('c_charas').GetNameNoTier]#!, and [Glossary('frankincense','pam_myron_gloss_frankincense')] and [Glossary('myrrh','pam_myron_gloss_myrrh')] in #V [GetTitleByKey('c_dhofar').GetNameNoTier]#! — a pair of stops on the incense road.\n\nYields a [masterwork|E] Ampulla of Holy Myron."
 pam_prepare_holy_myron_decision_india_desc: "Your [court_chaplain|E] gathers [Glossary('balsam','pam_myron_gloss_balsam')] at #V [GetTitleByKey('c_charas').GetNameNoTier]#!, [Glossary('frankincense','pam_myron_gloss_frankincense')] and [Glossary('myrrh','pam_myron_gloss_myrrh')] at #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!, and [Glossary('spikenard','pam_myron_gloss_spikenard')] and [Glossary('cinnamon','pam_myron_gloss_cinnamon')] at #V [GetTitleByKey('c_kerala').GetNameNoTier]#!, a long journey.\n\nYields a [famed|E] Ampulla of Holy Myron. If your [court_chaplain|E] follows the old recipes faithfully — a #V [ROOT.Char.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#! chance, scaling with [ROOT.Char.GetCouncillor('councillor_court_chaplain').GetHerHis] [learning|E] — the batch is [illustrious|E] instead."
 pam_prepare_holy_myron_decision_levant_effect_tt: "Your [court_chaplain|E] sets out for #V [GetTitleByKey('c_charas').GetNameNoTier]#!. Upon their return, a [common|E] Ampulla of Holy Myron will be consecrated — if the road is kind"
 pam_prepare_holy_myron_decision_arabia_effect_tt: "Your [court_chaplain|E] sets out for #V [GetTitleByKey('c_charas').GetNameNoTier]#! and #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!. Upon their return, a [masterwork|E] Ampulla of Holy Myron will be consecrated — bandits or misfortune on the road may diminish the batch"
 pam_prepare_holy_myron_decision_india_effect_tt: "Your [court_chaplain|E] sets out for #V [GetTitleByKey('c_charas').GetNameNoTier]#!, #V [GetTitleByKey('c_dhofar').GetNameNoTier]#!, and #V [GetTitleByKey('c_kerala').GetNameNoTier]#!. Upon their return, a [famed|E] Ampulla of Holy Myron will be consecrated, with a #V [GetPlayer.GetCouncillor('councillor_court_chaplain').MakeScope.ScriptValue('pam_holy_myron_illustrious_chance_value')|0]%#! chance of an [illustrious|E] one instead — bandits or misfortune on the road may diminish the batch"
 pam_secular_faith_events.0006.desc: "A travel-worn pilgrim catches my eye at the market. In [relic_seller.GetHerHis] trembling hands lies a yellowed finger-bone.\n\n"The bone of a saint," the [relic_seller.GetWomanMan] swears. "I found it on my journey to [GetTitleByKey('c_charas').GetNameNoTier], but it would be safer in the hands of a [ROOT.Char.GetTitleAsNameNoTooltip]."\n\nA learned eye could judge the claim. Conveniently, the relic is for sale."
 ## Event & Modifier Overrides
 # pam_secular_faith_events.0051
 pam_secular_faith_events.0051.t: "The Voice of Heaven"
 pam_secular_faith_events.0051.desc: "#EMP "I am Heaven and earth,"#! a booming voice echoes in the [ROOT.Char.GetFaith.HouseOfWorship]. #EMP "You will bow down before me."#!\n\nI fall to my knees, vision blurring. I wipe a streak of blood from my face.\n\n#EMP "I, Heaven, master of all mankind, command you: Obey me with all your heart and all your soul."#! One voice becomes a hundred. A hundred become a thousand. #EMP "If you do not, I will curse you until you are destroyed, for you have forsaken me, the God of all Mandates!"#!"
 pam_sf_peace_of_god_modifier: "Peace of Heaven"
 pam_sf_peace_of_god_modifier_desc: "This character has sworn and enforced the Peace of Heaven across the realm."
 pam_sf_voice_of_jesus_modifier: "Voice of Heaven"
 pam_sf_voice_of_jesus_modifier_desc: "This character was addressed by a divine voice and rose transfigured, every faculty sharpened, as though touched by Heaven."
 pam_sf_voice_of_jesus_toast: "Voice of Heaven"
 pam_sf_stroke_of_god_toast: "A Stroke of Heaven"
 pam_secular_faith_events.0012.desc: "Peace is a loan, never a gift.\n\nOn the feast of [ROOT.Char.GetFaith.WarGodName], my [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], offers to consecrate my household's arms.\n\n"Heaven, which gave Calradios' ships the wind at his back and strength to conquer his new home, set that same speed and strength in house [ROOT.Char.GetHouse.GetBaseName] — may you rise always to the defense of the weak," [chaplain.GetSheHe] prays."
 pam_secular_faith_events.0018.t: "A Child for Heaven"
 pam_secular_faith_events.0018.desc: "My [ROOT.Char.Custom2( 'RelationToMeShort', pious_child )], [pious_child.GetFirstName], is unlike most children. While others play, [pious_child.GetSheHe] spends [pious_child.GetHerHis] days in the chapel.\n\n"I have never seen a child like [pious_child.GetHerHim]," my [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], says quietly. "[pious_child.GetSheHe|U] spends hours in prayer, and weeps during service. It is clear as day: [pious_child.GetFirstNameNoTooltip] desires life as an [GetTrait('devoted').GetName( pious_child )].""
 pam_secular_faith_events.0019.t: "The Peace of Heaven"
 pam_secular_faith_events.0019.desc: "My [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], arrives with grave news.\n\n"Brother shall not slay brother beneath [ROOT.Char.GetFaith.HighGodNamePossessive] eye," [chaplain.GetSheHe|U] proclaims. "[feud_attacker.GetTitledFirstName] and [feud_defender.GetTitledFirstName] have bared steel against each other, and the smallfolk bleed for their quarrel!"\n\n"End this. Bind them with the [GetTenetType('tenet_peace_of_god').GetName( GetNullCharacter.GetRite )].""
 pam_secular_faith_events.0058.t: "Tí Esthíei Ho Mûs??"
 pam_secular_faith_events.0058.desc: "My [ROOT.Char.Custom2( 'RelationToMeShort', chaplain )], [chaplain.GetFirstName], bursts in, pale as an altar cloth, holding a small silver [Glossary( 'pyx', 'PYX_GLOSS' )] as if it burned in [chaplain.GetHerHis] hands.\n\n"A mouse, [ROOT.Char.Custom('FormOfAddressForLiege')]. It gnawed through the box earlier this night and ate of the [Glossary( 'blessed bread', 'RESERVED_HOST_GLOSS' )]!"\n\n[chaplain.GetSheHe|U] can barely speak. "The scholars ask [Glossary( 'quid mus sumit', 'QUID_MUS_SUMIT_GLOSS' )] — what, then, did the mouse eat? What must I do?""
 pam_secular_faith_events.0027.desc: ""Do you hear me, [ROOT.Char.GetFaith.HighGodName]?" I whisper. But deep down, I know [ROOT.Char.GetFaith.HighGodNameSheHe|U] doesn't listen to sinners like me.\n\nHave I misunderstood [ROOT.Char.GetFaith.HighGodHerHis|U] will? Is [old_tenet.GetName( ROOT.Char.GetRite )] not the true form of [ROOT.Char.GetFaith.HighGodHerHis|U] wisdom?\n\nLight falls upon my brow, and hope stirs within me."