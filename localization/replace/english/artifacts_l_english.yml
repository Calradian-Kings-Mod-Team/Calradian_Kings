 ## fund_inspiration.6001-6006 trinkets from your adventurer
 pilgrimage_figurine_name:0 "Cuttle-bone Saint Armagan"
 pilgrimage_figurine_description:1 "A figurine of Armagan, a general who told many tales across the world. His helmet is filled with bronze detail. Sent to [owner.GetTitledFirstNameNoTooltip] by [inspiration_owner.GetTitledFirstNameNoTooltip] during [inspiration_owner.GetHerHis] entertaining adventures."
 saint_margaret_fingernails_name:0 "Fingernails of Saint Ipek"
 saint_margaret_fingernails_description:1 "Saint Ipek of Yavuz was famed for slaying a dragon using the heels of her mount alone. Supposedly, these old disgusting fingernails' cuts belonged to her blade. Sent to [owner.GetTitledFirstNameNoTooltip] by [inspiration_owner.GetTitledFirstNameNoTooltip] during [inspiration_owner.GetHerHis] adventures."


