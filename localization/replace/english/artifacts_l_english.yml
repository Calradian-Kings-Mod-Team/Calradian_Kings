 kurgan_ornament_name:0 "Battannian Panther Figurine"
 kurgan_ornament_description:0 "A stone figurine looted by [inspiration_owner.GetTitledFirstName] from an old Battannian burial mound."
 kurgan_saddle_name:0 "Saddle from a Kurgan"
 kurgan_saddle_description:1 "A saddle swiped by [inspiration_owner.GetTitledFirstName] from a Druin burial mound. Over a thousand years old, it has been preserved in the trapped air of the tomb, amidst the bodies of dozens of embalmed horses. Perhaps we can learn something from the ways of the ancient saddle-warriors."
 

 artifact_muhammads_epistles_name:0 "Letter from Asera"
