 epistle_byzantium:0 "the Calradian Empire"
 epistle_bahrain:0 "Bahrain"
#  artifact_kaves_apron_name:0 "Kave's Apron"
 artifact_kaves_apron_description:0 "This tattered flag is said to be the legendary banner that the Darshi Blacksmith Kave made from his apron, to rally his people against their evil overlord."
# turquoise_throne_name:0 "Turquoise Throne"
 turquoise_throne_description:0 "This bejeweled royal throne has been made in the image of the legendary throne of the Darshi kings from the Shahnama. Its ebony frame is adorned by an uncountable amount of turquoises as well as plates of pure gold enameled with a turquoise hue. Its breathtaking beauty could only be obtained by the foremost artisans in their fields."
 artifact_eight_fold_chest_description: "This is a set of eight small chests, each inside the other, with the relic of Shantaya's Fingerbone placed in the central chest. The relic has been in use in welcoming ceremonies under successive Tang Emperors before these chests were made at the order of Emperor Yizong.\n\nEach chest is intricatly made in sandalwood, silver, gold and jade. The last chest is a four door pagoda in pure gold, housing the finger itself. The top of the pagoda is a lotus flower holding a golden pearl."
 artifact_afarganyu_description:0 "This large vessel is where the holy fire, central to many of the ceremonies of the Bazyardi faith, is lit. An old inscription speaks of the person who originally donated it to the priesthood."