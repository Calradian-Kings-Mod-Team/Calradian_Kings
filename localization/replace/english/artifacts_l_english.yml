#  artifact_kaves_apron_name:0 "Kave's Apron"
 artifact_kaves_apron_description:0 "This tattered flag is said to be the legendary banner that the Darshi Blacksmith Kave made from his apron, to rally his people against their evil overlord."
# turquoise_throne_name:0 "Turquoise Throne"
 turquoise_throne_description:0 "This bejeweled royal throne has been made in the image of the legendary throne of the Darshi kings from the Shahnama. Its ebony frame is adorned by an uncountable amount of turquoises as well as plates of pure gold enameled with a turquoise hue. Its breathtaking beauty could only be obtained by the foremost artisans in their fields."