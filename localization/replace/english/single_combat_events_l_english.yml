l_english:
 single_combat.0041.desc.sc_attacker.pocket_sand.injury:0 "coughing and spluttering as it goes half-way down [sc_loser.GetHerHis] windpipe.\n\nI waste no time knocking [sc_loser.GetFirstNamePossessiveNoTooltip] knees out from under [sc_loser.GetHerHim] with a [sc_victor.Custom('SignatureWeaponAttemptedHeavy')], and the [sc_loser.GetWomanMan] goes down, still writhing and trying to clear the [sc_defender.Custom('GritType')] from [sc_loser.GetHerHis] [sc_defender.Custom('EyeEyes')].\n\nBy the time [sc_loser.GetSheHe]'s succeeded, I'm readying myself to [sc_victor.Custom2('SignatureWeaponKillTypeGroinThirdPersonFutureGendered',SCOPE.sC('sc_loser'))].\n\nThe yield is rather rapid."
 single_combat.0041.desc.opponent_response.taunt.fatality:0 "It takes [sc_loser.GetName] in the torso, harder than I expected, and I'm showered in a rain of viscera and shattered ribs.\n\n[sc_loser.GetFirstNameNoTooltip] never quite makes it to the taunting. [sc_loser.GetSheHe|U] just shifts [sc_loser.GetHerHis] weight and staggers a few paces till falling down dead."