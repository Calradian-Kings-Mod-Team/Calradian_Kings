l_english:
 ###############################################
 # Curated relics enshrined at 1066 holy sites #
 # (historical_artifacts.0050)                 #
 ###############################################

 ## Christian
 # Pre-Darusos (967)
 artifact_relic_peter_bones_name: "Bones of Saint Rhovanis"
 artifact_relic_peter_bones_desc: "The bones of Rhovanis, the most trusted of Calradios' followers and founder of the Calradic Church."
 artifact_relic_paul_bones_name: "Arm of Saint Surmarys"
 artifact_relic_paul_bones_desc: "The bones of Surmarys, martyred at Marunath when attempting to proselytize to the Battanians."
 artifact_relic_crown_of_thorns_name: "Crown of Echerion"
 artifact_relic_crown_of_thorns_desc: "The laurel crown worn by the first Consul of Calradia after overthrowing the tyrant Cypegos."
 artifact_relic_baptist_arm_name: "Right Arm of Saint Zeona the Blessed"
 artifact_relic_baptist_arm_desc: "The right forearm of Saint Zeona, said to have been the very hand she was said to have blessed crowds with while she served as regent to her underage son."
 artifact_relic_true_cross_name: "Fragment of the True Cross"
 artifact_relic_true_cross_desc: "A splinter of the cross upon which Darusos was crucified, set in a gilded reliquary."
 artifact_relic_mark_name: "Head of Saint Pator"
 artifact_relic_mark_desc: "The severed head of the proselytizer Pator, founder of the Church of Sanala, severed by rebellious local tribesmen."
 artifact_relic_lance_antioch_name: "Heavenly Sword of Saint Phaera"
 artifact_relic_lance_antioch_desc: "A sword said to have been wielded by Saint Phaera in her defense of Vostrum from the tyrant, Archacos."
 artifact_relic_tabot_name: "Tabot of Heaven"
 artifact_relic_tabot_desc: "A consecrated stone tablet representing Heaven's first mandate to mankind, revered as among the most sacred of Calradic relics."
 artifact_relic_nine_saints_name: "Bones of the Nine Saints"
 artifact_relic_nine_saints_desc: "Bones of the Nine Saints - Sanalan monks who fled the Aserai Uprising for Agak and founded Merekata's first monasteries, planting Merechati Mandatist across the highlands."
 artifact_relic_thomas_name: "Relics of Saint Zumerias"
 artifact_relic_thomas_desc: "The bones and bloodstained paramerion sword of Zumerias the Saint, who is said to have brought the faith to Varnovapol during his own exile, and is said to have been martyred there."
 artifact_relic_augustine_pallium_name: "Toga of Oremos"
 artifact_relic_augustine_pallium_desc: "The bloodstaind toga worn by the pious Oremos Kiroplastos, who passed plebian land reforms and was murdered by iniquitous senators."
 artifact_relic_three_magi_name: "Relics of the Three Consuls"
 artifact_relic_three_magi_desc: "The bones of the Triumvirate who reunified a shattered republic into an empire."
 artifact_relic_becket_name: "Vestments of Emperor Darusos"
 artifact_relic_becket_desc: "The blood-soaked garments of Darusos, martyred and crucified outside of Jalmarys by his traitorous generals."
 artifact_relic_ursula_name: "Bones of Saint Aerilia"
 artifact_relic_ursula_desc: "The bones of Aerilia and her companion vestal-martyrs, unearthed in the graveyards of Paravenos."
 artifact_relic_ignatius_name: "Bones of Saint Ignatius"
 artifact_relic_ignatius_desc: "The bones of Ignatius, second patriarch of Antioch and disciple of the Apostle John, who was martyred in Rome during the reign of Trajan."
 # Post-Darusos (976)

 ## Islamic
 artifact_relic_black_stone_name: "Fragment of the Sky"
 artifact_relic_black_stone_desc: "A polished fragment of a fallen star that landed near Sahel over a thousand years ago, and was passed down Asera's family and blessed by the muftis."
 artifact_relic_dhulfiqar_name: "Sayr al-Nujum"
 artifact_relic_dhulfiqar_desc: "The blessed fallen-star sword of Asera ibn Sahelid, said to have been gifted by his father, which itself was passed down the lineage of the prophet Sahel."
 artifact_relic_buraq_footprint_name: "Shard of the Bahamut"
 artifact_relic_buraq_footprint_desc: "A wooden fragment of the Bahamut, the ship Asera had commissioned in Razih that later turned the tide against the Calradians in the Battle of Sanala before sinking. The ship was said to have later risen from the sea to deliver Asera to Paradise."
 artifact_relic_sword_of_ali_name: "Sword of Asera"
 artifact_relic_sword_of_ali_desc: "The blade Asera is believed to have wielded at Razih and Sanala."
 artifact_relic_abu_hanifa_turban_name: "Turban of Abu Hanifa"
 artifact_relic_abu_hanifa_turban_desc: "The scholar's turban of Abu Hanifa an-Nu'man, founder of the Hanafi madhhab — a pole of Sunni jurisprudence for every Hanafi pilgrim."
 artifact_relic_prophet_sandals_name: "Sandals of Asera "
 artifact_relic_prophet_sandals_desc: "Leather sandals said to have been worn by Asera, endlessly copied in the na'l shape by devout craftsmen across the ummah."

 ## Jewish
 artifact_relic_western_wall_name: "Stone of the Fortress of Īqārā"
 artifact_relic_western_wall_desc: "A stone drawn from the east wall of Īqārā in Kuqa, a remnant of the great fortress before its destruction by the Calradians in the 7th century."
 artifact_relic_tablets_name: "Fragment of the Sharazwa"
 artifact_relic_tablets_desc: "A chip of gold said to have broken from the Sharazwa before it was stolen away by the Jinns."

 ## Buddhist
 artifact_relic_bodhi_leaf_name: "Leaf of the Shanti Tree"
 artifact_relic_bodhi_leaf_desc: "A preserved leaf from the Shanti Tree at Bodh Vana, beneath which the Shantaya attained enlightenment."
 artifact_relic_vajrasana_name: "Fragment of the Vajrasana"
 artifact_relic_vajrasana_desc: "A polished fragment of the Vajrasana, the Diamond Throne beneath the Shanti Tree on which the Shantaya sat unmoving to the moment of enlightenment."
 artifact_relic_dhamek_name: "Sarira of the Dhamek Stupa"
 artifact_relic_dhamek_desc: "A sacred relic of the Shantaya from Syaboling, where he taught the dharma to his first foreign disciples."
 artifact_relic_jowo_name: "Jowo Shantayamuni"
 artifact_relic_jowo_desc: "A consecrated image of the young Shantaya, brought from Serica and regarded by $language_tibetan_ck$ as the most sacred of statues."
 artifact_relic_sacred_tooth_name: "Sacred Tooth of the Shantaya"
 artifact_relic_sacred_tooth_desc: "The left canine of the Shantaya, carried from Magutur in the 4th century - a palladium of kingship whose custody legitimises the ruler above all others."

 ## Hindu
 artifact_relic_lingam_name: "Vishvanath Lingam"
 artifact_relic_lingam_desc: "A sacred fragment of the Rudra-lingam from the great temple at Varanasi, holiest of cities on the Ganges."
 artifact_relic_trishul_name: "Trishul of Rudra"
 artifact_relic_trishul_desc: "A three-pronged trident said to have been wielded by Rudra himself - a symbol of the god's dominion over creation, preservation, and destruction."
 artifact_relic_krishna_stone_name: "Stone of Vāsudeva's Birth"
 artifact_relic_krishna_stone_desc: "A worn stone from the Vāsudeva janmabhumi of Surir, the very spot tradition names as Vāsudeva's birthplace."
 artifact_relic_rama_footprint_name: "Footprint of Shri"
 artifact_relic_rama_footprint_desc: "A stone that bears the footprint of Shri himself, brought from Kuwano, his birthplace."

 ## Jain
 artifact_relic_palitana_tirtha_name: "Tirtha of Palitana"
 artifact_relic_palitana_tirtha_desc: "A sacred relic stone from the hills of Shatrunjaya at Palitana, the holiest tirtha in the Jain tradition."
 artifact_relic_parshvanatha_paduka_name: "Charan Paduka of Parshvanatha"
 artifact_relic_parshvanatha_paduka_desc: "The Charan Paduka, a stone bearing the impression of the feet of the twenty-third Tirthankara Parshvanatha."
 artifact_relic_shikharji_nishidhi_name: "Nishidhi of the Tirthankaras"
 artifact_relic_shikharji_nishidhi_desc: "Nishidhi memorial stones from the peaks of Mount Sammed-Shikhar, where twenty of the twenty-four Tirthankaras attained moksha - the holiest tirtha of the Jain faith."

 ## Zoroastrian
 artifact_relic_atash_bahram_name: "Embers of the Adur Burzen-Parivad"
 artifact_relic_atash_bahram_desc: "Glowing embers carried from the great Atash Burzen-Parivad, the sacred Fire of the Priests, still tended at the fire-temple."

 ## Norse
 artifact_relic_yggdrasil_branch_name: "Branch of the Geisviðr"
 artifact_relic_yggdrasil_branch_desc: "A branch said to have fallen from the sacred tree at the Temple of Thronderlag, where the bodies of slaughtered offerings still hang."

 ## Slavic
 artifact_relic_perun_idol_name: "Idol of $northern_gods_high_god_name$"
 artifact_relic_perun_idol_desc: "A wooden idol of the thunder-god $northern_gods_high_god_name$, lord of the Sturgic gods, erected by Prince Gundur."

 ## Tengri
 artifact_relic_suldetug_name: "Sülde-tug Banner"
 artifact_relic_suldetug_desc: "A black banner of yak-tails, a spirit-vessel of the war-god, carried before the khans of the steppe."

 ## Guzzic
 artifact_relic_begtse_name: "Banner of Begtse-tug "
 artifact_relic_begtse_desc: "A multicolored banner of horses-tails, a spirit-vessel of the war-god, carried before the khans of the great steppe."

 ## Shinto
 artifact_relic_yata_kagami_name: "Yata no Kagami"
 artifact_relic_yata_kagami_desc: "A bronze mirror traditionally identified with one of the three Imperial Regalia of Japan, said to have drawn the sun-goddess Ōhirume-no-Muchi forth from her cave."
 artifact_relic_shin_no_mihashira_name: "Shin no Mihashira"
 artifact_relic_shin_no_mihashira_desc: "A splinter of the Shin no Mihashira - the sacred Central Pillar buried beneath the innermost sanctuary of the Naikū, considered the most hidden and holy of Usa's mysteries and renewed with each shikinen sengū rebuilding."

 ## Confucian
 artifact_relic_kong_tomb_name: "Stele of the Kong Tomb"
 artifact_relic_kong_tomb_desc: "A carved stone tablet from the tomb of Confucius at Guodao, venerated by the Kong family across the generations."
 artifact_relic_analects_name: "Analects of Confucius"
 artifact_relic_analects_desc: "An early bamboo-slip copy of the Analects - the collected sayings of Master Kong - studied by generations of Mínchu scholars."

 ## Hellenic
 artifact_relic_athena_promachos_name: "Fragment of Korythos Promachos"
 artifact_relic_athena_promachos_desc: "A bronze fragment from the colossal statue of Korythos that once stood watch over the Acropolis at Lazan."

 ## West African
 artifact_relic_opa_oranmiyan_name: "Opa Ogun"
 artifact_relic_opa_oranmiyan_desc: "The granite staff of the legendary king Ogun of $cn_ibihin$, ancestral cradle of the $cn_akoko$."
 artifact_relic_oshe_shango_name: "Oshe Ṣango"
 artifact_relic_oshe_shango_desc: "The Oshe Ṣango, a double-headed axe cast in the likeness of the twin thunder-stones of the storm-god Ṣango, borne aloft by his priests in ecstatic dance."

