l_english: 
#City ==> Village
 building_type_city_01:0 "Village"
 building_type_city_01_desc:1 "A village which houses a number of farmers, merchants, and non-suspicious folks."
 building_city_01:1 "Village Center"
 building_city_01_desc:0 "$building_type_city_01_desc$"
 building_city_02:1 "Large Village"
 building_city_02_desc:1 "This village has attracted the attention of traders and craftsmen from all around, with wealthy merchants setting up shop and diligent craftsmen erecting new houses almost daily."
 building_city_03:1 "Town Center"
 building_city_03_desc:1 "No longer content with just occupying its original area, this town now subsumes nearby farmland into its prosperous center. The town is vast and full of wealth and opportunity."
 building_city_04:1 "Small City"
 building_city_04_desc:1 "This town is known far and wide for the bountiful opportunities that lie within — it is said that even the lowliest peasant can find fortune here. Houses line the streets for as far as the eye can see, with carts and animals busy transporting goods wherever you look.\n\n#I This city can be upgraded into a major city!#"

 building_type_special_sicilian_parliament_01:0 "Senate"
#  building_type_special_sicilian_parliament_01_desc:0 "$building_special_sicilian_parliament_01_desc$"
#  building_special_sicilian_parliament_01:0 "Parliament"
 building_special_sicilian_parliament_01_desc:1 "Senators of the Calradian Empire meet regularly at this building to deliberate on the affairs of the realm and advice the current Emperor."

#  building_type_guild_halls_01:1 "Guilds"
 building_type_guild_halls_01_desc:1 "The town provides all major guilds and burgher families with ample locale to organize and practice their crafts."
 
#  building_type_house_of_wisdom_01:0 "House of Wisdom"
 building_type_house_of_wisdom_01_desc:0 "The House of Wisdom contains a vast collection of books, and the scribes therein work tirelessly both day and night to translate even more great works of literature. The sources vary from Calradian, Darshi, Merechati and many more — truly, it contains the entire world's knowledge! A shining beacon of human knowledge! And comfortably far from the illiterate horsemen of the steppe..."
 
##Mosque ==> Masjid, Caliph ==> Sultan, Muhammad ==> Asera, uncomment and rename after location when the buildings get enabled
 building_hagia_sophia_02:0 "Hagia Sophia Masjid"
 building_hagia_sophia_02_desc:0 "The Hagio Óros is a true marvel of engineering, with a massive dome and four impressive minarets standing out as the most impressive features. Started in AD 572 by Emperor Catomenys I, it has since been turned into an awe-inspiring Masjid.\n\nAnd so it will remain for all eternity, for surely nothing could ever topple the might of the Banu Asera."

 NOT_holy_site_muslim_or_holy_site_trigger:0 "The holder must be [GetReligionFamily('rf_nahasan').GetName] or consider this a [holy_site|E]"
 NOT_holy_site_christian_or_holy_site_trigger:0 "The holder must be [GetReligionFamily('rf_abrahamic').GetName] or consider this a [holy_site|E]"
