 NOT_holy_site_muslim_or_zoroastrian_or_holy_site_trigger:0 "The holder must be [GetReligionFamily('rf_nahasan').GetName], [GetReligionByKey('darshi_religion').GetAdherentName], or consider this a [holy_site|E]"
