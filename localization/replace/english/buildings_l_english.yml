 building_qanats_01_desc: "These dome-shaped ice houses combine a subterranean storage area with heat-resistant construction materials to create an insulated space that functions as an evaporative cooler." 
#  building_qanats_02: "Cistern"
 building_qanats_02_desc: "Called #italic Ab anbar#! in Ardyid, these arched structures, half underground, are used to store large volumes of water."
#  building_qanats_03: "Windcatchers"
 building_qanats_03_desc: "A Darshi invention, these tall towers are connected to cisterns and other buildings. Through openings in the direction of the prevailing winds, they catch air flows which are then circulated in their interiors to provide cooling."
