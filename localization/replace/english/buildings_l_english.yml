 building_type_al_azhar_university:0 "Sanala University"
 building_type_al_azhar_university_desc:0 "$building_type_generic_university_desc$\n\nSanala University was posthumously established by the brother of Asera, Zaqariz, as a place of learning, knowledge, and better understanding of the laws of the universe."
